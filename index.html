/* ---- member.js ---- */
/* =====================================================================
   RAISING ONE OF THE UNBURIED
   The editor. Every control it draws is described by the ruleset: the die
   ladder, what a step costs, what may be carried, what a flaw gives back.
   Nothing here decides a value.
   ===================================================================== */

let editId = null;
function editing(){ return band().members.find(m => m.id === editId); }

/* A member already in the band when it was sent on its first mission has
   its build fixed from there — what happens to them after that comes
   from play (XP, scars, finds), not free editing. A recruit who joins
   later, or one who was benched, is just as editable until they go out. */
function memberLocked(m){
  const b = band();
  return b.sealed && (b.sealedMemberIds || []).includes(m.id);
}
function openMember(id){
  const b = band(), m = b.members.find(x => x.id === id);
  if(m && memberLocked(m)){
    toast("Locked — their build is fixed now. XP and Cash still change them.");
    openCard(id);
    return;
  }
  editId = id;
  drawMember();
  $("#sheet").classList.add("show");
  $("#scrim").classList.add("show");
  document.body.classList.add("locked");
}
function redraw(){ drawMember(); renderUnburied(band()); save(); }

/* ---- a row with a stepper, used by every stat ---- */
function stepRow(o){
  return `
  <div class="srow">
    <div class="srow-l">
      <b>${esc(o.title)}</b>
      <span>${esc(o.sub)}</span>
    </div>
    <div class="srow-r">
      <div class="stepper">
        <button data-step="${o.key}|-1" ${o.down ? "" : "disabled"} aria-label="Lower ${esc(o.title)}">−</button>
        <span>${esc(o.value)}</span>
        <button data-step="${o.key}|1" ${o.up ? "" : "disabled"} aria-label="Raise ${esc(o.title)}">+</button>
      </div>
      <span class="srow-hint mono">${esc(o.hint)}</span>
    </div>
  </div>`;
}

function drawMember(){
  const m = editing(); if(!m) return closeSheet();
  const b = band();
  const cost = unitCost(m), bd = costBreakdown(profileOf(m));

  const dieRows = DIE_STATS.map(k => {
    const st = RSX.stat[k], cur = m[k];
    const i = RSX.ladder.indexOf(dieNum(cur));
    const iMin = RSX.ladder.indexOf(dieNum(st.min)), iMax = RSX.ladder.indexOf(dieNum(st.max));
    const iBase = RSX.ladder.indexOf(dieNum(st.default));
    const next = i < iBase ? st.stepDownCost : st.stepUpCosts[i - iBase];
    return stepRow({key: "die:" + k, title: st.name, sub: "from " + st.default + " · " + st.min + "–" + st.max,
      value: cur, down: i > iMin, up: i < iMax,
      hint: i >= iMax ? "max" : (next === undefined ? "—" : "next +" + next)});
  }).join("");

  const mv = RSX.stat.move, ws = RSX.stat.wounds, as = RSX.stat.actions, sz = RSX.stat.size;
  const wStep = ws.upStep || 1, wCost = ws.upCostPerStep !== undefined ? ws.upCostPerStep : ws.upCostEach;
  const hStart = startHealth(m.size), hMax = maxHealth(m.size);
  const armObj = bodyArmourId(m) ? RSX.armour[bodyArmourId(m)] : null;
  const bodyRows =
    stepRow({key: "move", title: mv.name,
      sub: mv.step + "cm a step · " + mv.costPerStep + " pts" +
           (armObj && armObj.moveMod ? " · armour " + signed(armObj.moveMod) + "cm" : ""),
      value: effectiveMove(m) + "cm", down: m.move > mv.min, up: m.move < mv.max, hint: "±" + mv.costPerStep}) +
    stepRow({key: "wounds", title: ws.name,
      sub: m.size + " starts at " + hStart + ", tops out at " + hMax +
           (wStep > 1 ? " · " + wCost + " a step of " + wStep : ""),
      value: m.wounds, down: m.wounds > ws.min, up: m.wounds < hMax,
      hint: m.wounds >= hMax ? "max" : "+" + wCost}) +
    stepRow({key: "actions", title: as.name, sub: "start " + as.default,
      value: m.actions, down: m.actions > as.min,
      up: m.actions < as.max && as.upCosts[m.actions - as.default] !== undefined,
      hint: as.upCosts[m.actions - as.default] !== undefined ? "+" + as.upCosts[m.actions - as.default] : "max"}) +
    (sz ? stepRow({key: "size", title: sz.name,
      sub: startHealth(m.size) + "–" + maxHealth(m.size) + " " + ws.name.toLowerCase() +
           " · " + ((sz.costs || {})[m.size] ? signed(sz.costs[m.size]) + " points" : "no change"),
      value: m.size.charAt(0).toUpperCase() + m.size.slice(1),
      down: sz.values.indexOf(m.size) > 0, up: sz.values.indexOf(m.size) < sz.values.length - 1,
      hint: (sz.costs || {})[m.size] ? signed(sz.costs[m.size]) : "free"}) : "");

  const n = squadOf(m), sq = RS.squads;
  const deploy = stepRow({key: "count", title: isSquad(m) ? "Squad" : "Alone",
    sub: isSquad(m) ? "one profile, " + n + " models · " + (sq.squadDiscount * 100) + "% together"
                    : "set " + sq.minSize + " or more to field a squad",
    value: n, down: n > 1, up: n < sq.maxSize, hint: n > 1 ? "×" + n : "—"});

  $("#sheetIn").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="mBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="eyebrow">One of the Unburied</div>
      <div class="m-cost" style="position:static">${cost}<small>points</small></div>
    </div>

    <div class="slab">
      <div class="field" style="margin-bottom:11px"><label>Name</label>
        <input class="input" id="fName" value="${esc(m.name)}" maxlength="42" placeholder="who were they"></div>
      <div class="field" style="margin-bottom:11px"><label>Epithet — joins the name</label>
        <input class="input serif" id="fEpi" value="${esc(m.epithet)}" maxlength="50" placeholder="the Deadeye, Ashmouth, One-Eye"></div>
      <div class="field" style="margin-bottom:11px"><label>Epitaph — what the stone would say</label>
        <input class="input serif" id="fEpitaph" value="${esc(m.epitaph || "")}" maxlength="140"
          placeholder="He always gave his all and never missed"></div>
      <div class="field" style="margin-bottom:11px"><label>Role</label>
        <input class="input" id="fRole" value="${esc(m.role)}" maxlength="40" placeholder="what they do"></div>
      <div class="field"><label>Their story</label>
        <textarea class="input" id="fStory" rows="3" placeholder="how they came to be Unburied">${esc(m.story)}</textarea></div>
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">Attributes</span><span class="rule"></span>
        <span class="quiet mono">${RS.dice.ladder.join(" · ")}</span></div>
      ${dieRows}
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">Body</span><span class="rule"></span></div>
      ${bodyRows}
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">How it deploys</span><span class="rule"></span>
        <span class="chip gilt">${activationsOf(m)} activation${activationsOf(m) === 1 ? "" : "s"}</span></div>
      ${deploy}
      <p class="quiet" style="margin:9px 0 0">${isSquad(m)
        ? memberCost(m) + " each × " + n + ", less " + (sq.squadDiscount * 100) + "% — <b>" + unitCost(m) + " points</b>. Activates " +
          activationsOf(m) + " time" + (activationsOf(m) === 1 ? "" : "s") + " a round, up to three models each time. Coherency " + sq.coherency + "cm."
        : "One activation per " + RS.activation.pointsPerActivation + " points, up to " + RS.activation.maxActivations + "."}</p>
    </div>

    ${gearSlab(m, "Weapons", "weapons")}
    ${gearSlab(m, "Armour", "armour")}
    ${gearSlab(m, "Carried", "items")}
    ${gearSlab(m, "Traits", "traits")}
    ${gearSlab(m, "Abilities", "abilities")}
    ${gearSlab(m, "Powers", "powers")}
    ${gearSlab(m, "Flaws", "flaws")}
    ${(m.traits || []).includes("leader") && ruleOn("narrative") ? tetherEditorHTML(m) : ""}

    <div class="slab">
      <div class="head"><span class="eyebrow">What it costs</span><span class="rule"></span>
        <span class="chip gilt mono">${bd.total} points</span></div>
      ${bd.rows.map(r => `<div class="cost-row"><span>${esc(r.label)}</span><b class="mono ${r.cost < 0 ? "neg" : ""}">${signed(r.cost)}</b></div>`).join("")}
      ${n > 1 ? `<div class="cost-row"><span>Squad of ${n}, less ${(sq.squadDiscount * 100)}%</span><b class="mono">${unitCost(m)}</b></div>` : ""}
      <p class="quiet" style="margin:10px 0 0">The first ${RS.surcharge.freeUpgrades} upgrades cost list price; after that each
        adds +${RS.surcharge.perPriorUpgrade} for every upgrade already bought. Gear, size, resistances and flaws are exempt.</p>
    </div>

    <div class="sheet-actions">
      <button class="btn danger ghost" id="mDel">Lay to rest</button>
      <button class="btn primary" id="mDone">Done</button>
    </div>`;

  const root = $("#sheetIn");
  root.querySelector("#fName").oninput = e => { m.name = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fEpi").oninput = e => { m.epithet = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fEpitaph").oninput = e => { m.epitaph = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fRole").oninput = e => { m.role = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fStory").oninput = e => { m.story = e.target.value; save(); };

  root.querySelectorAll("[data-step]").forEach(btn => btn.onclick = () => {
    const [key, dRaw] = btn.dataset.step.split("|"); const d = +dRaw;
    if(key.startsWith("die:")){
      const k = key.slice(4), st = RSX.stat[k];
      const nv = dieStep(m[k], d); if(!nv) return;
      const i = RSX.ladder.indexOf(dieNum(nv));
      if(i < RSX.ladder.indexOf(dieNum(st.min)) || i > RSX.ladder.indexOf(dieNum(st.max))) return;
      m[k] = nv;
    } else if(key === "move"){
      const nv = m.move + d * mv.step; if(nv < mv.min || nv > mv.max) return; m.move = nv;
    } else if(key === "wounds"){
      const nv = m.wounds + d * (d > 0 || m.wounds - wStep >= ws.default ? wStep : 1);
      if(nv < ws.min || nv > ws.max) return; m.wounds = nv;
    } else if(key === "actions"){
      const nv = m.actions + d; if(nv < as.min || nv > as.max) return; m.actions = nv;
    } else if(key === "size"){
      const i = sz.values.indexOf(m.size) + d; if(i < 0 || i >= sz.values.length) return;
      setSize(m, sz.values[i]);
    } else if(key === "count"){
      let nv = n + d;
      if(nv > 1 && nv < sq.minSize) nv = d > 0 ? sq.minSize : 1;
      m.count = Math.max(1, Math.min(sq.maxSize, nv));
    }
    redraw();
  });

  bindGear(root, m);
  bindTetherEditor(root, m, redraw);
  root.querySelector("#mBack").onclick = closeSheet;
  root.querySelector("#mDone").onclick = closeSheet;
  root.querySelector("#mDel").onclick = () => {
    const b2 = band();
    b2.members = b2.members.filter(x => x.id !== m.id);
    closeSheet(); renderUnburied(b2); save();
    toast("Laid to rest");
  };
}

/* ---- gear, traits, powers and flaws all render the same way ---- */
const GEAR_KIND = {
  weapons:  {cat:"weapons",  qty:true,  single:false, reskin:true,  add:"Add a weapon"},
  armour:   {cat:"armour",   qty:false, single:false, reskin:true,  add:"Wear armour or carry a shield"},
  items:    {cat:"items",    qty:true,  single:false, reskin:true,  add:"Carry something"},
  traits:   {cat:"traits",   qty:false, single:false, reskin:false, add:"Add a trait"},
  abilities:{cat:"abilities",qty:false, single:false, reskin:false, add:"Add an ability"},
  powers:   {cat:"powers",   qty:false, single:false, reskin:false, add:"Learn a power"},
  flaws:    {cat:"flaws",    qty:false, single:false, reskin:false, add:"Take a flaw"}
};
function gearSlab(m, label, field){
  const k = GEAR_KIND[field], cat = catOf(k.cat), arr = m[field] || [];
  const rows = arr.map((entry, idx) => {
    const id = k.qty ? entry.id : (entry.id || entry);
    const o = cat[id]; if(!o) return "";
    const nth = k.qty ? 1 : arr.slice(0, idx + 1).filter(e => (e.id || e) === id).length;    // 2 for a second pair
    const unitCost = field === "traits" ? traitPriceAt(id, nth) : o.cost;
    const shown = k.reskin ? skinOf(m, id, o.name) : o.name;
    const mods = k.qty && field === "weapons" ? (entry.mods || []) : [];
    const modCost = mods.reduce((s, x) => s + ((CAT.mods[x] || {}).cost || 0), 0);
    const price = k.qty ? (o.cost + modCost) * (entry.qty || 1) : unitCost;
    return `
    <div class="grow">
      <div class="grow-main">
        <div class="grow-name">${esc(shown)}${nth > 1 ? ` <span class="chip gilt">second pair</span>` : ""}
          ${k.reskin ? `<button class="tiny" data-skin="${field}|${esc(id)}" title="Call it something else">✎</button>` : ""}</div>
        ${shown !== o.name ? `<div class="grow-sub">${esc(o.name)}</div>` : ""}
        <div class="grow-sub">${esc(field === "weapons" && isAnimal(m) ? o.desc.replace(/ \u00b7 Two Handed/i, "") : o.desc)}</div>
        ${field === "weapons" ? `
          <div class="mods">
            ${mods.map(x => { const mo = CAT.mods[x]; return mo ? `<span class="mod">${esc(mo.name)} <b>${mo.cost}</b><button data-modoff="${esc(id)}|${esc(x)}" aria-label="Remove">×</button></span>` : ""; }).join("")}
            ${Object.values(CAT.mods).filter(x => !mods.includes(x.id)).length ? `
              <select class="mod-add" data-modadd="${esc(id)}" aria-label="Add an effect">
                <option value="">+ effect…</option>
                ${Object.values(CAT.mods).filter(x => !mods.includes(x.id))
                  .map(x => `<option value="${esc(x.id)}">${esc(x.name)} +${x.cost} — ${esc(x.desc)}</option>`).join("")}
              </select>` : ""}
          </div>` : ""}
      </div>
      <div class="grow-r">
        <span class="mono ${unitCost < 0 ? "neg" : ""}">${k.qty ? price + " pts" : signed(price)}</span>
        ${k.qty ? `<div class="stepper sm">
            <button data-qty="${field}|${esc(id)}|-1" aria-label="fewer">−</button>
            <span>${entry.qty || 1}</span>
            <button data-qty="${field}|${esc(id)}|1" aria-label="more">+</button></div>` : ""}
        <button class="tiny" data-drop="${field}|${esc(id)}|${idx}" aria-label="Remove">×</button>
      </div>
    </div>`;
  }).join("");
  const total = arr.reduce((s, e, i) => {
    const id = k.qty ? e.id : (e.id || e), o = cat[id]; if(!o) return s;
    const mods = (e.mods || []).reduce((t, x) => t + ((CAT.mods[x] || {}).cost || 0), 0);
    const nth = k.qty ? 1 : arr.slice(0, i + 1).filter(x => (x.id || x) === id).length;
    return s + (k.qty ? (o.cost + mods) * (e.qty || 1) : (field === "traits" ? traitPriceAt(id, nth) : o.cost));
  }, 0);
  return `
  <div class="slab">
    <div class="head"><span class="eyebrow">${esc(label)}</span><span class="rule"></span>
      ${field === "weapons" || field === "armour" ? `<span class="chip ${handsFree(m) < 0 ? "bad" : ""}" title="Weapons and a shield need a hand each; two for Two-handed">${isAnimal(m) && handsOf(m) === 0 ? (field === "weapons" ? "natural \u2014 no hands needed" : "no hands, so no shield") : "\u270b " + handsUsed(m) + " of " + handsOf(m) + " hands"}</span>` : ""}
      <span class="quiet mono">${arr.length ? (k.qty ? total + " pts" : signed(total)) : "—"}</span></div>
    ${field === "weapons" && handsFree(m) < 0 ? `<p class="quiet" style="margin:0 0 8px;color:var(--rust)">More gear than hands: ${handsUsed(m)} carried, ${handsOf(m)} hands. Drop something or take a second pair of arms.</p>` : ""}
    ${rows || `<p class="quiet" style="margin:0">Nothing yet.</p>`}
    <button class="btn sm ghost" data-add="${field}" style="margin-top:10px">${esc(k.add)}</button>
  </div>`;
}

function bindGear(root, m){
  root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openPicker(m, b.dataset.add));
  root.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => {
    const [field, id, idx] = b.dataset.drop.split("|");
    const k = GEAR_KIND[field];
    if(!k.qty && field === "traits" && traitCount(m, id) > 1){
      m[field].splice(+idx, 1);                    // one pair of a pair-trait goes; the other stays
    } else {
      m[field] = k.qty ? m[field].filter(e => e.id !== id) : m[field].filter(e => (e.id || e) !== id);
      if(m.skins) delete m.skins[id];
    }
    redraw();
  });
  root.querySelectorAll("[data-qty]").forEach(b => b.onclick = () => {
    const [field, id, d] = b.dataset.qty.split("|");
    const e = m[field].find(x => x.id === id); if(!e) return;
    if(+d > 0 && field === "weapons"){ const hb = handsBlock(m, field, id); if(hb){ toast(hb); return; } }
    e.qty = Math.max(1, (e.qty || 1) + +d);
    redraw();
  });
  root.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => {
    const [field, id] = b.dataset.skin.split("|");
    askName(m, field, id);
  });
  root.querySelectorAll("[data-modoff]").forEach(b => b.onclick = () => {
    const [wid, mod] = b.dataset.modoff.split("|");
    const e = m.weapons.find(x => x.id === wid); if(!e) return;
    e.mods = (e.mods || []).filter(x => x !== mod);
    redraw();
  });
  root.querySelectorAll("[data-modadd]").forEach(sel => sel.onchange = () => {
    if(!sel.value) return;
    const e = m.weapons.find(x => x.id === sel.dataset.modadd); if(!e) return;
    e.mods = (e.mods || []).concat([sel.value]);
    redraw();
  });
}

/* ---- pickers.js ---- */
/* =====================================================================
   CHOOSING THINGS
   The picker lists whatever the ruleset holds for that kind, with its
   price and its own words. It also enforces the few limits the ruleset
   states outright: one suit of armour, so many flaws, uniques, squad-only.
   ===================================================================== */

let pickCtx = null;

function openPicker(m, field){
  const k = GEAR_KIND[field];
  pickCtx = {m, field, k, q: ""};
  drawPicker();
  $("#sheet2").classList.add("show");
  $("#scrim2").classList.add("show");
}
function closePicker(){
  $("#sheet2").classList.remove("show");
  $("#scrim2").classList.remove("show");
  pickCtx = null;
}

/* What the ruleset forbids, said plainly rather than silently ignored. */
function pickBlocked(m, field, o){
  if(field === "weapons" || field === "armour"){ const hb = handsBlock(m, field, o.id); if(hb) return hb; }
  const raw = (RS[field === "flaws" ? "flaws" : field] || {});
  if(field === "flaws"){
    const cap = ((RS.flaws || {}).refundCap || {});
    if(cap.maxFlaws !== undefined && (m.flaws || []).length >= cap.maxFlaws)
      return "Only " + cap.maxFlaws + " flaws on one model.";
    const taken = (m.flaws || []).reduce((s, id) => s + -((catOf("flaws")[id] || {}).cost || 0), 0);
    if(cap.maxRefund !== undefined && taken + -o.cost > cap.maxRefund)
      return "Flaws give back at most " + cap.maxRefund + " points; this would pass it.";
  }
  const src = (RS.traits || []).find(t => t.id === o.id);
  if(src){
    if(src.unique && (m.traits || []).includes(o.id)) return "Only one.";
    if(src.squadOnly && !isSquad(m)) return "Squads only — this one fields alone.";
    if(src.max && (m.traits || []).filter(x => x === o.id).length >= src.max)
      return "At most " + src.max + ".";
  }
  /* A weakness offsets a nature; it cannot simply be banked. */
  const vuln = ((RS.traitTags || {}).vulnerabilities) || [];
  if(vuln.includes(o.id)){
    const spendOn = ((RS.traitTags || {}).resistances || []).concat(["aura", "regenerate"]);
    const spent = (m.traits || []).reduce((s, id) => s + (spendOn.includes(id) ? (catOf("traits")[id] || {}).cost || 0 : 0), 0)
      + (m.weapons || []).reduce((s, w) => s + (w.mods || []).reduce((t, x) => t + ((CAT.mods[x] || {}).cost || 0), 0), 0);
    const already = (m.traits || []).reduce((s, id) => s + (vuln.includes(id) ? -((catOf("traits")[id] || {}).cost || 0) : 0), 0);
    if(already + -o.cost > spent)
      return "A weakness offsets a nature. Buy a resistance, an aura or a weapon effect first, or this gives nothing back.";
  }
  return null;
}

function drawPicker(){
  const {m, field, k, q} = pickCtx;
  const cat = catOf(k.cat);
  const chosen = new Set((m[field] || []).map(e => e.id || e));
  const all = Object.values(cat);
  const hay = o => (o.name + " " + (o.desc || "") + " " + (o.examples || []).join(" ")).toLowerCase();
  const list = q ? all.filter(o => hay(o).includes(q.toLowerCase())) : all;

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="pkX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="eyebrow">${esc(k.add)}</div>
      <span class="chip">${list.length}</span>
    </div>
    <input class="input" id="pkQ" placeholder="Search" value="${esc(q)}" style="margin-bottom:12px">
    <div class="picks">
      ${list.map(o => {
        const cnt = field === "traits" ? traitCount(m, o.id) : 0, mx = field === "traits" ? traitMax(o.id) : 1;
        const on = chosen.has(o.id);
        const why = on ? null : pickBlocked(m, field, o);
        const nextPrice = field === "traits" && cnt >= 1 && cnt < mx ? traitPriceAt(o.id, cnt + 1) : o.cost;
        return `
        <button class="pick ${on ? "on" : ""} ${why ? "no" : ""}" data-pick="${esc(o.id)}" ${why ? "disabled" : ""}>
          <div class="pick-main">
            <div class="pick-name">${esc(o.name)}${on ? ` <span class="chip gilt">taken${cnt > 1 ? " \u00d7" + cnt : ""}</span>` : ""}${on && mx > 1 && cnt < mx ? ` <span class="chip">tap for a second pair</span>` : ""}${on && mx > 1 && cnt >= mx ? ` <span class="chip">tap to remove one</span>` : ""}</div>
            <div class="pick-desc">${esc(o.desc)}</div>
            ${o.examples ? `<div class="pick-eg">e.g. ${esc(o.examples.slice(0, 4).join(", "))}</div>` : ""}
            ${why ? `<div class="pick-no">${esc(why)}</div>` : ""}
          </div>
          <div class="pick-cost mono ${o.cost < 0 ? "neg" : ""}">${k.qty ? o.cost + " pts" : signed(nextPrice)}</div>
        </button>`;
      }).join("") || `<p class="quiet">Nothing matches that.</p>`}
    </div>`;

  $("#pkX").onclick = closePicker;
  const qi = $("#pkQ");
  qi.oninput = e => { pickCtx.q = e.target.value; drawPicker(); $("#pkQ").focus(); };
  $("#sheet2In").querySelectorAll("[data-pick]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.pick, o = cat[id];
    const arr = m[field] = m[field] || [];
    if(k.qty){
      const e = arr.find(x => x.id === id);
      if(field === "weapons"){ const hb = handsBlock(m, field, id); if(hb){ toast(hb); return; } }
      if(e) e.qty = (e.qty || 1) + 1;
      else arr.push({id, qty: 1, mods: []});
      toast(o.name + " taken");
    } else if(field === "traits" && chosen.has(id) && traitMax(id) > 1){
      /* a trait that comes in pairs: another copy until the limit, then take one back */
      if(traitCount(m, id) < traitMax(id)){ arr.push(id); toast(o.name + " \u2014 a second pair"); }
      else { arr.splice(arr.lastIndexOf(id), 1); toast(o.name + " \u2014 one pair dropped"); }
    } else if(chosen.has(id)){
      m[field] = arr.filter(x => (x.id || x) !== id);
      if(m.skins) delete m.skins[id];
      toast(o.name + " dropped");
    } else {
      if(field === "armour"){
        /* a suit swaps a suit and a shield swaps a shield; the other stays */
        const uses = armourUsesHand(id);
        arr.filter(x => armourUsesHand(x.id || x) === uses).forEach(x => { if(m.skins) delete m.skins[x.id || x]; });
        m.armour = arr.filter(x => armourUsesHand(x.id || x) !== uses);
        m.armour.push(id);
        redraw(); drawPicker(); toast(o.name + " taken"); return;
      }
      if(k.single){ arr.length = 0; if(m.skins) m.skins = {}; }
      arr.push(id);
      toast(o.name + " taken");
    }
    redraw(); drawPicker();
  });
}

/* ---- calling a thing by your own name for it ---- */
function askName(m, field, id){
  const cat = catOf(GEAR_KIND[field].cat), o = cat[id]; if(!o) return;
  const cur = (m.skins && m.skins[id]) || "";
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="skX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="eyebrow">Call it something else</div>
    </div>
    <p class="lead">This changes the name on this model only. The stats and the cost stay
      exactly as they are.${o.examples ? " For instance: " + esc(o.examples.join(", ")) + "." : ""}</p>
    <div class="field" style="margin:14px 0"><label>${esc(o.name)}</label>
      <input class="input" id="skV" value="${esc(cur)}" placeholder="${esc(o.name)}" maxlength="40"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="skClear">Use the standard name</button>
      <button class="btn primary" id="skGo">Rename</button>
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  const done = v => {
    m.skins = m.skins || {};
    if(v && v !== o.name) m.skins[id] = v.slice(0, 40); else delete m.skins[id];
    closePicker(); redraw();
  };
  $("#skX").onclick = closePicker;
  $("#skClear").onclick = () => done("");
  $("#skGo").onclick = () => done($("#skV").value.trim());
  $("#skV").onkeydown = e => { if(e.key === "Enter") done($("#skV").value.trim()); };
  setTimeout(() => { const i = $("#skV"); if(i){ i.focus(); i.select(); } }, 60);
}

/* ---- more than one band, because a person may keep several ---- */
function openBands(){
  const rows = store.bands.map(b => `
    <div class="grow">
      <button class="grow-main" data-band="${b.id}" style="text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer">
        <div class="grow-name">${esc(b.name)}${b.id === store.activeId ? ` <span class="chip gilt">open</span>` : ""}</div>
        <div class="grow-sub">${b.members.length} raised · ${bandSpent(b)} of ${b.budget} points fielded</div>
      </button>
      <div class="grow-r">
        <button class="tiny" data-bcopy="${b.id}" title="Copy">⧉</button>
        <button class="tiny" data-bdel="${b.id}" aria-label="Delete this band">×</button>
      </div>
    </div>`).join("");
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="bX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="eyebrow">Your bands</div>
    </div>
    ${rows}
    ${realmAvailable() ? `<p class="quiet" style="margin:12px 0 0">More bands arrive from the Reliquary — use the carry icon to call one to the barrow.</p>`
      : `<button class="btn sm ghost" id="bNew" style="margin-top:12px">Begin another band</button>`}`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#bX").onclick = closePicker;
  $("#sheet2In").querySelectorAll("[data-band]").forEach(b => b.onclick = () => {
    store.activeId = b.dataset.band; closePicker(); render();
  });
  $("#sheet2In").querySelectorAll("[data-bcopy]").forEach(b => b.onclick = () => {
    const src = store.bands.find(x => x.id === b.dataset.bcopy);
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid(); copy.name = src.name + " (again)";
    copy.members.forEach(m => m.id = uid());
    store.bands.push(copy); save(); openBands(); toast("Copied");
  });
  $("#sheet2In").querySelectorAll("[data-bdel]").forEach(b => b.onclick = () => {
    const bd = store.bands.find(x => x.id === b.dataset.bdel); if(!bd) return;
    askDelete("Delete " + (bd.name || "this band") + "?",
      bd.members.length + " of the Unburied go with it, along with their scars, XP, Cash and anything in the Cenotaph. This cannot be undone."
        + (store.bands.length === 1 ? " It is your only band, so you will start again from an empty one." : ""),
      () => {
        store.bands = store.bands.filter(x => x.id !== bd.id);
        if(!store.bands.length) store.bands = [newBand("The Unburied")];
        if(!store.bands.some(x => x.id === store.activeId)) store.activeId = store.bands[0].id;
        save(); openBands(); render(); toast("Band deleted");
      }, openBands);
  });
  const bNew = $("#bNew");
  if(bNew) bNew.onclick = () => {
    const b = newBand("The Unburied");
    store.bands.push(b); store.activeId = b.id;
    closePicker(); render(); toast("A new band");
  };
}

/* ---- quest.js ---- */
/* =====================================================================
   THE QUEST
   A battle in progress. The app does not play the game; it remembers the
   things that are easy to lose track of across a table — Health on each
   model, Strain and its burnout number, Ready tokens, which units have
   activated, how many activate per turn, and how close a side is to
   breaking.

   It also keeps the secrets. Markers are numbered on the table and blank;
   what is under them lives here, and when a model walks into one, the app
   knows which model it was and deals with it.
   ===================================================================== */

const QUEST_KEY = "ep_quest_v1";
let Q = null;

function questLoad(){
  if(Q !== null) return Q;
  try{ Q = JSON.parse(localStorage.getItem(QUEST_KEY) || "null"); }catch(e){ Q = null; }
  return Q;
}
function questSave(){
  try{ localStorage.setItem(QUEST_KEY, JSON.stringify(Q)); }catch(e){}
  /* A shared quest publishes what this device owns and nothing else:
     a player their own models, the host the table as well. */
  if(Q && Q.realm && typeof pushMyUnits === "function"){
    try{ pushMyUnits(); if(Q.host) pushTable(); }catch(e){}
  }
}
function questOn(){ return !!questLoad(); }

/* ---- what stays behind: a scenario ends, but the table remembers it ---- */
const HISTORY_KEY = "ep_history_v1";
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }catch(e){ return []; }
}
function saveHistory(list){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){} }
function sideCasualties(side){
  const units = Q.units.filter(u => u.side === side && !u.hidden);
  return {total: units.reduce((s, u) => s + u.models.length, 0),
          lost: units.reduce((s, u) => s + u.models.filter(h => h <= 0).length, 0)};
}
function archiveQuest(){
  if(!Q) return;
  const us = sideCasualties("us"), them = sideCasualties("them");
  const usBroke = breakState("us").at > 0, themBroke = breakState("them").at > 0;
  let result = "Even";
  if(usBroke && !themBroke) result = "Broken";
  else if(themBroke && !usBroke) result = "Routed the enemy";
  else if(Q.vp.us > Q.vp.them) result = "Won on points";
  else if(Q.vp.them > Q.vp.us) result = "Lost on points";
  const rec = {
    id: uid(), at: Date.now(),
    title: (Q.scenario && Q.scenario.name) || "Took them out",
    round: Q.round, rounds: (Q.scenario && Q.scenario.rounds) || null,
    vpUs: Q.vp.us, vpThem: Q.vp.them,
    usLost: us.lost, usTotal: us.total,
    themLost: them.lost, themTotal: them.total,
    result,
    /* the pristine scenario, if this quest started from one — lets the
       record be opened and read, or the same scenario started again fresh */
    scenario: Q.scenarioSource || null
  };
  const list = loadHistory();
  list.unshift(rec);
  saveHistory(list.slice(0, 40));
}
function deleteHistory(id){ saveHistory(loadHistory().filter(r => r.id !== id)); }

function questEnd(){ archiveQuest(); Q = null; try{ localStorage.removeItem(QUEST_KEY); }catch(e){} }

/* ---- who is in it ---- */
function questUnitFrom(m){
  /* 0.11: every model comes back to full Health between battles. Lasting harm
     comes from Fate alone — carrying damage as well punishes a losing band
     twice and sends it into a spiral. The old behaviour is the Hard campaign
     rule, which a band can switch on. */
  const carry = !!band().hardCampaign;
  return {uid: m.id, side: "us", name: m.name || "Unnamed",
          models: carry ? healthOf(m) : Array.from({length: squadOf(m)}, () => effWounds(m)),
          max: m.wounds, acts: activationsOf(m), used: 0,
          strain: 0, ready: false, cond: [], pushed: false, lead: isLeaderM(m)};
}
/* Anything that changes a unit's Health writes straight through to the model.
   The tracker is a view of the Unburied, not a separate set of numbers. */
function writeThrough(u){
  if(!u || u.remote || u.side !== "us") return;
  if(!band().hardCampaign) return;      // damage is a battle's business, not the band's
  const m = band().members.find(x => x.id === u.uid);
  if(m) setHealth(m, u.models);
}
/* The other way: a point given back (a slip of the thumb on the table, or a heal). It goes to the
   model that was hurt last, so it undoes a hurtUnit in reverse. */
function healUnit(u, amount, why){
  let left = amount;
  while(left > 0){
    let i = -1;
    for(let k = u.models.length - 1; k >= 0; k--) if(u.models[k] < u.max){ i = k; break; }
    if(i < 0) break;
    const give = Math.min(u.max - u.models[i], left);
    u.models[i] += give; left -= give;
  }
  writeThrough(u);
  if(amount - left > 0) qlog(u.name + " — " + (amount - left) + " Health back" + (why ? " (" + why + ")" : ""));
  questSave();
}
function questFoe(name, count, health, acts, hidden){
  /* A hidden unit exists from the start of the scenario but is not on the
     table: it cannot be picked as a marker target and does not add to
     activation counts until something reveals it. */
  return {uid: "f" + uid(), side: "them", name: name || "Enemy",
          models: Array.from({length: count}, () => health),
          max: health, acts, used: 0, strain: 0, ready: false, cond: [],
          pushed: false, hidden: !!hidden};
}
/* Bring a held-back unit onto the table — a scenario event, a marker, or the
   host doing it by hand. */
function revealFoe(uidStr, why){
  const u = Q.units.find(x => x.uid === uidStr && x.hidden);
  if(!u) return null;
  u.hidden = false;
  qlog(u.name + " arrives" + (why ? " — " + why : ""));
  questSave();
  return u;
}

/* Whoever is running a sealed scenario judges when a trigger has happened
   and opens that envelope by hand — the conditions are plain English, not
   something the app can watch for on its own. */
function openEnvelope(eid){
  const m = Q.scenario && Q.scenario.mystery; if(!m) return null;
  const e = m.envelopes.find(x => x.eid === eid); if(!e || e.opened) return null;
  e.opened = true;
  qlog("Envelope — " + e.title);
  if(e.revealsObjectives && !Q.scenario.objectivesKnown){
    Q.scenario.objectivesKnown = true;
    qlog("The objectives are revealed");
  }
  questSave();
  return e;
}
function questUnit(m){ return Q ? Q.units.find(u => u.uid === m.id) : null; }
function unitDown(u){ return u.models.every(h => h <= 0); }
function unitStanding(u){ return u.models.filter(h => h > 0).length; }

function questBegin(size, opts){
  const b = band();
  const tableOnly = typeof getRole === "function" && getRole() === "realm";     // the Realm runs the table and brings no band
  const mine = tableOnly ? [] : b.members.filter(fielded);
  if(!mine.length && !tableOnly){ toast("Field someone first"); return false; }
  /* The band's build is theirs to shape freely right up until they are
     actually sent out. The first time that happens, whoever holds the
     Leader trait is bound by a tether, and every member already in the
     band at that moment has its build fixed from here on — recruits
     added afterward are unaffected until their own first mission. */
  if(tableOnly){ /* no band here, so nothing to seal or bind */ }
  else if(!b.sealed){
    const leader = leaderOf(b);
    if(!leader){ toast("Someone needs to be the " + leaderTerm() + " before the band's first mission"); return false; }
    b.sealed = true;
    b.sealedMemberIds = mine.map(m => m.id);      // only those who actually go; the benched stay editable
    save();
  } else {
    /* whoever goes is locked by it: a newcomer or a benched member is locked
       only by the first quest they actually take part in */
    b.sealedMemberIds = b.sealedMemberIds || [];
    mine.forEach(m => { if(!b.sealedMemberIds.includes(m.id)) b.sealedMemberIds.push(m.id); });
    save();
  }
  /* the tether is normally rolled already, back at the barrow; this catches a band
     with none (a severed one, or narrative switched on late) */
  if(!tableOnly && ruleOn("narrative", b) && leaderOf(b) && !b.tether){ bindTether(b); save(); }
  Q = {round: 1, step: "tempo", size,
       nerve: {us: 0, them: 0}, vp: {us: 0, them: 0},
       units: mine.map(questUnitFrom),
       markers: rollMarkers(size, opts),
       log: []};
  questStep();           // the first round opens with its Tempo: Nerve gained, activations ready
  questSave();
  return true;
}

/* ---- the ruleset's arithmetic ---- */
function sideActs(side){
  return Q.units.filter(u => u.side === side && !u.hidden && !unitDown(u)).reduce((s, u) => s + u.acts, 0);
}
function questGroups(){
  const a = sideActs("us"), b = sideActs("them");
  if(!a || !b) return {us: 1, them: 1, usTotal: a, themTotal: b};
  return a >= b ? {us: Math.ceil(a / b), them: 1, usTotal: a, themTotal: b}
                : {us: 1, them: Math.ceil(b / a), usTotal: a, themTotal: b};
}
function lostFraction(side){
  const us = Q.units.filter(u => u.side === side && !u.hidden);
  const start = us.reduce((s, u) => s + u.models.length, 0);
  const lost = us.reduce((s, u) => s + u.models.filter(h => h <= 0).length, 0);
  return start ? lost / start : 0;
}
function breakState(side){
  const f = lostFraction(side);
  const hit = RS.morale.break.thresholds.slice().sort((a, b) => b - a).find(t => f >= t);
  return {at: hit || 0, frac: f};
}
function qlog(s){ Q.log.unshift({r: Q.round, t: s}); Q.log = Q.log.slice(0, 50); }

/* ---- what happens to a model ---- */
function hurtUnit(u, amount, why){
  let left = amount;
  while(left > 0){
    const i = u.models.findIndex(h => h > 0);
    if(i < 0) break;
    const take = Math.min(u.models[i], left);
    u.models[i] -= take; left -= take;
    if(u.models[i] === 0) qlog(u.name + " — a model goes Down" + (why ? " (" + why + ")" : ""));
  }
  writeThrough(u);
  questSave();
}
function strainUnit(u, d){
  const st = RS.strain;
  u.strain = Math.max(0, u.strain + d);
  if(u.strain >= st.autoBurnoutAt){
    u.strain = 0;
    hurtUnit(u, st.burnoutEffect.damage, "burnout");
    qlog(u.name + " burns out at " + st.autoBurnoutAt + " Strain");
    toast("Burnout — " + st.burnoutEffect.damage + " damage, no save");
  }
  questSave();
}
function questStep(){
  if(Q.step === "tempo"){
    const gain = side => {
      let g = RS.nerve.perRound;
      if(Q.units.some(u => u.side === side && !unitDown(u) && (u.lead || (u.cond || []).includes("leader"))))
        g += RS.nerve.leaderStandingBonus;
      return g;
    };
    Q.nerve.us = Math.min(RS.nerve.cap, Q.nerve.us + gain("us"));
    Q.nerve.them = Math.min(RS.nerve.cap, Q.nerve.them + gain("them"));
    Q.units.forEach(u => u.used = 0);
    Q.step = "acts";
    qlog("Round " + Q.round + " — Nerve gained, activations reset");
  } else if(Q.step === "acts"){
    Q.step = "end";
  } else {
    const endingRound = Q.round;      // the round whose End step this is, before it advances
    /* Everything the End step does that a host could otherwise miss is
       collected here and handed back as Q.pending, for a popup that stays
       up until it is dismissed rather than a toast that can be missed. */
    const summary = [];
    Q.units.forEach(u => {
      if((u.cond || []).includes("burning")){ hurtUnit(u, 1, "burning"); summary.push(u.name + " burns for 1"); }
      if((u.cond || []).includes("tainted")){ hurtUnit(u, 1, "tainted"); summary.push(u.name + " is tainted for 1"); }
      u.ready = false;
      if(!u.pushed && u.strain > 0) u.strain = Math.max(0, u.strain - RS.strain.restDecay.amount);
      u.pushed = false;
    });
    /* sealedRule, read literally: "revealed in the End step of round 2" —
       this round's own End step, not the one that rolls into round 2. */
    const sc2 = Q.scenario;
    if(sc2 && sc2.sealed && !sc2.objectivesKnown && endingRound >= 2){
      sc2.objectivesKnown = true;
      qlog("The objectives are revealed");
      summary.push("The objectives are revealed");
    }
    Q.round++; Q.step = "tempo";
    qlog("End of round — Burning and Tainted bite, Ready cleared, Strain rested");
    /* Anything the scenario keeps back for this round comes out now. Until it
       does, nobody can read it — that is the point of writing it down early. */
    const due = ((Q.scenario || {}).events || []).filter(e => !e.sprung && e.round <= Q.round);
    due.forEach(e => {
      e.sprung = true;
      qlog("Round " + e.round + " — " + e.title);
      summary.push(e.title + (e.text ? ": " + e.text : ""));
      if(e.effect && e.effect.type === "spawn"){
        const hid = Q.units.filter(u => u.side === "them" && u.hidden);
        const one = hid.find(u => (e.effect.who || "").toLowerCase().includes(u.name.toLowerCase())) || hid[0];
        if(one) revealFoe(one.uid, e.title);
      }
    });
    Q.pending = {round: Q.round, lines: summary};
  }
  questSave();
}

/* ---- markers: numbered on the table, known only here ---- */
function markerKinds(){
  const priced = id => (((RS.scenario.budget || {}).costs) || []).find(c => c.id === id) || {};
  return {
    trapVisible:  {label: "Trap", hurt: 2,
      sprung: priced("trapVisible").desc || "Wits test or 2 damage.",
      seen: "A trap, in plain view now. Go round it, or disarm it with Interact in contact (Wits; Tools step up)."},
    trapHidden:   {label: "Hidden trap", hurt: 2,
      sprung: "It springs. " + (priced("trapVisible").desc || "Wits test or 2 damage."),
      seen: "A hidden trap, now visible. Go round it, or disarm it with Interact in contact."},
    cache:        {label: "Cache", hurt: 0,
      sprung: "A cache. It pays out only when a model in contact spends Interact on it (Wits test).",
      seen: "A cache. Interact in contact to search it."},
    hiddenUnit:   {label: "Hidden enemy", hurt: 0,
      sprung: "Something was waiting here. Place it on the marker.",
      seen: "A hidden enemy. Place it on the marker — it has not acted."},
    ambushTrigger:{label: "Ambush", hurt: 0,
      sprung: "Ambush. The reserve arrives — place it as the scenario says.",
      seen: "An ambush trigger. Stepping within 5 cm brings the reserve in."},
    objective:    {label: "Objective", hurt: 0,
      sprung: "The objective is here.", seen: "The objective is here."},
    nothing:      {label: "Nothing", hurt: 0,
      sprung: "Nothing. Take the marker off the table.", seen: "A decoy. Take it off the table."}
  };
}
/* Marker limits, straight from scenario.secrets.limits rather than guessed:
     objective     exactly the battle type's count (+1 per player beyond the first),
                   only for a battle type that actually hides objectives
     ambushTrigger one per 250 points
     hiddenUnit    one per 250 points, sharing that pool with ambushes
     trap          one per 150 points, both kinds together
     cache         one per 250 points
     decoys        at least one, and at least a quarter of all markers
     total         max 8

   The battle type's own base objective count is not stated as a number
   anywhere in the file, so this reads it as 1 for any type that lists
   objectives at all (mystery lists none, so gets zero) \u2014 flagged here
   rather than silently assumed. */
function rollMarkers(size, opts){
  const type = (opts && opts.type) || null;
  const players = Math.max(1, (opts && opts.players) || 1);
  const n = Math.max(1, Math.min(8, Math.round(size / 100) || 1));

  const capTrap = Math.max(0, Math.floor(size / 150));
  const capAmbushHidden = Math.max(0, Math.floor(size / 250));      // shared pool
  const capCache = Math.max(0, Math.floor(size / 250));
  const usesHiddenObjective = !!(type && type.objectives && type.objectives.length);
  const capObjective = usesHiddenObjective ? (1 + (players - 1)) : 0;
  const minDecoys = Math.max(1, Math.ceil(n / 4));

  const want = ["trapVisible", "trapHidden", "cache", "hiddenUnit", "ambushTrigger", "objective"];
  const pool = [];
  let traps = 0, ambushHidden = 0, caches = 0, objectives = 0, spins = 0;
  const room = () => n - pool.length - minDecoys;
  while(room() > 0 && spins++ < 500){
    const pick = want[Math.floor(Math.random() * want.length)];
    if((pick === "trapVisible" || pick === "trapHidden") && traps >= capTrap) continue;
    if((pick === "hiddenUnit" || pick === "ambushTrigger") && ambushHidden >= capAmbushHidden) continue;
    if(pick === "cache" && caches >= capCache) continue;
    if(pick === "objective" && objectives >= capObjective) continue;
    if(pick === "trapVisible" || pick === "trapHidden") traps++;
    if(pick === "hiddenUnit" || pick === "ambushTrigger") ambushHidden++;
    if(pick === "cache") caches++;
    if(pick === "objective") objectives++;
    pool.push(pick);
  }
  while(pool.length < n) pool.push("nothing");
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.map((kind, i) => ({n: i + 1, kind, state: "hidden"}));
}

/* Armour saves on damage that is not an attack (traps): one save die per
   point, each at the target number or better cancels 1. Only a model whose
   band is on this device has a known armour, so a foe just takes the damage
   and the text says to roll its saves by hand. */
function saveDieOf(u){
  const m = u && u.side === "us" && !u.remote ? band().members.find(x => x.id === u.uid) : null;
  const a = m && bodyArmourId(m) ? RS.armour.find(x => x.id === bodyArmourId(m)) : null;
  return a && a.save ? dieNum(a.save) : 0;
}
function damageWithSaves(u, amount, why){
  const die = saveDieOf(u), rolls = [];
  let taken = amount;
  if(die){
    taken = 0;
    for(let i = 0; i < amount; i++){
      const r = 1 + Math.floor(Math.random() * die); rolls.push(r);
      if(r < RS.dice.target) taken++;
    }
  }
  if(taken) hurtUnit(u, taken, why);
  return {taken, rolls, die};
}
function addCond(u, c){ if(!(u.cond || []).includes(c)) u.cond = (u.cond || []).concat([c]); }

/* A model walked into it. The app knows which model, so a trap lands where
   it should rather than on whoever the table remembers last.
   A visible trap asks for a Wits test first (the model may pass it), so it
   comes back as pending until trapFailed() is called; a hidden trap allows
   no test and Pins as well. */
function resolveMarker(num, uid){
  const mk = Q.markers.find(x => x.n === num); if(!mk) return null;
  const k = markerKinds()[mk.kind];
  const u = uid ? Q.units.find(x => x.uid === uid) : null;
  mk.state = mk.kind === "nothing" ? "gone" : "sprung";
  let extra = "", pending = null;
  if(mk.kind === "ambushTrigger" || mk.kind === "hiddenUnit"){
    const hid = Q.units.find(x => x.side === "them" && x.hidden);
    if(hid){ revealFoe(hid.uid, "marker " + num); extra += " " + hid.name + " was waiting here."; }
  }
  if(k.hurt && u && mk.kind === "trapVisible"){
    pending = {n: num, uid: u.uid};
    extra = " " + u.name + " makes a Wits test; on a fail, tap it below.";
  } else if(k.hurt && u){
    extra = " " + trapHit(u, k.hurt, "marker " + num, true);
  }
  qlog("Marker " + num + " — " + k.label + (u ? ", triggered by " + u.name : ""));
  questSave();
  return {label: k.label, text: k.sprung + extra, hurt: k.hurt && u && !pending ? u.name : null, pending};
}
/* Damage from a trap, with saves; hidden ones also Pin. Returns the sentence. */
function trapHit(u, amount, why, pin){
  if(u.remote && typeof sendEvent === "function"){
    /* Someone else's model: post what happened and let their app roll its own
       saves and apply it. */
    sendEvent(u.uid, Object.assign({damage: amount, saves: true, why}, pin ? {cond: "pinned"} : {}));
    return u.name + " takes up to " + amount + " (their app rolls the saves)" + (pin ? " and is Pinned." : ".");
  }
  const r = damageWithSaves(u, amount, why);
  if(pin) addCond(u, "pinned");
  questSave();
  const d = r.die ? " Saves d" + r.die + ": " + r.rolls.join(", ") + "." : (u.side === "them" ? " Roll its saves by hand." : "");
  return u.name + " takes " + r.taken + " of " + amount + "." + d + (pin ? " Pinned." : "");
}
function trapFailed(num, uid){
  const u = Q.units.find(x => x.uid === uid); if(!u) return null;
  const t = trapHit(u, 2, "marker " + num, false);
  qlog("Marker " + num + " — " + u.name + " failed the Wits test");
  return {label: "Trap", text: t, hurt: u.name};
}
function revealMarkers(nums){
  const out = [];
  nums.forEach(num => {
    const mk = Q.markers.find(x => x.n === num);
    if(!mk || mk.state === "gone") return;
    const k = markerKinds()[mk.kind];
    if(mk.state === "hidden") mk.state = mk.kind === "nothing" ? "gone" : "seen";
    out.push({n: num, label: k.label, text: k.seen});
  });
  qlog("Revealed " + nums.join(", ") + " without setting them off");
  questSave();
  return out;
}

/* ---- card.js ---- */
/* =====================================================================
   THE CARD
   This is the app. It is what you look at across a table instead of a
   printed sheet, so it has to answer one question fast: what can this
   model do right now?

   Everything it says is quoted from the ruleset in the ruleset's own
   words. Nothing is summarised, because a summary is the thing you end
   up looking up anyway.
   ===================================================================== */

let cardId = null;
function carded(){ return band().members.find(m => m.id === cardId); }

function openCard(id){
  cardId = id;
  drawCard();
  $("#sheet").classList.add("show");
  $("#scrim").classList.add("show");
  document.body.classList.add("locked");
  $("#sheet").scrollTop = 0;
}

/* One attack line per weapon: which die you roll, what it does, and
   whatever the model calls it. */
function attackHTML(m, e){
  const w = catOf("weapons")[e.id]; if(!w) return "";
  const ranged = w.kind === "ranged";
  const stat = ranged ? "aim" : "fight";
  const die = effDie(m, stat);            // after any scars
  const shown = skinOf(m, e.id, w.name);
  const mods = (e.mods || []).map(x => catOf("mods")[x]).filter(Boolean);
  return `
  <div class="atk">
    <div class="atk-top">
      <span class="atk-name">${ranged ? "➤" : "⚔"} ${esc(shown)}</span>
      <span class="atk-roll">${esc(RSX.stat[stat].name)} <b>${esc(die)}</b> <small>4+</small></span>
    </div>
    <div class="atk-line">${esc(isAnimal(m) ? w.desc.replace(/ · Two Handed/i, "") : w.desc)}${shown !== w.name ? ` · <span class="quiet">${esc(w.name)}</span>` : ""}</div>
    ${mods.length ? `<div class="atk-mods">${mods.map(x =>
      `<span class="mod"><b>${esc(x.name)}</b> ${esc(x.desc)}</span>`).join("")}</div>` : ""}
  </div>`;
}

/* Some catalogue entries (Extra arms is the worst of them) pack several
   sentences of mechanics into one dense paragraph. Split those onto their
   own lines so a card reads at a glance instead of as a wall of text —
   short entries are left exactly as written. */
function readableDesc(text){
  if(!text || text.length < 90) return text;
  return text.split(/(?<=[.!?])\s+(?=[A-Z(])/).join("\n");
}
/* A block of things that each have a name and their own words. */
function saysHTML(m, title, field, tone){
  const arr = m[field] || []; if(!arr.length) return "";
  const cat = catOf(GEAR_KIND[field].cat);
  const qty = GEAR_KIND[field].qty;
  const seen = new Set();
  return `
  <div class="slab">
    <div class="head"><span class="eyebrow">${esc(title)}</span><span class="rule"></span></div>
    ${arr.map(entry => {
      const id = qty ? entry.id : (entry.id || entry);
      const o = cat[id]; if(!o) return "";
      /* a trait taken twice (a second pair of arms) is one row, times two */
      const times = qty ? 1 : arr.filter(e => (e.id || e) === id).length;
      if(!qty){ if(seen.has(id)) return ""; seen.add(id); }
      const shown = GEAR_KIND[field].reskin ? skinOf(m, id, o.name) : o.name;
      return `<div class="says ${tone || ""}">
        <div class="says-n">${esc(shown)}${qty && (entry.qty || 1) > 1 ? ` ×${entry.qty}` : ""}${times > 1 ? ` \u00d7${times}` : ""}
          ${shown !== o.name ? `<span class="quiet"> · ${esc(o.name)}</span>` : ""}</div>
        <div class="says-d">${esc(readableDesc(o.desc))}</div>
      </div>`;
    }).join("")}
  </div>`;
}

let cardTab = "combat";
function combatTabHTML(m){
  return `${(m.weapons || []).length ? `
      <div class="slab">
        <div class="head"><span class="eyebrow">What it can do</span><span class="rule"></span>
          <span class="quiet">one Attack an activation</span></div>
        ${m.weapons.map(e => attackHTML(m, e)).join("")}
      </div>` : `
      <div class="slab"><p class="quiet" style="margin:0">Unarmed. It has no weapon.</p></div>`}
    ${saysHTML(m, "Traits", "traits")}
    ${saysHTML(m, "Abilities", "abilities")}
    ${saysHTML(m, "Powers", "powers")}
    ${saysHTML(m, "Flaws", "flaws", "bad")}
    ${saysHTML(m, "Carried", "items")}
    ${sizeHTML(m)}`;
}
function storyTabHTML(m){
  const k = isLeaderM(m) ? tetherKind(m.tetherKind) : null;
  const parts = [
    k ? `<div class="slab"><div class="head"><span class="eyebrow">Tether — ${esc(k.name)}</span><span class="rule"></span></div>
      <p class="quiet" style="margin:0">They must ${esc(tetherObservance(m.tetherKind, m.tetherSworn))}.</p>
      <p class="serif" style="margin:8px 0 0;color:var(--ash-dim);font-size:13.5px;line-height:1.55">${esc(k.why)}</p></div>` : "",
    m.story ? `<div class="slab"><div class="head"><span class="eyebrow">Their story</span><span class="rule"></span></div>
      <p class="serif" style="margin:0;font-size:14px;line-height:1.6;color:var(--ash-dim)">${esc(m.story)}</p></div>` : "",
    scarsHTML(m), foundHTML(m)].filter(Boolean);
  return parts.length ? parts.join("") : `<div class="empty"><div class="big">Nothing written yet</div>
    <div class="quiet">Their story, scars and finds gather here as they play.</div></div>`;
}
function trainTabHTML(m){
  const locked = memberLocked(m), camp = realmAvailable();
  return `<div class="slab">
    <div class="head"><span class="eyebrow">Advancement</span><span class="rule"></span>${m.xp ? `<span class="chip gilt">${m.xp} XP</span>` : ""}</div>
    <p class="quiet" style="margin:0 0 10px">${m.xp
      ? "XP buys anything at its points price, surcharge and all."
      : "No XP to spend yet. It comes from battles."}</p>
    <div class="sheet-actions" style="flex-wrap:wrap;gap:8px;margin:0">
      <button class="btn ${m.xp ? "primary" : ""}" id="ctTrain" style="margin-left:0" ${m.xp ? "" : "disabled"}>Spend XP</button>
      ${camp ? `<button class="btn" id="ctGear">Gear</button>` : ""}
      ${camp && treatable(m) ? `<button class="btn" id="ctSurg">Surgery</button>` : ""}
    </div>
  </div>
  <div class="slab">
    <div class="head"><span class="eyebrow">${lockIcon(locked, 13)} ${locked ? "Locked" : "Editable"}</span><span class="rule"></span></div>
    <p class="quiet" style="margin:0">${locked
      ? "They have been on a quest, so their build is fixed. XP and Cash are the only things that change it."

    ${locked ? "" : `<div class="sheet-actions" style="margin:10px 0 0"><button class="btn" id="ctEdit" style="margin-left:0">Edit</button></div>`}
  </div>`;
}
function drawCard(){
  const m = carded(); if(!m) return closeSheet();
  const n = squadOf(m), live = questUnit(m);
  const armour = bodyArmourId(m) ? catOf("armour")[bodyArmourId(m)] : null;
  const shield = shieldId(m) ? catOf("armour")[shieldId(m)] : null;

  const statCell = (label, value, note) => `
    <div class="cstat"><b>${esc(value)}</b><span>${esc(label)}</span>${note ? `<small>${esc(note)}</small>` : ""}</div>`;

  $("#sheetIn").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="cBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="eyebrow">${n > 1 ? "A squad of the Unburied" : "One of the Unburied"}</div>
      ${m.xp ? `<button class="btn sm" id="cXP">${m.xp} XP</button>` : ""}
      ${realmAvailable() ? "" : `<button class="btn sm ghost" id="cSend">${barrowIcon(13)} Send to the Barrow</button>`}
      <button class="btn sm ghost" id="cEdit">${memberLocked(m) ? "Locked" : "Edit"}</button>
    </div>

    <div class="cardhead">
      <div class="cardname">${isLeaderM(m) ? crownHTML(19) : ""}${esc(fullName(m)) || "Unnamed"}</div>
      ${combatStyle(m) ? `<div style="margin:2px 0 4px">${styleBadge(m)}</div>` : ""}
      ${m.epitaph ? `<div class="cardepi">“${esc(m.epitaph)}”</div>` : ""}
      <div class="cardrole">${esc(m.role || "")}${n > 1 ? (m.role ? " · " : "") + n + " models" : ""}
        ${handsOf(m) > 2 ? `<span class="chip gilt">${handsOf(m)} arms</span>` : ""}
        ${handsFree(m) < 0 ? `<span class="chip bad" title="More gear than hands">\u270b ${handsUsed(m)} of ${handsOf(m)}</span>` : ""}
        <span class="cardpts">${unitCost(m)} points</span></div>
    </div>

    ${live ? questStripHTML(m, live) : (isHurt(m) ? hurtStripHTML(m) : "")}

    <div class="cstats">
      ${DIE_STATS.map(k => { const e = effDie(m, k);
          return statCell(RSX.stat[k].name, e, e !== m[k] ? "was " + m[k] : "roll 4+"); }).join("")}
      ${statCell(RSX.stat.wounds.name,
          isHurt(m) ? healthOf(m).reduce((s2, h) => s2 + h, 0) + "/" + (effWounds(m) * n) : effWounds(m),
          isHurt(m) ? "left" : (effWounds(m) !== m.wounds ? "was " + m.wounds : (n > 1 ? "each" : "")))}
      ${statCell(RSX.stat.move.name, effectiveMove(m) + "cm", armour && armour.moveMod ? "with armour" : "")}
      ${statCell(RSX.stat.actions.name, m.actions, "an activation")}
      ${statCell("Activations", activationsOf(m), "a round")}
      ${armour ? statCell("Armour", (RS.armour.find(a => a.id === bodyArmourId(m)) || {}).save || "—", skinOf(m, bodyArmourId(m), armour.name)) : ""}
      ${shield ? statCell("Shield", "\u2713", "melee steps down") : ""}
      ${m.size !== statDefault("size") ? statCell(RSX.stat.size.name, m.size.charAt(0).toUpperCase() + m.size.slice(1), "") : ""}
    </div>

    <div class="ctabs" role="tablist">
      ${[["combat", "Combat"], ["story", "Story"], ["train", "Training"]].map(([id, label]) =>
        `<button class="ctab ${cardTab === id ? "on" : ""}" role="tab" aria-selected="${cardTab === id}" data-ctab="${id}">${label}</button>`).join("")}
    </div>

    ${cardTab === "combat" ? combatTabHTML(m) : cardTab === "story" ? storyTabHTML(m) : trainTabHTML(m)}

    <div class="sheet-actions">
      <span class="quiet">${n > 1 ? "Every model shares this profile." : ""}</span>
      <button class="btn primary" id="cDone">Done</button>
    </div>`;

  const root = $("#sheetIn");
  root.querySelectorAll("[data-drop-found]").forEach(btn => btn.onclick = () => {
    dropFound(m, btn.dataset.dropFound);
    drawCard(); renderUnburied(band());
    toast("Left behind");
  });
  root.querySelectorAll("[data-hurt]").forEach(btn => btn.onclick = () => {
    const [what, i, d] = btn.dataset.hurt.split("|");
    if(what === "patch"){ patchUp(m); toast("Patched up"); }
    else { const hp = healthOf(m); hp[+i] = hp[+i] + +d; setHealth(m, hp); }
    drawCard(); renderUnburied(band());
  });
  root.querySelectorAll("[data-ctab]").forEach(btn => btn.onclick = () => { cardTab = btn.dataset.ctab; drawCard(); $("#sheet").scrollTop = 0; });
  const tr = root.querySelector("#ctTrain"); if(tr) tr.onclick = () => openAdvance(m.id);
  const ge = root.querySelector("#ctGear"); if(ge) ge.onclick = () => openBuy(m.id);
  const su = root.querySelector("#ctSurg"); if(su) su.onclick = () => openTreat(m.id);
  const ed = root.querySelector("#ctEdit"); if(ed) ed.onclick = () => openMember(m.id);
  root.querySelector("#cBack").onclick = closeSheet;
  root.querySelector("#cDone").onclick = closeSheet;
  root.querySelector("#cEdit").onclick = () => openMember(m.id);
  const xpb = root.querySelector("#cXP");
  if(xpb) xpb.onclick = () => openAdvance(m.id);
  const sendb = root.querySelector("#cSend");
  if(sendb) sendb.onclick = () => openMemberSend(m);
  if(live) questBind(root, m);
}

/* Outside a quest a hurt model still shows what it lost, and can be patched
   up when the band has had time to see to it. */
function hurtStripHTML(m){
  const hp = healthOf(m), n = hp.length;
  return `
  <div class="qstrip hurtonly">
    <div class="qs-top">
      <span class="qs-round">Carrying wounds</span>
      <span class="chip bad">${hp.reduce((s, h) => s + h, 0)}/${m.wounds * n}</span>
      ${n > 1 ? `<span class="chip">${hp.filter(h => h > 0).length}/${n} standing</span>` : ""}
      <button class="chip good" data-hurt="patch">Patch up</button>
    </div>
    <div class="qs-hp">
      ${hp.map((h, i) => `
        <span class="pip ${h <= 0 ? "dead" : h <= m.wounds * 0.5 ? "hurt" : ""}">
          <button data-hurt="hp|${i}|-1" aria-label="Worse">\u2212</button><b>${h}</b>
          <button data-hurt="hp|${i}|1" aria-label="Better">+</button></span>`).join("")}
    </div>
    <p class="quiet" style="margin:0">Taken in a scenario and still carried. Patch up when
      they have had time to mend.</p>
  </div>`;
}

/* Things picked up in the field. Deliberately apart from bought gear: a model
   that finds a medkit does not become worth more points for having found it. */

    ${f.map(x => `
      <div class="says">
        <div class="says-n">${esc(x.name)}

          <button class="tiny" data-drop-found="${esc(x.fid)}" style="margin-left:auto"
            aria-label="Leave it behind">\u00d7</button></div>

  return `
  <div class="slab">
    <div class="head"><span class="eyebrow">What it has cost them</span><span class="rule"></span>

}

/* Being small or huge is not just a number: 0.11 gives every size its own
   benefits and drawbacks, and they belong on the card with everything else. */
function sizeHTML(m){
  const sz = RSX.stat.size; if(!sz) return "";
  const e = (sz.effects || {})[m.size];
  if(!e || (!(e.benefits || []).length && !(e.drawbacks || []).length)) return "";
  return `
  <div class="slab">
    <div class="head"><span class="eyebrow">Being ${esc(m.size)}</span><span class="rule"></span>
      <span class="quiet">${startHealth(m.size)}\u2013${maxHealth(m.size)} ${esc(RSX.stat.wounds.name.toLowerCase())}</span></div>
    ${(e.benefits || []).map(b => `<div class="says"><div class="says-d">${esc(b)}</div></div>`).join("")}
    ${(e.drawbacks || []).map(d => `<div class="says bad"><div class="says-d">${esc(d)}</div></div>`).join("")}
  </div>`;
}

/* ---- ai.js ---- */
/* =====================================================================
   THE AI
   One way in, two possible backends. Today it is the artifact's own
   sampling; set AI_ENDPOINT and every AI feature moves to a server you
   run, without a line changing anywhere else.

   Whatever comes back is a suggestion. Every id is checked against the
   ruleset and the whole build is trimmed until it fits the points, so a
   hallucinated trait or an overspend never reaches the roster.
   ===================================================================== */

const AI_ENDPOINT = "";                 // e.g. "https://epitaph.<you>.workers.dev/ask"
function aiKey(){ try{ return localStorage.getItem("ep_aikey") || ""; }catch(e){ return ""; } }

let _ai, _aiTried = false;
/* The runtime that grants sampling is injected after the page's first scripts
   run, so asking the moment we boot finds nothing. Wait for it to turn up
   before deciding there is none — and never cache "no" just because it has
   not arrived yet, or the whole session is stuck with that answer. */
const AI_WAIT_MS = 10000, AI_POLL_MS = 120;
let _aiPending = null;
function claudeReady(){ return !!(window.claude && typeof window.claude.use === "function"); }

async function getAI(){
  /* Camp has no AI behind it, so never wait ten seconds to find that out. */
  if(typeof realmAvailable === "function" && realmAvailable() && !AI_ENDPOINT){ _ai = null; _aiTried = true; return null; }
  if(_aiTried) return _ai;
  if(_aiPending) return _aiPending;
  _aiPending = (async () => {
    if(AI_ENDPOINT){ _ai = httpAI(AI_ENDPOINT); _aiTried = true; return _ai; }
    const until = Date.now() + AI_WAIT_MS;
    while(!claudeReady() && Date.now() < until){
      await new Promise(r => setTimeout(r, AI_POLL_MS));
    }
    if(!claudeReady()){ _ai = null; _aiTried = true; return null; }
    try{ _ai = await window.claude.use("sample"); }
    catch(e){ _ai = null; }
    _aiTried = true;
    return _ai;
  })();
  const got = await _aiPending;
  _aiPending = null;
  return got;
}
function httpAI(url){
  async function post(prompt, opts){
    let r;
    try{
      r = await fetch(url, {method:"POST",
        headers: Object.assign({"content-type":"application/json"}, aiKey() ? {authorization:"Bearer " + aiKey()} : {}),
        body: JSON.stringify({prompt, tier:(opts && opts.modelTier) || "default"})});
    }catch(e){ throw {code:"offline", message:"Could not reach the service."}; }
    if(!r.ok) throw {code: r.status === 401 || r.status === 403 ? "not_granted"
                         : r.status === 429 ? "rate_limited" : "error",
                     message:"The service answered " + r.status + "."};
    return String(((await r.json().catch(() => ({}))) || {}).text || "");
  }
  const ask = async (p, o) => { const text = await post(p, o); if(o && o.onText) o.onText({text}); return {text}; };
  ask.json = async (p, o) => {
    const text = await post(p, o);
    const m = text.match(/[\[{][\s\S]*[\]}]/);
    try{ return JSON.parse(m ? m[0] : text); }
    catch(e){ throw {code:"bad_json", message:"The reply was not valid JSON."}; }
  };
  return ask;
}
function aiTrouble(code){
  switch(code){
    case "not_granted": case "sampling_disabled": case "capability_disabled":
    case "not_declared": case "capability_removed":
      return "There is no AI behind this copy. It works in the version opened from claude.ai — you may be on the web address instead, where it stays dark until you point it at your own service.";
    case "rate_limited": return "Too many at once. Wait a moment and try again.";
    case "offline":      return "No answer from the service. Check the connection.";
    case "bad_json":     return "What came back was garbled. Try again.";
    case "cancelled":    return "";
    default:             return "That did not work. Try again.";
  }
}

/* ---- what the ruleset offers, written out for the model to choose from ---- */
function aiCatalogue(){
  const line = kind => Object.values(catOf(kind))
    .map(o => `${o.id} "${o.name}" (${o.cost})`).join(", ");
  const weapons = Object.values(catOf("weapons"))
    .map(o => `${o.id} "${o.name}" (${o.cost}; ${o.desc})`).join(", ");
  const mods = Object.values(catOf("mods"))
    .map(o => `${o.id} "${o.name}" (+${o.cost}: ${o.desc})`).join(", ");
  return `TRAITS: ${line("traits")}
ABILITIES: ${line("abilities")}
POWERS: ${line("powers")}
FLAWS (these give points back): ${line("flaws")}
WEAPONS: ${weapons}
WEAPON EFFECTS (any weapon may take some): ${mods}
ARMOUR: ${line("armour")}
CARRIED: ${line("items")}`;
}

/* ---- turn a suggestion into something legal ---- */
function aiLegalise(raw, budget){
  if(!raw || typeof raw !== "object") return null;
  const m = newMember();
  const st = raw.stats || {};
  DIE_STATS.forEach(k => {
    const conf = RSX.stat[k], i = RSX.ladder.indexOf(dieNum(String(st[k] || "").trim()));
    if(i < 0){ m[k] = conf.default; return; }
    const lo = RSX.ladder.indexOf(dieNum(conf.min)), hi = RSX.ladder.indexOf(dieNum(conf.max));
    m[k] = dieName(RSX.ladder[Math.max(lo, Math.min(hi, i))]);
  });
  const clamp = (v, conf, step) => {
    let n = Math.round(+v); if(!isFinite(n)) n = conf.default;
    if(step) n = conf.default + Math.round((n - conf.default) / step) * step;
    return Math.max(conf.min, Math.min(conf.max, n));
  };
  m.move    = clamp(st.move, RSX.stat.move, RSX.stat.move.step);
  m.actions = clamp(st.actions, RSX.stat.actions);
  if(RSX.stat.size && RSX.stat.size.values.includes(raw.size)) m.size = raw.size;
  /* Health is bounded by the size it just chose, not by a global default. */
  m.wounds = clamp(st.wounds, {default: startHealth(m.size), min: 1, max: maxHealth(m.size)},
                   RSX.stat.wounds.upStep || 1);

  const keep = (arr, kind, max) => [...new Set((Array.isArray(arr) ? arr : [])
    .map(x => (typeof x === "string" ? x : x && x.id))
    .filter(id => catOf(kind)[id]))].slice(0, max);
  m.traits    = keep(raw.traits, "traits", 4);
  m.abilities = keep(raw.abilities, "abilities", 3);
  m.powers    = keep(raw.powers, "powers", 3);
  m.flaws     = keep(raw.flaws, "flaws", ((RS.flaws || {}).refundCap || {}).maxFlaws || 2);

  (Array.isArray(raw.weapons) ? raw.weapons : []).slice(0, 3).forEach(x => {
    const id = typeof x === "string" ? x : x && x.id;
    if(!catOf("weapons")[id] || m.weapons.some(e => e.id === id)) return;
    const mods = [...new Set(((x && x.mods) || []).filter(v => catOf("mods")[v]))];
    m.weapons.push({id, qty: 1, mods});
    const as = (x && typeof x.as === "string") ? x.as.trim().slice(0, 40) : "";
    if(as && as.toLowerCase() !== catOf("weapons")[id].name.toLowerCase()) m.skins[id] = as;
  });
  /* a suit and a shield can go together; either may be missing, and either may have
     been put in the other's place */
  const arm = [raw.armour, raw.shield].filter(id => typeof id === "string" && catOf("armour")[id]);
  m.armour = [arm.find(id => !armourUsesHand(id)), arm.find(id => armourUsesHand(id))].filter(Boolean);
  m.items = keep(raw.items, "items", 2).map(id => ({id, qty: 1}));

  /* It cannot carry more than its hands allow, whatever was written. */
  let handGuard = 20;
  while(handsFree(m) < 0 && handGuard-- > 0){
    /* the shield goes first: it is the extra, the weapons are what the model is */
    if(shieldId(m)){ m.armour = m.armour.filter(id => !armourUsesHand(id)); continue; }
    const w = m.weapons[m.weapons.length - 1];
    if(w){ if((w.qty || 1) > 1) w.qty--; else { delete m.skins[w.id]; m.weapons.pop(); } continue; }
    break;
  }
  /* Trim until it can be paid for: the trimmings go in the order a player
     would give things up, cheapest flavour first, their own dice last. */
  let guard = 80;
  while(memberCost(m) > budget && guard-- > 0){
    if(m.items.length){ m.items.pop(); continue; }
    const withMods = m.weapons.filter(w => w.mods.length);
    if(withMods.length){ withMods[withMods.length - 1].mods.pop(); continue; }
    if(m.powers.length){ m.powers.pop(); continue; }
    if(m.abilities.length){ m.abilities.pop(); continue; }
    if(m.armour.length){ m.armour = []; continue; }
    if(m.weapons.length > 1){ const g = m.weapons.pop(); delete m.skins[g.id]; continue; }
    const costly = m.traits.filter(id => catOf("traits")[id].cost > 0);
    if(costly.length){ m.traits.splice(m.traits.indexOf(costly[costly.length - 1]), 1); continue; }
    if(m.wounds > startHealth(m.size)){ m.wounds -= (RSX.stat.wounds.upStep || 1); continue; }
    if(m.actions > RSX.stat.actions.default){ m.actions--; continue; }
    const best = DIE_STATS.slice().sort((a, b) => dieNum(m[b]) - dieNum(m[a]))[0];
    if(dieNum(m[best]) > dieNum(RSX.stat[best].default)){ m[best] = dieStep(m[best], -1); continue; }
    if(m.weapons.length){ const g = m.weapons.pop(); delete m.skins[g.id]; continue; }
    break;
  }
  m.name = String(raw.name || "").trim().slice(0, 42);
  let epithet = String(raw.epithet || "").trim().slice(0, 50);
  /* Belt and braces: the model sometimes folds the epithet into the name
     itself and then repeats it — drop it here rather than show it twice. */
  if(epithet && m.name.toLowerCase().includes(epithet.toLowerCase())) epithet = "";
  m.epithet = epithet;
  m.epitaph = String(raw.epitaph || "").trim().slice(0, 140);
  m.role = String(raw.role || "").trim().slice(0, 40);
  m.story = String(raw.story || "").trim();
  return m.name ? m : null;
}

function aiSummary(m){
  const nm = (arr, kind) => arr.map(id => (catOf(kind)[id] || {}).name).filter(Boolean);
  const parts = [DIE_STATS.map(k => RSX.stat[k].name + " " + m[k]).join(" · "),
                 m.wounds + " " + RSX.stat.wounds.name];
  const w = m.weapons.map(e => skinOf(m, e.id, (catOf("weapons")[e.id] || {}).name));
  if(w.length) parts.push(w.join(", "));
  const t = nm(m.traits, "traits").concat(nm(m.abilities, "abilities"), nm(m.powers, "powers"));
  if(t.length) parts.push(t.join(", "));
  const f = nm(m.flaws, "flaws");
  if(f.length) parts.push(f.join(", "));
  return parts.join("  ·  ");
}

/* ---- carry.js ---- */
/* =====================================================================
   CARRYING THINGS OUT
   Nothing raised in the Reliquary lives anywhere else, which means a dead
   phone or a different origin loses it. So a band, and separately a
   scenario, can each be written down as a code: short enough to paste
   into a message, complete enough to raise the whole thing again
   somewhere else — in camp, or in the Realm.
   ===================================================================== */

const CARRY_TAG = "EPITAPH1";
const SCENARIO_CARRY_TAG = "EPITAPHSCN1";
const MEMBER_CARRY_TAG = "EPITAPHM1";
const GROUP_CARRY_TAG = "EPITAPHG1";      // several chosen Unburied, sent together
const KNOWN_CARRY_TAGS = [CARRY_TAG, SCENARIO_CARRY_TAG, MEMBER_CARRY_TAG, GROUP_CARRY_TAG];

/* Only what differs from a fresh model is written down. A band of six comes
   out a few hundred characters rather than several thousand. */
function thin(m){
  const base = newMember(), out = {};
  Object.keys(m).forEach(k => {
    if(k === "id") return;
    const v = m[k], b = base[k];
    if(JSON.stringify(v) === JSON.stringify(b)) return;
    if(v === "" || v === null || v === undefined) return;
    if(Array.isArray(v) && !v.length) return;
    if(k === "skins" && !Object.keys(v || {}).length) return;
    out[k] = v;
  });
  return out;
}
function bandPayload(b){
  return {t: CARRY_TAG, rs: RS.meta.version, name: b.name, budget: b.budget,
          members: b.members.map(thin)};
}

/* gzip where the browser has it, which is most places now; plain where not.
   The prefix says which, and which of the known tags it is, so a code
   made on one device for one purpose is never mistaken for the other. */
async function packCode(obj, tag){
  tag = tag || CARRY_TAG;
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let body, mark = "R";
  if(typeof CompressionStream === "function"){
    try{
      const cs = new CompressionStream("gzip");
      const w = cs.writable.getWriter(); w.write(bytes); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      body = new Uint8Array(buf); mark = "Z";
    }catch(e){ body = bytes; }
  } else body = bytes;
  let s = ""; body.forEach(c => s += String.fromCharCode(c));
  return tag + mark + ":" + btoa(s);
}
async function unpackCode(code){
  const raw = String(code || "").trim().replace(/\s+/g, "");
  const tag = KNOWN_CARRY_TAGS.find(t => raw.startsWith(t));
  const m = tag && raw.slice(tag.length).match(/^([ZR]):(.+)$/);
  if(!m) throw new Error("That is not an Epitaph code.");
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  let json;
  if(m[1] === "Z"){
    const ds = new DecompressionStream("gzip");
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    json = await new Response(ds.readable).text();
  } else json = new TextDecoder().decode(bytes);
  const obj = JSON.parse(json);
  if(obj.t !== tag) throw new Error("That code is not from Epitaph.");
  return obj;
}

/* Whatever arrives is put through the same mending every saved band gets,
   so a code written against an older ruleset still opens. */
function adoptBand(obj){
  const b = newBand(obj.name || "The Unburied");
  b.budget = Math.max(0, parseInt(obj.budget, 10) || 500);
  b.members = (obj.members || []).map(m => Object.assign(newMember(), m, {id: uid()}));
  mendBand(b);
  return b;
}

/* One of the Unburied, sent alone — a Leader raised to replace one who did
   not come back, joining a band already at camp rather than starting a
   new one. */
function memberPayload(m){ return {t: MEMBER_CARRY_TAG, rs: RS.meta.version, member: thin(m)}; }
function groupPayload(list){ return {t: GROUP_CARRY_TAG, rs: RS.meta.version, members: list.map(thin)}; }
function adoptMember(obj){ return Object.assign(newMember(), obj.member, {id: uid()}); }

/* A scenario carries whole — it is already trimmed to what the ruleset
   allowed when it was written, and there is no fresh-model shape to diff
   it against the way a band member has. */
function scenarioPayload(s){ return {t: SCENARIO_CARRY_TAG, rs: RS.meta.version, out: s}; }

      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Saved");
    }catch(e){ toast("Files cannot be saved here \u2014 copy the code instead"); }
  };

  const bring = async text => {
    const msg = $("#cyMsg");
    try{
      let obj;
      const t = String(text || "").trim();
      if(t.startsWith("{")) obj = JSON.parse(t);        // a saved file, pasted or opened
      else obj = await unpackCode(t);
      if(obj.t !== CARRY_TAG) throw new Error("That is not an Epitaph band.");
      const nb = adoptBand(obj);
      store.bands.push(nb); store.activeId = nb.id;
      save(); closePicker(); render();
      toast(nb.name + " raised \u2014 " + nb.members.length + " of them");
      if(obj.rs && obj.rs !== RS.meta.version)
        setTimeout(() => toast("Written against ruleset " + obj.rs + "; costs may differ"), 2400);
    }catch(e){
      msg.textContent = e.message || "That did not open.";
      msg.style.color = "var(--rust)";
    }
  };
  const go = $("#cyGo");
  if(go) go.onclick = () => bring($("#cyIn").value);
  const file = $("#cyFile");
  if(file) file.onchange = e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => bring(String(r.result));
    r.readAsText(f);
  };
}
