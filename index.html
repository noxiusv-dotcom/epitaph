<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Epitaph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* =====================================================================
   EPITAPH — carved stone, ash and gilt.
   Headings are inscriptions: Cinzel, letter-spaced, the way a name is cut
   into a marker. Body is plain and readable because rules text has to be.
   ===================================================================== */
:root{
  color-scheme:dark;       /* native pop-ups (the effect list, selects) follow the theme */
  --stone-0:#0d0f12;        /* the dark between markers */
  --stone-1:#14171c;        /* panel */
  --stone-2:#1c2026;        /* raised panel */
  --stone-3:#252a32;        /* input, chip */
  --line:#2f353e;
  --line-soft:#232830;

  --ash:#e8e4dc;            /* primary text: bone, not white */
  --ash-dim:#a8a49c;
  --ash-mute:#6e6a64;

  --gilt:#c9a227;           /* the lettering on the marker */
  --gilt-deep:#9c7d18;
  --gilt-glow:rgba(201,162,39,.14);
  --verdigris:#5e9e8a;      /* aged copper: good news */
  --rust:#b5503c;           /* iron rot: bad news */

  --r-sm:3px; --r-md:4px; --r-lg:4px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  --frame:#2a241a;          /* the outer keyline of a framed panel */
  --edge:#3a3225;           /* the panel's own border */
  --candle:rgba(224,168,60,.05);
  --panel-a:#191816; --panel-b:#12110f;
  --vig:rgba(0,0,0,.55);
  --grain:.05;
  --halo:rgba(224,168,60,.07);
  --under:rgba(224,168,60,.13);   /* dark stone: a shadow can't be seen, so the float is shown as light beneath */
  --rim:rgba(255,236,190,.08);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --stone-0:#e9e5dd; --stone-1:#f3f0e9; --stone-2:#fbf9f4; --stone-3:#ffffff;
    --line:#d2ccc0; --line-soft:#e0dbd1;
    --ash:#1b1916; --ash-dim:#55504a; --ash-mute:#8a8479;
    --gilt:#8a6d12; --gilt-deep:#6d5510; --gilt-glow:rgba(138,109,18,.10);
    --verdigris:#3f7a66; --rust:#9c402d;
    --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 18px rgba(0,0,0,.08);
    --frame:#d9d2c2; --edge:#c9bfa8; --candle:rgba(138,109,18,.05);
    --panel-a:#f6f3ec; --panel-b:#efeadf;
    --vig:rgba(90,70,30,.16); --grain:.06; --halo:rgba(138,109,18,.08); --under:transparent; --rim:transparent;
  }
}
[data-theme="light"]{
  color-scheme:light;
  --stone-0:#e9e5dd; --stone-1:#f3f0e9; --stone-2:#fbf9f4; --stone-3:#ffffff;
  --line:#d2ccc0; --line-soft:#e0dbd1;
  --ash:#1b1916; --ash-dim:#55504a; --ash-mute:#8a8479;
  --gilt:#8a6d12; --gilt-deep:#6d5510; --gilt-glow:rgba(138,109,18,.10);
  --verdigris:#3f7a66; --rust:#9c402d;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 18px rgba(0,0,0,.08);
  --frame:#d9d2c2; --edge:#c9bfa8; --candle:rgba(138,109,18,.05);
  --panel-a:#f6f3ec; --panel-b:#efeadf;
  --vig:rgba(90,70,30,.16); --grain:.06; --halo:rgba(138,109,18,.08); --under:transparent; --rim:transparent;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
select,option,optgroup{background-color:var(--stone-2);color:var(--ash)}
/* Where the browser lets a drop-down be dressed (Chrome, Edge), its list is ours: translucent glass, gilt edge, gilt highlight instead of the system blue. */
@supports (appearance:base-select){
  select,select::picker(select){appearance:base-select}
  select::picker-icon{color:var(--gilt);transition:rotate .2s}
  select:open::picker-icon{rotate:180deg}
  select::picker(select){
    background:color-mix(in srgb,var(--panel-a) 72%,transparent);
    -webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1);
    border:1px solid var(--gilt-deep);border-radius:3px;padding:4px;margin-top:4px;
    box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 3px color-mix(in srgb,var(--stone-0) 70%,transparent);
    max-height:min(60vh,360px);overflow:auto;color:var(--ash)}
  select option{background:transparent;color:var(--ash);padding:9px 12px;border-radius:2px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  select option:hover,select option:focus-visible{background:var(--gilt-glow);color:var(--gilt);outline:none}
  select option:checked{background:color-mix(in srgb,var(--gilt) 18%,transparent);color:var(--gilt)}
  select option::checkmark{color:var(--gilt);order:2;margin-left:auto}
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(90% 55% at 50% 0,var(--halo),transparent 70%),
    radial-gradient(130% 110% at 50% 40%,transparent 55%,var(--vig)),
    var(--stone-0);
  background-attachment:fixed;
  color:var(--ash);
  font:15px/1.55 "Inter",system-ui,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:anywhere;
}
body.locked{overflow:hidden}
/* a fine stone grain over everything, too faint to read as a pattern */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* thin, even line-work for every icon */
svg[stroke="currentColor"]{stroke-width:1.5}
.iconbtn svg,.way svg{stroke-width:1.4}

/* ---- inscriptional headings ---- */
h1,h2,h3,.inscribed{
  font-family:"Cinzel",Georgia,serif;
  font-weight:600;
  letter-spacing:.06em;
  margin:0;
}
h1{font-size:23px;letter-spacing:.16em;font-weight:500}
h2{font-size:17px;letter-spacing:.1em;font-weight:500}
h3{font-size:16px;letter-spacing:.08em}
.eyebrow{
  font-family:"Cinzel",Georgia,serif;
  font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gilt-deep);
}
.lead{color:var(--ash-dim);font-size:13.5px;margin:6px 0 0;line-height:1.55}
.quiet{color:var(--ash-mute);font-size:12.5px}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.serif{font-family:"Spectral",Georgia,serif}

/* ---- the masthead, cut like a marker ---- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--stone-1),var(--stone-0));
  border-bottom:1px solid var(--line);
}
.masthead{max-width:860px;margin:0 auto;padding:13px 16px 0;display:flex;align-items:center;gap:12px}
.sigil{
  width:34px;height:34px;flex:none;border-radius:2px;
  border:1px solid var(--gilt-deep);background:var(--stone-2);
  display:grid;place-items:center;color:var(--gilt);
  box-shadow:0 0 0 2px var(--stone-0),0 0 0 3px var(--frame),0 0 16px var(--gilt-glow);
}
.brand{min-width:0;flex:1}
.brand h1{line-height:1.1}
.brand .sub{
  font-family:"Cinzel",Georgia,serif;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ash-mute);margin-top:3px;
}
.iconbtn{
  width:34px;height:34px;flex:none;border-radius:2px;border:1px solid var(--edge);
  background:transparent;color:var(--gilt-deep);display:grid;place-items:center;cursor:pointer;
}
.iconbtn:hover{color:var(--gilt);border-color:var(--gilt-deep);box-shadow:0 0 12px var(--gilt-glow)}

/* ---- the two halves of the app ---- */
nav.ways[hidden]{display:none}
nav.ways{max-width:860px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px}
.way{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 12px;border-radius:3px 3px 0 0;
  border:1px solid var(--line);border-bottom:none;
  background:var(--stone-1);color:var(--ash-mute);cursor:pointer;
  font-family:"Cinzel",Georgia,serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
}
.way.on{background:var(--stone-2);color:var(--gilt);border-color:var(--gilt-deep)}
.way svg{width:15px;height:15px}

main{max-width:860px;margin:0 auto;padding:18px 16px 90px}

/* ---- surfaces ---- */
/* A framed panel: a keyline outside a keyline, gilt corner marks on two corners, a faint candle-glow within. */
.slab{
  position:relative;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
  border:1px solid var(--edge);border-radius:4px;
  padding:16px;
  box-shadow:0 0 0 3px var(--stone-0),0 0 0 4px var(--frame),0 8px 24px rgba(0,0,0,.28),inset 0 0 40px var(--candle);
  margin:5px 5px;
}
.slab::before,.slab::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gilt);pointer-events:none;opacity:.9}
.slab::before{top:5px;left:5px;border-right:0;border-bottom:0}
.slab::after{bottom:5px;right:5px;border-left:0;border-top:0}
.slab + .slab{margin-top:18px}
.rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gilt-deep),transparent);opacity:.7}
.head{display:flex;align-items:center;gap:11px;margin-bottom:12px}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:2px;border:1px solid var(--edge);
  background:transparent;color:var(--ash-dim);font-size:11.5px;white-space:nowrap;
}
.chip.gilt{color:var(--gilt);border-color:var(--gilt-deep);background:var(--gilt-glow)}
.chip.good{color:var(--verdigris);border-color:var(--verdigris)}
.chip.bad{color:var(--rust);border-color:var(--rust)}

.btn{
  font-family:"Cinzel",Georgia,serif;font-weight:500;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  padding:9px 18px;border-radius:2px;
  border:1px solid var(--gilt-deep);background:transparent;color:var(--gilt);
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--gilt-deep)}
.btn:hover{box-shadow:0 0 14px var(--gilt-glow)}
.btn.primary{background:var(--gilt);border-color:var(--gilt);color:#17130a;font-weight:600;
  box-shadow:inset 0 0 0 2px var(--gilt),inset 0 0 0 3px rgba(23,19,10,.35)}
.btn.primary:hover{background:var(--gilt-deep);border-color:var(--gilt-deep);box-shadow:inset 0 0 0 2px var(--gilt-deep),inset 0 0 0 3px rgba(23,19,10,.35),0 0 14px var(--gilt-glow)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ash-dim)}
.btn.ghost:hover{color:var(--gilt)}
.btn.sm{font-size:10.5px;padding:6px 12px;letter-spacing:.13em}
.btn.danger,.btn.danger.ghost{color:var(--rust);border-color:var(--rust)}
.btn:disabled{opacity:.4;cursor:default}

.input{
  width:100%;font:inherit;font-size:14px;padding:9px 11px;border-radius:3px;
  border:1px solid var(--edge);background:var(--stone-3);color:var(--ash);
}
.input:focus{outline:none;border-color:var(--gilt-deep)}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash-mute);margin-bottom:5px;font-family:"Cinzel",Georgia,serif}

/* ---- the roster: each of the Unburied on their own marker ---- */
.markers{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.marker{
  position:relative;text-align:left;width:100%;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--edge);
  border-radius:4px;margin:5px;width:calc(100% - 10px);
  padding:15px 15px 13px;cursor:pointer;color:inherit;font:inherit;
  box-shadow:0 0 0 3px var(--stone-0),0 0 0 4px var(--frame),0 8px 24px rgba(0,0,0,.28),inset 0 0 40px var(--candle);
}
.marker{transition:transform .22s cubic-bezier(.3,.8,.3,1),box-shadow .22s,border-color .2s;
  box-shadow:0 0 0 3px var(--stone-0),0 0 0 4px var(--frame),0 14px 22px -6px rgba(0,0,0,.5),0 3px 6px rgba(0,0,0,.3),0 20px 28px -14px var(--under),inset 0 1px 0 var(--rim),inset 0 0 40px var(--candle)}
.marker:hover{transform:translateY(-5px);border-color:var(--gilt-deep);
  box-shadow:0 0 0 3px var(--stone-0),0 0 0 4px var(--gilt-deep),0 24px 30px -8px rgba(0,0,0,.6),0 26px 34px -12px var(--under),0 0 22px var(--gilt-glow),inset 0 1px 0 var(--rim),inset 0 0 40px var(--gilt-glow)}
.marker:active{transform:translateY(-2px)}
.marker.benched{transform:none;box-shadow:0 0 0 3px var(--stone-0),0 0 0 4px var(--frame),0 4px 8px rgba(0,0,0,.3)}
.marker.benched:hover{transform:translateY(-2px)}
/* a slow bob, each card on its own beat; uses the separate 'translate' property so it never fights the hover lift */
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.marker:not(.benched):not(.add){animation:bob 6s ease-in-out infinite}
.marker:not(.benched):not(.add):nth-child(2n){animation-duration:7s;animation-delay:-2s}
.marker:not(.benched):not(.add):nth-child(3n){animation-duration:8s;animation-delay:-4.5s}
.marker:not(.benched):not(.add):nth-child(5n){animation-duration:6.5s;animation-delay:-1s}
.marker:hover{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.marker,.marker:hover{transition:none;transform:none;animation:none}}
.marker.benched{opacity:.55}
.marker::before{
  content:"";position:absolute;left:14px;right:14px;top:6px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gilt-deep),transparent);opacity:.5;
}
.marker::after{content:"";position:absolute;bottom:5px;right:5px;width:9px;height:9px;border:1px solid var(--gilt);border-left:0;border-top:0;opacity:.9;pointer-events:none}
.m-crown{display:inline-flex;flex:none;vertical-align:-2px;color:var(--gilt);margin-right:4px}
.m-name{font-family:"Cinzel",Georgia,serif;font-size:15px;letter-spacing:.09em;font-weight:500;
  margin-bottom:2px;display:block;padding-right:56px}
.m-epithet{font-family:"Spectral",Georgia,serif;font-style:italic;color:var(--gilt);
  font-size:12.5px;margin-bottom:8px;display:block;padding-right:56px}
.m-style{display:inline-flex;align-items:center;gap:5px;color:var(--gilt);font-family:"Cinzel",Georgia,serif;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;margin-right:9px;vertical-align:1px}
.m-role{color:var(--ash-mute);font-size:12px;margin-bottom:9px;display:block}
.m-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}
.m-stat{text-align:center;padding:6px 2px;border-radius:3px;
  background:var(--stone-2);border:1px solid var(--line-soft)}
.m-stat b{display:block;font-size:14px;font-family:"Space Mono",monospace}
.m-stat span{display:block;font-size:8px;letter-spacing:.05em;white-space:nowrap;text-transform:uppercase;
  color:var(--ash-mute);margin-top:2px}
.m-foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px}
.m-gear{font-size:11.5px;color:var(--ash-dim);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-gear b{color:var(--ash-mute);font-weight:500;margin-right:4px;letter-spacing:.08em;font-size:9.5px;text-transform:uppercase;font-family:"Cinzel",serif}
.m-row2{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)}
.m-ic{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;border:1px solid var(--line);
  color:var(--ash-dim);font-family:"Space Mono",monospace;font-size:11px;line-height:1.4}
.m-ic svg{flex:none}
.m-ic.bad{color:var(--rust);border-color:var(--rust)}
.m-ic.gilt{color:var(--gilt);border-color:var(--gilt-deep)}
.m-ic.good{color:var(--verdigris);border-color:var(--verdigris)}
.m-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:3px;cursor:pointer;
  border:1px solid var(--line);color:var(--ash-mute);font-size:11.5px;background:var(--stone-2)}
.m-toggle i{width:7px;height:7px;border-radius:50%;background:var(--ash-mute)}
.m-toggle.on{color:var(--gilt);border-color:var(--gilt-deep);background:var(--gilt-glow)}
.m-toggle.on i{background:var(--gilt)}
.m-send{margin-top:9px;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 10px;border-radius:var(--r-sm);
  border:1px dashed var(--gilt-deep);color:var(--gilt);font-size:12.5px;cursor:pointer}
.m-send:hover{background:var(--gilt-glow);border-style:solid}
.ctabs{display:flex;gap:2px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.ctab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ash-mute);padding:9px 14px;cursor:pointer;
  font-family:"Cinzel",Georgia,serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.ctab:hover{color:var(--ash)}
.ctab.on{color:var(--gilt);border-bottom-color:var(--gilt)}
.statusrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.statusrow .chip{cursor:pointer;font:inherit;font-size:12px}
.m-cost{position:absolute;top:12px;right:14px;font-family:"Space Mono",monospace;
  font-size:15px;color:var(--gilt)}
.m-cost small{display:block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ash-mute);font-family:"Cinzel",serif;text-align:right}

.marker.add{display:grid;place-items:center;min-height:132px;border-style:dashed;
  color:var(--ash-mute);gap:6px}
.marker.add .plus{font-size:26px;color:var(--gilt);line-height:1}
.marker.add span{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

.empty{text-align:center;padding:36px 18px;color:var(--ash-mute)}
.empty .big{font-family:"Cinzel",serif;font-size:15px;letter-spacing:.08em;color:var(--ash-dim);margin-bottom:6px}

/* ---- the band's own heading ---- */
.band{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.band-name{
  font-family:"Cinzel",Georgia,serif;font-size:21px;letter-spacing:.05em;
  background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--ash);padding:2px 0;min-width:180px;flex:1;
}
.band-name:focus{outline:none;border-color:var(--gilt)}
.gauge{margin-top:11px}
.gauge-line{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ash-mute)}
.gauge-line b{font-family:"Space Mono",monospace;font-size:19px;color:var(--ash)}
.gauge-line b.over{color:var(--rust)}
.bar{height:3px;border-radius:2px;background:var(--stone-3);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gilt);transition:width .25s}
.bar i.over{background:var(--rust)}

/* ---- the table screen: what the scenario device shows ---- */
#tableScreen{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:
  radial-gradient(90% 40% at 50% 0,var(--halo),transparent 70%),var(--stone-0);overflow:hidden}
body.table-on{overflow:hidden}
.tb-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--gilt-deep);
  background:linear-gradient(180deg,var(--panel-a),var(--stone-1))}
.tb-ttl{font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:17px;letter-spacing:.13em;line-height:1.15}
.tb-ttl small{display:block;font-weight:500;font-size:8.5px;letter-spacing:.24em;color:var(--gilt-deep);margin-top:2px}
.tb-st{border:1px solid var(--edge);padding:4px 12px;text-align:center;background:transparent;color:inherit;font:inherit}
.tb-st b{display:block;font:600 16px "Space Mono",monospace;color:var(--gilt)}
.tb-st span{font:500 8px "Cinzel",serif;letter-spacing:.16em;color:var(--ash-mute);text-transform:uppercase}
.tb-btn{cursor:pointer}.tb-btn:hover{border-color:var(--gilt-deep)}
.tb-main{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:12px;padding:12px 14px}
.tb-left{display:grid;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);gap:12px;min-height:0}
.tb-right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-height:0}

.tb-eb{font:500 9.5px "Cinzel",serif;letter-spacing:.26em;text-transform:uppercase;color:var(--gilt-deep);display:flex;gap:10px;align-items:center;margin-bottom:8px}

.tb-scroll{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--gilt-deep) transparent}
.tb-mapbox{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.tb-map{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
.tb-mapp.big{position:fixed;inset:0;z-index:46;margin:0;background:var(--stone-0);box-shadow:none}
.tb-mapp.big .tb-mapbox{display:flex;overflow:auto}

.tb-zm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gilt-deep);background:transparent;color:var(--gilt);min-width:30px;height:28px;

.tb-zm:hover{box-shadow:0 0 12px var(--gilt-glow)}
.tb-zv{font:600 11px "Space Mono",monospace;color:var(--ash-dim);min-width:38px;text-align:center}
.tb-map svg.scnmap{position:absolute;inset:0;width:100%;height:100%}
.tb-nomap{position:absolute;inset:0;display:grid;place-items:center;color:var(--ash-mute);border:1px dashed var(--line)}
.tb-pin{position:absolute;transform:translate(-50%,-50%);min-width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gilt);
  background:rgba(13,15,18,.86);color:var(--gilt);font:600 14px "Space Mono",monospace;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 16px var(--gilt-glow),0 2px 6px rgba(0,0,0,.5);padding:0 6px;line-height:1}
.tb-pin small{display:block;font:500 7px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;margin-top:-6px}
.tb-pin.hidden::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gilt);opacity:.4}
.tb-pin.revealed,.tb-pin.sprung{border-color:var(--verdigris);color:var(--verdigris);border-style:dashed}
.tb-pin.gone{opacity:.35;border-color:var(--ash-mute);color:var(--ash-mute)}
.tb-pin:hover{box-shadow:0 0 22px var(--gilt-glow),0 0 0 3px var(--gilt-glow)}
.tb-lens{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--stone-1);border:1px solid var(--gilt-deep);
  color:var(--gilt);display:grid;place-items:center;font-style:normal}
.tb-use{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:1.5px solid var(--verdigris);
  background:rgba(13,15,18,.86);color:var(--verdigris);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tb-use.worked{border-style:dashed;opacity:.85}
.tb-use:hover{box-shadow:0 0 0 3px var(--gilt-glow)}
.tb-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--ash-mute)}
.tb-legend span{display:inline-flex;align-items:center;gap:6px}
.tb-legend svg{color:var(--gilt)}.tb-legend span + span svg{color:var(--verdigris)}
.tb-event{border:1px solid var(--rust);background:rgba(181,80,60,.08);padding:10px 12px;margin-bottom:10px}
.tb-ev-h{font:500 10px "Cinzel",serif;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);margin-bottom:4px}
.tb-event p{margin:0 0 8px;font-family:"Spectral",Georgia,serif;font-size:16px;line-height:1.5}
.tb-brief{font-size:16px;line-height:1.6;color:var(--ash-dim);margin:0 0 10px}
.tb-line{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14px;color:var(--ash-dim)}
.tb-line b{font:500 10px "Cinzel",serif;letter-spacing:.12em;color:var(--gilt-deep);padding-top:3px;flex:none}
.tb-line.hot{color:var(--ash);font-family:"Spectral",Georgia,serif;font-size:16px}
.tb-line.hot b{color:var(--gilt)}
.tb-first{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-first span{font:500 9px "Cinzel",serif;letter-spacing:.2em;color:var(--ash-mute);text-transform:uppercase}
.tb-first .chip{cursor:pointer;font:inherit;font-size:12px}
.tb-seq{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px;color:var(--ash-mute)}
.tb-turn-c{border:1px solid var(--edge);padding:3px 9px;font:500 10px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:7px;align-items:baseline}
.tb-turn-c small{color:var(--ash-mute);font-size:9px}
.tb-turn-c.us{color:var(--verdigris);border-color:var(--verdigris)}.tb-turn-c.them{color:var(--rust);border-color:var(--rust)}
.tb-wb{margin-bottom:12px}
.tb-wb h4{margin:0 0 4px;font:500 11px "Cinzel",serif;letter-spacing:.16em;text-transform:uppercase}
.tb-wb h4 small{font:400 10px "Inter",sans-serif;letter-spacing:0;color:var(--ash-mute);text-transform:none;margin-left:6px}
.tb-m{display:grid;grid-template-columns:26px 1fr 76px 38px 68px;gap:9px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line-soft)}
.tb-m[data-tcard]{cursor:pointer}.tb-m[data-tcard]:hover{background:var(--gilt-glow)}
.tb-m.done{opacity:.5}.tb-m.down{opacity:.35;text-decoration:line-through}
.tb-t{width:24px;height:24px;border:1px solid var(--gilt-deep);background:transparent;color:var(--gilt);display:grid;place-items:center;font-size:13px;cursor:pointer;padding:0}
.tb-t.on{background:var(--gilt);color:#17130a}.tb-t.ro{cursor:default;opacity:.85}
.tb-n{font:500 12.5px "Cinzel",serif;letter-spacing:.06em;display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.tb-n small{font:400 10px "Inter",sans-serif;color:var(--ash-mute);letter-spacing:0}
.tb-boss{display:inline-flex;align-items:center;gap:5px;color:var(--gilt);font:500 9px "Cinzel",serif;letter-spacing:.14em;text-transform:uppercase}
.tb-boss i{font-style:italic;font:italic 12px "Spectral",Georgia,serif;letter-spacing:0;text-transform:none;color:var(--gilt)}
.tb-cd{font:500 8px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rust);color:var(--rust);padding:0 5px}
.tb-bar{height:5px;background:var(--stone-3)}.tb-bar i{display:block;height:100%;background:var(--verdigris)}
.tb-bar i.m{background:var(--gilt)}.tb-bar i.l{background:var(--rust)}
.tb-h{font:600 12px "Space Mono",monospace;text-align:right}
.tb-hp2{display:flex;gap:4px}.tb-hp2 .tb-hit{flex:1;min-width:30px}
.tb-hit.up{color:var(--verdigris)}.tb-hit.up:hover:not(:disabled){border-color:var(--verdigris)}
.tb-hit{border:1px solid var(--edge);color:var(--rust);background:transparent;padding:3px 0;font:500 10px "Space Mono",monospace;cursor:pointer}
.tb-hit:hover:not(:disabled){border-color:var(--rust)}.tb-hit:disabled{opacity:.3;cursor:default}
.eai-lore p{margin:0;font-size:16px;line-height:1.6;color:var(--ash-dim)}
.eai-trail{display:grid;gap:6px}
.eai-t{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ash-dim)}
.eai-t b{font:500 9px "Cinzel",serif;letter-spacing:.14em;text-transform:uppercase;min-width:28px}
.eai-t.yes b{color:var(--verdigris)}.eai-t.no b{color:var(--ash-mute)}.eai-t.no span{opacity:.65}
.eai-t small{color:var(--ash-mute)}
/* ---- the battle screen: a player's phone ---- */
#battleScreen{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:
  radial-gradient(90% 40% at 50% 0,var(--halo),transparent 70%),var(--stone-0)}
.bt-top{padding:10px 14px 10px;background:linear-gradient(180deg,var(--panel-a),var(--stone-1));border-bottom:1px solid var(--gilt-deep);box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:2}
.bt-t1{display:flex;align-items:center;gap:10px}
.bt-rd{font:600 15px "Cinzel",serif;letter-spacing:.12em;min-width:0}
.bt-rd small{display:block;font:500 9px "Cinzel",serif;letter-spacing:.2em;color:var(--gilt-deep);margin-top:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-go{margin-left:auto;flex:none;padding:10px 16px}
.bt-t2{display:flex;gap:6px;margin-top:9px}
.bt-st{flex:1;border:1px solid var(--edge);padding:5px 4px;text-align:center;background:transparent;color:inherit;font:inherit}
button.bt-st{cursor:pointer}
.bt-st b{display:block;font:600 14px "Space Mono",monospace;color:var(--gilt)}
.bt-st span{font:500 8px "Cinzel",serif;letter-spacing:.14em;color:var(--ash-mute);text-transform:uppercase}
.bt-list{flex:1;overflow:auto;padding:12px 12px 14px;display:grid;gap:12px;align-content:start}
.bt-row{position:relative;background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--edge);
  box-shadow:0 0 0 2px var(--stone-0),0 0 0 3px var(--frame);margin:0 3px;padding:10px 12px}
.bt-row.done{opacity:.55}.bt-row.open{opacity:1;border-color:var(--gilt-deep)}
.bt-row.hurt{border-left:2px solid var(--rust)}.bt-row.down{border-left:2px solid var(--rust)}
.bt-r1{display:flex;align-items:center;gap:10px;cursor:pointer}
.bt-tick{width:34px;height:34px;border:1px solid var(--gilt-deep);background:transparent;color:var(--gilt);display:grid;place-items:center;font-size:16px;flex:none;padding:0;cursor:pointer}
.bt-tick.on{background:var(--gilt);color:#17130a}
.bt-tick:disabled{opacity:.4}
.bt-nm{min-width:0;flex:1}
.bt-name{font:500 14px "Cinzel",serif;letter-spacing:.08em;display:inline-flex;align-items:center;gap:5px}
.bt-name small{font:400 10px "Inter",sans-serif;color:var(--ash-mute);letter-spacing:0}
.bt-nm .m-style{margin:0 0 0 8px}
.bt-hp{text-align:right;flex:none}.bt-hp b{font:600 15px "Space Mono",monospace}
.bt-hp span{display:block;font:500 8px "Cinzel",serif;letter-spacing:.14em;color:var(--ash-mute);text-transform:uppercase}
.bt-bar{height:4px;background:var(--stone-3);margin:8px 0 6px}.bt-bar i{display:block;height:100%;background:var(--verdigris)}
.bt-bar i.m{background:var(--gilt)}.bt-bar i.l{background:var(--rust)}
.bt-cd{display:flex;gap:5px;flex-wrap:wrap;min-height:6px}
.bt-cd .c{font:500 9px "Cinzel",serif;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--edge);padding:2px 7px;color:var(--ash-dim)}
.bt-cd .c.bad{color:var(--rust);border-color:var(--rust)}.bt-cd .c.g{color:var(--gilt);border-color:var(--gilt-deep)}
.bt-ex{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.bt-ab{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bt-ab button{background:transparent;border:1px solid var(--gilt-deep);color:var(--gilt);padding:12px 0;font:500 10px "Cinzel",serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.bt-ab button.p{background:var(--gilt);color:#17130a;font-weight:600}
.bt-ab button:disabled{opacity:.35;cursor:default}
.bt-pips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.bt-pip{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);padding:2px}
.bt-pip b{font:600 20px "Space Mono",monospace;min-width:34px;text-align:center}
.bt-pip.hurt b{color:var(--gilt)}.bt-pip.dead b{color:var(--rust)}
.bt-pip button{width:44px;height:44px;border:1px solid var(--gilt-deep);background:transparent;color:var(--gilt);font:20px "Inter",sans-serif;cursor:pointer}
.bt-cs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.bt-cs button{font:500 9px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;border:1px dashed var(--line);padding:9px 10px;color:var(--ash-mute);background:transparent;cursor:pointer}
.bt-cs button.on{border:1px solid var(--gilt);color:var(--gilt);background:var(--gilt-glow)}
.bt-note{font-size:12px;color:var(--ash-dim);margin-top:10px;display:grid;gap:5px}.bt-note b{color:var(--ash)}
.bt-more{text-align:center;margin-top:10px}
.bt-more button{background:none;border:0;color:var(--gilt-deep);font:500 10px "Cinzel",serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:underline;cursor:pointer;padding:6px}
.bt-dock{display:grid;grid-template-columns:repeat(6,1fr);background:var(--stone-1);border-top:1px solid var(--gilt-deep);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bt-dock button{background:none;border:0;color:var(--ash-dim);font:500 8px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;display:grid;justify-items:center;gap:3px;padding:6px 0;position:relative;cursor:pointer}
.bt-dock button svg{color:var(--gilt)}.bt-dock button:disabled{opacity:.35}
.bt-dot{position:absolute;top:2px;right:30%;width:7px;height:7px;border-radius:50%;background:var(--rust)}


.bt-theme{flex:none;margin-left:auto}
.bt-theme + .bt-go{margin-left:0}
#questDock{position:fixed;left:0;right:0;bottom:0;z-index:47;display:grid;grid-template-columns:repeat(6,1fr);background:var(--stone-1);
  border-top:1px solid var(--gilt-deep);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px rgba(0,0,0,.3)}
#questDock button{background:none;border:0;color:var(--ash-dim);font:500 8px "Cinzel",serif;letter-spacing:.1em;text-transform:uppercase;display:grid;justify-items:center;gap:3px;padding:6px 0;position:relative;cursor:pointer}
#questDock button svg{color:var(--gilt-deep)}
#questDock button.on{color:var(--gilt)}#questDock button.on svg{color:var(--gilt)}
#questDock button.on::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--gilt)}
#questDock button:disabled{opacity:.35}
#questDock button.dim{opacity:.4}
body.has-dock main{padding-bottom:110px}
body.has-dock #battleScreen{padding-bottom:64px}
/* ---- which device is this: a barrow under a moon ---- */
#rolePick{position:fixed;inset:0;z-index:80;overflow:hidden;background:linear-gradient(180deg,#05070c,#0e1420 42%,#1a2230 66%,#0d0f12);color:#e8e4dc}
body:has(#rolePick){overflow:hidden}
.rp-sc{position:absolute;top:0;left:50%;height:100%;width:auto;aspect-ratio:375/760;transform:translateX(-50%);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
@media (max-aspect-ratio:1/2){.rp-sc{-webkit-mask-image:none;mask-image:none}}
.rp-star{fill:#f4efe0;opacity:.8;animation:rpTw 5s ease-in-out infinite}
@keyframes rpTw{0%,100%{opacity:.25}50%{opacity:.95}}
.rp-cloud{animation:rpDrift 40s ease-in-out infinite alternate}
.rp-fog1{animation:rpDrift 26s ease-in-out infinite alternate}
@keyframes rpDrift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.rp-strings path{stroke-dasharray:3 4;animation:rpFlow 14s linear infinite}
@keyframes rpFlow{to{stroke-dashoffset:-140}}
.rp-nodes g{animation:rpPulse 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rp-nodes g:nth-child(2){animation-delay:-.9s}.rp-nodes g:nth-child(3){animation-delay:-1.8s}.rp-nodes g:nth-child(4){animation-delay:-2.6s}
@keyframes rpPulse{0%,100%{opacity:.55}50%{opacity:1}}
.rp-flicker{animation:rpFlk 3.2s ease-in-out infinite}
@keyframes rpFlk{0%,100%{opacity:.82}18%{opacity:1}34%{opacity:.7}52%{opacity:.95}70%{opacity:.78}}
.rp-win{animation:rpFlk 5s ease-in-out infinite}
.rp-ember{fill:#ffb84a;opacity:0;animation:rpUp 9s ease-in infinite}
@keyframes rpUp{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(14px,-120px)}}
.rp-ttl{position:absolute;top:max(40px,7vh);left:0;right:0;text-align:center;padding:0 16px;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.rp-ttl h1{font-size:30px;letter-spacing:.3em;font-weight:500;padding-left:.3em}
.rp-ttl p{margin:10px 0 0;font:italic 17px "Spectral",Georgia,serif;color:#b9b4a8}
.rp-signs{position:absolute;left:0;right:0;bottom:0;padding:0 16px max(26px,env(safe-area-inset-bottom));display:grid;gap:12px;max-width:470px;margin:0 auto;
  background:linear-gradient(180deg,transparent,rgba(8,10,13,.82) 28%)}
.rp-sign{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;color:inherit;font:inherit;cursor:pointer;position:relative;
  background:linear-gradient(180deg,rgba(26,27,24,.92),rgba(14,14,12,.94));border:1px solid #4a3d22;
  box-shadow:0 0 0 3px #080a0d,0 0 0 4px #2a241a,0 12px 22px -8px rgba(0,0,0,.7),0 0 26px rgba(224,168,60,.07);
  transition:transform .22s cubic-bezier(.3,.8,.3,1),box-shadow .22s,border-color .2s}
.rp-sign::before,.rp-sign::after{content:"";position:absolute;width:9px;height:9px;border:1px solid #c9a227;pointer-events:none}
.rp-sign::before{top:5px;left:5px;border-right:0;border-bottom:0}.rp-sign::after{bottom:5px;right:5px;border-left:0;border-top:0}
.rp-sign:hover,.rp-sign:focus-visible,.rp-sign.on{transform:translateY(-4px);border-color:#9c7d18;box-shadow:0 0 0 3px #080a0d,0 0 0 4px #9c7d18,0 18px 28px -8px rgba(0,0,0,.75),0 0 34px rgba(224,168,60,.22);outline:none}
.rp-sign:active{transform:translateY(-1px)}
.rp-sign i{flex:none;width:46px;height:46px;display:grid;place-items:center;border:1px solid #9c7d18;color:#c9a227;background:rgba(201,162,39,.06)}
.rp-sign b{display:block;font:600 15px "Cinzel",serif;letter-spacing:.2em;text-transform:uppercase;color:#c9a227}
.rp-sign span{display:block;font-size:12.5px;line-height:1.5;color:#a8a49c;margin-top:4px}
.rp-sign em{margin-left:auto;font-style:normal;font-size:26px;color:#c9a227;line-height:1;transition:transform .2s}
.rp-sign:hover em{transform:translateX(3px)}
.rp-note,.rp-cancel{margin:2px 0 0;text-align:center;font-size:12px;color:#7a766e}
.rp-cancel{background:none;border:0;text-decoration:underline;cursor:pointer;font-family:inherit}
@media (prefers-reduced-motion:reduce){#rolePick *{animation:none!important;transition:none!important}}
@media (max-height:640px){.rp-ttl{top:22px}.rp-sign{padding:11px 14px}.rp-sign span{display:none}}

.ma-acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){
  #tableScreen{overflow:auto}
  .tb-main{display:block;overflow:visible;flex:none}
  .tb-left,.tb-right{display:block}.tb-panel{margin-bottom:12px}
  .tb-mapbox{display:block;container-type:normal}.tb-map{width:100%;height:auto;aspect-ratio:1}
  .tb-m{grid-template-columns:26px 1fr 52px 34px 64px}
}

/* ---- overlays ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;overflow:auto;
  background:radial-gradient(120% 60% at 50% 0,var(--panel-a),var(--stone-1));border-top:1px solid var(--gilt-deep);
  border-radius:10px 10px 0 0;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.3,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:none;box-shadow:0 -1px 0 var(--frame),0 -10px 40px rgba(0,0,0,.45)}
.sheet-in{max-width:860px;margin:0 auto;padding:16px 16px 22px}
.sheet-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.sheet-head .eyebrow{white-space:nowrap}
.sheet-head .eyebrow{flex:1}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);z-index:90;

<script>
/* ---- core-rules.js ---- */
/* ===================================================================
   RULESET LOADER — the JSON is the single source of truth.
   Nothing about the game is written in this file: dice, costs, gear,
   traits, powers, injuries and scenario rules all come from the ruleset.
   Everything is keyed by id; `name` is only ever a label to display.
   =================================================================== */
const RS_REQUIRED = ["meta","dice","stats","baseCost","minModelCost","surcharge",
  "activation","nerve","actions","reactions","strain","movement","shooting","melee",
  "damage","conditions","morale","squads","keywords","traits","abilities","weapons",
  "armour","items","powers","casting","injuries","campaign","scenario"];

let RS = null;            // the loaded ruleset
let RSX = null;           // indexes derived from it
let RS_ERRORS = [];

function rsFail(msg){ RS_ERRORS.push(msg); }

function loadRuleset(json){
  /* Validates loudly: a missing section or an unknown id is a hard error, not a
     silent default. Returns null and fills RS_ERRORS when the file is unusable. */
  RS_ERRORS = [];
  let r;
  try { r = (typeof json === "string") ? JSON.parse(json) : json; }
  catch(e){ rsFail("The ruleset is not valid JSON: " + e.message); return null; }

  RS_REQUIRED.forEach(k => { if(r[k] === undefined) rsFail("missing section: " + k); });
  if(RS_ERRORS.length) return null;

  const ver = String(r.meta.version || "");
  if(!/^\d+\.\d+(\.\d+)?$/.test(ver)) rsFail('meta.version must look like "0.8" or "0.8.1", got "' + ver + '"');

  // --- indexes, keyed by id
  const byId = (list, what) => {
    const m = {};
    (list || []).forEach(x => {
      if(!x || !x.id) return rsFail(what + ": an entry has no id");
      if(m[x.id]) rsFail(what + ": duplicate id " + x.id);
      m[x.id] = x;
    });
    return m;
  };
  const X = {
    ladder: (r.dice.ladder || []).map(d => +String(d).slice(1)),
    stat:   byId((r.stats || []).map(x => Object.assign({id:x.key}, x)), "stats"),
    trait:  byId(r.traits, "traits"),
    ability:byId(r.abilities, "abilities"),
    weapon: byId(r.weapons, "weapons"),
    armour: byId(r.armour, "armour"),
    item:   byId(r.items, "items"),
    power:  byId(r.powers, "powers"),
    keyword:byId(r.keywords, "keywords"),
    cond:   byId(r.conditions, "conditions"),
    objective: byId((r.scenario.victory || {}).objectiveTypes, "scenario.victory.objectiveTypes"),
    element:byId((r.scenario.budget || {}).costs, "scenario.budget.costs"),
    difficulty: byId(r.scenario.difficulty, "scenario.difficulty"),
    length: byId(r.scenario.lengths, "scenario.lengths")
  };
  if(!X.ladder.length) rsFail("dice.ladder is empty");

  // --- cross-references: every id a rule points at must exist
  (r.weapons || []).forEach(w => (w.keywords || []).forEach(k => {
    if(!X.keyword[k]) rsFail("weapon " + w.id + " uses unknown keyword " + k); }));
  (r.injuries || []).forEach(inj => (inj.replace || []).forEach(rep => {
    if(!(r.replacements || []).some(x => x.id === rep))
      rsFail("injury " + inj.id + " points at unknown replacement " + rep); }));
  ["fight","aim","will","wits","move","wounds","actions"].forEach(k => {
    if(!X.stat[k]) rsFail("stats is missing the " + k + " entry"); });

  if(RS_ERRORS.length) return null;
  RS = r; RSX = X;
  return r;
}

/* ---- dice helpers, all from the ladder in the file ---- */
/* The four attributes that are dice. Move, Health, Actions and Size are
   numbers or a list, and are handled on their own terms. */
const DIE_STATS = ["fight", "aim", "will", "wits"];
function dieNum(d){ return +String(d || "").slice(1) || 0; }
function dieName(n){ return "d" + n; }
function dieIndex(d){ return RSX.ladder.indexOf(dieNum(d)); }
function dieStep(d, n){
  const i = dieIndex(d) + n;
  if(i < 0) return null;                       // below the ladder: the test fails
  return dieName(RSX.ladder[Math.min(i, RSX.ladder.length - 1)]);
}
function statDefault(key){ return RSX.stat[key] ? RSX.stat[key].default : null; }

/* ---- Health comes from Size ----
   0.11 made a model's starting and maximum Health a property of how big it is,
   so nothing may read stats.wounds.default as a number any more. */
function sizeHealth(size){
  const tbl = ((RSX.stat.size || {}).health) || {};
  return tbl[size || "man"] || tbl.man || {start: 5, max: 13};
}
function startHealth(size){ return sizeHealth(size).start; }
function maxHealth(size){ return sizeHealth(size).max; }

/* A trait that can be taken more than once (Extra arms, up to a second pair) can
   price its later copies differently; the file says so as `secondPairCost`. */
function traitPriceAt(id, nth){
  const o = RSX.trait[id]; if(!o) return 0;
  return nth > 1 && o.secondPairCost !== undefined ? o.secondPairCost : o.cost;
}
function traitMax(id){ const o = RSX.trait[id]; return (o && o.max) || 1; }
function traitCount(m, id){ return (m.traits || []).filter(x => x === id).length; }
/* hands: two, and two more for each pair of Extra arms */
function isAnimal(m){ return traitCount(m, "animal") > 0; }
function handsOf(m){
  /* an Animal has no hands: what it fights with is natural and needs none */
  const base = isAnimal(m) ? 0 : ((RS.hands && RS.hands.default) || 2);
  return base + 2 * traitCount(m, "extraArms");
}

/* ---- the symbols for the kinds of place beyond the first five (space, sky, dream, ice,
   mystery), drawn around 0,0 in a box about 12 across. `c` is the colour. ---- */
function planeGlyph(plane, c){
  const g = {
    space:   `<path d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6Z" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/>`,
    sky:     `<path d="M-6 3.5 a3 3 0 0 1 1.2 -5.6 a4 4 0 0 1 7.4 -.6 a3 3 0 0 1 3.4 6.2Z" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/>`,
    dream:   `<path d="M3 -6 a6.2 6.2 0 1 0 3 10.6 a5 5 0 0 1 -3 -10.6Z" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/>`,
    ice:     `<path d="M0 -6.2 V6.2 M-5.4 -3.1 L5.4 3.1 M-5.4 3.1 L5.4 -3.1" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/><path d="M-1.4 -4.6 L0 -3.4 L1.4 -4.6 M-1.4 4.6 L0 3.4 L1.4 4.6" fill="none" stroke="${c}" stroke-width="1" stroke-linecap="round"/>`,
    mystery: `<path d="M-3 -3.2 a3 3 0 1 1 4.6 2.5 c-1.2 .8 -1.6 1.4 -1.6 2.6" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/><circle cx="0" cy="5.6" r=".95" fill="${c}"/>`
  };
  return g[plane] || "";
}
const PLANE_IDS = ["land", "water", "fire", "under", "void", "space", "sky", "dream", "ice", "mystery"];

/* ---- hands ----
   "Weapons and a Shield need hands to be carried: one each, two for Two-handed."
   Fists are not gear and need none. A model may carry what its hands allow. */
function weaponHands(id){
  const w = RSX.weapon[id]; if(!w || id === "bareHands") return 0;
  return (w.keywords || []).includes("twoHanded") ? 2 : 1;
}
function armourUsesHand(id){ const a = RSX.armour[id]; return !!(a && /uses a hand/i.test(a.desc || "")); }
/* A model may wear one suit of armour and carry one shield. The suit gives the save; the
   shield needs a hand and steps melee attacks against it down. */
function armourIds(m){ return (m.armour || []).map(a => a.id || a).filter(id => RSX.armour[id]); }
function bodyArmourId(m){ return armourIds(m).find(id => !armourUsesHand(id)) || null; }
function shieldId(m){ return armourIds(m).find(id => armourUsesHand(id)) || null; }
function handsUsed(m){
  let n = 0;
  if(!isAnimal(m)) (m.weapons || []).forEach(e => { n += weaponHands(e.id) * (e.qty || 1); });
  (m.armour || []).forEach(a => { if(armourUsesHand(a.id || a)) n++; });
  return n;
}
function handsFree(m){ return handsOf(m) - handsUsed(m); }
/* why a piece of gear cannot be added, or null. `replacing` is the armour it would swap out. */
function handsBlock(m, field, id){
  if(field === "weapons"){
    const w = RSX.weapon[id]; if(!w) return null;
    if((m.size === "small") && ((w.keywords || []).includes("heavy") || (w.keywords || []).includes("twoHanded")))
      return "Too small for a Heavy or Two-handed weapon.";
    const need = weaponHands(id);
    if(isAnimal(m)) return null;       // natural weapons: no hands needed
    if(need > handsFree(m))
      return need > 1 && handsFree(m) >= 1 ? "Needs two hands; only one is free."
        : "No free hand (" + handsUsed(m) + " of " + handsOf(m) + " in use). Drop something, or take a second pair of arms.";
  } else if(field === "armour"){
    const replaces = armourUsesHand(id) ? shieldId(m) : bodyArmourId(m);      // a shield swaps a shield, a suit a suit
    if(armourUsesHand(id) && !replaces && handsFree(m) < 1)
      return "No free hand for a shield (" + handsUsed(m) + " of " + handsOf(m) + " in use).";
  }
  return null;
}

/* ---- the cost engine, straight from the file ----
   baseCost + stat steps + Wounds + actions + traits/abilities/powers, with the
   surcharge applied in purchase order (the first `freeUpgrades` are clean, then
   each upgrade adds +(n-1)); gear and downgrades are excluded from the surcharge;
   never below minModelCost. */
function upgradeList(p){
  const ups = [];                              // [{label, cost}] in purchase order
  let flat = 0;
  ["fight","aim","will","wits"].forEach(k => {
    const st = RSX.stat[k];
    const cur = dieIndex(p[k] || st.default), base = dieIndex(st.default);
    for(let i = base; i < cur; i++) ups.push({label: st.name + " " + dieName(RSX.ladder[i+1]), cost: st.stepUpCosts[i - base]});
    for(let i = cur; i < base; i++) flat -= st.stepDownCost;
  });
  const mv = RSX.stat.move;
  const dm = (p.move === undefined ? mv.default : p.move) - mv.default;
  flat += (dm / mv.step) * mv.costPerStep;
  const wst = RSX.stat.wounds;
  const base = startHealth(p.size);                 // what this size starts with
  const w = (p.wounds === undefined ? base : p.wounds);
  const hStep = wst.upStep || 1, hCost = (wst.upCostPerStep !== undefined ? wst.upCostPerStep : wst.upCostEach);
  for(let v = base + hStep; v <= w; v += hStep) ups.push({label: wst.name + " " + v, cost: hCost});
  const odd = (w - base) % hStep;      // a Fate result or a scar can leave an odd point
  if(w > base && odd) ups.push({label: wst.name + " " + w, cost: Math.round(hCost / hStep)});
  for(let i = 0; i < base - w; i++) flat -= wst.downRefunds[Math.min(i, wst.downRefunds.length - 1)];
  const ast = RSX.stat.actions;
  const a = (p.actions === undefined ? ast.default : p.actions);
  for(let i = ast.default; i < a; i++) ups.push({label: "Action " + (i+1), cost: ast.upCosts[i - ast.default]});
  /* Resistances, vulnerabilities and Size are what make a creature a creature rather
     than a min-maxed fighter. The surcharge exists to stop stat stacking, so these are
     paid flat and never count toward the upgrade number. */
  const freeOfSurcharge = new Set([].concat((RS.traitTags||{}).resistances||[], (RS.traitTags||{}).vulnerabilities||[]));
  const traitSeen = {};
  (p.traits || []).forEach(id => {
    const o = RSX.trait[id]; if(!o) return rsFail("unknown trait " + id);
    const nth = traitSeen[id] = (traitSeen[id] || 0) + 1;
    const cost = traitPriceAt(id, nth);
    if(freeOfSurcharge.has(id)) flat += cost; else ups.push({label: o.name + (nth > 1 ? " (pair " + nth + ")" : ""), cost});
  });
  const sz = RSX.stat.size;
  if(sz && p.size && p.size !== sz.default) flat += (sz.costs||{})[p.size] || 0;

  /* A weakness offsets a nature; it is not free points. Refunds from Vulnerable traits
     cannot exceed what the model spent on resistances, Burning aura, Regenerate and
     weapon effects — otherwise you take Vulnerable to an element nobody uses and bank it. */
  const vulnIds = new Set(((RS.traitTags||{}).vulnerabilities)||[]);
  const resIds  = new Set(((RS.traitTags||{}).resistances)||[]);
  let vulnRefund = 0, natureSpend = 0;
  (p.traits || []).forEach(id => {
    const o = RSX.trait[id]; if(!o) return;
    if(vulnIds.has(id)) vulnRefund += -o.cost;
    else if(resIds.has(id) || id === "aura" || id === "regenerate") natureSpend += o.cost;
  });
  (p.weaponMods || []).forEach(id => { const m = RSX.wmod[id]; if(m) natureSpend += m.cost; });
  if(vulnRefund > natureSpend) flat += (vulnRefund - natureSpend);   // claw back the excess

  /* Flaws: capped in number and in total refund, and never surcharged. */
  const fc = (RS.flaws || {}).refundCap || {};
  const maxF = fc.maxFlaws === undefined ? 99 : fc.maxFlaws;
  let flawRefund = 0;
  (p.flaws || []).slice(0, maxF).forEach(id => { const o = (CAT.flaw||{})[id]; if(o) flawRefund += -o.cost; });
  if(fc.maxRefund !== undefined) flawRefund = Math.min(flawRefund, fc.maxRefund);
  flat -= flawRefund;
  (p.abilities || []).forEach(id => { const o = RSX.ability[id]; if(!o) return rsFail("unknown ability " + id); ups.push({label:o.name, cost:o.cost}); });
  (p.powers || []).forEach(id => { const o = RSX.power[id]; if(!o) return rsFail("unknown power " + id); ups.push({label:o.name, cost:o.cost}); });
  return {ups, flat};
}
function gearCost(p){
  let g = 0;
  (p.weapons || []).forEach(id => { const o = RSX.weapon[id]; if(o) g += o.cost; });
  (p.weaponMods || []).forEach(id => { const o = RSX.wmod[id]; if(o) g += o.cost; });
  if(p.armour){ const o = RSX.armour[p.armour]; if(o) g += o.cost; }
  if(p.shield){ const o = RSX.armour[p.shield]; if(o) g += o.cost; }
  (p.items || []).forEach(id => { const o = RSX.item[id]; if(o) g += o.cost; });
  return g;
}
function modelCost(p){
  const {ups, flat} = upgradeList(p);
  const sc = RS.surcharge;
  let total = RS.baseCost + flat;
  ups.forEach((u, i) => {
    const n = i + 1;
    total += u.cost + (n > sc.freeUpgrades ? (n - 1) * sc.perPriorUpgrade : 0);
  });
  return Math.max(RS.minModelCost, Math.round(total + gearCost(p)));
}
function costBreakdown(p){
  const {ups, flat} = upgradeList(p);
  const sc = RS.surcharge;
  const rows = [{label: "Base", cost: RS.baseCost}];
  if(flat) rows.push({label: "Move, size, downgrades and resistances", cost: flat});
  ups.forEach((u, i) => {
    const n = i + 1, extra = n > sc.freeUpgrades ? (n - 1) * sc.perPriorUpgrade : 0;
    rows.push({label: u.label + (extra ? " (+" + extra + " surcharge)" : ""), cost: u.cost + extra});
  });
  const g = gearCost(p);
  if(g){
    const mods = (p.weaponMods || []).reduce((n, id) => n + ((RSX.wmod[id] || {}).cost || 0), 0);
    if(mods){ rows.push({label: "Gear", cost: g - mods}); rows.push({label: "Weapon effects", cost: mods}); }
    else rows.push({label: "Gear", cost: g});
  }
  return {rows, total: modelCost(p)};
}
/* squads: per-model cost x size, less the discount; the floor applies per model first */
function squadCost(p, size){
  const per = Math.max(RS.minModelCost, modelCost(p));
  return Math.round(per * size * (1 - (RS.squads.squadDiscount || 0)));
}
function unitCostOf(u){
  return (u.size && u.size > 1) ? squadCost(u, u.size) : modelCost(u);
}
/* activations: 1 per full pointsPerActivation, capped; squads by size */
function activationsOf(u){
  const a = RS.activation;
  if(u.size && u.size >= RS.squads.minSize) return Math.max(1, Math.ceil(u.size / 3));
  const n = Math.floor(unitCostOf(u) / a.pointsPerActivation);
  return Math.max(a.minActivations, Math.min(a.maxActivations, n));
}


/* ---- app.js ---- */
/* =====================================================================
   EPITAPH
   Two halves. YOUR UNBURIED live on this device and are yours alone.
   THE REALM is the shared table: scenarios, and the person hosting them.

   The ruleset JSON is the only place the game is written down. Nothing
   about dice, costs, gear or rules is hard-coded below; if a value is not
   in the file, the app does not know it.
   ===================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uid = () => Math.random().toString(36).slice(2, 9);
/* The trait id stays "leader" for good — what the table calls it is a
   display term the ruleset owns, same as it owns "Unburied". Older
   rulesets without the term still read "Leader". */
function leaderTerm(){ return (RS.meta.terms && RS.meta.terms.leader) || "Leader"; }
/* A small crown ahead of the name, not just a chip below it — so the
   band's Oathbearer reads as one at a glance, wherever their name appears. */
/* How a model fights, read from what they carry: powers make a caster; otherwise the longest gun sets the
   range (short / mid / long), a gun and a real blade make a hybrid, and blades alone are melee. */
const STYLE_ICON = {
  melee:  '<path d="M6 18L18 6M15 5.5h3.5V9M8.5 12.5l3 3M4 20l3-3"/>',
  short:  '<path d="M6 12h9M12 8l4 4-4 4"/><path d="M19 8v8" stroke-dasharray="1 2.5"/>',
  mid:    '<path d="M3 12h13M12 8l4 4-4 4"/><circle cx="20" cy="12" r="1.3"/>',
  long:   '<path d="M2 12h15M13 8l4 4-4 4"/><circle cx="21" cy="12" r="2.2"/><circle cx="21" cy="12" r=".5"/>',
  hybrid: '<path d="M5 19L14 10M12 8.5h3.5V12M5 5l4 4M15 15l4 4M19 5l-1.5 1.5"/>',
  magic:  '<path d="M12 3c.5 5 4 8.5 9 9-5 .5-8.5 4-9 9-.5-5-4-8.5-9-9 5-.5 8.5-4 9-9z"/>'
};
function combatStyle(m){
  if((m.powers || []).length) return {id: "magic", label: "Caster"};
  const W = catOf("weapons");
  const held = (m.weapons || []).map(e => W[e.id]).filter(Boolean);
  const guns = held.filter(w => w.kind === "ranged");
  const blades = held.filter(w => w.kind === "melee" && w.cost > 0);
  if(guns.length && blades.length) return {id: "hybrid", label: "Mixed"};
  if(guns.length){
    const far = Math.max.apply(null, guns.map(w => w.range || 0));
    return far >= 60 ? {id: "long", label: "Long range"} : far >= 35 ? {id: "mid", label: "Mid range"} : {id: "short", label: "Short range"};
  }
  if(blades.length) return {id: "melee", label: "Melee"};
  return null;
}
function styleBadge(m, size){
  const st = combatStyle(m); if(!st) return "";
  return `<span class="m-style" title="${esc(st.label)}"><svg viewBox="0 0 24 24" width="${size || 17}" height="${size || 17}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${STYLE_ICON[st.id]}</svg>${esc(st.label)}</span>`;
}
function crownHTML(size){
  size = size || 13;
  return `<span class="m-crown" title="${esc(leaderTerm())}" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}">
      <path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><path d="M5 21h14"/></svg></span>`;
}
function isLeaderM(m){ return (m.traits || []).includes("leader"); }
/* The epithet is not a separate label — it is the second half of what
   people actually call them. "James" who is "the Deadeye" is "James the
   Deadeye" at the table, one name, not a name and a nickname underneath.
   Guarded against the AI folding the epithet into the name itself and then
   repeating it — never show the same words twice. */
function fullName(m){
  const name = (m.name || "").trim(), epi = (m.epithet || "").trim();
  if(!epi) return name;
  if(name.toLowerCase().includes(epi.toLowerCase())) return name;
  return [name, epi].filter(Boolean).join(" ");
}
const signed = n => (n >= 0 ? "+" : "−") + Math.abs(n);

/* ---------------------------------------------------------------- state */
const STORE_KEY = "ep_bands_v1";
let store = {bands: [], activeId: null, way: "unburied"};

function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(raw && Array.isArray(raw.bands)) store = Object.assign(store, raw);
  }catch(e){}
  if(!store.bands.length) store.bands = [newBand("The Unburied")];
  if(!store.bands.some(b => b.id === store.activeId)) store.activeId = store.bands[0].id;
  store.bands.forEach(mendBand);
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

/* A band can be reshaped freely until its first quest. That quest locks it:
   after it, a member changes only through XP (Train) and Cash (Gear, Surgery).
   Anyone who has not yet gone out on a quest (a newcomer, or someone benched)
   stays editable until they do. */
function lockIcon(locked, size){
  size = size || 14;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="5" y="11" width="14" height="10" rx="2"/>${locked ? '<path d="M8 11V8a4 4 0 0 1 8 0v3"/>' : '<path d="M8 11V8a4 4 0 0 1 7.5-2"/>'}</svg>`;
}
function lockNoteHTML(b){
  if(!b.members.length) return "";
  const open = b.members.filter(m => !memberLocked(m)).length;
  if(!b.sealed)
    return `<div class="slab" style="margin-top:12px;border-color:var(--verdigris)">
      <div class="head" style="margin-bottom:6px"><span class="eyebrow" style="color:var(--verdigris)">${lockIcon(false)} Unlocked</span><span class="rule"></span></div>
      <p class="quiet" style="margin:0">This band can still be edited freely. It locks the moment it goes on its first quest; after that a member
        changes only through XP (Train) and Cash (Gear and Surgery).</p></div>`;
  return `<div class="slab" style="margin-top:12px;border-color:var(--gilt-deep)">
    <div class="head" style="margin-bottom:6px"><span class="eyebrow" style="color:var(--gilt)">${lockIcon(true)} Locked</span><span class="rule"></span>
      ${open ? `<span class="chip good">${open} still editable</span>` : ""}</div>
    <p class="quiet" style="margin:0">This band has been on a quest, so its builds are fixed. They change only through XP (Train) and Cash
      (Gear and Surgery).${open ? " Newcomers and anyone benched stay editable until they go out on a quest." : ""}</p></div>`;
}
/* a mound with a door: the Barrow */
function barrowIcon(size){
  size = size || 14;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M3 19a9 9 0 0 1 18 0z"/><path d="M10 19v-4a2 2 0 0 1 4 0v4"/><path d="M12 3v2"/></svg>`;
}

/* The lock and the tether, on one slim line. Tap either to open the full text. */
let statusOpen = false;
function statusStripHTML(b){
  if(!b.members.length) return "";
  const t = ruleOn("narrative", b) && b.tether && tetherKind(b.tether.kindId) ? b.tether : null;
  const open = b.members.filter(m => !memberLocked(m)).length;
  const strip = `<div class="slab" style="margin-top:12px;padding:9px 12px">
    <div class="statusrow">
      <button class="chip ${b.sealed ? "gilt" : "good"}" data-status="1">${lockIcon(!!b.sealed, 12)} ${b.sealed ? "Locked" : "Unlocked"}${b.sealed && open ? " · " + open + " editable" : ""}</button>
      ${t ? `<button class="chip ${t.frayed ? "bad" : "gilt"}" data-status="1">${esc(tetherKind(t.kindId).name)} tether · ${t.kept} of ${t.debt} oaths${t.frayed ? " · frayed" : ""}</button>` : ""}
      <span class="rule"></span>
      <button class="tiny" data-status="1" aria-label="${statusOpen ? "Hide details" : "Show details"}">${statusOpen ? "▴" : "▾"}</button>
    </div></div>`;
  return strip + (statusOpen ? lockNoteHTML(b) + (t ? tetherHTML(b) : "") : "");
}
function newBand(name){
  return {id: uid(), name: name || "The Unburied", budget: 500, members: [], sealed: false};
}
function band(){ return store.bands.find(b => b.id === store.activeId) || store.bands[0]; }

/* A model is only ever what the ruleset says a model is. Anything missing is
   filled from the file, never from a number written in this app. */
function newMember(){
  const h = ((RS.campaign || {}).hire || {}).baseProfile || {};
  const m = {
    id: uid(), name: "", epithet: "", epitaph: "", role: "", story: "",
    fielded: true, count: 1,
    move: h.move !== undefined ? h.move : statDefault("move"),
    actions: h.actions !== undefined ? h.actions : statDefault("actions"),
    size: statDefault("size"),
    wounds: h.wounds !== undefined ? h.wounds : startHealth(statDefault("size")),
    traits: [], abilities: [], powers: [], flaws: [],
    weapons: [], armour: [], items: [], skins: {},
    /* Health as it stands now, one entry per model. null means untouched.
       A scenario writes here, so a model that was hurt stays hurt. */
    hp: null,
    /* Things picked up in a scenario. Kept apart from bought gear because
       finding something does not make the model cost more. */
    found: [],
    /* What the campaign left on them. Scars change what a model can do but
       never what it cost: a wound is not a discount. */
    scars: [], xp: 0
  };
  DIE_STATS.forEach(k => m[k] = h[k] || statDefault(k));
  return m;
}
/* Older saves, or a ruleset that has moved on, should not crash the app. */
function mendBand(b){
  b.members = (b.members || []).map(m => {
    const base = newMember();
    const out = Object.assign(base, m);
    out.id = m.id || base.id;
    DIE_STATS.forEach(k => { if(!RSX.ladder.includes(dieNum(out[k]))) out[k] = statDefault(k); });
    ["traits","abilities","powers","flaws"].forEach(k =>
      out[k] = (out[k] || []).filter(id => catOf(k)[id]));
    out.weapons = (out.weapons || []).filter(e => RSX.weapon[e.id])
      .map(e => ({id: e.id, qty: Math.max(1, e.qty || 1), mods: (e.mods || []).filter(x => RSX.wmod[x])}));
    /* one suit and one shield at most (older saves held just one of either) */
    const ids = (out.armour || []).map(id => id.id || id).filter(id => RSX.armour[id]);
    out.armour = [ids.find(id => !armourUsesHand(id)), ids.find(id => armourUsesHand(id))].filter(Boolean);
    out.items = (out.items || []).filter(e => RSX.item[e.id]).map(e => ({id: e.id, qty: Math.max(1, e.qty || 1)}));
    out.found = (out.found || []).filter(f => f && f.name).map(f => Object.assign({fid: f.fid || uid()}, f));
    out.scars = (out.scars || []).filter(x => x && x.name).map(x => Object.assign({iid: x.iid || uid()}, x));
    out.xp = Math.max(0, out.xp | 0);
    return out;
  });
  return b;
}

/* ---------------------------------------------------------------- catalogues
   Everything a player can pick comes from the ruleset, indexed by id. */
let CAT = {};
function catOf(kind){ return CAT[kind] || {}; }
function buildCatalogues(){
  const kw = ids => (ids || []).map(k => k.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase())).join(" · ");
  const map = (list, shape) => {
    const o = {};
    (list || []).forEach(x => o[x.id] = Object.assign(
      {id: x.id, name: x.name, cost: x.cost, examples: x.examples || null},
      shape ? shape(x) : {desc: x.desc || ""}));
    return o;
  };
  const tier = {};
  (RS.powerTiers || []).forEach(t => tier[t.id] = t);
  const order = id => (tier[id] && tier[id].order) || 99;

  CAT.traits    = map(RS.traits);
  CAT.abilities = map(RS.abilities);
  CAT.flaws     = map((RS.flaws || {}).list || []);
  CAT.items     = map(RS.items, x => ({desc: x.desc + (x.limited ? "  (" + x.limited + " use" + (x.limited > 1 ? "s" : "") + ")" : "")}));
  CAT.armour    = map(RS.armour, x => ({
    desc: [x.save ? "Save " + x.save : "", x.moveMod ? "Move " + signed(x.moveMod) + "cm" : "", x.desc || ""]
            .filter(Boolean).join(" · ")
  }));
  CAT.weapons   = map(RS.weapons, x => ({
    kind: x.type, range: x.range, damage: x.damage,
    desc: [x.type === "melee" ? "Melee" : "Ranged",
           x.range ? x.range + "cm" : null,
           x.damage + " damage",
           kw(x.keywords) || null].filter(Boolean).join(" · ")
  }));
  CAT.powers    = map(RS.powers.slice().sort((a, b) =>
      (order(a.tier) - order(b.tier)) || (a.cost - b.cost) || a.name.localeCompare(b.name)),
    x => {
      const t = tier[x.tier] || {short: x.tier, name: x.tier, blurb: ""};
      return {tier: x.tier,
        desc: [t.short + " (" + t.name + ")", (x.tags || []).join(", "), x.range ? x.range + "cm" : null]
                .filter(Boolean).join(" · ") + "\n" + t.blurb +
              (x.levels ? "\n" + x.levels.map(l => "L" + l.level + " " + l.desc).join("  ") : (x.desc ? "\n" + x.desc : ""))};
    });
  CAT.mods = map(RS.weaponMods || []);
  RSX.wmod = CAT.mods;
}

/* ---------------------------------------------------------------- costing
   The cost engine lives in core-rules and takes the ruleset's own shape,
   so the app's shape is translated once, here, and nowhere else. */
function profileOf(m){
  const p = {
    move: m.move, wounds: m.wounds, actions: m.actions, size: m.size,
    traits: m.traits || [], abilities: m.abilities || [],
    powers: m.powers || [], flaws: m.flaws || [],
    weapons: [], weaponMods: [], items: [], armour: bodyArmourId(m), shield: shieldId(m)
  };
  DIE_STATS.forEach(k => p[k] = m[k]);
  (m.weapons || []).forEach(e => {
    for(let i = 0; i < (e.qty || 1); i++){
      p.weapons.push(e.id);
      (e.mods || []).forEach(x => p.weaponMods.push(x));
    }
  });
  (m.items || []).forEach(e => { for(let i = 0; i < (e.qty || 1); i++) p.items.push(e.id); });
  return p;
}
function memberCost(m){ return modelCost(profileOf(m)); }
function squadOf(m){ return Math.max(1, m.count || 1); }
function isSquad(m){ return squadOf(m) >= RS.squads.minSize; }
function unitCost(m){ return isSquad(m) ? squadCost(profileOf(m), squadOf(m)) : memberCost(m); }
function activationsOf(m){
  const a = RS.activation;
  if(isSquad(m)) return Math.max(1, Math.ceil(squadOf(m) / 3));
  return Math.max(a.minActivations, Math.min(a.maxActivations,
    Math.floor(unitCost(m) / a.pointsPerActivation)));
}
function fielded(m){ return m.fielded !== false; }
function bandSpent(b){ return b.members.filter(fielded).reduce((s, m) => s + unitCost(m), 0); }
function bandActs(b){ return b.members.filter(fielded).reduce((s, m) => s + activationsOf(m), 0); }

/* A model's own name for a piece of gear. Stats and cost always come from the
   id, so renaming something can never move a number. */
function skinOf(m, id, fallback){ return (m.skins && m.skins[id]) || fallback; }

/* ---- what a model has left ----
   Kept on the model, not in the battle tracker, because damage taken in a
   scenario belongs to the Unburied and should still be there afterwards. */
function healthOf(m){
  const n = squadOf(m), max = effWounds(m);
  let hp = Array.isArray(m.hp) ? m.hp.slice(0, n) : [];
  while(hp.length < n) hp.push(max);
  return hp.map(h => Math.max(0, Math.min(max, h | 0)));
}
function setHealth(m, hp){
  const max = effWounds(m);
  m.hp = hp.map(h => Math.max(0, Math.min(max, h | 0)));
  if(m.hp.every(h => h >= max)) m.hp = null;    // untouched again
  save();
}
function isHurt(m){ const max = effWounds(m); return healthOf(m).some(h => h < max); }
function standing(m){ return healthOf(m).filter(h => h > 0).length; }
function patchUp(m){ m.hp = null; save(); }

/* Size decides what a model starts and tops out at, so changing size moves its
   Health with it rather than leaving a number that no longer means anything. */
function setSize(m, size){
  const wasStart = startHealth(m.size), wasMax = maxHealth(m.size);
  const nowStart = startHealth(size), nowMax = maxHealth(size);
  const bought = m.wounds - wasStart;                   // steps paid for, kept
  m.size = size;
  m.wounds = Math.max(1, Math.min(nowMax, nowStart + bought));
  m.hp = null;
  save();
}

/* ---- what a model picked up ---- */
function giveFound(m, what){
  m.found = (m.found || []).concat([Object.assign({fid: uid()}, what)]);
  save();
}
function dropFound(m, fid){
  m.found = (m.found || []).filter(f => f.fid !== fid);
  save();
}
function effectiveMove(m){
  let v = m.move === undefined ? statDefault("move") : m.move;
  const a = bodyArmourId(m);
  const o = a ? RSX.armour[a] : null;
  if(o && o.moveMod) v += o.moveMod;
  if(typeof scarMods === "function"){ const sm = scarMods(m); if(sm.move) v += sm.move; }
  return Math.max(1, v);
}

/* ---------------------------------------------------------------- chrome */

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2100);
}
function openSheet(html, after){

/* ---------------------------------------------------------------- render */
function render(){
  const b = band();
  /* In a battle there is one place to be: the Barrow's roster and the battle screens. The Realm's map and the
     tab that leads to it step aside until the quest is left. */
  const inQuest = questOn();
  const role = typeof getRole === "function" ? getRole() : "";
  /* A device is one thing or the other: a Barrow shows the roster, the Realm shows the table. */
  if(role){ const want = role === "realm" ? "realm" : "unburied"; if(store.way !== want) store.way = want; }
  else if(inQuest && store.way !== "unburied") store.way = "unburied";
  const ways = document.querySelector("nav.ways"); if(ways) ways.hidden = inQuest || !!role;
  if(!realmAvailable()) $("#rsVer").textContent = "The Reliquary";
  else $("#rsVer").innerHTML = (role === "realm" ? "The Realm" : "Camp of the Unburied") + " \u00b7 ruleset " + RS.meta.version
    + (role ? ` \u00b7 <a href="#" data-role-switch onclick="return false" style="color:inherit;text-decoration:underline">switch</a>` : "");
  $$(".way").forEach(w => w.classList.toggle("on", w.dataset.way === store.way));
  $("#viewUnburied").hidden = store.way !== "unburied";
  $("#viewRealm").hidden = store.way !== "realm";
  if(store.way === "unburied") renderUnburied(b); else renderRealm();
  document.body.classList.toggle("has-qbar", store.way === "unburied" && questOn());
  if(typeof drawTable === "function") drawTable();
  if(typeof drawBattle === "function"){ drawBattle(); maybeAutoBattle(); drawDock(); }
  if(typeof drawRolePick === "function") drawRolePick();
  /* the table device opens straight onto the table when a quest begins */
  if(role === "realm" && inQuest && !Q.tableSeen && typeof openTable === "function" && !tableOpen){ Q.tableSeen = true; questSave(); openTable(); }
  save();
}

    const gear = [].concat(
      (m.weapons || []).map(e => { const w = catOf("weapons")[e.id]; return w ? skinOf(m, e.id, w.name) + ((e.qty || 1) > 1 ? " ×" + e.qty : "") : ""; }),
      (m.armour || []).map(id => { const o = catOf("armour")[id]; return o ? skinOf(m, id, o.name) : ""; })).filter(Boolean);

      m.xp ? ic(I('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'), m.xp, "gilt", m.xp + " XP to spend") : "",
      (m.found || []).length ? ic(I('<path d="M12 3l8 5v8l-8 5-8-5V8z"/>'), m.found.length, "good", m.found.length + " found in the field") : "",

      realmAvailable() && b.sealed ? (memberLocked(m) ? ic(lockIcon(true, 12), "", "", "Locked: changes only through XP and Cash")

    ].filter(Boolean).join("");
    el.innerHTML = `

      <div class="m-stats">

      <div class="m-foot">
        ${(m.traits || []).includes("leader") ? `<span class="chip gilt">${esc(leaderTerm())}</span>` : ""}
        ${n > 1 ? `<span class="chip">squad ×${n}</span>` : ""}
        <span class="chip">${effectiveMove(m)}cm</span>
        <span class="chip">${activationsOf(m)} act</span>

      <div class="m-row2">
        ${icons}

      </div>
      ${realmAvailable() ? "" : `<div class="m-send" data-send role="button" tabindex="0" title="Send just ${esc(m.name || "this one")} to the Barrow, to join a band already there">${barrowIcon(14)} Send to the Barrow</div>`}`;
    el.onclick = ev => {
      if(ev.target.closest("[data-send]")){ openMemberSend(m); return; }
      if(ev.target.closest("[data-field]")){ m.fielded = !fielded(m); renderUnburied(b); return; }
      openCard(m.id);
    };
    list.appendChild(el);
  });
  const conj = document.createElement("button");
  conj.className = "marker add conjure";
  conj.hidden = true;
  conj.innerHTML = `<div class="plus">✦</div><span>Call something up</span>`;
  conj.onclick = openConjure;
  /* Only offered where there is something to answer: the artifact's own
     sampling, or an endpoint you have set. Elsewhere it stays hidden
     rather than sitting there dead. */
  /* Asked for lazily: the answer may take a moment to exist, and the tile
     simply appears when it does. */
  getAI().then(ai => { if(ai && conj.isConnected) conj.hidden = false; });
  const add = document.createElement("button");
  add.className = "marker add";
  add.innerHTML = `<div class="plus">†</div><span>Raise one of the Unburied</span>`;
  add.onclick = () => {
    const m = newMember();

  };
  /* Camp is where the Unburied live, not where they are made: raising and
     calling up happen in the Reliquary and arrive here by code or file. */

  if(realmAvailable()){
    const bring = document.createElement("button");
    bring.className = "marker add";
