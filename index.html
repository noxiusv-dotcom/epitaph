/* ---- questview.js ---- */
/* =====================================================================
   THE QUEST, SEEN
   Two places only. The bar above the roster holds what belongs to the
   whole table — the round, Nerve, activations, victory points, markers.
   Everything that belongs to a model lives on that model's card, because
   that is where you are already looking.
   ===================================================================== */

let qbarFolded = false;
try{ qbarFolded = localStorage.getItem("ep_qbar_fold") === "1"; }catch(e){}

function questBarHTML(){
  if(!questOn()) return "";
  const g = questGroups(), brk = breakState("us");
  return `
  <div class="qbar ${qbarFolded ? "folded" : ""}">
    <div class="qbar-top">
      <button class="qbar-fold" id="qbarFold" aria-label="${qbarFolded ? "Show the tracker" : "Tuck the tracker away"}">${qbarFolded ? "›" : "‹"}</button>
      <div class="qbar-l">
        <b>${Q.scenario ? esc(Q.scenario.name) + " · " : ""}Round ${Q.round}${
          Q.scenario && Q.scenario.rounds ? " of " + Q.scenario.rounds : ""}</b>
      </div>
      <button class="btn sm primary" data-q="step" style="margin-left:auto;flex:none">End turn ▸</button>
    </div>
    <div class="qbar-r">
      <button class="chip gilt" data-q="nerve">◆ ${Q.nerve.us} Nerve</button>
      <span class="chip" title="The side with more activations acts several units per turn">${g.usTotal} acts · ${g.us} a turn</span>
      <button class="chip" data-q="vp">VP ${Q.vp.us}–${Q.vp.them}</button>
      <button class="chip ${Q.markers.some(m => m.state === "hidden") ? "" : "good"}" data-q="markers">
        ◈ ${Q.markers.filter(m => m.state === "hidden").length} unknown</button>
      ${brk.at ? `<span class="chip bad">⚠ past ${Math.round(brk.at * 100)}% — break test</span>` : ""}
      ${Q.scenario ? `<button class="chip ${questDue() ? "bad" : ""}" data-q="brief">${
        questDue() ? "⚠ " + questDue() + " happening" : "The brief"}</button>` : ""}
      <button class="chip gilt" data-q="battle">\u25a3 Battle screen</button>
      <button class="chip" data-q="table">\u25a4 Table screen</button>
      <button class="btn sm ghost" data-q="end">End</button>
    </div>
  </div>`;
}
function questBarBind(root){
  const fold = root.querySelector("#qbarFold");
  if(fold) fold.onclick = () => {
    qbarFolded = !qbarFolded;
    try{ localStorage.setItem("ep_qbar_fold", qbarFolded ? "1" : "0"); }catch(e){}
    render();
  };
  root.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    switch(b.dataset.q){
      case "step": tableEndTurn(); break;
      case "nerve":   openNerve(); break;
      case "vp":      openVP(); break;
      case "markers": openMarkers(); break;
      case "brief": openBrief(); break;
      case "table": openTable(); break;
      case "battle": openBattle(); break;
      case "end": askEnd(); break;
    }
  });
}
/* A new round only turns over once a step, so this is the one moment the
   app can be sure the host is looking right at it — it stays up until
   dismissed rather than fading like a toast, so nothing sprung this round
   goes unread. */
function showRoundPopup(pending){
  $("#sheet2In").innerHTML = `
    <div class="sheet-head"><div class="eyebrow">Round ${pending.round} begins</div></div>
    <div class="slab">
      ${(pending.lines.length ? pending.lines : ["Nothing else happened this round."]).map(l =>
        `<div class="says"><div class="says-d">${esc(l)}</div></div>`).join("")}
    </div>
    <div class="sheet-actions"><button class="btn primary" id="rpOK" style="margin-left:auto">Got it</button></div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#rpOK").onclick = () => { closePicker(); render(); };
}
function askEnd(){
  $("#sheet2In").innerHTML = `
    <div class="sheet-head"><div class="eyebrow">End the quest</div></div>
    <p class="lead">The tracker is cleared. What your Unburied lost, they keep — anyone
      hurt in this scenario is still hurt, and you can patch them up from their card.</p>
    <div class="sheet-actions">
      <button class="btn ghost" id="qeX">Keep going</button>
      <button class="btn danger" id="qeGo" style="margin-left:auto">End it</button>
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#qeX").onclick = closePicker;
  $("#qeGo").onclick = () => {
    const b = band();
    if(b.tether && !b.tether.severed && ruleOn("narrative", b)){
      if(tetherUnchecked(b)){ toast("No one who can call a Reckoning took the field, so the tether is not checked"); finishEnd(); }
      else askTether(b);
    } else finishEnd();
  };
}
/* Ending a quest hands straight on to the after-battle sheet, with what just
   happened already filled in. */
function finishEnd(){
  const b = band();
  const snap = typeof afterSnapshot === "function" && ruleOn("campaign", b) ? afterSnapshot() : null;
  questEnd(); closePicker(); render();
  if(snap) openAfter(snap); else toast("Quest ended");
}

/* The app has no way to see who actually took an enemy down or held an
   objective at the End step, so — same as it already does for wound
   flavour and for calls it can't detect — it asks. */
function askTether(b){
  const t = b.tether, kind = tetherKind(t.kindId);
  const leader = (b.members || []).find(m => m.id === t.leaderId);
  $("#sheet2In").innerHTML = `
    <div class="sheet-head"><div class="eyebrow">The tether</div></div>
    <p class="lead">${esc(leader ? leader.name : "The " + leaderTerm())}'s tether is
      <b>${esc(kind.name)}</b>: ${esc(tetherObservance(kind.id, t.sworn))}. Was it honoured this battle?</p>
    <div class="sheet-actions" style="flex-wrap:wrap;gap:8px">
      <button class="btn primary" id="tqYes" style="margin-left:0">Honoured</button>
      <button class="btn danger" id="tqNo">Forsaken</button>
      <button class="btn ghost" id="tqNA">Couldn't be checked</button>
    </div>`;
  $("#tqYes").onclick = () => { tetherHonour(b); afterTetherCheck(b); };
  $("#tqNA").onclick = () => afterTetherCheck(b);
  $("#tqNo").onclick = () => {
    if(obolAllowed(t) && (b.cash || 0) >= obolCost(t)){
      const cost = obolCost(t);
      $("#sheet2In").innerHTML = `
        <div class="sheet-head"><div class="eyebrow">The tether</div></div>
        <p class="lead">Forsaken. Pay the obol — ${cost} Cash — to still count the oath as kept,
          or let the tether fray?</p>
        <div class="sheet-actions" style="flex-wrap:wrap;gap:8px">
          <button class="btn primary" id="tqObol" style="margin-left:0">Pay the obol</button>
          <button class="btn ghost" id="tqFray">Let it fray</button>
        </div>`;
      $("#tqObol").onclick = () => { tetherPayObol(b); afterTetherCheck(b); };
      $("#tqFray").onclick = () => { tetherForsake(b); afterTetherCheck(b); };
    } else { tetherForsake(b); afterTetherCheck(b); }
  };
}
function afterTetherCheck(b){
  const t = b.tether;
  if(t && t.severed === "paid"){
    const leader = (b.members || []).find(m => m.id === t.leaderId);
    $("#sheet2In").innerHTML = `
      <div class="sheet-head"><div class="eyebrow">The tether is paid</div></div>
      <p class="lead">Every oath is kept. What does ${esc(leader ? leader.name : "the " + leaderTerm())} do now?</p>
      <div class="sheet-actions" style="flex-wrap:wrap;gap:8px">
        <button class="btn primary" id="tqUnbound" style="margin-left:0">Stay, Unbound</button>
        <button class="btn ghost" id="tqRest">Lay them to rest — +2 Reputation</button>
      </div>`;
    $("#tqUnbound").onclick = () => { tetherStayUnbound(b); finishEnd(); };
    $("#tqRest").onclick = () => { tetherLayToRest(b); finishEnd(); };
    return;
  }
  finishEnd();
}

/* ---- the live strip at the top of a card ---- */
function questStripHTML(m, u){
  const st = RS.strain, spent = u.used >= u.acts, down = unitDown(u);
  const conds = ["shaken", "pinned", "burning", "tainted", "marked", "stabilised"];
  const byId = {}; (RS.conditions || []).forEach(c => byId[c.id] = c);
  const effects = (u.cond || []).map(id => byId[id]).filter(Boolean);
  return `
  <div class="qstrip ${down ? "down" : ""}">
    <div class="qs-top">
      <span class="qs-round">Round ${Q.round}</span>
      <span class="chip ${spent ? "" : "gilt"}">${u.used}/${u.acts} used</span>
      ${u.models.length > 1 ? `<span class="chip">${unitStanding(u)}/${u.models.length} standing</span>` : ""}
      <button class="chip ${u.ready ? "good" : ""}" data-qp="ready">${u.ready ? "◉ Ready" : "○ Ready"}</button>
      ${u.strain ? `<span class="chip ${u.strain >= st.autoBurnoutAt - 1 ? "bad" : "gilt"}">Strain ${u.strain}</span>` : ""}
    </div>

    <div class="qs-hp">
      ${u.models.map((h, i) => `
        <span class="pip ${h <= 0 ? "dead" : h <= u.max * 0.5 ? "hurt" : ""}">
          <button data-qp="hp|${i}|-1" aria-label="Damage">−</button><b>${h}</b>
          <button data-qp="hp|${i}|1" aria-label="Heal">+</button></span>`).join("")}
    </div>

    <div class="qs-row">
      <button class="qp-btn" data-qp="act" ${spent || down ? "disabled" : ""}>Activate</button>
      <button class="qp-btn ghost" data-qp="unact" ${!u.used ? "disabled" : ""}>undo</button>
      <button class="qp-btn" data-qp="push" ${down ? "disabled" : ""}
        title="A push costs 1 Strain; you burn out if the Risk die rolls under it">Push</button>
      <button class="qp-btn ghost" data-qp="recover" ${!u.strain && !(u.cond || []).length ? "disabled" : ""}>Recover</button>
    </div>

    <div class="qs-conds">
      ${conds.map(id => `<button class="qp-cond ${(u.cond || []).includes(id) ? "on" : ""}"
        data-qp="cond|${id}">${id.charAt(0).toUpperCase() + id.slice(1)}</button>`).join("")}
    </div>

    ${effects.length || u.strain ? `<div class="qs-eff">
      ${effects.map(c => `<div><b>${c.id.charAt(0).toUpperCase() + c.id.slice(1)}</b> ${esc(c.desc)}</div>`).join("")}
      ${u.strain ? `<div><b>Strain ${u.strain}</b> ${u.strain >= st.autoBurnoutAt - 1
        ? "One more push and it burns out: " + st.burnoutEffect.damage + " damage, no save."
        : "Push again and the Risk die burns it out if it rolls under " + (u.strain + 1) + "."}</div>` : ""}
    </div>` : ""}
  </div>`;
}
function questBind(root, m){
  const u = questUnit(m); if(!u) return;
  root.querySelectorAll("[data-qp]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [what, a, c] = b.dataset.qp.split("|");
    questDo(u, what, a, c);
    questSave(); drawCard(); renderUnburied(band());
  });
}

  };

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">

      </button><div class="eyebrow">Suspicion markers</div>

    <div class="slab" style="margin-top:14px">

        <option value="">no one in particular</option>
        ${standing.map(u => `<option value="${esc(u.uid)}" ${mkWho === u.uid ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
      </select>
      <div class="sheet-actions">
        <button class="btn primary" id="mkGo" ${one ? "" : "disabled"} style="margin-left:0">
          ${one ? "Walk into marker " + one : "Walk into marker …"}</button>
      </div>
    </div>

    ${Q.markers.some(m => m.kind === "cache" && m.state !== "hidden" && m.state !== "gone") ? `
    <div class="slab">
      <div class="head"><span class="eyebrow">A cache</span><span class="rule"></span></div>
      <p class="quiet" style="margin:0 0 9px">It pays out only when a model in contact spends
        Interact on it and passes a Wits test.</p>
      <div class="sheet-actions">
        ${Q.markers.filter(m => m.kind === "cache" && m.state !== "hidden" && m.state !== "gone")
          .map(m => `<button class="btn" data-search="${m.n}" style="margin-left:0">Search marker ${m.n}</button>`).join("")}

      <div class="head"><span class="eyebrow">Something looked</span><span class="rule"></span></div>

      </div>

    ${result && result.length ? `<div class="mkout">${result.map(r =>
      `<div class="mkres"><b>Marker ${r.n !== undefined ? r.n : one} — ${esc(r.label)}</b>

  const go = $("#mkGo");

/* ---- searching a cache ----
   The ruleset pays a cache out with a d100 loot roll but does not say what the
   numbers mean, so the app rolls the die and whoever is running it says what
   turned up. What is found goes to the model that searched, and is kept apart
   from bought gear: finding something does not make a model cost more. */
let searchRoll = null, searchWho = null, searchRow = null, searchCash = null, searchTrapText = "";
/* The d100 table straight from the ruleset. */
function lootRow(n){
  return ((RS.loot || {}).table || []).find(r => n >= r.roll[0] && n <= r.roll[1]) || null;
}
/* "d6 Cash." / "2d6 Cash." -> a number, or null when the row is not cash. */
function rollCash(text){
  const m = /^(\d*)d(\d+)\s+Cash/i.exec(text || "");
  if(!m) return null;
  let t = 0; for(let i = 0; i < (+m[1] || 1); i++) t += 1 + Math.floor(Math.random() * +m[2]);
  return t;
}
function openSearch(markerN){
  const standing = Q.units.filter(u => u.side === "us" && !unitDown(u));
  if(!searchWho && standing.length) searchWho = standing[0].uid;
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="seX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">Searching${markerN ? " marker " + markerN : ""}</div></div>
    <p class="lead">A cache pays out only when a model in contact spends Interact on it
      and passes a Wits test. Then roll ${RS.dice.lootDie} for what is in it.</p>

    <div class="slab" style="margin-top:14px">
      <div class="field" style="margin-bottom:11px"><label>Who searched it</label>
        <select class="input" id="seWho">
          ${standing.map(u => `<option value="${esc(u.uid)}" ${searchWho === u.uid ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
        </select></div>
      <div class="sheet-actions" style="margin-bottom:11px">
        <button class="btn" id="seRoll" style="margin-left:0">Roll ${RS.dice.lootDie}</button>
        ${searchRoll ? `<span class="chip gilt mono" style="font-size:15px">${searchRoll}</span>` : ""}
      </div>
      ${searchRow ? `<p class="lead" style="margin:0 0 11px"><b>${esc(searchRow.result)}</b>
        ${searchCash ? `<br>Rolled: <b>${searchCash} Cash</b>.` : ""}
        ${searchTrapText ? `<br>${esc(searchTrapText)}` : ""}
        ${searchRow.itemChoice ? `<br>Finder chooses one of the listed items below.` : ""}
        ${searchRow.itemMaxCost ? `<br>Pick from the gear list, worth up to ${searchRow.itemMaxCost} points, in the box below.` : ""}</p>` : ""}
      <div class="field" style="margin-bottom:11px"><label>What they found</label>
        <input class="input" id="seName" maxlength="50" placeholder="a coil of wire, a wet ledger, someone's teeth"></div>
      <div class="field" style="margin-bottom:11px"><label>Or something from the list</label>
        <select class="input" id="seItem">
          <option value="">nothing from the list</option>
          ${Object.values(catOf("items")).map(o => `<option value="${esc(o.id)}" ${searchRow && searchRow.item === o.id ? "selected" : ""}>${esc(o.name)} \u2014 ${esc(o.desc)}</option>`).join("")}
        </select></div>
      <div class="field"><label>A note, if it needs one</label>
        <input class="input" id="seNote" maxlength="90" placeholder="what it does, or where it came from"></div>
      <div class="sheet-actions" style="margin-top:12px">
        <button class="btn primary" id="seGive" style="margin-left:0">${searchCash ? "Add " + searchCash + " Cash to the band" : "They take it"}</button></div>
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#seX").onclick = () => { searchRoll = null; searchRow = null; searchCash = null; searchTrapText = ""; closePicker(); render(); };
  $("#seWho").onchange = e => searchWho = e.target.value;
  $("#seRoll").onclick = () => {
    searchRoll = 1 + Math.floor(Math.random() * (dieNum(RS.dice.lootDie) || 100));
    searchWho = $("#seWho").value;
    searchRow = lootRow(searchRoll);
    if(searchRow) searchCash = rollCash(searchRow.result);
    else searchCash = null;
    if(searchRow && /trapped/i.test(searchRow.result)){
      const u = Q.units.find(x => x.uid === searchWho);
      if(u){ hurtUnit(u, 1, "trapped cache"); searchTrapText = u.name + " takes 1 damage, no save."; }
    } else searchTrapText = "";
    openSearch(markerN);
  };
  $("#seGive").onclick = () => {
    const uidSel = $("#seWho").value;
    const u = Q.units.find(x => x.uid === uidSel);
    if(searchCash && !$("#seName").value.trim() && !$("#seItem").value){
      const b = band(); b.cash = (b.cash || 0) + searchCash; save();
      const searchCashToast = "+" + searchCash + " Cash";
      qlog((u ? u.name : "Someone") + " found " + searchCash + " Cash (" + RS.dice.lootDie + " " + searchRoll + ")");
      searchRoll = null; searchRow = null; searchCash = null; searchTrapText = "";
      questSave(); closePicker(); render(); toast(searchCashToast);
      return;
    }
    const itemId = $("#seItem").value;
    const listed = itemId ? catOf("items")[itemId] : null;
    const name = ($("#seName").value.trim()) || (listed ? listed.name : "");
    if(!name && !listed){ toast("Say what they found"); return; }
    const what = {name: name || listed.name, id: itemId || null,
                  note: $("#seNote").value.trim() || (listed ? listed.desc : ""),
                  roll: searchRoll || null, from: markerN ? "marker " + markerN : "the field"};
    if(u && u.remote && typeof sendEvent === "function"){
      sendEvent(u.uid, {found: what, why: "found " + what.name});
    } else {
      const m = band().members.find(x => x.id === uidSel);
      if(m) giveFound(m, what);
    }
    qlog((u ? u.name : "Someone") + " found " + what.name + (searchRoll ? " (" + RS.dice.lootDie + " " + searchRoll + ")" : ""));
    searchRoll = null; searchRow = null; searchCash = null; searchTrapText = "";
    questSave(); closePicker(); render();
    toast((u ? u.name : "They") + " take " + what.name);
  };
}

  bind("[data-funact]", b => { const u = Q.units.find(x => x.uid === b.dataset.funact); u.used = Math.max(0, u.used - 1); });
  bind("[data-fhp]", b => {
    const [uid, i, d] = b.dataset.fhp.split("|");
    const u = Q.units.find(x => x.uid === uid);
    u.models[+i] = Math.max(0, Math.min(u.max, u.models[+i] + +d));
  });
}

/* How many of the scenario's events have just come out and not been read. */
function questDue(){
  return ((Q.scenario || {}).events || []).filter(e => e.sprung && !e.read).length;
}

/* The scenario as written, for looking back at mid-game. */
/* Every round the scenario has run through, at a glance. A round only gets a
   dot for having an event once that event has actually sprung — a future
   round is just a dim number, never a hint that something is coming. */
function roundTimelineHTML(s){
  const cur = Q.round;
  const eventRounds = (s.events || []).map(e => e.round || 1);
  const tot = Math.max(s.rounds || 0, cur, ...(eventRounds.length ? eventRounds : [cur]));
  let h = `<div class="tline" id="qTline">`;
  for(let r = 1; r <= tot; r++){
    const ev = r <= cur && (s.events || []).some(e => e.round === r && e.sprung);
    h += `<button class="tl-t ${r < cur ? "past" : r === cur ? "now" : "future"} ${ev ? "ev" : ""}"
      data-tljump="${r}" ${r > cur ? "disabled" : ""} title="Round ${r}"><b>${r}</b></button>`;
  }
  return h + `</div>`;
}
/* The table's own record of what happened, round by round — built from the

/* ---- tableview.js ---- */
/* =====================================================================
   THE TABLE SCREEN
   What the scenario device shows while a quest runs: the map with its
   numbered markers, the order of battle (every Unburied warband and the
   enemy, ranked by the turn order the rules give), and the story as it
   unfolds. It reads the quest and acts only through the same calls the rest
   of the app uses, so nothing here can disagree with a phone.
   ===================================================================== */

let tableOpen = false, tableBig = false, tableZoom = 1;

/* small, fine-lined badges: a magnifying glass for what can be searched, two gears for what can be worked */
const LENS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg>';
const GEARS = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="10" r="4.2" stroke-width="2.6" stroke-dasharray="2.2 1.7"/><circle cx="9" cy="10" r="1.4"/><circle cx="17" cy="16.5" r="3" stroke-width="2.2" stroke-dasharray="1.8 1.4"/><circle cx="17" cy="16.5" r="1"/></svg>';

/* Where a marker sits on the map (0-100). The scenario writer places them; one
   without a place (an older scenario) is spread around the middle so it can still be tapped. */
function markerSpot(m, i, total){
  if(typeof m.x === "number" && typeof m.y === "number") return {x: m.x, y: m.y};
  const a = i * 2.399963 + 0.6, r = 14 + 26 * ((i % 3) / 3 + 0.2) * (total > 1 ? 1 : 0);
  return {x: 50 + Math.cos(a) * (18 + r), y: 50 + Math.sin(a) * (14 + r * .8)};
}

function openTable(){
  if(!questOn()){ toast("No quest is running"); return; }
  if(typeof battleOpen !== "undefined" && battleOpen) closeBattle();
  tableOpen = true;
  document.body.classList.add("table-on");
  /* The table runs a round as one thing: Tempo (Nerve, activations reset) happens as the round opens. */
  if(Q.step === "tempo") questStep();
  drawTable();
}
function closeTable(){
  tableOpen = false; tableBig = false; tableZoom = 1;
  document.body.classList.remove("table-on");
  const el = document.getElementById("tableScreen"); if(el) el.remove();
}

/* Activations still to come for a side, and the turns they make up: the side that won
   Tempo goes first, sides alternate, and the side with more activations takes
   several units a turn (groups). */
function tableTurns(){
  const g = questGroups(), left = {};
  ["us", "them"].forEach(s => left[s] = Q.units.filter(u => u.side === s && !u.hidden && !unitDown(u))
    .reduce((n, u) => n + Math.max(0, u.acts - u.used), 0));
  const per = {us: g.us, them: g.them};
  const seq = []; let side = Q.first || "us", guard = 0;
  while((left.us > 0 || left.them > 0) && guard++ < 40){
    if(left[side] > 0){ const n = Math.min(per[side], left[side]); seq.push({side, n}); left[side] -= n; }
    side = side === "us" ? "them" : "us";
  }
  return seq;
}

/* What a model shows across the table: its dice, what it carries and what it can do. Travels with the shared unit. */
function unitGlance(m){
  const W = catOf("weapons"), A = catOf("armour"), I = catOf("items");
  const names = (list, cat) => (list || []).map(e => { const o = cat[e.id || e]; return o ? o.name + ((e.qty || 1) > 1 ? " ×" + e.qty : "") : ""; }).filter(Boolean);
  const nm = (ids, key) => (ids || []).map(id => { const o = (RSX[key] || {})[id]; return o ? o.name : ""; }).filter(Boolean);
  const style = typeof combatStyle === "function" ? combatStyle(m) : null;
  return {
    role: m.role || "", style: style ? style.label : "", epitaph: m.epitaph || "",
    dice: DIE_STATS.map(k => [RSX.stat[k].name, effDie(m, k)]),
    health: effWounds(m), move: effectiveMove(m),
    weapons: names(m.weapons, W), armour: names(m.armour, A), items: names(m.items, I),
    traits: nm(m.traits, "trait"), abilities: nm(m.abilities, "ability"), powers: nm(m.powers, "power")
  };
}

/* Tapping a row: a card for whoever it is. The fullest one there is: your own model's card, an enemy's card, or,
   for another player's model, what that phone has shared. */
function openUnitSummary(u){
  const g = u.glance || {}, h = tableHealth(u);
  const list = (label, arr) => arr && arr.length ? `<div class="says"><div class="says-n">${esc(label)}</div><div class="says-d">${arr.map(esc).join(" · ")}</div></div>` : "";
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="usX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <div class="eyebrow">${u.side === "them" ? "The enemy" : esc(u.band || "The Unburied")}</div></div>
    <div class="cardhead">
      <div class="cardname">${u.lead && typeof crownHTML === "function" ? crownHTML(19) : ""}${esc(u.name)}</div>
      ${u.boss ? `<div class="cardrole">${bossMark(u)}</div>` : ""}
      ${g.style || g.role ? `<div class="cardrole">${esc([g.style, g.role].filter(Boolean).join(" · "))}</div>` : ""}
      ${g.epitaph ? `<div class="cardepi">“${esc(g.epitaph)}”</div>` : ""}
    </div>
    ${g.dice ? `<div class="cstats">${g.dice.map(d => `<div class="cstat"><b>${esc(d[1])}</b><span>${esc(d[0])}</span></div>`).join("")}
      <div class="cstat"><b>${esc(g.health)}</b><span>Health</span></div><div class="cstat"><b>${esc(g.move)}cm</b><span>Move</span></div></div>` : ""}
    <div class="slab">
      <div class="head"><span class="eyebrow">Right now</span><span class="rule"></span></div>
      <p class="lead" style="margin:0">Health ${h.now} of ${h.max}${u.models.length > 1 ? " across " + u.models.length + " models" : ""}.
        ${u.used}/${u.acts} activations used.${u.strain ? " Strain " + u.strain + "." : ""}
        ${(u.cond || []).filter(c => c !== "leader").length ? " " + (u.cond || []).filter(c => c !== "leader").map(c => c.charAt(0).toUpperCase() + c.slice(1)).join(", ") + "." : ""}</p>
    </div>
    ${(g.weapons || g.armour || g.items || g.traits || g.abilities || g.powers) ? `<div class="slab">
      ${list("Carries", (g.weapons || []).concat(g.armour || [], g.items || []))}${list("Traits", g.traits)}${list("Abilities", g.abilities)}${list("Powers", g.powers)}</div>` : ""}
    ${u.hint ? `<div class="slab"><div class="says-d">${esc(u.hint)}</div></div>` : ""}
    ${u.known && u.lore ? `<div class="slab eai-lore"><div class="head"><span class="eyebrow">What you know</span><span class="rule"></span></div><p class="serif">${esc(u.lore)}</p></div>`
      : u.sight ? `<div class="slab eai-lore"><div class="head"><span class="eyebrow">What you see</span><span class="rule"></span></div><p class="serif">${esc(u.sight)}</p></div>` : ""}
    ${(u.protocol || []).length ? `<div class="slab"><div class="head"><span class="eyebrow">How it acts</span><span class="rule"></span></div>
      ${u.protocol.map(p => `<div class="says"><div class="says-d quiet">${esc(p)}</div></div>`).join("")}
      ${u.side === "them" ? `<div class="sheet-actions" style="margin-top:10px"><button class="btn primary" id="usAct" style="margin-left:0">Step through its activation</button></div>` : ""}</div>` : ""}
    <div class="sheet-actions"><button class="btn primary" id="usDone" style="margin-left:auto">Done</button></div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#usX").onclick = $("#usDone").onclick = () => { closePicker(); render(); };
  const usAct = $("#usAct"); if(usAct) usAct.onclick = () => openEnemyAct(u.uid);
}
function tableCard(uid){
  const u = Q.units.find(x => x.uid === uid); if(!u) return;
  if(u.side === "them"){ if(u.profile) openEnemyCard(uid); else openUnitSummary(u); return; }
  if(!u.remote && band().members.some(m => m.id === uid)){ openCard(uid); return; }
  openUnitSummary(u);
}

/* The head enemy's mark: a horned sigil, and what this place calls it if the scenario named it. */
const BOSS_SIGIL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4c1 4 3 5 5 6M20 4c-1 4-3 5-5 6"/><path d="M12 7a5.5 5.5 0 015.5 5.5c0 2.5-1 3.5-2 4.5v3H8.5v-3c-1-1-2-2-2-4.5A5.5 5.5 0 0112 7z"/><circle cx="9.7" cy="12.5" r=".6"/><circle cx="14.3" cy="12.5" r=".6"/></svg>';
function bossMark(u){ return `<span class="tb-boss" title="The head of the enemy">${BOSS_SIGIL}${u.rank ? `<i>${esc(u.rank)}</i>` : ""}</span>`; }

function tableHealth(u){
  const now = u.models.reduce((s, h) => s + Math.max(0, h), 0), max = u.max * u.models.length;
  const f = max ? now / max : 0;
  return {now, max, cls: f <= .3 ? "l" : f <= .6 ? "m" : ""};
}
function tableStyle(u){
  /* a model on this device's own band can show its fighting-style icon */
  if(u.remote) return "";
  const m = band().members.find(x => x.id === u.uid);
  return m && typeof styleBadge === "function" ? styleBadge(m, 13) : "";
}

function tableUnitRow(u, mine){
  const h = tableHealth(u), acted = u.used >= u.acts, down = unitDown(u);
  const conds = (u.cond || []).filter(c => c !== "leader").map(c => `<span class="tb-cd">${esc(c)}</span>`).join("");
  const foe = u.side === "them";
  const clickable = !u.hidden;
  const canAct = !u.remote;       // a phone's own models are ticked on that phone
  return `<div class="tb-m ${acted || down ? "done" : ""} ${down ? "down" : ""}" ${clickable ? `data-tcard="${esc(u.uid)}" role="button" tabindex="0"` : ""}>
    ${canAct ? `<button class="tb-t ${acted ? "on" : ""}" data-tact="${esc(u.uid)}" aria-label="Activated" ${down ? "disabled" : ""}>${acted ? "✓" : "○"}</button>`
             : `<span class="tb-t ${acted ? "on" : ""} ro">${acted ? "✓" : "○"}</span>`}
    <div class="tb-n">${u.lead && typeof crownHTML === "function" ? crownHTML(13) : ""}${esc(u.name)}${u.models.length > 1 ? ` <small>×${u.models.length}</small>` : ""}
      ${u.boss ? bossMark(u) : ""}${tableStyle(u)}${conds}
      ${u.acts > 1 ? `<small>${u.used}/${u.acts}</small>` : ""}</div>
    <div class="tb-bar"><i class="${h.cls}" style="width:${h.max ? Math.round(h.now / h.max * 100) : 0}%"></i></div>
    <div class="tb-h">${h.now}/${h.max}</div>
    <span class="tb-hp2"><button class="tb-hit" data-thit="${esc(u.uid)}" aria-label="Take 1 damage" ${down ? "disabled" : ""}>−1</button><button class="tb-hit up" data-theal="${esc(u.uid)}" aria-label="Give 1 Health back" ${h.now >= h.max ? "disabled" : ""}>+1</button></span>
  </div>`;
}

function tableMapHTML(){
  const s = Q.scenario || {};
  const K = markerKinds();
  const hasMap = s.map && (s.map.features || []).length + (s.map.zones || []).length > 0;
  const pins = Q.markers.map((m, i) => {
    const p = markerSpot(m, i, Q.markers.length);
    const face = m.state === "hidden" ? "?" : m.n;
    return `<button class="tb-pin ${m.state}" style="left:${p.x}%;top:${p.y}%" data-tpin="${m.n}"
      title="${esc(m.state === "hidden" ? "Marker " + m.n : "Marker " + m.n + " — " + (K[m.kind] || {}).label)}"
      ${m.state === "gone" ? "disabled" : ""}>${m.state === "hidden" ? m.n : "◈"}<small>${m.state === "hidden" ? "" : esc((K[m.kind] || {}).label || "")}</small>${m.state === "gone" ? "" : `<i class="tb-lens">${LENS}</i>`}</button>`;
  }).join("");
  const uses = "";
  return `<div class="tb-mapbox" ${tableBig ? "data-keep" : ""}><div class="tb-map">
    ${hasMap ? mapSVG(s.map, {theme: s.theme}) : `<div class="tb-nomap">No map was written for this quest.</div>`}
    ${pins}${uses}</div></div>
    <div class="tb-legend"><span>${LENS} Search it, or look with a spell or ability</span><span>${GEARS} Work it: a door, switch or lever</span></div>`;
}

function tableStoryHTML(){
  const s = Q.scenario || {};
  const due = (s.events || []).filter(e => e.sprung && !e.read);
  const timeline = s.events && s.events.length ? roundTimelineHTML(s) : "";
  const log = (Q.log || []).slice(0, 14);
  const finds = /found|takes|trapped|searched|revealed|springs|burns|Down/i;
  return `
    ${due.length ? due.map((e, i) => `<div class="tb-event">
        <div class="tb-ev-h">Round ${e.round} · ${esc(e.title)}</div>
        <p>${esc(e.text)}</p>
        <button class="btn sm" data-tread="${(s.events || []).indexOf(e)}">Read aloud — done</button></div>`).join("") : ""}
    ${s.briefing && Q.round === 1 && !due.length && !log.length ? `<p class="tb-brief serif">${esc(s.briefing)}</p>` : ""}
    <div class="tb-story">
      ${log.length ? log.map(e => `<div class="tb-line ${finds.test(e.t) ? "hot" : ""}"><b>R${e.r}</b><span>${esc(e.t)}</span></div>`).join("")
                   : `<p class="quiet" style="margin:0">Nothing has happened yet. Tap a marker on the map to search it, walk into it, or look.</p>`}
    </div>
    ${timeline}`;
}

function drawTable(){
  if(!tableOpen) return;
  if(!questOn()){ closeTable(); return; }
  let el = document.getElementById("tableScreen");
  if(!el){ el = document.createElement("div"); el.id = "tableScreen"; document.body.appendChild(el); }
  const keepScroll = [...el.querySelectorAll("[data-keep]")].map(n => [n.scrollTop, n.scrollLeft]);
  const s = Q.scenario || {}, g = questGroups(), brk = breakState("us");
  const us = Q.units.filter(u => u.side === "us"), them = Q.units.filter(u => u.side === "them" && !u.hidden);
  const held = Q.units.filter(u => u.side === "them" && u.hidden).length;

  const turns = tableTurns();

  /* the Unburied, warband by warband */

  us.forEach(u => { const k = u.owner || "me"; if(!bands[k]){ bands[k] = {label: u.band || (u.remote ? "Unburied" : band().name || "The Unburied"), units: []}; order.push(k); } bands[k].units.push(u); });

  el.innerHTML = `
  <div class="tb-top">

    <div class="tb-ttl">${esc(s.name || "The quest")}<small>${Q.realm && Q.joinCode ? "JOIN CODE " + esc(Q.joinCode) : "ONE DEVICE"}${s.type ? " · " + esc(String(s.type).toUpperCase()) : ""}</small></div>

    <div class="tb-st"><b>${Q.vp.us}–${Q.vp.them}</b><span>Victory</span></div>
    <button class="tb-st tb-btn" data-tq="nerve"><b>${Q.nerve.us}</b><span>Nerve</span></button>
    ${brk.at ? `<span class="chip bad">⚠ past ${Math.round(brk.at * 100)}%</span>` : ""}
    <div style="flex:1"></div>
    <button class="iconbtn" data-tq="theme" aria-label="Switch between light and dark" title="Light / dark">${(document.getElementById("btnTheme") || {}).innerHTML || "◐"}</button>

      <div class="tb-panel tb-mapp ${tableBig ? "big" : ""}" style="--z:${tableZoom}">
        <div class="tb-eb">The table <i></i><span>tap a marker</span>
          ${tableBig ? `<button class="tb-zm" data-tz="-" aria-label="Zoom out">−</button><b class="tb-zv">${Math.round(tableZoom * 100)}%</b><button class="tb-zm" data-tz="+" aria-label="Zoom in">+</button>` : ""}
          <button class="tb-zm wide" data-tz="big" aria-label="${tableBig ? "Shrink the map" : "Enlarge the map"}" title="${tableBig ? "Shrink the map" : "Enlarge the map"}">${tableBig

  bindTableScreen(el);
}

/* One press closes the round: the Acts step, then the End step (events, burning, strain), and the next round opens with its Tempo. */
function tableEndTurn(){
  if(Q.step === "tempo") questStep();
  if(Q.step === "acts") questStep();
  if(Q.step === "end") questStep();         // the round turns over; anything that sprang is in Q.pending
  const pending = Q.pending; Q.pending = null;
  if(Q.step === "tempo") questStep();       // the new round's Tempo
  questSave();
  if(pending) showRoundPopup(pending); else render();
}

function bindTableScreen(el){
  const done = () => { questSave(); render(); };
  el.querySelector("#tbClose").onclick = closeTable;
  el.querySelectorAll("[data-tq]").forEach(b => b.onclick = () => {
    switch(b.dataset.tq){
      case "step": tableEndTurn(); break;
      case "theme": { const t = document.getElementById("btnTheme"); if(t) t.click(); } break;
      case "nerve": openNerve(); break;
      case "brief": openBrief(); break;
      case "end": askEnd(); break;
    }
  });
  el.querySelectorAll("[data-tz]").forEach(b => b.onclick = () => {
    const k = b.dataset.tz;
    if(k === "big"){ tableBig = !tableBig; if(!tableBig) tableZoom = 1; }
    else tableZoom = Math.max(1, Math.min(4, Math.round((tableZoom + (k === "+" ? .5 : -.5)) * 10) / 10));
    drawTable();
  });
  el.querySelectorAll("[data-tfirst]").forEach(b => b.onclick = () => { Q.first = b.dataset.tfirst; done(); });
  el.querySelectorAll("[data-tpin]").forEach(b => b.onclick = () => openMarkerAct(+b.dataset.tpin));
  el.querySelectorAll("[data-tuse]").forEach(b => b.onclick = () => openUseAct(+b.dataset.tuse));
  el.querySelectorAll("[data-tread]").forEach(b => b.onclick = () => {
    const e = (Q.scenario.events || [])[+b.dataset.tread]; if(e) e.read = true; done();
  });
  el.querySelectorAll("[data-tact]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const u = Q.units.find(x => x.uid === b.dataset.tact); if(!u) return;
    u.used = u.used >= u.acts ? 0 : Math.min(u.acts, u.used + 1);
    if(u.side === "us") writeThrough(u);
    done();
  });
  el.querySelectorAll("[data-thit]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const u = Q.units.find(x => x.uid === b.dataset.thit); if(!u) return;
    if(u.side === "us" && u.remote){
      if(typeof sendEvent === "function" && Q.host){ sendEvent(u.uid, {damage: 1, why: "struck on the table"}); toast(u.name + " takes 1"); }
      return;
    }
    hurtUnit(u, 1, "struck on the table");
    done();
  });
  el.querySelectorAll("[data-theal]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const u = Q.units.find(x => x.uid === b.dataset.theal); if(!u) return;
    if(u.side === "us" && u.remote){
      if(typeof sendEvent === "function" && Q.host){ sendEvent(u.uid, {heal: 1, why: "set right on the table"}); toast(u.name + " gets 1 back"); }
      return;
    }
    healUnit(u, 1, "set right on the table");
    done();
  });
  el.querySelectorAll("[data-tcard]").forEach(row => row.onclick = ev => {
    if(ev.target.closest("button")) return;
    tableCard(row.dataset.tcard);
  });
}

/* ---- battleview.js ---- */
/* =====================================================================
   THE BATTLE SCREEN (a player's phone)
   While a quest runs, a player sees only their own warband: one line per model,
   the whole band on one screen, and the tools for the model they are planning
   with opening in place. Everything it does goes through the same call as
   the model's own card, so the two can never disagree.
   ===================================================================== */

let battleOpen = false, battleSel = null, battleOrder = null;

function openBattle(){
  if(!questOn()){ toast("No quest is running"); return; }
  if(typeof closeTable === "function" && tableOpen) closeTable();
  battleOpen = true; Q.dockOn = true; questSave();     // once you are in the battle, the bar stays until the quest is over
  document.body.classList.add("table-on");
  if(Q.step === "tempo") questStep();
  drawBattle(); drawDock();
}
function closeBattle(){
  battleOpen = false; battleSel = null; battleOrder = null;
  if(typeof tableOpen === "undefined" || !tableOpen) document.body.classList.remove("table-on");
  const el = document.getElementById("battleScreen"); if(el) el.remove();
  drawDock();
}

const BT_ICON = {
  brief:   '<path d="M6 4h10a2 2 0 012 2v14H8a2 2 0 01-2-2zM9 8h6M9 12h6"/>',
  foes:    '<path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"/>',
  markers: '<path d="M12 3l8 5v8l-8 5-8-5V8z"/><circle cx="12" cy="12" r="2"/>',
  table:   '<rect x="3" y="4" width="18" height="14" rx="1"/><path d="M8 21h8M12 18v3"/>',
  battle:  '<path d="M6 18L18 6M15 5.5h3.5V9M8.5 12.5l3 3M4 20l3-3"/>',
  band:    '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5.5"/>',
  end:     '<path d="M18 6L6 18M6 6l12 12"/>'
};
const btIcon = k => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${BT_ICON[k]}</svg>`;

/* The one place a model's tracker buttons do their work, shared with the full card. */
function questDo(u, what, a, c){
  if(what === "hp"){ u.models[+a] = Math.max(0, Math.min(u.max, u.models[+a] + +c)); writeThrough(u); }
  else if(what === "ready") u.ready = !u.ready;
  else if(what === "act")   u.used = Math.min(u.acts, u.used + 1);
  else if(what === "unact") u.used = Math.max(0, u.used - 1);
  else if(what === "push"){ u.pushed = true; strainUnit(u, 1); }
  else if(what === "recover"){
    /* One Recover: 1 Strain, or Shaken, or Pinned. Not all three. */
    if(u.strain > 0) u.strain--;
    else if((u.cond || []).includes("shaken")) u.cond = u.cond.filter(x => x !== "shaken");
    else if((u.cond || []).includes("pinned")) u.cond = u.cond.filter(x => x !== "pinned");
  }
  else if(what === "cond"){
    u.cond = u.cond || [];
    u.cond = u.cond.includes(a) ? u.cond.filter(x => x !== a) : u.cond.concat([a]);
  }
}

function btRow(u){
  const m = band().members.find(x => x.id === u.uid);
  const now = u.models.reduce((s, h) => s + Math.max(0, h), 0), max = u.max * u.models.length;
  const f = max ? now / max : 0, cls = f <= .3 ? "l" : f <= .6 ? "m" : "";
  const down = unitDown(u), spent = u.used >= u.acts;
  const sel = battleSel === u.uid;
  const conds = (u.cond || []).filter(c => c !== "leader");
  const byId = {}; (RS.conditions || []).forEach(c => byId[c.id] = c);
  const st = RS.strain;
  const all = ["shaken", "pinned", "burning", "tainted", "marked", "stabilised"];
  const effects = conds.map(id => byId[id]).filter(Boolean);
  return `<div class="bt-row ${sel ? "open" : ""} ${spent || down ? "done" : ""} ${f <= .5 && !down ? "hurt" : ""} ${down ? "down" : ""}" data-btrow="${esc(u.uid)}">
    <div class="bt-r1" data-btpick="${esc(u.uid)}" role="button" tabindex="0">
      <button class="bt-tick ${spent ? "on" : ""}" data-btq="${esc(u.uid)}|${spent ? "unact" : "act"}" aria-label="${spent ? "Undo activation" : "Activate"}" ${down ? "disabled" : ""}>${spent ? "✓" : "○"}</button>
      <div class="bt-nm">
        <span class="bt-name">${m && isLeaderM(m) && typeof crownHTML === "function" ? crownHTML(14) : ""}${esc(u.name)}${u.models.length > 1 ? ` <small>×${u.models.length}</small>` : ""}</span>
        ${m && typeof styleBadge === "function" ? styleBadge(m, 13) : ""}
      </div>
      <div class="bt-hp"><b>${now}/${max}</b><span>Health</span></div>
    </div>
    <div class="bt-bar"><i class="${cls}" style="width:${max ? Math.round(f * 100) : 0}%"></i></div>
    <div class="bt-cd">${down ? `<span class="c bad">Down</span>` : ""}${conds.map(c => `<span class="c bad">${esc(c)}</span>`).join("")}${u.strain ? `<span class="c g">Strain ${u.strain}</span>` : ""}${u.acts > 1 ? `<span class="c">${u.used}/${u.acts} acts</span>` : ""}${u.ready ? `<span class="c g">Ready</span>` : ""}</div>
    ${sel ? `<div class="bt-ex">
      <div class="bt-ab">
        <button class="p" data-btq="${esc(u.uid)}|act" ${spent || down ? "disabled" : ""}>Activate</button>
        <button data-btq="${esc(u.uid)}|push" ${down ? "disabled" : ""} title="A push costs 1 Strain">Push</button>
        <button data-btq="${esc(u.uid)}|recover" ${!u.strain && !conds.length ? "disabled" : ""}>Recover</button>
        <button data-btq="${esc(u.uid)}|unact" ${!u.used ? "disabled" : ""}>Undo</button>
      </div>
      <div class="bt-pips">${u.models.map((h, i) => `<div class="bt-pip ${h <= 0 ? "dead" : h <= u.max * .5 ? "hurt" : ""}">
        <button data-btq="${esc(u.uid)}|hp|${i}|-1" aria-label="Damage">−</button><b>${h}</b><button data-btq="${esc(u.uid)}|hp|${i}|1" aria-label="Heal">+</button></div>`).join("")}</div>
      <div class="bt-cs">${all.map(id => `<button class="${conds.includes(id) ? "on" : ""}" data-btq="${esc(u.uid)}|cond|${id}">${id.charAt(0).toUpperCase() + id.slice(1)}</button>`).join("")}</div>
      ${effects.length || u.strain ? `<div class="bt-note">${effects.map(c => `<div><b>${esc(c.id.charAt(0).toUpperCase() + c.id.slice(1))}</b> ${esc(c.desc)}</div>`).join("")}${u.strain ? `<div><b>Strain ${u.strain}</b> ${u.strain >= st.autoBurnoutAt - 1
        ? "One more push and it burns out: " + st.burnoutEffect.damage + " damage, no save."
        : "Push again and the Risk die burns it out if it rolls under " + (u.strain + 1) + "."}</div>` : ""}</div>` : ""}
      <div class="bt-more"><button data-btcard="${esc(u.uid)}">Open the full card</button></div>
    </div>` : ""}
  </div>`;
}

function drawBattle(){
  if(!battleOpen) return;
  if(!questOn()){ closeBattle(); return; }
  let el = document.getElementById("battleScreen");
  if(!el){ el = document.createElement("div"); el.id = "battleScreen"; document.body.appendChild(el); }
  const keep = el.querySelector(".bt-list") ? el.querySelector(".bt-list").scrollTop : 0;
  const s = Q.scenario || {}, mine = Q.units.filter(u => u.side === "us" && !u.remote);
  const acted = mine.filter(u => u.used >= u.acts || unitDown(u)).length;
  /* not yet acted first; but while a row is open the order holds still, so it does not jump under your thumb */
  if(!battleSel) battleOrder = null;
  const ranked = battleOrder ? battleOrder.map(id => mine.find(u => u.uid === id)).filter(Boolean)
    : mine.slice().sort((a, b) => ((a.used >= a.acts || unitDown(a)) - (b.used >= b.acts || unitDown(b))));
  if(battleSel && !battleOrder) battleOrder = ranked.map(u => u.uid);
  const isHost = !Q.realm || Q.host;
  const due = questDue();
  el.innerHTML = `
  <div class="bt-top">
    <div class="bt-t1">
      <div class="bt-rd">Round ${Q.round}${s.rounds ? " of " + s.rounds : ""}<small>${esc(s.name || "The quest")}</small></div>
      <button class="iconbtn bt-theme" data-bt="theme" aria-label="Switch between light and dark" title="Light / dark">${(document.getElementById("btnTheme") || {}).innerHTML || "\u25d0"}</button>
      ${isHost ? `<button class="btn primary bt-go" data-bt="step">End turn ▸</button>` : ""}
    </div>
    <div class="bt-t2">
      <button class="bt-st" data-bt="nerve"><b>${Q.nerve.us}</b><span>Nerve</span></button>
      <button class="bt-st" data-bt="vp"><b>${Q.vp.us}–${Q.vp.them}</b><span>Victory</span></button>
      <div class="bt-st"><b>${acted}/${mine.length}</b><span>Acted</span></div>
      <button class="bt-st" data-bt="markers"><b>${Q.markers.filter(m => m.state === "hidden").length}</b><span>Unknown</span></button>
    </div>
  </div>
  <div class="bt-list" data-btscroll>${ranked.map(btRow).join("") || `<p class="quiet" style="padding:20px">No one from your band is in this quest.</p>`}</div>`;
  const list = el.querySelector(".bt-list"); if(list) list.scrollTop = keep;
  bindBattle(el);
}

function bindBattle(el){
  const done = () => { questSave(); render(); };
  el.querySelectorAll("[data-bt]").forEach(b => b.onclick = () => {
    switch(b.dataset.bt){
      case "step":    battleSel = null; battleOrder = null; tableEndTurn(); break;
      case "nerve":   openNerve(); break;
      case "vp":      openVP(); break;
      case "markers": openMarkers(); break;
      case "brief":   openBrief(); break;
      case "foes":    openFoes(); break;
      case "table":   closeBattle(); openTable(); break;
      case "end":     askEnd(); break;
      case "theme":   { const t = document.getElementById("btnTheme"); if(t) t.click(); } break;
      case "close":   closeBattle(); render(); break;
    }
  });
  el.querySelectorAll("[data-btpick]").forEach(r => r.onclick = ev => {
    if(ev.target.closest("button")) return;
    battleSel = battleSel === r.dataset.btpick ? null : r.dataset.btpick;
    if(!battleSel) battleOrder = null;
    drawBattle();
  });
  el.querySelectorAll("[data-btq]").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const [uid, what, a, c] = b.dataset.btq.split("|");
    const u = Q.units.find(x => x.uid === uid); if(!u) return;
    questDo(u, what, a, c);
    done();
  });
  el.querySelectorAll("[data-btcard]").forEach(b => b.onclick = () => openCard(b.dataset.btcard));
}

/* A phone opens straight onto its own battle screen the first time a quest is seen. */
function maybeAutoBattle(){
  if(battleOpen || !questOn() || Q.battleSeen) return;
  if(window.innerWidth > 700 || (typeof tableOpen !== "undefined" && tableOpen)) return;
  Q.battleSeen = true; questSave();
  openBattle();
}

/* The bar along the bottom. It belongs to the quest, not to one screen: it stays, in the same place, on
   the battle screen and on the band, until the quest is over. */
function drawDock(){
  const want = questOn() && (battleOpen || Q.dockOn || window.innerWidth <= 900) && !(typeof tableOpen !== "undefined" && tableOpen);
  let el = document.getElementById("questDock");
  if(!want){ if(el) el.remove(); document.body.classList.remove("has-dock"); return; }
  if(!el){ el = document.createElement("div"); el.id = "questDock"; document.body.appendChild(el); }
  document.body.classList.add("has-dock");
  const s = Q.scenario || {}, due = questDue();
  el.innerHTML = `
    <button class="${battleOpen ? "on" : ""}" data-dk="battle">${btIcon("battle")}Battle</button>
    <button class="${battleOpen ? "" : "on"}" data-dk="band">${btIcon("band")}Band</button>
    <button data-dk="brief" class="${s.name ? "" : "dim"}">${btIcon("brief")}Brief${due ? `<i class="bt-dot"></i>` : ""}</button>
    <button data-dk="foes">${btIcon("foes")}Enemy</button>
    <button data-dk="markers">${btIcon("markers")}Markers</button>
    <button data-dk="end">${btIcon("end")}End quest</button>`;
  el.querySelectorAll("[data-dk]").forEach(b => b.onclick = () => {
    switch(b.dataset.dk){
      case "battle":  if(!battleOpen) openBattle(); break;
      case "band":    if(battleOpen){ closeBattle(); render(); } break;
      case "brief":   if(Q.scenario && Q.scenario.name) openBrief(); else toast("This quest was started without a scenario, so there is no brief to read"); break;
      case "foes":    openFoes(); break;

window.addEventListener("resize", () => { try{ drawDock(); }catch(e){} });

/* ---- enemyai.js ---- */
/* =====================================================================
   HOW AN ENEMY ACTS
   Enemies have no player behind them, so each carries a short protocol: lines of
   "condition: order", read top to bottom, first true line wins. This steps
   whoever is running it through those lines. Where the tracker already knows the
   answer (Shaken, wounded, the round) it answers; where only the table can see
   (who is in reach) it asks. It never moves anything: it says what the enemy
   does, and the person running it picks the target.
   ===================================================================== */

let eaiState = null;

/* "enemyWithin(15)" -> {name: "enemyWithin", arg: "15"} */
function eaiParse(line){
  const i = String(line).indexOf(":");
  const cond = (i < 0 ? "else" : line.slice(0, i)).trim();
  const order = (i < 0 ? line : line.slice(i + 1)).trim();
  const m = /^(\w+)\s*(?:\(([^)]*)\))?$/.exec(cond) || [];
  return {cond, name: m[1] || cond, arg: (m[2] || "").trim(), order};
}
function eaiOrderText(order){
  const m = /^(\w+)\s*(?:\(([^)]*)\))?$/.exec(order.trim()) || [];
  const name = m[1] || order, arg = (m[2] || "").trim();
  const t = arg && arg !== "target" ? arg : "";
  switch(name){
    case "advanceOn":  return {text: "Advance on " + (t || "its target") + ".", target: true};
    case "charge":     return {text: "Charge " + (t || "its target") + ".", target: true};
    case "shoot":      return {text: "Shoot " + (t || "its target") + ".", target: true};
    case "finish":     return {text: "Finish " + (t || "a Down model") + ".", target: true};
    case "guard":      return {text: "Guard " + (t || "its post") + ".", target: false};
    case "hold":       return {text: "Hold " + (t || "its ground") + ".", target: false};
    case "retreatToCover": return {text: "Fall back to the nearest cover.", target: false};
    case "usePower":   return {text: "Use its power" + (arg ? " (" + arg.replace(",", " at level ") + ")" : "") + ".", target: true};
    case "flee":       return {text: "Flee toward the nearest table edge.", target: false};
    case "search":     return {text: "Search " + (t || "the nearest cache") + ".", target: false};
    case "interact":   return {text: "Interact with " + (t || "the objective") + ".", target: false};
    default:           return {text: order, target: false};
  }
}
/* The question for a condition, and the answer when the tracker can give it. */
function eaiQuestion(p, u){
  const a = p.arg;
  switch(p.name){
    case "else":                return {auto: true, yes: true, q: "Nothing above applied."};
    case "shaken":              return {auto: true, yes: (u.cond || []).includes("shaken"), q: "Is it Shaken?"};
    case "wounded": {
      const now = u.models.reduce((s, h) => s + Math.max(0, h), 0), max = u.max * u.models.length;
      return {auto: true, yes: max > 0 && now <= max / 2, q: "Is it wounded (half its Health or less)?"};
    }
    case "roundAtLeast":        return {auto: true, yes: Q.round >= (+a || 1), q: "Is it round " + a + " or later?"};
    case "enemyWithin":         return {q: "Is an Unburied model within " + a + " cm of it?"};
    case "enemyCasterInSight":  return {q: "Can it see an Unburied caster?"};
    case "enemyDownWithin":     return {q: "Is a Down Unburied model within " + a + " cm of it?"};
    case "objectiveContested":  return {q: "Is an objective contested?"};
    case "alone":               return {q: "Is it alone, with no friend in reach?"};
    case "outnumbering":        return {q: "Does its side outnumber the Unburied near it?"};
    default:                    return {q: "Is this true: " + p.cond + "?"};
  }
}

function openEnemyAct(uid){
  const u = Q.units.find(x => x.uid === uid); if(!u) return;
  const lines = (u.protocol && u.protocol.length ? u.protocol : ["else: hold(its ground)"]).map(eaiParse);
  eaiState = {uid, lines, i: 0, trail: [], order: null, target: ""};
  drawEnemyAct();
}
function drawEnemyAct(){
  const S = eaiState, u = Q.units.find(x => x.uid === S.uid); if(!u) return;
  /* let the tracker answer what it can, then stop at the first question only the table can answer */
  while(!S.order && S.i < S.lines.length){
    const p = S.lines[S.i], q = eaiQuestion(p, u);
    if(q.auto){
      S.trail.push({q: q.q, yes: q.yes, auto: true});
      if(q.yes){ S.order = p.order; break; }
      S.i++;
    } else break;
  }
  if(!S.order && S.i >= S.lines.length) S.order = S.lines[S.lines.length - 1].order;
  const standing = Q.units.filter(x => x.side === "us" && !unitDown(x));
  const cur = !S.order ? eaiQuestion(S.lines[S.i], u) : null;
  const ord = S.order ? eaiOrderText(S.order) : null;
  const tie = ((RS.scenario.protocols || {}).targetTieBreak || ["nearest", "fewest Wounds left"]);
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="eaX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <div class="eyebrow">How it acts</div><span class="chip">${u.used}/${u.acts} used</span></div>
    <div class="cardhead" style="padding-bottom:10px;margin-bottom:10px">
      <div class="cardname" style="font-size:20px">${esc(u.name)}</div>
      <div class="cardrole">Read top to bottom. The first line that is true is what it does.</div></div>
    ${S.trail.length ? `<div class="slab"><div class="eai-trail">${S.trail.map(t =>
      `<div class="eai-t ${t.yes ? "yes" : "no"}"><b>${t.yes ? "Yes" : "No"}</b><span>${esc(t.q)}${t.auto ? " <small>(from the tracker)</small>" : ""}</span></div>`).join("")}</div></div>` : ""}
    ${cur ? `<div class="slab" style="border-color:var(--gilt)">
      <p class="lead" style="margin:0 0 12px;font-size:16px;color:var(--ash)">${esc(cur.q)}</p>
      <p class="quiet" style="margin:0 0 12px">If yes: ${esc(eaiOrderText(S.lines[S.i].order).text)}</p>
      <div class="sheet-actions"><button class="btn primary" id="eaYes" style="margin-left:0">Yes</button><button class="btn" id="eaNo">No</button></div>
    </div>` : ""}
    ${ord ? `<div class="slab" style="border-color:var(--gilt)">
      <div class="head"><span class="eyebrow">It will</span><span class="rule"></span></div>
      <p class="serif" style="margin:0 0 10px;font-size:18px;line-height:1.4">${esc(ord.text)}</p>
      ${ord.target ? `<div class="field" style="margin-bottom:10px"><label>Who is it after? You choose</label>
        <select class="input" id="eaWho">
          <option value="">whoever fits the rule below</option>
          ${standing.map(x => `<option value="${esc(x.uid)}" ${S.target === x.uid ? "selected" : ""}>${esc(x.name)}${x.band && x.remote ? " (" + esc(x.band) + ")" : ""}</option>`).join("")}
        </select>
        <p class="quiet" style="margin:6px 0 0">Between several, it picks ${tie.map(esc).join(", then ")}.</p></div>` : ""}
      <div class="sheet-actions">
        <button class="btn primary" id="eaDone" style="margin-left:0" ${u.used >= u.acts ? "disabled" : ""}>${u.used >= u.acts ? "Already spent" : "Done — it has acted"}</button>
        <button class="btn ghost" id="eaAgain">Start again</button></div>
    </div>` : ""}`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#eaX").onclick = () => { eaiState = null; closePicker(); render(); };
  const yes = $("#eaYes"), no = $("#eaNo");
  if(yes) yes.onclick = () => { S.trail.push({q: cur.q, yes: true}); S.order = S.lines[S.i].order; drawEnemyAct(); };
  if(no) no.onclick = () => { S.trail.push({q: cur.q, yes: false}); S.i++; drawEnemyAct(); };
  const who = $("#eaWho"); if(who) who.onchange = () => { S.target = who.value; };
  const again = $("#eaAgain"); if(again) again.onclick = () => openEnemyAct(S.uid);
  const done = $("#eaDone");
  if(done) done.onclick = () => {
    const t = S.target ? Q.units.find(x => x.uid === S.target) : null;
    u.used = Math.min(u.acts, u.used + 1);
    qlog(u.name + ": " + ord.text.replace(/\.$/, "") + (t && ord.target ? " — after " + t.name : ""));
    questSave(); eaiState = null; closePicker(); render();
  };
}

/* ---- campaign.js ---- */
/* =====================================================================
   AFTER THE BATTLE
   What a scenario leaves behind. A model taken Down rolls Fate on a d20:
   most of the time it walks it off, sometimes it keeps something for good.
   A scar is not a number in a ledger — it changes what the model can do,
   and it earns a name.

   Every roll, every effect and every price here is read from the ruleset.
   ===================================================================== */

const INJ = () => RS.injuries || [];
function injuryFor(roll){
  return INJ().find(i => roll >= i.roll[0] && roll <= i.roll[1]) || null;
}
function d20(){ return 1 + Math.floor(Math.random() * 20); }

/* Stabilised rolls two and keeps the higher, Marked two and keeps the lower,
   and one cancels the other. */
function rollFate(mode){
  const a = d20();
  if(mode === "plain") return {roll: a, dice: [a]};
  const b = d20();
  const keep = mode === "advantage" ? Math.max(a, b) : Math.min(a, b);
  return {roll: keep, dice: [a, b]};
}
function fateMode(stabilised, marked){
  if(RS.fateRules.cancel && stabilised && marked) return "plain";
  if(stabilised) return "advantage";
  if(marked) return "disadvantage";
  return "plain";
}

/* ---- what a scar does to a model ----
   Scars change what a model can do but never what it cost. A wound is not a
   discount, and re-pricing a band mid-campaign because someone lost an eye
   would be a nasty surprise. */
function scarMods(m){
  const out = {};
  (m.scars || []).forEach(s => {
    Object.keys(s.mods || {}).forEach(k => {
      if(typeof s.mods[k] === "number") out[k] = (out[k] || 0) + s.mods[k];
      else out[k] = s.mods[k];
    });
  });
  return out;
}
function effDie(m, key){
  const mods = scarMods(m);
  let d = m[key];
  if(mods[key]) d = dieStep(d, mods[key]) || d;
  return d;
}
function effWounds(m){
  const mods = scarMods(m);
  return Math.max(1, m.wounds + (mods.wounds || 0));
}
function scarNotes(m){
  const mods = scarMods(m), out = [];
  if(mods.noSprint) out.push("cannot Sprint");
  if(mods.noTwoHanded) out.push("no two-handed weapons");
  if(mods.noShield) out.push("no shield");
  if(mods.startStrain) out.push("starts every battle with " + mods.startStrain + " Strain");
  return out;
}

/* ---- the roll ---- */
function applyInjury(m, inj, roll){
  const rec = {iid: uid(), id: inj.id, name: inj.name, roll,
               effect: inj.effect || "", mods: inj.mods || null,
               scar: !!inj.scar, hooks: inj.epithetHooks || [],
               mend: inj.mend || null, replace: inj.replace || []};
  if(inj.id === "dead"){ rec.dead = true; }
  /* Laid up means they miss the NEXT battle: sat out until then, and told
     apart from one that was only just rolled by the fresh mark. */
  if(inj.id === "laidUp"){ rec.fresh = true; m.fielded = false; }
  /* The bought profile is never touched. A Health change from an injury is a
     scar modifier, applied by effWounds — writing it into m.wounds would both
     double-count it and quietly re-price the model. */
  if(inj.id === "bruisedButWiser" || /\+1 XP/i.test(inj.effect || "")) m.xp = (m.xp || 0) + 1;
  m.scars = (m.scars || []).concat([rec]);
  save();
  return rec;
}

/* ---- what the band takes away ---- */
/* Won pays in full, a draw 75% each (scenario.victory.rewards), a loss the ruleset's
   loss factor. A win on Hard or Extreme is worth one more Reputation. */
const DRAW_FACTOR = 0.75;
function outcomeFactor(outcome){
  return outcome === "won" ? 1 : outcome === "draw" ? DRAW_FACTOR : RS.campaign.awards.cash.lossFactor;
}
function repFor(outcome, difficulty){
  const r = RS.campaign.awards.reputation;
  if(outcome === "won") return r.win + (difficulty === "hard" || difficulty === "extreme" ? r.hardOrExtremeWin : 0);
  return outcome === "draw" ? 0 : r.withdrawOrBreak;
}
function awardBattle(b, {outcome, size, difficultyMult, difficulty}){
  const aw = RS.campaign.awards;
  const cash = Math.round((size || 0) * aw.cash.winPayoutPctOfGameSize * outcomeFactor(outcome) * (difficultyMult || 1));
  const rep = repFor(outcome, difficulty);
  b.cash = (b.cash || 0) + cash;
  b.reputation = (b.reputation || 0) + rep;
  save();
  return {cash, rep};
}
function repLevel(b){
  const n = b.reputation || 0;
  return (RS.campaign.reputationLevels || []).find(l => n >= l.min && n <= l.max) || null;
}

/* =====================================================================
   The sheet: every model that owes a roll, one at a time.
   ===================================================================== */
let afterState = null;

/* What the quest that has just ended leaves for the after-battle sheet. The quest is
   cleared the moment it ends, so this is taken first and kept on the band until the
   sheet is finished, so closing it half way and coming back loses nothing. */
function afterSnapshot(){
  if(!Q) return null;
  const b = band();
  const owed = b.members.map(m => ({m, u: questUnit(m)})).filter(x => x.u && (unitDown(x.u) || (x.u.cond || []).includes("marked")))
    .map(x => ({id: x.m.id, marked: (x.u.cond || []).includes("marked"), stabilised: (x.u.cond || []).includes("stabilised")}));
  const usBroke = breakState("us").at > 0, themBroke = breakState("them").at > 0;
  let outcome = "draw";
  if(usBroke && !themBroke) outcome = "lost";
  else if(themBroke && !usBroke) outcome = "won";
  else if(Q.vp.us > Q.vp.them) outcome = "won";
  else if(Q.vp.them > Q.vp.us) outcome = "lost";
  return {owed, went: Q.units.filter(u => u.side === "us" && !u.remote).map(u => u.uid), outcome,
          size: Q.size, mult: Q.reward || 1, difficulty: Q.difficulty || null,
          flavours: (Q.scenario && Q.scenario.woundFlavour) || [],
          bosses: Q.units.filter(u => u.side === "them" && u.boss && !u.hidden).map(u => u.name),
          /* enemies that never came onto the table stay unnamed, even here */
          unseen: Q.units.filter(u => u.side === "them" && u.hidden).map(u => u.name),
          namings: (Q.scenario && Q.scenario.namings) || null,
          title: (Q.scenario && Q.scenario.name) || "The battle", vp: [Q.vp.us, Q.vp.them], step: null};
}

function openAfter(snap){
  const b = band();
  if(!snap) snap = b.pendingAfter || null;
  if(!snap){
    /* opened by hand with nothing to go on: whoever is at zero Health owes a roll */
    snap = {owed: b.members.filter(m => healthOf(m).every(h => h <= 0)).map(m => ({id: m.id, marked: false, stabilised: false})),
            went: b.members.filter(fielded).map(m => m.id), outcome: "won", size: bandSpent(b), mult: 1, difficulty: null,
            flavours: [], title: "The battle", vp: null};
  }
  b.pendingAfter = snap;                 // owed is shared with the state below, so a rolled fate is never rolled twice
  save();
  const went = new Set(snap.went || []);
  const x = {};
  b.members.forEach(m => x[m.id] = {took: went.has(m.id), kills: 0, obj: false, boss: false});
  afterState = {owed: snap.owed, total: snap.owed.length, done: [], step: snap.owed.length ? "fate" : "spoils",
                outcome: snap.outcome, size: snap.size, mult: snap.mult, difficulty: snap.difficulty,
                flavours: snap.flavours || [], title: snap.title, vp: snap.vp, bosses: snap.bosses || [], unseen: snap.unseen || [], namings: snap.namings || null, x};
  b.lastNamings = snap.namings || b.lastNamings || null;      // camp may need "survived" names later
  drawAfter();
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
}

function drawAfter(){
  const b = band();
  const S = afterState;
  if(S.step === "fate" && S.owed.length){
    const next = S.owed[0];
    const m = b.members.find(x => x.id === next.id);
    const mode = fateMode(next.stabilised, next.marked);
    $("#sheet2In").innerHTML = `
      <div class="sheet-head">
        <button class="iconbtn" id="afX" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button><div class="eyebrow">${stepLine(S, "fate")}</div></div>
      <div class="cardhead" style="padding-bottom:12px;margin-bottom:12px">
        <div class="cardname" style="font-size:22px">${esc(fullName(m)) || "Unnamed"}</div>
        ${combatStyle(m) ? `<div style="margin:2px 0 4px">${styleBadge(m)}</div>` : ""}
        ${m.epitaph ? `<div class="cardepi">“${esc(m.epitaph)}”</div>` : ""}
      </div>
      <p class="lead">Taken Down. ${mode === "advantage"
        ? "Stabilised by a friend — roll two d20 and keep the higher."
        : mode === "disadvantage" ? "Marked — roll two d20 and keep the lower."
        : next.stabilised && next.marked ? "Stabilised and Marked, which cancel — one d20."
        : "One d20."}</p>
      <div class="sheet-actions" style="margin-top:16px">
        <button class="btn primary" id="afRoll" style="margin-left:0">Roll Fate</button>
        <button class="btn ghost" id="afSkip">Skip this one</button>
      </div>`;
    $("#afX").onclick = closeAfter;
    $("#afSkip").onclick = () => { S.owed.shift(); if(!S.owed.length) S.step = "spoils"; drawAfter(); };
    $("#afRoll").onclick = () => {
      const r = rollFate(mode);
      const inj = injuryFor(r.roll);
      const rec = applyInjury(m, inj, r.roll);
      S.done.push({id: m.id, rec, dice: r.dice});
      S.owed.shift();
      S.step = "result"; S.showing = {id: m.id, rec, dice: r.dice, mode};
      drawAfter();
    };
    return;
  }

  if(S.step === "result"){
    const {id, rec, dice, mode} = S.showing;
    const m = b.members.find(x => x.id === id);
    const wantsEpithet = rec.scar || rec.id === "newOutlook" || (rec.hooks || []).length;
    /* Nothing records what actually took a model Down, so this asks rather
       than guesses. The scenario's own woundFlavour lines, if it has any,
       are the choices — the host says what did it, in one tap. */
    const flavours = S.flavours || (questOn() && Q.scenario && Q.scenario.woundFlavour) || [];
    $("#sheet2In").innerHTML = `
      <div class="sheet-head"><div class="eyebrow">${stepLine(S, "fate")}</div>
        <span class="chip mono">d20 ${dice.join(" / ")}${dice.length > 1 ? " — kept " + rec.roll : ""}</span></div>
      <div class="slab" style="margin-top:6px;border-color:${rec.dead ? "var(--rust)" : rec.scar ? "var(--rust)" : "var(--gilt-deep)"}">
        <div class="head"><span class="eyebrow">${esc(m.name)}</span><span class="rule"></span>
          <span class="chip mono">${rec.roll}</span></div>
        <div class="cardname" style="font-size:19px;margin-bottom:6px">${esc(rec.name)}${rec.baseName ? ` <span class="quiet" style="font-size:12px;letter-spacing:0;font-family:Inter,sans-serif">(${esc(rec.baseName.toLowerCase())})</span>` : ""}</div>
        <p class="lead" style="margin:0">${esc(rec.effect)}</p>

  $("#sheet2In").innerHTML = `

      <div class="head"><span class="eyebrow">XP</span><span class="rule"></span>
        <span class="quiet">tick what each of them did</span></div>
      ${b.members.map(m => { const x = S.x[m.id];
        return `<div class="grow" style="flex-wrap:wrap;align-items:center">
          <div class="grow-main" style="min-width:130px">
            <div class="grow-name">${esc(m.name) || "Unnamed"}${x.took ? "" : ` <span class="chip">did not go</span>`}</div>

              (m.scars || []).filter(sc => sc.scar).map(sc => `<span class="chip bad" title="${esc(sc.effect)}">${esc(sc.name)}${sc.mended ? " \u00b7 mended" : ""}${sc.fitted ? " \u00b7 fitted" : ""}</span>`).join("")}</div>` : ""}</div>

    const [id, d] = bn.dataset.xk.split("|"); const x = S.x[id];

    if(x.kills) x.took = true;
    drawAfter();
  });
  $("#afDone").onclick = () => {
    const xpLines = [];
    b.members.forEach(m => {
      /* Anyone laid up before this battle has now missed it. */
      const lu = laidUpRec(m);
      if(lu && !lu.fresh){ m.scars = m.scars.filter(x => x !== lu); m.fielded = true; }
      else if(lu) lu.fresh = false;
      const n = xpFor(m, S);
      if(S.x[m.id].took) m.battles = (m.battles || 0) + 1;
      if(S.x[m.id].boss && ruleOn("narrative", b)){
        const who = (S.bosses || []).length === 1 ? S.bosses[0] : "a boss";

        const entry = nb.find(e => (S.bosses || []).some(n => n.toLowerCase() === e.who.toLowerCase())) || nb[0];
        addMoment(b, m.id, "Struck the final blow on " + who, ["-slayer", "-bane", "-ender", "giant-killer"], "", entry ? entry.options : []);

    });
    const got = awardBattle(b, {outcome: S.outcome, size: S.size, difficultyMult: S.mult || 1, difficulty: S.difficulty});
    S.result = {cash: got.cash, rep: got.rep, xpLines};
    b.pendingAfter = null;
    save(); render();

}

/* "Fate 1 of 2 \u00b7 Spoils \u00b7 Done", the step you are on lit */
function stepLine(S, at){
  const steps = [];
  if(S.total) steps.push(["fate", at === "fate" ? "Fate " + Math.min(S.total, S.total - S.owed.length + (S.step === "result" ? 0 : 1)) + " of " + S.total : "Fate"]);
  steps.push(["spoils", "Spoils"], ["done", "Done"]);
  return steps.map(([id, label]) => id === at ? label : `<span style="opacity:.45">${label}</span>`).join(" \u00b7 ");
}
function xpFor(m, S){
  const aw = RS.campaign.awards.xp, x = S.x[m.id];
  if(!x) return 0;
  return (x.took ? aw.participate : 0) + Math.min(x.kills, aw.takeEnemyDownMax) * aw.takeEnemyDown
       + (x.obj ? aw.objectiveAction : 0) + (S.outcome === "won" && x.took ? aw.win : 0);
}
function cashFor(S){
  const aw = RS.campaign.awards.cash;
  return Math.round((S.size || 0) * aw.winPayoutPctOfGameSize * outcomeFactor(S.outcome) * (S.mult || 1));
}
function closeAfter(){ afterState = null; closePicker(); render(); }

/* ---- an epithet for what it cost them ---- */
/* A name changes when something happens to someone: a scar, a boss brought down, a
   brush with death, an oath finally paid. The old name is kept (it is on their stone
   later) and the new one replaces it. */
function setEpithet(m, v){
  v = String(v || "").trim().slice(0, 50);
  if(!v || v === m.epithet) return;
  if(m.epithet) m.epithetHistory = (m.epithetHistory || []).concat([m.epithet]);
  m.epithet = v;
}
function addMoment(b, mid, name, hooks, effect, options){
  b.moments = b.moments || [];
  const x = {id: uid(), mid, name, effect: effect || "", hooks: hooks || [], options: (options || []).slice(0, 3), at: Date.now()};
  b.moments.push(x); save();
  return x;
}
function resolveMoment(id){ const b = band(); b.moments = (b.moments || []).filter(x => x.id !== id); save(); }
/* things that have happened which may earn a new name, waiting to be settled */
function momentsHTML(b){
  if(!ruleOn("narrative", b)) return "";
  const list = (b.moments || []).filter(x => b.members.some(m => m.id === x.mid));
  if(!list.length) return "";
  return `<div class="slab" style="border-color:var(--gilt-deep)">
    <div class="head"><span class="eyebrow">A new name?</span><span class="rule"></span><span class="quiet">something happened to them</span></div>
    ${list.map(x => { const m = b.members.find(z => z.id === x.mid);
      return `<div class="grow"><div class="grow-main"><div class="grow-name">${esc(fullName(m)) || "Unnamed"}${m && combatStyle(m) ? " " + styleBadge(m, 14) : ""}</div>
        <div class="grow-sub">${esc(x.name)}</div></div>
        <div class="grow-r"><button class="btn sm" data-mom="${esc(x.id)}">Give a name</button>
          <button class="tiny" data-momx="${esc(x.id)}" aria-label="They keep their name">\u00d7</button></div></div>`; }).join("")}
  </div>`;
}
function bindMoments(root, redraw){
  root.querySelectorAll("[data-mom]").forEach(btn => btn.onclick = () => {
    const b = band(), x = (b.moments || []).find(y => y.id === btn.dataset.mom); if(!x) return;
    const m = b.members.find(z => z.id === x.mid); if(!m) return;
    openEpithet(m, {name: x.name, effect: x.effect, hooks: x.hooks, options: x.options},
      {back: redraw, moment: x.id, lead: m.name + " \u2014 " + x.name.charAt(0).toLowerCase() + x.name.slice(1) + ". People will call them something for it; it replaces the name they had."});
  });
  root.querySelectorAll("[data-momx]").forEach(btn => btn.onclick = () => { resolveMoment(btn.dataset.momx); redraw(); });
}

/* A cause that names an enemy who never showed itself is not read out. */
function causeLabel(cause, S){
  const c = String(cause || "").toLowerCase();
  return (S.unseen || []).some(n => n && c.includes(n.toLowerCase())) ? "Something unseen" : cause;
}
