/* ---- asking ---- */
async function runGenerate(ai){
  const S = genState, sc = RS.scenario;
  S.busy = true; drawGenerate(ai);

  const size = S.players * S.perBand;
  const diff = (sc.difficulty || []).find(d => d.id === S.difficulty);
  const enemy = Math.round(size * diff.enemyPct);
  const len = (sc.lengths || []).find(l => l.id === S.length);
  const mode = (sc.modes || []).find(m => m.id === S.mode);

  /* Anything left on "let it decide" is chosen here, so the scenario still
     comes back legal, and the choice is shown afterwards rather than hidden. */
  const type = S.type
    ? (sc.battleTypes || []).find(t => t.id === S.type)
    : (sc.battleTypes || [])[Math.floor(Math.random() * sc.battleTypes.length)];
  const theme = S.theme
    ? (sc.themes || []).find(t => t.id === S.theme)
    : (sc.themes || [])[Math.floor(Math.random() * sc.themes.length)];

  /* A sealed (mystery) battle type has no fixed objectives of its own \u2014 the
     generator picks any it likes and the app hides them until round 2 or an
     envelope says otherwise. Everything else works exactly as before. */
  const sealed = !!type.sealed;
  const objList = sealed ? (sc.victory.objectiveTypes || []).map(o => o.id)
    : (type.objectives && type.objectives.length)
    ? type.objectives : (sc.victory.objectiveTypes || []).map(o => o.id);
  const objCount = sealed ? (type.baseObjectives || 2) : null;
  const markers = Math.max(1, Math.min(8, Math.round(size / 100) || 1));

  const roles = "cover, blocking, high, objective, hazard, marker";
  const grounds = "even, rough, hazardous, impassable";
  const prompt = `You are running tonight's game of ${RS.meta.name} for a table that has shown
up to play, not to read a rulebook. A player's band is called the Unburied.

Write so the table wants to go in and see what is happening, and wants to stay once they are
there. That means specifics, not adjectives: not "an eerie ruin" but what is actually standing,
what it smells like, what sound stops when they arrive. Write like someone who has actually
been to this place \u2014 concrete, unhurried, never explaining the mood, just describing the
thing so the mood happens on its own. No sentence should tell the reader how to feel.

For tone only, never to be copied or echoed \u2014 the kind of image this game wants:
  "The last name on the wall is still wet."
  "Someone built a door into the reactor housing. Someone else used it."
  "The tide left fish in the rafters. They are still breathing."
  "Every clock in the station stopped at the same second, years apart."
  "The Unburied who came before you left their names carved by the gate. Yours goes under them."

${S.wish.trim() ? `WHAT THEY ASKED FOR \u2014 this matters more than anything below. Build the whole
scenario out of it. The settings are only there to keep it legal.

  "${S.wish.trim()}"
` : "They did not say what they wanted, so surprise them."}

THE SHAPE
Mode: ${mode.id} \u2014 ${mode.desc}
Mission: ${type.id} \u2014 ${type.desc}${S.type ? "" : "  (you chose this)"}
Where: ${theme.id} \u2014 ${theme.desc}${S.theme ? "" : "  (you chose this)"}
${S.players} player${S.players === 1 ? "" : "s"}, ${S.perBand} points each, ${size} in total.
Difficulty ${diff.id}. ${len.rounds ? len.rounds + " rounds" : "no fixed length"}.
${S.table.trim() ? "ON THE TABLE ALREADY: " + S.table.trim() + ". Build the scenario around these pieces and name them." : ""}

WHAT TO WRITE

  title      four words or fewer.
  premise    one or two sentences. The hook.
  briefing   four to six sentences, second person, present tense, read aloud at the table before
             a model is placed. Ground it in one or two exact, physical details rather than an
             overview \u2014 the thing they would actually notice first. Write it the way the
             examples above read, not the way a field description reads.
  scenery    one or two sentences on what to put on the table.
  deployment where each side starts, by table edge or feature.

  terrain    four to eight pieces to build or stand in. Each: name, note (how many, what it
             looks like), role (one of ${roles}), ground (one of ${grounds}).
             If a piece is something they probably do not own, say so in "note".

  events     two to four things that happen on a named round. Each: round, title, text
             (write the moment the way it is discovered, in the same voice as the briefing,
             ending with the measurable rule stated plainly), and effect
             {type: damage|condition|spawn|terrain|none, amount, where, who}.
             Events are hidden from the players until their round arrives, so write them
             as something that happens to the table, not as a rule being announced.

  map        a top-down plan. Coordinates are percentages: x 0 (left) to 100 (right),
             y 0 (top) to 100 (bottom).
             zones: two to four deployment areas {label, side ("a","b","neutral"), x, y, w, h}
             features: six to ten {label, role (${roles}), ground (${grounds}), x, y, r}
             where r is how far that ground spreads, 4 to 28. Every feature needs a role and
             a ground. Keep labels under 22 characters. The features are numbered in order,
             so refer to them in the text as "the bell tower (3)".

  objectives only from: ${objList.join(", ")}.
${(sc.victory.objectiveTypes || []).filter(o => objList.includes(o.id)).map(o => "             " + o.id + ": " + o.desc).join("\n")}

  specialRules  nought to three, one line each. Only if the place demands one.
  twist         one sentence. Something that turns in the second half.

  woundFlavour  three to five short lines for what this specific place does to whoever is hurt
                by it. Each: "cause" (an enemy name from your own enemy list, the environment
                id, or a terrain piece's name \u2014 something that actually exists in this
                scenario) and "text" (one sentence, present tense, what it looks or feels like
                to be marked by that specific thing here). These do not invent new injuries or
                change any rule \u2014 they give a scar earned in this scenario its own scene
                instead of a generic one. Example shape only, invent your own: {"cause":"the
                Drowned","text":"the cold gets into the wound and does not leave with it"}.
${sealed ? `
  THIS IS A SEALED SCENARIO. Nobody knows what is going on yet \u2014 write it the way an
  unnerving discovery feels: a thing is found, and nothing about it is understood at first.
  Do NOT explain what it is in the briefing or the premise. The players find out through
  envelopes, not through you telling them up front.

  The objectives above should total exactly ${objCount}, chosen from any of the allowed
  types \u2014 they stay secret until round 2 or an envelope reveals them, so do not describe
  them in the briefing.

  Also write a "mystery" object:
    question   what the players are actually trying to work out, one sentence
    truth      what is really going on \u2014 never told to the players directly, only
               through envelopes
    envelopes  four to six moments of discovery, IN ORDER from earliest to latest. Each one
               reveals one more piece of the truth than the last — never the whole of it
               at once. Build them so a table paying attention could guess the truth one
               envelope before the last, then have it confirmed. Each: "trigger" (a plain
               condition someone running the game can judge for themselves, e.g. "a model
               enters the chamber", "round 3", "someone searches the body", "a model takes
               damage from it" — prefer triggers tied to what the players DO over ones
               tied only to the round), "title" (short, gives nothing away — the host
               reads this before opening it), "text" (what is found or realised, written in
               the same voice as the briefing, one image doing the work, not an explanation),
               and "revealsObjectives" (true on whichever envelope is what makes the real
               objectives known).
    finale     one or two sentences: what becomes clear once every envelope has opened, and
               what it changes about how the last part of the fight should feel
` : ""}
  markers    ${markers} numbered suspicion markers. For each give "where" \u2014 where it sits,
             naming a map feature if it suits. Do NOT say what is under them.

  enemy      ${enemy} points of them, from the catalogue below, by id. A unit is one profile
             fielded as several identical models; cost is the profile cost times the count.
             Stay at or under ${enemy}.
             Each unit also gets "protocol": two or three "condition: order" lines, read top
             to bottom, first true line wins.
             Conditions: ${sc.protocols.conditions.join(", ")}.
             Orders: ${sc.protocols.orders.join(", ")}.
             Mark a unit "hidden": true if it is not on the table at the start, and give it
             a "hint": what to physically prepare for it \u2014 size and shape, not its name or
             stats (e.g. "something large, many-limbed" rather than "the Broodmother"). Nothing
             hidden should be named or described recognisably anywhere else in this scenario
             \u2014 not in an envelope's title or trigger, not in specialRules, not in the twist
             \u2014 until the moment that reveals it. An envelope that brings a hidden unit on
             should describe what happens, not name what did it.

             EVERY UNIT YOU WRITE MUST FIT INSIDE ${enemy} POINTS TOGETHER. Total their cost
             yourself before replying. If a unit is named or implied anywhere else in this
             scenario (an envelope, a special rule, the twist), it must appear in this list \u2014
             never write a creature into the story and then leave it out of the roster. If the
             points are tight, write fewer models of it rather than omitting it.

Model profile: fight, aim, will, wits are dice on ${RS.dice.ladder.join(", ")} (default ${statDefault("fight")});
move in cm (default ${statDefault("move")}); ${RSX.stat.wounds.name.toLowerCase()} (default ${statDefault("wounds")});
actions (default ${statDefault("actions")}); size one of ${RSX.stat.size.values.join(", ")}.

${aiCatalogue()}

GEAR IS NAMED BY WHAT IT DOES. Give every enemy weapon an "as" \u2014 a name that suits that
creature. A drowned thing does not carry a "Melee weapon", it swings a "Rusted clapper".

Reply with ONLY this JSON and nothing else:
{"title":"...","premise":"...","briefing":"...","scenery":"...","deployment":"...",
${sealed ? '"mystery":{"question":"...","truth":"...","finale":"...","envelopes":[{"trigger":"...","title":"...","text":"...","revealsObjectives":false}]},' : ""}
 "environment":${JSON.stringify((sc.environment || []).map(e => e.id))} pick one or null,
 "terrain":[{"name":"...","note":"...","role":"cover","ground":"even"}],
 "events":[{"round":3,"title":"...","text":"...","effect":{"type":"damage","amount":"1","where":"within 10 cm of the bell tower (3)","who":"every model"}}],
 "map":{"note":"one line on the table","zones":[{"label":"...","side":"a","x":5,"y":40,"w":18,"h":30}],
        "features":[{"label":"...","role":"cover","ground":"rough","x":50,"y":50,"r":8}]},
 "objectives":[{"type":"allowed id","what":"what it is, in the fiction","vp":1}],
 "specialRules":["..."],"twist":"...",
 "woundFlavour":[{"cause":"...","text":"..."}],
 "markers":[{"n":1,"where":"..."}],
 "enemy":[{"name":"...","count":3,"hidden":false,"hint":"only if hidden \u2014 what to prepare, no name",
   "stats":{"fight":"d6","aim":"d6","will":"d6","wits":"d6","move":12,"wounds":5,"actions":2},
   "size":"man","traits":["id"],"weapons":[{"id":"id","as":"its name","mods":["id"]}],
   "armour":"id or null","protocol":["condition: order"]}]}`;

  try{
    const raw = await ai.json(prompt, {modelTier: "default", cache: false});
    S.out = legaliseScenario(raw, {size, enemy, objList, objCount, markers, diff, len, type, theme, mode,
                                   players: S.players, perBand: S.perBand,
                                   chose: {type: !S.type, theme: !S.theme}});
  }catch(e){
    S.out = null;
    toast(aiTrouble(e && e.code) || "That did not work");
  }finally{
    S.busy = false; drawGenerate(ai);
  }
}

/* ---- checking it against the rules ---- */
function legaliseScenario(raw, ctx){
  if(!raw || typeof raw !== "object") return null;
  const str = (v, n) => String(v == null ? "" : v).slice(0, n);
  const ROLES = ["cover", "blocking", "high", "objective", "hazard", "marker"];
  const GROUNDS = ["even", "rough", "hazardous", "impassable"];
  const num = (v, lo, hi, dflt) => {
    const n = Math.round(+v);
    return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : dflt;
  };

  const out = {
    title: str(raw.title || raw.name || "Unnamed", 60),
    premise: str(raw.premise, 300),
    briefing: str(raw.briefing, 1200),
    scenery: str(raw.scenery, 400),
    deployment: str(raw.deployment, 300),
    twist: str(raw.twist, 300),
    environment: (RS.scenario.environment || []).some(e => e.id === raw.environment) ? raw.environment : null,
    size: ctx.size, enemyBudget: ctx.enemy, difficulty: ctx.diff.id, reward: ctx.diff.reward,
    rounds: ctx.len.rounds, type: ctx.type.id, theme: ctx.theme.id, mode: ctx.mode.id,
    players: ctx.players, perBand: ctx.perBand, chose: ctx.chose || {},
    sealed: !!ctx.type.sealed, mystery: null,
    terrain: [], events: [], map: {note: "", zones: [], features: []},
    objectives: [], specialRules: [], markers: [], enemy: [], notes: [],
    woundFlavour: []
  };

  /* The mystery block: everything is optional prose, so it is trimmed rather
     than rejected \u2014 a sealed scenario with a thin mystery is still playable,
     it just has less to open. */
  if(out.sealed && raw.mystery && typeof raw.mystery === "object"){
    const rm = raw.mystery;
    out.mystery = {
      question: str(rm.question, 200), truth: str(rm.truth, 500), finale: str(rm.finale, 400),
      envelopes: (Array.isArray(rm.envelopes) ? rm.envelopes : []).slice(0, 5).map((e, i) => ({
        eid: "e" + i, trigger: str(e && e.trigger, 140), title: str(e && e.title, 60),
        text: str(e && e.text, 500), revealsObjectives: !!(e && e.revealsObjectives),
        opened: false
      })).filter(e => e.title)
    };
    if(!out.mystery.envelopes.length) out.notes.push("no envelopes came back for a sealed scenario \u2014 objectives will just reveal at round 2");
  } else if(out.sealed){
    out.notes.push("this was meant to be sealed but no mystery came back");
  }

  /* terrain to build */
  (Array.isArray(raw.terrain) ? raw.terrain : []).slice(0, 8).forEach(t => {
    if(!t || !t.name) return;
    out.terrain.push({name: str(t.name, 50), note: str(t.note, 140),
      role: ROLES.includes(t.role) ? t.role : "cover",
      ground: GROUNDS.includes(t.ground) ? t.ground : "even"});
  });

  /* the map, clamped to the table */
  const m = raw.map || {};
  out.map.note = str(m.note, 140);
  (Array.isArray(m.zones) ? m.zones : []).slice(0, 4).forEach(z => {
    out.map.zones.push({label: str(z.label, 22),
      side: ["a", "b", "neutral"].includes(z.side) ? z.side : "neutral",
      x: num(z.x, 0, 100, 0), y: num(z.y, 0, 100, 0),
      w: num(z.w, 4, 100, 20), h: num(z.h, 4, 100, 18)});
  });
  (Array.isArray(m.features) ? m.features : []).slice(0, 10).forEach(f => {
    out.map.features.push({label: str(f.label, 22),
      role: ROLES.includes(f.role) ? f.role : "cover",
      ground: GROUNDS.includes(f.ground) ? f.ground : "even",
      x: num(f.x, 0, 100, 50), y: num(f.y, 0, 100, 50), r: num(f.r, 3, 30, 7)});
  });
  if(!out.map.features.length) out.notes.push("no map came back, so there is nothing to lay out");

  /* events, only on rounds that exist */
  const lastRound = ctx.len.rounds || 8;
  (Array.isArray(raw.events) ? raw.events : []).slice(0, 4).forEach(e => {
    if(!e || !e.title) return;
    const r = num(e.round, 1, lastRound, 2);
    const eff = e.effect || {};
    out.events.push({round: r, title: str(e.title, 50), text: str(e.text, 500),
      effect: {type: ["damage", "condition", "spawn", "terrain", "none"].includes(eff.type) ? eff.type : "none",
               amount: str(eff.amount, 30), where: str(eff.where, 120), who: str(eff.who, 80)},
      sprung: false});
  });
  out.events.sort((a, b) => a.round - b.round);

  const maxObj = out.sealed ? (ctx.objCount || 2) : 4;
  (Array.isArray(raw.objectives) ? raw.objectives : []).slice(0, maxObj).forEach(o => {
    const t = (RS.scenario.victory.objectiveTypes || []).find(x => x.id === (o && o.type));
    if(!t || !ctx.objList.includes(t.id)){ out.notes.push("dropped an objective this mission does not allow"); return; }
    out.objectives.push({type: t.id, what: str(o.what || t.desc, 120),
                         vp: num(o.vp, 1, 5, 1), rule: t.desc});
  });

  (Array.isArray(raw.specialRules) ? raw.specialRules : []).slice(0, 3)
    .forEach(r => { if(r) out.specialRules.push(str(r, 200)); });

  /* What being hurt HERE looks like, keyed to something the scenario actually
     has — never a new rule, only a scene for a scar the ruleset already
     produces. Anything not tied to a real cause is dropped rather than shown
     out of context. */
  (Array.isArray(raw.woundFlavour) ? raw.woundFlavour : []).slice(0, 5).forEach(w => {
    const cause = str(w && w.cause, 60), text = str(w && w.text, 200);
    if(cause && text) out.woundFlavour.push({cause, text});
  });

  for(let i = 1; i <= ctx.markers; i++){
    const mk = (Array.isArray(raw.markers) ? raw.markers : []).find(x => +(x && x.n) === i);
    out.markers.push({n: i, where: mk ? str(mk.where, 120) : ""});
  }

  /* Whatever the AI wrote elsewhere in this scenario may already depend on an
     enemy existing — an envelope, a special rule, the twist. Dropping a
     named unit for points would leave that text pointing at nothing, which is
     worse than a fight being a little smaller than asked for. So a unit the
     story already named is never simply cut: its count is scaled down to
     fit, and only if it cannot fit even alone is it left out — loudly. */
  const storyText = [
    out.twist, ...(out.specialRules || []),
    ...((out.mystery && out.mystery.envelopes) || []).map(e => e.title + " " + e.trigger + " " + e.text)
  ].join(" ");
  const escapeRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const isReferenced = name => name && new RegExp("\\b" + escapeRe(name) + "\\b", "i").test(storyText);

  const requested = (Array.isArray(raw.enemy) ? raw.enemy : []).slice(0, 6).map(u => {
    const built = aiLegalise(Object.assign({}, u, {name: u.name}), 9999);
    if(!built) return null;
    const name = built.name || u.name || "Enemy";
    return {name, u, built, per: memberCost(built), want: num(u.count, 1, 10, 1),
            referenced: isReferenced(name)};
  }).filter(Boolean);
  requested.sort((a, b) => (b.referenced - a.referenced));   // referenced units get first claim on the budget

  let spent = 0;
  requested.forEach(r => {
    const room = ctx.enemy - spent;
    if(room < r.per){
      out.notes.push((r.referenced
        ? "the story depends on " + r.name + ", but even one of it would not fit — raise the enemy budget or trim the brief"
        : "left out " + r.name + " — it would not fit the points"));
      return;
    }
    const count = Math.min(r.want, Math.floor(room / r.per));
    if(count < r.want) out.notes.push(r.name + " scaled from " + r.want + " to " + count + " to fit the points");
    const cost = r.per * count;
    spent += cost;
    out.enemy.push({name: r.name, count, per: r.per, cost, built: r.built, hidden: !!r.u.hidden,
      hint: str(r.u.hint, 90),
      protocol: (Array.isArray(r.u.protocol) ? r.u.protocol : []).map(x => str(x, 90)).slice(0, 4)});
  });
  out.enemySpent = spent;
  if(!out.enemy.length) out.notes.push("no enemy came back that fitted the points");
  return out;
}

/* Hidden units are never named in the open, even by accident: anywhere a
   scenario's own text might mention one before its reveal, swap the real
   name for its hint (or a plain placeholder if it has none). Belt and
   braces — the prompt already asks the writer not to do this. */
function maskHiddenNames(text, hiddenUnits){
  if(!text) return text;
  (hiddenUnits || []).forEach(u => {
    if(!u || !u.name) return;
    const re = new RegExp("\\b" + u.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "gi");
    text = text.replace(re, u.hint || "something hidden");
  });
  return text;
}
function maskSecrets(text, s){
  return maskHiddenNames(text, (s.enemy || []).filter(u => u.hidden));
}

function enemyLine(m){
  const bits = DIE_STATS.map(k => RSX.stat[k].name.slice(0, 2) + " " + m[k]).join(" · ");
  const w = (m.weapons || []).map(e => skinOf(m, e.id, (catOf("weapons")[e.id] || {}).name)).join(", ");
  const t = (m.traits || []).map(id => (catOf("traits")[id] || {}).name).filter(Boolean).join(", ");
  return [bits, m.wounds + " " + RSX.stat.wounds.name, w, t].filter(Boolean).join("  ·  ");
}
function bindScenario(){
  const again = $("#gAgain"), take = $("#gTake");
  if(again) again.onclick = async () => runGenerate(await getAI());
  if(take) take.onclick = () => startFromScenario(genState.out);
}

/* ---- into a quest ---- */
function startFromScenario(s){
  if(!s) return;
  const typeObj = (RS.scenario.battleTypes || []).find(t => t.id === s.type) || null;
  if(!questBegin(s.size, {type: typeObj, players: s.players || 1})) return;
  Q.difficulty = s.difficulty;
  Q.reward = s.reward;
  Q.enemyPoints = s.enemyBudget;
  Q.scenario = {name: s.title, premise: s.premise, briefing: s.briefing,
                scenery: s.scenery, deployment: s.deployment, twist: s.twist,
                environment: s.environment, objectives: s.objectives,
                specialRules: s.specialRules, terrain: s.terrain, map: s.map,
                events: s.events.map(e => Object.assign({}, e, {sprung: false})),
                rounds: s.rounds, type: s.type, theme: s.theme,
                /* A sealed scenario keeps its objectives to itself until round 2
                   or an envelope says otherwise. mystery travels with the quest so
                   the app \u2014 never the players \u2014 can check envelope triggers. */
                sealed: !!s.sealed, objectivesKnown: !s.sealed,
                mystery: s.mystery ? Object.assign({}, s.mystery,
                  {envelopes: s.mystery.envelopes.map(e => Object.assign({}, e))}) : null,
                woundFlavour: s.woundFlavour || []};
  /* the generator's placements, over the app's own secret contents */
  Q.markers.forEach((m, i) => { const g = s.markers[i]; if(g) m.where = g.where; });
  s.enemy.forEach(u => {
    const f = questFoe(u.name, u.count, u.built.wounds,
      activationsOf(Object.assign({}, u.built, {count: u.count})), u.hidden);
    f.profile = u.built;
    f.protocol = u.protocol;
    f.points = u.cost;
    f.hint = u.hint;
    Q.units.push(f);
  });
  questSave();
  genState = null;
  closePicker(); render();
  toast(s.title + " — begins");
}

/* ---- realm.js ---- */
/* =====================================================================
   THE REALM
   A shared table. One person hosts; the rest join with the realm's name
   and a number.

   Who may write what is the whole design:

     the host   the round, victory points, the markers, the enemy, and
                EVENTS aimed at a player's model
     a player   their own models, and nothing else

   A trap never reaches in and sets your Health. It posts an event saying
   what happened, your app applies it to your own model and marks it done.
   Two devices never write the same thing, so nothing is lost when you
   both touch the table at once.

   None of this exists in an artifact; it needs the hosted build, and the
   app simply hides the Realm where it cannot work.
   ===================================================================== */

const REALM_PASS = "ep_realm_pass", REALM_ME = "ep_me";
let realmDb = null, realmKey = "", realmOff = [];

function realmAvailable(){
  return typeof firebase !== "undefined" && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey;
}
function meId(){
  let v = "";
  try{ v = localStorage.getItem(REALM_ME) || ""; }catch(e){}
  if(!v){ v = uid() + uid(); try{ localStorage.setItem(REALM_ME, v); }catch(e){} }
  return v;
}
async function hashKey(s){
  const norm = String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("epitaph|" + norm));
  return [...new Uint8Array(buf)].slice(0, 10).map(b => b.toString(16).padStart(2, "0")).join("");
}
function realmInit(){
  if(realmDb) return true;
  if(!realmAvailable()) return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    realmDb = firebase.database();
    return true;
  }catch(e){ return false; }
}
/* The database allows writing children of a room, not the room node itself,
   so everything lives one level in. The realm key is hashed with its own
   prefix, so an Epitaph realm never lands on another game's room even if
   someone types the same name. */
function ref(path){
  if(!realmDb || !realmKey) return null;
  return realmDb.ref("rooms/" + realmKey + "/epitaph/" + path);
}
/* Publishing must never be able to stop the game. If the realm is not there
   — no connection, not entered, a dropped signal — the app carries on as a
   local tracker and picks the sharing back up when it returns. */
function tryWrite(path, value){
  const r = ref(path);
  if(!r) return false;
  try{ r.set(value); return true; }catch(e){ return false; }
}
function watch(path, fn){
  const r = ref(path);
  if(!r) return;
  const h = r.on("value", s => fn(s.val()));
  realmOff.push(() => r.off("value", h));
}
function unwatchAll(){ realmOff.forEach(f => { try{ f(); }catch(e){} }); realmOff = []; }

/* ---- entering ---- */
async function enterRealm(name){
  if(!realmInit()) return false;
  realmKey = await hashKey(name);
  try{ localStorage.setItem(REALM_PASS, name); }catch(e){}
  return true;
}
function savedRealm(){ try{ return localStorage.getItem(REALM_PASS) || ""; }catch(e){ return ""; } }

/* ---- what goes up ----
   A unit is published thin: what the table needs to see, not the whole
   model. Its profile stays on the owner's phone. */
function shareUnit(u){
  return {uid: u.uid, owner: meId(), name: u.name, side: u.side,
          models: u.models, max: u.max, acts: u.acts, used: u.used,
          strain: u.strain, ready: !!u.ready, cond: u.cond || []};
}
function pushMyUnits(){
  if(!Q || !Q.realm) return;
  const mine = Q.units.filter(u => u.side === "us" && !u.remote);
  const out = {};
  mine.forEach(u => out[u.uid] = shareUnit(u));
  tryWrite("quests/" + Q.realm + "/units/" + meId(), out);
}
function pushTable(){
  if(!Q || !Q.realm || !Q.host) return;
  tryWrite("quests/" + Q.realm + "/table", {
    round: Q.round, step: Q.step, size: Q.size,
    vp: Q.vp, nerve: Q.nerve,
    markers: Q.markers.map(m => ({n: m.n, state: m.state})),   // never the kind
    foes: Q.units.filter(u => u.side === "them").map(shareUnit),
    at: Date.now()
  });
}

/* ---- events: the only way the host touches a player's model ---- */
function sendEvent(toUid, ev){
  if(!Q || !Q.realm || !Q.host) return;
  const id = uid() + Date.now().toString(36);
  tryWrite("quests/" + Q.realm + "/events/" + id, Object.assign({to: toUid, at: Date.now()}, ev));
}
function applyEvent(id, ev){
  const u = Q.units.find(x => x.uid === ev.to);
  if(!u || u.side !== "us") return;
  let seen = Q.seen || (Q.seen = {});
  if(seen[id]) return;
  seen[id] = 1;
  if(ev.damage) hurtUnit(u, ev.damage, ev.why || "the scenario");
  if(ev.cond && !(u.cond || []).includes(ev.cond)) u.cond = (u.cond || []).concat([ev.cond]);
  if(ev.strain) strainUnit(u, ev.strain);
  if(ev.found){
    const m = band().members.find(x => x.id === u.uid);
    if(m) giveFound(m, ev.found);
  }
  qlog(u.name + " — " + (ev.why || "the scenario") + (ev.damage ? ", " + ev.damage + " damage" : ""));
  questSave();
  toast(u.name + ": " + (ev.why || "something happens") + (ev.damage ? " — " + ev.damage + " damage" : ""));
  render();
  if(cardId) drawCard();
}

/* ---- hosting ---- */
async function hostQuest(size){
  if(!questBegin(size)) return false;
  Q.realm = uid();
  Q.host = true;
  Q.joinCode = Q.realm.slice(0, 5).toUpperCase();
  questSave();
  tryWrite("quests/" + Q.realm + "/meta", {code: Q.joinCode, host: meId(), size, at: Date.now()});
  pushTable(); pushMyUnits();
  listenAsHost();
  return true;
}
function listenAsHost(){
  unwatchAll();
  watch("quests/" + Q.realm + "/units", all => {
    if(!all) return;
    const others = [];
    Object.keys(all).forEach(owner => {
      if(owner === meId()) return;
      Object.values(all[owner] || {}).forEach(u => others.push(Object.assign({}, u, {owner, remote: true})));
    });
    Q.units = Q.units.filter(u => !u.remote).concat(others);
    questSave(); render();
  });
}

/* ---- joining ---- */
async function joinQuest(code){
  const snap = await realmDb.ref("rooms/" + realmKey + "/epitaph/quests").once("value");
  const all = snap.val() || {};
  const id = Object.keys(all).find(k => ((all[k] || {}).meta || {}).code === String(code).trim().toUpperCase());
  if(!id) throw new Error("No quest with that number in this realm.");
  const b = band();
  const mine = b.members.filter(fielded);
  if(!mine.length) throw new Error("Field someone first.");
  Q = {round: 1, step: "tempo", size: (all[id].meta || {}).size || 0,
       nerve: {us: 0, them: 0}, vp: {us: 0, them: 0},
       units: mine.map(questUnitFrom), markers: [], log: [],
       realm: id, host: false, joinCode: String(code).trim().toUpperCase(), seen: {}};
  questSave();
  pushMyUnits();
  listenAsGuest();
  return true;
}
function listenAsGuest(){
  unwatchAll();
  watch("quests/" + Q.realm + "/table", t => {
    if(!t) return;
    Q.round = t.round; Q.step = t.step; Q.size = t.size;
    Q.vp = t.vp || Q.vp; Q.nerve = t.nerve || Q.nerve;
    Q.markers = (t.markers || []).map(m => ({n: m.n, state: m.state, kind: "unknown"}));
    Q.units = Q.units.filter(u => u.side === "us")
      .concat((t.foes || []).map(f => Object.assign({}, f, {remote: true})));
    questSave(); render();
    if(cardId) drawCard();
  });
  watch("quests/" + Q.realm + "/events", all => {
    if(!all) return;
    Object.keys(all).forEach(id => applyEvent(id, all[id]));
  });
}

function leaveRealm(){
  unwatchAll();
  if(Q && Q.realm && !Q.host){ const r = ref("quests/" + Q.realm + "/units/" + meId()); if(r) try{ r.remove(); }catch(e){} }
  if(Q){ delete Q.realm; delete Q.host; questSave(); }
}

/* ---- the Realm view ---- */
/* The table: what to fight over, and who is at it. Arranging a game happens
   here; playing your own models happens on their cards. */
function tableHTML(){
  const q = questOn();
  return `
  <div class="slab">
    <div class="head"><span class="eyebrow">Something to fight over</span><span class="rule"></span>
      ${q && Q.scenario ? `<span class="chip gilt">${esc(Q.scenario.name)}</span>` : ""}</div>
    <p class="lead">${q
      ? "A quest is running. The round, the markers and your models are on the Unburied side."
      : "Have one written for you — a place, a reason, an enemy that fits the points, and where the markers go."}</p>
    <div class="sheet-actions" style="flex-wrap:wrap;gap:8px">
      ${q ? `
        <button class="btn" id="tbBrief" style="margin-left:0" ${Q.scenario ? "" : "disabled"}>The brief</button>
        <button class="btn" id="tbFoes">The enemy</button>
        <button class="btn" id="tbMarkers">Markers</button>
        <button class="btn ghost" id="tbEnd" style="margin-left:auto">End the quest</button>`
      : `
        <button class="btn primary" id="tbScn" style="margin-left:0">Write a scenario</button>
        <button class="btn ghost" id="tbPlain">Just take them out</button>`}
    </div>
  </div>`;
}
function bindTable(el){
  const go = (id, fn) => { const b = el.querySelector("#" + id); if(b) b.onclick = fn; };
  go("tbScn", openGenerate);
  go("tbPlain", openQuestStart);
  go("tbBrief", openBrief);
  go("tbFoes", openFoes);
  go("tbMarkers", () => openMarkers());
  go("tbEnd", askEnd);
}

function renderRealm(){
  const el = $("#viewRealm");
  if(!realmAvailable()){
    el.innerHTML = tableHTML() + `
      <div class="slab">
        <div class="head"><span class="eyebrow">A shared table</span><span class="rule"></span></div>
        <p class="lead">Hosting and joining need somewhere to share it, and this copy has no
          realm behind it. Everything else works — writing a scenario, running it, your cards.</p>
        <p class="quiet" style="margin-top:9px">The hosted build at your own address can share.</p>
      </div>`;
    bindTable(el);
    return;
  }
  const inQuest = questOn() && Q.realm;
  el.innerHTML = tableHTML() + `
    <div class="slab">
      <div class="head"><span class="eyebrow">A shared table</span><span class="rule"></span>
        ${realmKey ? `<span class="chip good">entered</span>` : ""}</div>
      <p class="lead">Everyone who types the same realm name plays in the same one.
        Share it only with them — it is never stored, only its fingerprint.</p>
      <div class="field" style="margin:13px 0">
        <label>Realm name</label>
        <input class="input" id="rmName" value="${esc(savedRealm())}" placeholder="rusted-cathedral"
          autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="sheet-actions"><button class="btn primary" id="rmEnter" style="margin-left:0">Enter</button></div>
    </div>

    ${!realmKey ? "" : inQuest ? `
    <div class="slab">
      <div class="head"><span class="eyebrow">${Q.host ? "You are hosting" : "You have joined"}</span><span class="rule"></span></div>
      <p class="lead">The number for this table is <b class="mono" style="font-size:19px;color:var(--gilt)">${esc(Q.joinCode)}</b></p>
      <p class="quiet" style="margin-top:8px">${Q.host
        ? "Players enter the realm, then this number. Their models appear here as they join."
        : "Your models are yours to run. The round, the markers and anything the scenario does to you arrive from the host."}</p>
      <div class="sheet-actions">
        <button class="btn ghost" id="rmLeave" style="margin-left:0">${Q.host ? "Stop hosting" : "Leave the table"}</button>
      </div>
    </div>` : `
    <div class="slab">
      <div class="head"><span class="eyebrow">Host a table</span><span class="rule"></span></div>
      <p class="lead">You keep the scenario, the markers and the enemy. Everyone else brings
        their own Unburied.</p>
      <div class="field" style="margin:13px 0"><label>Game size in points</label>
        <input class="input mono" id="rmSize" inputmode="numeric" value="${band().budget * 2}"></div>
      <div class="sheet-actions"><button class="btn primary" id="rmHost" style="margin-left:0">Host it</button></div>
    </div>
    <div class="slab">
      <div class="head"><span class="eyebrow">Join a table</span><span class="rule"></span></div>
      <p class="lead">Whoever is hosting will read you the number.</p>
      <div class="field" style="margin:13px 0"><label>The number</label>
        <input class="input mono" id="rmCode" maxlength="5" placeholder="A1B2C"
          style="text-transform:uppercase"></div>
      <div class="sheet-actions"><button class="btn primary" id="rmJoin" style="margin-left:0">Join</button></div>
      <p class="quiet" id="rmMsg" style="margin:9px 0 0"></p>
    </div>`}`;

  bindTable(el);
  const enter = $("#rmEnter");
  if(enter) enter.onclick = async () => {
    const v = $("#rmName").value.trim();
    if(!v){ toast("Name the realm"); return; }
    if(await enterRealm(v)){ toast("Entered"); renderRealm(); }
    else toast("Could not reach the realm");
  };
  const host = $("#rmHost");
  if(host) host.onclick = async () => {
    const n = Math.max(100, parseInt(($("#rmSize").value || "").replace(/\D/g, ""), 10) || 500);
    if(await hostQuest(n)){ render(); renderRealm(); toast("Hosting — give them the number"); }
  };
  const join = $("#rmJoin");
  if(join) join.onclick = async () => {
    try{ await joinQuest($("#rmCode").value); render(); renderRealm(); toast("Joined"); }
    catch(e){ const m = $("#rmMsg"); m.textContent = e.message; m.style.color = "var(--rust)"; }
  };
  const leave = $("#rmLeave");
  if(leave) leave.onclick = () => { leaveRealm(); renderRealm(); render(); toast("Left the table"); };
}


/* light / dark is the viewer's choice and is remembered on this device */
(function(){
  const k="ep_theme";
  try{ const t=localStorage.getItem(k); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
  const b=document.getElementById("btnTheme");
  if(b) b.onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="dark"?"light":cur==="light"?"dark":
      (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem(k,next); }catch(e){}
  };
})();
boot();
