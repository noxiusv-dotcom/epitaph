<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Epitaph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* =====================================================================
   EPITAPH — carved stone, ash and gilt.
   Headings are inscriptions: Cinzel, letter-spaced, the way a name is cut
   into a marker. Body is plain and readable because rules text has to be.
   ===================================================================== */
:root{
  --stone-0:#0d0f12;        /* the dark between markers */
  --stone-1:#14171c;        /* panel */
  --stone-2:#1c2026;        /* raised panel */
  --stone-3:#252a32;        /* input, chip */
  --line:#2f353e;
  --line-soft:#232830;

  --ash:#e8e4dc;            /* primary text: bone, not white */
  --ash-dim:#a8a49c;
  --ash-mute:#6e6a64;

  --gilt:#c9a227;           /* the lettering on the marker */
  --gilt-deep:#9c7d18;
  --gilt-glow:rgba(201,162,39,.14);
  --verdigris:#5e9e8a;      /* aged copper: good news */
  --rust:#b5503c;           /* iron rot: bad news */

  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --stone-0:#e9e5dd; --stone-1:#f3f0e9; --stone-2:#fbf9f4; --stone-3:#ffffff;
    --line:#d2ccc0; --line-soft:#e0dbd1;
    --ash:#1b1916; --ash-dim:#55504a; --ash-mute:#8a8479;
    --gilt:#8a6d12; --gilt-deep:#6d5510; --gilt-glow:rgba(138,109,18,.10);
    --verdigris:#3f7a66; --rust:#9c402d;
    --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 18px rgba(0,0,0,.08);
  }
}
[data-theme="light"]{
  --stone-0:#e9e5dd; --stone-1:#f3f0e9; --stone-2:#fbf9f4; --stone-3:#ffffff;
  --line:#d2ccc0; --line-soft:#e0dbd1;
  --ash:#1b1916; --ash-dim:#55504a; --ash-mute:#8a8479;
  --gilt:#8a6d12; --gilt-deep:#6d5510; --gilt-glow:rgba(138,109,18,.10);
  --verdigris:#3f7a66; --rust:#9c402d;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 18px rgba(0,0,0,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone-0);
  color:var(--ash);
  font:15px/1.55 "Inter",system-ui,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:anywhere;
}
body.locked{overflow:hidden}

/* ---- inscriptional headings ---- */
h1,h2,h3,.inscribed{
  font-family:"Cinzel",Georgia,serif;
  font-weight:600;
  letter-spacing:.06em;
  margin:0;
}
h1{font-size:23px;letter-spacing:.11em}
h2{font-size:17px}
h3{font-size:16px;letter-spacing:.08em}
.eyebrow{
  font-family:"Cinzel",Georgia,serif;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ash-mute);
}
.lead{color:var(--ash-dim);font-size:13.5px;margin:6px 0 0;line-height:1.55}
.quiet{color:var(--ash-mute);font-size:12.5px}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.serif{font-family:"Spectral",Georgia,serif}

/* ---- the masthead, cut like a marker ---- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--stone-1),var(--stone-0));
  border-bottom:1px solid var(--line);
}
.masthead{max-width:860px;margin:0 auto;padding:13px 16px 0;display:flex;align-items:center;gap:12px}
.sigil{
  width:34px;height:34px;flex:none;border-radius:7px;
  border:1px solid var(--gilt-deep);background:var(--stone-2);
  display:grid;place-items:center;color:var(--gilt);
}
.brand{min-width:0;flex:1}
.brand h1{line-height:1.1}
.brand .sub{
  font-family:"Cinzel",Georgia,serif;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ash-mute);margin-top:3px;
}
.iconbtn{
  width:34px;height:34px;flex:none;border-radius:8px;border:1px solid var(--line);
  background:var(--stone-2);color:var(--ash-dim);display:grid;place-items:center;cursor:pointer;
}
.iconbtn:hover{color:var(--ash);border-color:var(--gilt-deep)}

/* ---- the two halves of the app ---- */
nav.ways{max-width:860px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px}
.way{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 12px;border-radius:var(--r-md) var(--r-md) 0 0;
  border:1px solid var(--line);border-bottom:none;
  background:var(--stone-1);color:var(--ash-mute);cursor:pointer;
  font-family:"Cinzel",Georgia,serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
}
.way.on{background:var(--stone-2);color:var(--gilt);border-color:var(--gilt-deep)}
.way svg{width:15px;height:15px}

main{max-width:860px;margin:0 auto;padding:18px 16px 90px}

/* ---- surfaces ---- */
.slab{
  background:var(--stone-1);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px;box-shadow:var(--shadow);
}
.slab + .slab{margin-top:13px}
.rule{flex:1;height:1px;background:var(--line);opacity:.8}
.head{display:flex;align-items:center;gap:11px;margin-bottom:12px}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--stone-2);color:var(--ash-dim);font-size:11.5px;white-space:nowrap;
}
.chip.gilt{color:var(--gilt);border-color:var(--gilt-deep);background:var(--gilt-glow)}
.chip.good{color:var(--verdigris);border-color:var(--verdigris)}
.chip.bad{color:var(--rust);border-color:var(--rust)}

.btn{
  font:inherit;font-size:13px;padding:9px 16px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--stone-2);color:var(--ash);
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--gilt-deep)}
.btn.primary{background:var(--gilt);border-color:var(--gilt);color:#17130a;font-weight:600}
.btn.primary:hover{background:var(--gilt-deep);border-color:var(--gilt-deep)}
.btn.ghost{background:transparent}
.btn.sm{font-size:12px;padding:6px 12px}
.btn.danger{color:var(--rust);border-color:var(--rust)}
.btn:disabled{opacity:.4;cursor:default}

.input{
  width:100%;font:inherit;font-size:14px;padding:9px 11px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--stone-3);color:var(--ash);
}
.input:focus{outline:none;border-color:var(--gilt-deep)}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash-mute);margin-bottom:5px;font-family:"Cinzel",Georgia,serif}

/* ---- the roster: each of the Unburied on their own marker ---- */
.markers{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.marker{
  position:relative;text-align:left;width:100%;
  background:var(--stone-1);border:1px solid var(--line);
  border-radius:var(--r-lg) var(--r-lg) var(--r-sm) var(--r-sm);
  padding:14px 14px 12px;cursor:pointer;color:inherit;font:inherit;
  box-shadow:var(--shadow);
}
.marker:hover{border-color:var(--gilt-deep)}
.marker.benched{opacity:.55}
.marker::before{
  content:"";position:absolute;left:14px;right:14px;top:6px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gilt-deep),transparent);opacity:.5;
}
.m-name{font-family:"Cinzel",Georgia,serif;font-size:15px;letter-spacing:.05em;
  margin-bottom:2px;display:block}
.m-epithet{font-family:"Spectral",Georgia,serif;font-style:italic;color:var(--gilt);
  font-size:12.5px;margin-bottom:8px;display:block}
.m-role{color:var(--ash-mute);font-size:12px;margin-bottom:9px;display:block}
.m-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}
.m-stat{text-align:center;padding:6px 2px;border-radius:var(--r-sm);
  background:var(--stone-2);border:1px solid var(--line-soft)}
.m-stat b{display:block;font-size:14px;font-family:"Space Mono",monospace}
.m-stat span{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ash-mute);margin-top:2px}
.m-foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px}
.m-cost{position:absolute;top:12px;right:14px;font-family:"Space Mono",monospace;
  font-size:15px;color:var(--gilt)}
.m-cost small{display:block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ash-mute);font-family:"Cinzel",serif;text-align:right}

.marker.add{display:grid;place-items:center;min-height:132px;border-style:dashed;
  color:var(--ash-mute);gap:6px}
.marker.add .plus{font-size:26px;color:var(--gilt);line-height:1}
.marker.add span{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

.empty{text-align:center;padding:36px 18px;color:var(--ash-mute)}
.empty .big{font-family:"Cinzel",serif;font-size:15px;letter-spacing:.08em;color:var(--ash-dim);margin-bottom:6px}

/* ---- the band's own heading ---- */
.band{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.band-name{
  font-family:"Cinzel",Georgia,serif;font-size:21px;letter-spacing:.05em;
  background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--ash);padding:2px 0;min-width:180px;flex:1;
}
.band-name:focus{outline:none;border-color:var(--gilt)}
.gauge{margin-top:11px}
.gauge-line{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ash-mute)}
.gauge-line b{font-family:"Space Mono",monospace;font-size:19px;color:var(--ash)}
.gauge-line b.over{color:var(--rust)}
.bar{height:3px;border-radius:2px;background:var(--stone-3);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gilt);transition:width .25s}
.bar i.over{background:var(--rust)}

/* ---- overlays ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;overflow:auto;
  background:var(--stone-1);border-top:1px solid var(--gilt-deep);
  border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.3,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:none}
.sheet-in{max-width:860px;margin:0 auto;padding:16px 16px 22px}
.sheet-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.sheet-head .eyebrow{flex:1}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);z-index:90;
  background:var(--stone-2);border:1px solid var(--gilt-deep);color:var(--ash);
  padding:9px 15px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- the error page the app shows rather than guessing at rules ---- */
.fatal{max-width:620px;margin:56px auto;padding:22px}
.fatal h2{color:var(--rust);margin-bottom:10px}
.fatal ul{color:var(--ash-dim);font-size:13.5px;line-height:1.7}

@media (max-width:540px){
  .markers{grid-template-columns:1fr}
  main{padding:14px 13px 80px}
  h1{font-size:20px}
}

/* ---- the editor ---- */
.sheet.two{z-index:70}
.scrim.two{z-index:65}
.sheet-actions{display:flex;gap:9px;margin-top:16px;align-items:center}
.sheet-actions .btn.primary{margin-left:auto}
.srow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.srow:last-child{border-bottom:none}
.srow-l{flex:1;min-width:0}
.srow-l b{display:block;font-size:13.5px;font-weight:600}
.srow-l span{display:block;font-size:11.5px;color:var(--ash-mute);margin-top:1px}
.srow-r{display:flex;align-items:center;gap:10px}
.srow-hint{font-size:11.5px;color:var(--ash-mute);min-width:52px;text-align:right}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--stone-2)}
.stepper button{width:30px;height:30px;border:0;background:none;color:var(--ash-dim);cursor:pointer;font-size:16px;line-height:1}
.stepper button:hover:not(:disabled){color:var(--gilt)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper span{min-width:44px;text-align:center;font-family:"Space Mono",monospace;font-size:13px}
.stepper.sm button{width:24px;height:24px;font-size:14px}
.stepper.sm span{min-width:24px;font-size:12px}

.grow{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.grow:last-of-type{border-bottom:none}
.grow-main{flex:1;min-width:0}
.grow-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grow-sub{font-size:12px;color:var(--ash-mute);margin-top:2px;line-height:1.45;white-space:pre-line}
.grow-r{display:flex;align-items:center;gap:8px;flex:none}
.grow-r .mono{font-size:12.5px;color:var(--gilt)}
.grow-r .mono.neg,.cost-row b.neg{color:var(--verdigris)}
.tiny{background:none;border:0;color:var(--ash-mute);cursor:pointer;font-size:14px;line-height:1;padding:2px}
.tiny:hover{color:var(--gilt)}
.mods{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.mod{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:999px;
  border:1px solid var(--line);background:var(--stone-2);color:var(--ash-dim)}
.mod b{color:var(--gilt)}
.mod button{background:none;border:0;color:var(--ash-mute);cursor:pointer;font-size:12px;line-height:1;padding:0}
.mod-add{font:inherit;font-size:11px;padding:2px 7px;border-radius:999px;border:1px dashed var(--line);
  background:transparent;color:var(--ash-mute);max-width:180px}
.cost-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px;
  border-bottom:1px solid var(--line-soft)}
.cost-row:last-of-type{border-bottom:none}
.cost-row span{color:var(--ash-dim)}
.cost-row b{font-size:13px}

.picks{display:flex;flex-direction:column;gap:7px}
.pick{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--stone-2);color:inherit;
  font:inherit;cursor:pointer}
.pick:hover:not(:disabled){border-color:var(--gilt-deep)}
.pick.on{border-color:var(--gilt);background:var(--gilt-glow)}
.pick.no{opacity:.55;cursor:default}
.pick-main{flex:1;min-width:0}
.pick-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pick-desc{font-size:12px;color:var(--ash-mute);margin-top:3px;line-height:1.45;white-space:pre-line}
.pick-eg{font-family:"Spectral",Georgia,serif;font-style:italic;font-size:11.5px;color:var(--ash-mute);margin-top:4px;opacity:.85}
.pick-no{font-size:11.5px;color:var(--rust);margin-top:5px}
.pick-cost{font-size:13px;color:var(--gilt);flex:none}
.pick-cost.neg{color:var(--verdigris)}

/* ---- the card: read at arm's length ---- */
.cardhead{padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.cardname{font-family:"Cinzel",Georgia,serif;font-size:26px;letter-spacing:.07em;line-height:1.15}
.cardepi{font-family:"Spectral",Georgia,serif;font-style:italic;color:var(--gilt);font-size:17px;margin-top:5px}
.cardrole{color:var(--ash-mute);font-size:13px;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.cardpts{margin-left:auto;font-family:"Space Mono",monospace;color:var(--gilt);font-size:13px}

.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.cstat{text-align:center;padding:11px 6px;border-radius:var(--r-md);
  background:var(--stone-1);border:1px solid var(--line)}
.cstat b{display:block;font-family:"Space Mono",monospace;font-size:21px;line-height:1}
.cstat span{display:block;font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ash-dim);margin-top:5px}
.cstat small{display:block;font-size:9.5px;color:var(--ash-mute);margin-top:3px}

.atk{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.atk:last-child{border-bottom:none;padding-bottom:0}
.atk:first-child{padding-top:0}
.atk-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.atk-name{font-size:15px;font-weight:600;flex:1;min-width:0}
.atk-roll{font-size:12.5px;color:var(--ash-dim);white-space:nowrap}
.atk-roll b{font-family:"Space Mono",monospace;font-size:15px;color:var(--gilt)}
.atk-roll small{color:var(--ash-mute);font-size:11px}
.atk-line{font-size:13px;color:var(--ash-dim);margin-top:3px}
.atk-mods{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.atk-mods .mod{display:block;font-size:12px;padding:5px 9px;border-radius:var(--r-sm);
  background:var(--stone-2);border:1px solid var(--line);color:var(--ash-dim)}
.atk-mods .mod b{color:var(--gilt);margin-right:5px}

.says{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.says:last-child{border-bottom:none;padding-bottom:0}
.says:first-child{padding-top:0}
.says-n{font-size:14px;font-weight:600}
.says-d{font-size:13px;color:var(--ash-dim);line-height:1.5;margin-top:2px;white-space:pre-line}
.says.bad .says-n{color:var(--rust)}

.marker.add.conjure{border-color:var(--gilt-deep)}
.marker.add.conjure .plus{color:var(--gilt)}
.marker.add.conjure:hover{background:var(--gilt-glow)}

/* ---- the quest ---- */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;justify-content:space-between;
  margin:14px 0 0;padding:11px 13px;border-radius:var(--r-md);
  background:var(--stone-1);border:1px solid var(--gilt-deep)}
.qbar-l{display:flex;align-items:baseline;gap:9px}
.qbar-l b{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.06em}
.qbar-l span{font-size:12px;color:var(--ash-mute)}
.qbar-r{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.qbar-r button.chip{cursor:pointer;font:inherit;font-size:11.5px}
.qbar-r button.chip:hover{border-color:var(--gilt)}

.qstrip{margin:0 0 16px;padding:12px 13px;border-radius:var(--r-md);
  background:var(--stone-1);border:1px solid var(--gilt-deep)}
.qstrip.down{border-color:var(--rust)}
.qs-top{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:10px}
.qs-round{font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gilt)}
.qs-top button.chip{cursor:pointer;font:inherit;font-size:11.5px}
.qs-hp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qs-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qs-conds{display:flex;flex-wrap:wrap;gap:5px}
.qs-eff{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.qs-eff div{font-size:12px;color:var(--ash-dim);line-height:1.45}
.qs-eff b{color:var(--ash);margin-right:4px}
.qp-btn{font:inherit;font-size:11.5px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--stone-2);color:var(--ash-dim);cursor:pointer}
.qp-btn.ghost{background:transparent;opacity:.8}
.qp-btn:disabled{opacity:.35;cursor:default}
.qp-cond{font:inherit;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px dashed var(--line);background:transparent;color:var(--ash-mute);cursor:pointer}
.qp-cond.on{border-style:solid;border-color:var(--gilt);color:var(--gilt);background:var(--gilt-glow)}

    "lore": "every tether says why the Leader was bound; the app shows it when the tether is bound and on the Epitaph wall",
    "optional": true,
    "category": "narrative",
    "optionalNote": "story rule, off unless the table turns it on for a campaign; changes no points and nothing else depends on it"
  },
  "epitaphWall": {
    "desc": "A memorial page in the app for every Unburied who is gone.",
    "entryOn": [
      "dead on the Fate table",
      "tether snapped",
      "laid to rest"
    ],
    "stone": [
      "name",
      "epithets",
      "titles",
      "battles fought",
      "how they left",
      "a one-line epitaph the AI writes from their deeds, which the player may edit"
    ],
    "gilded": "laid-to-rest stones are gilded",
    "category": "narrative"
  }
}
</script>
<script>
/* ---- core-rules.js ---- */
/* ===================================================================
   RULESET LOADER — the JSON is the single source of truth.
   Nothing about the game is written in this file: dice, costs, gear,
   traits, powers, injuries and scenario rules all come from the ruleset.
   Everything is keyed by id; `name` is only ever a label to display.
   =================================================================== */
const RS_REQUIRED = ["meta","dice","stats","baseCost","minModelCost","surcharge",
  "activation","nerve","actions","reactions","strain","movement","shooting","melee",
  "damage","conditions","morale","squads","keywords","traits","abilities","weapons",
  "armour","items","powers","casting","injuries","campaign","scenario"];

let RS = null;            // the loaded ruleset
let RSX = null;           // indexes derived from it
let RS_ERRORS = [];

function rsFail(msg){ RS_ERRORS.push(msg); }

function loadRuleset(json){
  /* Validates loudly: a missing section or an unknown id is a hard error, not a
     silent default. Returns null and fills RS_ERRORS when the file is unusable. */
  RS_ERRORS = [];
  let r;
  try { r = (typeof json === "string") ? JSON.parse(json) : json; }
  catch(e){ rsFail("The ruleset is not valid JSON: " + e.message); return null; }

  RS_REQUIRED.forEach(k => { if(r[k] === undefined) rsFail("missing section: " + k); });
  if(RS_ERRORS.length) return null;

  const ver = String(r.meta.version || "");
  if(!/^\d+\.\d+(\.\d+)?$/.test(ver)) rsFail('meta.version must look like "0.8" or "0.8.1", got "' + ver + '"');

  // --- indexes, keyed by id
  const byId = (list, what) => {
    const m = {};
    (list || []).forEach(x => {
      if(!x || !x.id) return rsFail(what + ": an entry has no id");
      if(m[x.id]) rsFail(what + ": duplicate id " + x.id);
      m[x.id] = x;
    });
    return m;
  };
  const X = {
    ladder: (r.dice.ladder || []).map(d => +String(d).slice(1)),
    stat:   byId((r.stats || []).map(x => Object.assign({id:x.key}, x)), "stats"),
    trait:  byId(r.traits, "traits"),
    ability:byId(r.abilities, "abilities"),
    weapon: byId(r.weapons, "weapons"),
    armour: byId(r.armour, "armour"),
    item:   byId(r.items, "items"),
    power:  byId(r.powers, "powers"),
    keyword:byId(r.keywords, "keywords"),
    cond:   byId(r.conditions, "conditions"),
    objective: byId((r.scenario.victory || {}).objectiveTypes, "scenario.victory.objectiveTypes"),
    element:byId((r.scenario.budget || {}).costs, "scenario.budget.costs"),
    difficulty: byId(r.scenario.difficulty, "scenario.difficulty"),
    length: byId(r.scenario.lengths, "scenario.lengths")
  };
  if(!X.ladder.length) rsFail("dice.ladder is empty");

  // --- cross-references: every id a rule points at must exist
  (r.weapons || []).forEach(w => (w.keywords || []).forEach(k => {
    if(!X.keyword[k]) rsFail("weapon " + w.id + " uses unknown keyword " + k); }));
  (r.injuries || []).forEach(inj => (inj.replace || []).forEach(rep => {
    if(!(r.replacements || []).some(x => x.id === rep))
      rsFail("injury " + inj.id + " points at unknown replacement " + rep); }));
  ["fight","aim","will","wits","move","wounds","actions"].forEach(k => {
    if(!X.stat[k]) rsFail("stats is missing the " + k + " entry"); });

  if(RS_ERRORS.length) return null;
  RS = r; RSX = X;
  return r;
}

/* ---- dice helpers, all from the ladder in the file ---- */
/* The four attributes that are dice. Move, Health, Actions and Size are
   numbers or a list, and are handled on their own terms. */
const DIE_STATS = ["fight", "aim", "will", "wits"];
function dieNum(d){ return +String(d || "").slice(1) || 0; }
function dieName(n){ return "d" + n; }
function dieIndex(d){ return RSX.ladder.indexOf(dieNum(d)); }
function dieStep(d, n){
  const i = dieIndex(d) + n;
  if(i < 0) return null;                       // below the ladder: the test fails
  return dieName(RSX.ladder[Math.min(i, RSX.ladder.length - 1)]);
}
function statDefault(key){ return RSX.stat[key] ? RSX.stat[key].default : null; }

/* ---- Health comes from Size ----
   0.11 made a model's starting and maximum Health a property of how big it is,
   so nothing may read stats.wounds.default as a number any more. */
function sizeHealth(size){
  const tbl = ((RSX.stat.size || {}).health) || {};
  return tbl[size || "man"] || tbl.man || {start: 5, max: 13};
}
function startHealth(size){ return sizeHealth(size).start; }
function maxHealth(size){ return sizeHealth(size).max; }

/* ---- the cost engine, straight from the file ----
   baseCost + stat steps + Wounds + actions + traits/abilities/powers, with the
   surcharge applied in purchase order (the first `freeUpgrades` are clean, then
   each upgrade adds +(n-1)); gear and downgrades are excluded from the surcharge;
   never below minModelCost. */
function upgradeList(p){
  const ups = [];                              // [{label, cost}] in purchase order
  let flat = 0;
  ["fight","aim","will","wits"].forEach(k => {
    const st = RSX.stat[k];
    const cur = dieIndex(p[k] || st.default), base = dieIndex(st.default);
    for(let i = base; i < cur; i++) ups.push({label: st.name + " " + dieName(RSX.ladder[i+1]), cost: st.stepUpCosts[i - base]});
    for(let i = cur; i < base; i++) flat -= st.stepDownCost;
  });
  const mv = RSX.stat.move;
  const dm = (p.move === undefined ? mv.default : p.move) - mv.default;
  flat += (dm / mv.step) * mv.costPerStep;
  const wst = RSX.stat.wounds;
  const base = startHealth(p.size);                 // what this size starts with
  const w = (p.wounds === undefined ? base : p.wounds);
  const hStep = wst.upStep || 1, hCost = (wst.upCostPerStep !== undefined ? wst.upCostPerStep : wst.upCostEach);
  for(let v = base + hStep; v <= w; v += hStep) ups.push({label: wst.name + " " + v, cost: hCost});
  const odd = (w - base) % hStep;      // a Fate result or a scar can leave an odd point
  if(w > base && odd) ups.push({label: wst.name + " " + w, cost: Math.round(hCost / hStep)});
  for(let i = 0; i < base - w; i++) flat -= wst.downRefunds[Math.min(i, wst.downRefunds.length - 1)];
  const ast = RSX.stat.actions;
  const a = (p.actions === undefined ? ast.default : p.actions);
  for(let i = ast.default; i < a; i++) ups.push({label: "Action " + (i+1), cost: ast.upCosts[i - ast.default]});
  /* Resistances, vulnerabilities and Size are what make a creature a creature rather
     than a min-maxed fighter. The surcharge exists to stop stat stacking, so these are
     paid flat and never count toward the upgrade number. */
  const freeOfSurcharge = new Set([].concat((RS.traitTags||{}).resistances||[], (RS.traitTags||{}).vulnerabilities||[]));
  (p.traits || []).forEach(id => {
    const o = RSX.trait[id]; if(!o) return rsFail("unknown trait " + id);
    if(freeOfSurcharge.has(id)) flat += o.cost; else ups.push({label:o.name, cost:o.cost});
  });
  const sz = RSX.stat.size;
  if(sz && p.size && p.size !== sz.default) flat += (sz.costs||{})[p.size] || 0;

  /* A weakness offsets a nature; it is not free points. Refunds from Vulnerable traits
     cannot exceed what the model spent on resistances, Burning aura, Regenerate and
     weapon effects — otherwise you take Vulnerable to an element nobody uses and bank it. */
  const vulnIds = new Set(((RS.traitTags||{}).vulnerabilities)||[]);
  const resIds  = new Set(((RS.traitTags||{}).resistances)||[]);
  let vulnRefund = 0, natureSpend = 0;
  (p.traits || []).forEach(id => {
    const o = RSX.trait[id]; if(!o) return;
    if(vulnIds.has(id)) vulnRefund += -o.cost;
    else if(resIds.has(id) || id === "aura" || id === "regenerate") natureSpend += o.cost;
  });
  (p.weaponMods || []).forEach(id => { const m = RSX.wmod[id]; if(m) natureSpend += m.cost; });
  if(vulnRefund > natureSpend) flat += (vulnRefund - natureSpend);   // claw back the excess

  /* Flaws: capped in number and in total refund, and never surcharged. */
  const fc = (RS.flaws || {}).refundCap || {};
  const maxF = fc.maxFlaws === undefined ? 99 : fc.maxFlaws;
  let flawRefund = 0;
  (p.flaws || []).slice(0, maxF).forEach(id => { const o = (CAT.flaw||{})[id]; if(o) flawRefund += -o.cost; });
  if(fc.maxRefund !== undefined) flawRefund = Math.min(flawRefund, fc.maxRefund);
  flat -= flawRefund;
  (p.abilities || []).forEach(id => { const o = RSX.ability[id]; if(!o) return rsFail("unknown ability " + id); ups.push({label:o.name, cost:o.cost}); });
  (p.powers || []).forEach(id => { const o = RSX.power[id]; if(!o) return rsFail("unknown power " + id); ups.push({label:o.name, cost:o.cost}); });
  return {ups, flat};
}
function gearCost(p){
  let g = 0;
  (p.weapons || []).forEach(id => { const o = RSX.weapon[id]; if(o) g += o.cost; });
  (p.weaponMods || []).forEach(id => { const o = RSX.wmod[id]; if(o) g += o.cost; });
  if(p.armour){ const o = RSX.armour[p.armour]; if(o) g += o.cost; }
  (p.items || []).forEach(id => { const o = RSX.item[id]; if(o) g += o.cost; });
  return g;
}
function modelCost(p){
  const {ups, flat} = upgradeList(p);
  const sc = RS.surcharge;
  let total = RS.baseCost + flat;
  ups.forEach((u, i) => {
    const n = i + 1;
    total += u.cost + (n > sc.freeUpgrades ? (n - 1) * sc.perPriorUpgrade : 0);
  });
  return Math.max(RS.minModelCost, Math.round(total + gearCost(p)));
}
function costBreakdown(p){
  const {ups, flat} = upgradeList(p);
  const sc = RS.surcharge;
  const rows = [{label: "Base", cost: RS.baseCost}];
  if(flat) rows.push({label: "Move, size, downgrades and resistances", cost: flat});
  ups.forEach((u, i) => {
    const n = i + 1, extra = n > sc.freeUpgrades ? (n - 1) * sc.perPriorUpgrade : 0;
    rows.push({label: u.label + (extra ? " (+" + extra + " surcharge)" : ""), cost: u.cost + extra});
  });
  const g = gearCost(p);
  if(g){
    const mods = (p.weaponMods || []).reduce((n, id) => n + ((RSX.wmod[id] || {}).cost || 0), 0);
    if(mods){ rows.push({label: "Gear", cost: g - mods}); rows.push({label: "Weapon effects", cost: mods}); }
    else rows.push({label: "Gear", cost: g});
  }
  return {rows, total: modelCost(p)};
}
/* squads: per-model cost x size, less the discount; the floor applies per model first */
function squadCost(p, size){
  const per = Math.max(RS.minModelCost, modelCost(p));
  return Math.round(per * size * (1 - (RS.squads.squadDiscount || 0)));
}
function unitCostOf(u){
  return (u.size && u.size > 1) ? squadCost(u, u.size) : modelCost(u);
}
/* activations: 1 per full pointsPerActivation, capped; squads by size */
function activationsOf(u){
  const a = RS.activation;
  if(u.size && u.size >= RS.squads.minSize) return Math.max(1, Math.ceil(u.size / 3));
  const n = Math.floor(unitCostOf(u) / a.pointsPerActivation);
  return Math.max(a.minActivations, Math.min(a.maxActivations, n));
}


/* ---- app.js ---- */
/* =====================================================================
   EPITAPH
   Two halves. YOUR UNBURIED live on this device and are yours alone.
   THE REALM is the shared table: scenarios, and the person hosting them.

   The ruleset JSON is the only place the game is written down. Nothing
   about dice, costs, gear or rules is hard-coded below; if a value is not
   in the file, the app does not know it.
   ===================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uid = () => Math.random().toString(36).slice(2, 9);
const signed = n => (n >= 0 ? "+" : "−") + Math.abs(n);

/* ---------------------------------------------------------------- state */
const STORE_KEY = "ep_bands_v1";
let store = {bands: [], activeId: null, way: "unburied"};

function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(raw && Array.isArray(raw.bands)) store = Object.assign(store, raw);
  }catch(e){}
  if(!store.bands.length) store.bands = [newBand("The Unburied")];
  if(!store.bands.some(b => b.id === store.activeId)) store.activeId = store.bands[0].id;
  store.bands.forEach(mendBand);
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

function newBand(name){
  return {id: uid(), name: name || "The Unburied", budget: 500, members: [], sealed: false};
}
function band(){ return store.bands.find(b => b.id === store.activeId) || store.bands[0]; }

/* A model is only ever what the ruleset says a model is. Anything missing is
   filled from the file, never from a number written in this app. */
function newMember(){
  const h = ((RS.campaign || {}).hire || {}).baseProfile || {};
  const m = {
    id: uid(), name: "", epithet: "", role: "", story: "",
    fielded: true, count: 1,
    move: h.move !== undefined ? h.move : statDefault("move"),
    actions: h.actions !== undefined ? h.actions : statDefault("actions"),
    size: statDefault("size"),
    wounds: h.wounds !== undefined ? h.wounds : startHealth(statDefault("size")),
    traits: [], abilities: [], powers: [], flaws: [],
    weapons: [], armour: [], items: [], skins: {},
    /* Health as it stands now, one entry per model. null means untouched.
       A scenario writes here, so a model that was hurt stays hurt. */
    hp: null,
    /* Things picked up in a scenario. Kept apart from bought gear because
       finding something does not make the model cost more. */
    found: [],
    /* What the campaign left on them. Scars change what a model can do but
       never what it cost: a wound is not a discount. */
    scars: [], xp: 0
  };
  DIE_STATS.forEach(k => m[k] = h[k] || statDefault(k));
  return m;
}
/* Older saves, or a ruleset that has moved on, should not crash the app. */
function mendBand(b){
  b.members = (b.members || []).map(m => {
    const base = newMember();
    const out = Object.assign(base, m);
    out.id = m.id || base.id;
    DIE_STATS.forEach(k => { if(!RSX.ladder.includes(dieNum(out[k]))) out[k] = statDefault(k); });
    ["traits","abilities","powers","flaws"].forEach(k =>
      out[k] = (out[k] || []).filter(id => catOf(k)[id]));
    out.weapons = (out.weapons || []).filter(e => RSX.weapon[e.id])
      .map(e => ({id: e.id, qty: Math.max(1, e.qty || 1), mods: (e.mods || []).filter(x => RSX.wmod[x])}));
    out.armour = (out.armour || []).filter(id => RSX.armour[id.id || id]).map(id => id.id || id).slice(0, 1);
    out.items = (out.items || []).filter(e => RSX.item[e.id]).map(e => ({id: e.id, qty: Math.max(1, e.qty || 1)}));
    out.found = (out.found || []).filter(f => f && f.name).map(f => Object.assign({fid: f.fid || uid()}, f));
    out.scars = (out.scars || []).filter(x => x && x.name).map(x => Object.assign({iid: x.iid || uid()}, x));
    out.xp = Math.max(0, out.xp | 0);
    return out;
  });
  return b;
}

/* ---------------------------------------------------------------- catalogues
   Everything a player can pick comes from the ruleset, indexed by id. */
let CAT = {};
function catOf(kind){ return CAT[kind] || {}; }
function buildCatalogues(){
  const kw = ids => (ids || []).map(k => k.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase())).join(" · ");
  const map = (list, shape) => {
    const o = {};
    (list || []).forEach(x => o[x.id] = Object.assign(
      {id: x.id, name: x.name, cost: x.cost, examples: x.examples || null},
      shape ? shape(x) : {desc: x.desc || ""}));
    return o;
  };
  const tier = {};
  (RS.powerTiers || []).forEach(t => tier[t.id] = t);
  const order = id => (tier[id] && tier[id].order) || 99;

  CAT.traits    = map(RS.traits);
  CAT.abilities = map(RS.abilities);
  CAT.flaws     = map((RS.flaws || {}).list || []);
  CAT.items     = map(RS.items, x => ({desc: x.desc + (x.limited ? "  (" + x.limited + " use" + (x.limited > 1 ? "s" : "") + ")" : "")}));
  CAT.armour    = map(RS.armour, x => ({
    desc: [x.save ? "Save " + x.save : "", x.moveMod ? "Move " + signed(x.moveMod) + "cm" : "", x.desc || ""]
            .filter(Boolean).join(" · ")
  }));
  CAT.weapons   = map(RS.weapons, x => ({
    kind: x.type, range: x.range, damage: x.damage,
    desc: [x.type === "melee" ? "Melee" : "Ranged",
           x.range ? x.range + "cm" : null,
           x.damage + " damage",
           kw(x.keywords) || null].filter(Boolean).join(" · ")
  }));
  CAT.powers    = map(RS.powers.slice().sort((a, b) =>
      (order(a.tier) - order(b.tier)) || (a.cost - b.cost) || a.name.localeCompare(b.name)),
    x => {
      const t = tier[x.tier] || {short: x.tier, name: x.tier, blurb: ""};
      return {tier: x.tier,
        desc: [t.short + " (" + t.name + ")", (x.tags || []).join(", "), x.range ? x.range + "cm" : null]
                .filter(Boolean).join(" · ") + "\n" + t.blurb +
              (x.levels ? "\n" + x.levels.map(l => "L" + l.level + " " + l.desc).join("  ") : (x.desc ? "\n" + x.desc : ""))};
    });
  CAT.mods = map(RS.weaponMods || []);
  RSX.wmod = CAT.mods;
}

/* ---------------------------------------------------------------- costing
   The cost engine lives in core-rules and takes the ruleset's own shape,
   so the app's shape is translated once, here, and nowhere else. */
function profileOf(m){
  const p = {
    move: m.move, wounds: m.wounds, actions: m.actions, size: m.size,
    traits: m.traits || [], abilities: m.abilities || [],
    powers: m.powers || [], flaws: m.flaws || [],
    weapons: [], weaponMods: [], items: [], armour: (m.armour || [])[0] || null
  };
  DIE_STATS.forEach(k => p[k] = m[k]);
  (m.weapons || []).forEach(e => {
    for(let i = 0; i < (e.qty || 1); i++){
      p.weapons.push(e.id);
      (e.mods || []).forEach(x => p.weaponMods.push(x));
    }
  });
  (m.items || []).forEach(e => { for(let i = 0; i < (e.qty || 1); i++) p.items.push(e.id); });
  return p;
}
function memberCost(m){ return modelCost(profileOf(m)); }
function squadOf(m){ return Math.max(1, m.count || 1); }
function isSquad(m){ return squadOf(m) >= RS.squads.minSize; }
function unitCost(m){ return isSquad(m) ? squadCost(profileOf(m), squadOf(m)) : memberCost(m); }
function activationsOf(m){
  const a = RS.activation;
  if(isSquad(m)) return Math.max(1, Math.ceil(squadOf(m) / 3));
  return Math.max(a.minActivations, Math.min(a.maxActivations,
    Math.floor(unitCost(m) / a.pointsPerActivation)));
}
function fielded(m){ return m.fielded !== false; }
function bandSpent(b){ return b.members.filter(fielded).reduce((s, m) => s + unitCost(m), 0); }
function bandActs(b){ return b.members.filter(fielded).reduce((s, m) => s + activationsOf(m), 0); }

/* A model's own name for a piece of gear. Stats and cost always come from the
   id, so renaming something can never move a number. */
function skinOf(m, id, fallback){ return (m.skins && m.skins[id]) || fallback; }

/* ---- what a model has left ----
   Kept on the model, not in the battle tracker, because damage taken in a
   scenario belongs to the Unburied and should still be there afterwards. */
function healthOf(m){
  const n = squadOf(m), max = effWounds(m);
  let hp = Array.isArray(m.hp) ? m.hp.slice(0, n) : [];
  while(hp.length < n) hp.push(max);
  return hp.map(h => Math.max(0, Math.min(max, h | 0)));
}
function setHealth(m, hp){
  const max = effWounds(m);
  m.hp = hp.map(h => Math.max(0, Math.min(max, h | 0)));
  if(m.hp.every(h => h >= max)) m.hp = null;    // untouched again
  save();
}
function isHurt(m){ const max = effWounds(m); return healthOf(m).some(h => h < max); }
function standing(m){ return healthOf(m).filter(h => h > 0).length; }
function patchUp(m){ m.hp = null; save(); }

/* Size decides what a model starts and tops out at, so changing size moves its
   Health with it rather than leaving a number that no longer means anything. */
function setSize(m, size){
  const wasStart = startHealth(m.size), wasMax = maxHealth(m.size);
  const nowStart = startHealth(size), nowMax = maxHealth(size);
  const bought = m.wounds - wasStart;                   // steps paid for, kept
  m.size = size;
  m.wounds = Math.max(1, Math.min(nowMax, nowStart + bought));
  m.hp = null;
  save();
}

/* ---- what a model picked up ---- */
function giveFound(m, what){
  m.found = (m.found || []).concat([Object.assign({fid: uid()}, what)]);
  save();
}
function dropFound(m, fid){
  m.found = (m.found || []).filter(f => f.fid !== fid);
  save();
}
function effectiveMove(m){
  let v = m.move === undefined ? statDefault("move") : m.move;
  const a = (m.armour || [])[0];
  const o = a ? RSX.armour[a] : null;
  if(o && o.moveMod) v += o.moveMod;
  if(typeof scarMods === "function"){ const sm = scarMods(m); if(sm.move) v += sm.move; }
  return Math.max(1, v);
}

/* ---------------------------------------------------------------- chrome */
let toastT = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2100);
}
function openSheet(html, after){
  $("#sheetIn").innerHTML = html;
  $("#sheet").classList.add("show");
  $("#scrim").classList.add("show");
  document.body.classList.add("locked");
  if(after) after($("#sheetIn"));
}
function closeSheet(){
  $("#sheet").classList.remove("show");
  $("#scrim").classList.remove("show");
  document.body.classList.remove("locked");
}

/* ---------------------------------------------------------------- render */
function render(){
  const b = band();
  $("#rsVer").textContent = RS.meta.name + " · ruleset " + RS.meta.version;
  $$(".way").forEach(w => w.classList.toggle("on", w.dataset.way === store.way));
  $("#viewUnburied").hidden = store.way !== "unburied";
  $("#viewRealm").hidden = store.way !== "realm";
  if(store.way === "unburied") renderUnburied(b); else renderRealm();
  save();
}

function renderUnburied(b){
  const spent = bandSpent(b), over = spent > b.budget;
  const pct = b.budget > 0 ? Math.min(100, spent / b.budget * 100) : 0;
  const nField = b.members.filter(fielded).length;

  $("#bandHead").innerHTML = `
    <div class="band">
      <input class="band-name" id="bandName" value="${esc(b.name)}" maxlength="42" spellcheck="false">
      <button class="iconbtn" id="bandCarry" aria-label="Carry this band out or bring one in" title="Carry out / bring in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="16" height="16">
          <path d="M12 3v11M8 10l4 4 4-4M4 17v3h16v-3"/></svg></button>
      <button class="btn sm ghost" id="bandAfter">After the battle</button>
      <button class="btn sm ghost" id="bandMenu">Bands</button>
    </div>
    <div class="gauge">
      <div class="gauge-line">
        <b class="${over ? "over" : ""}">${spent}</b>
        <span>of</span>
        <input class="input mono" id="bandBudget" value="${b.budget}" inputmode="numeric"
               style="width:76px;padding:3px 7px;font-size:13px;text-align:center">
        <span>points fielded</span>
        <span class="rule"></span>
        <span class="chip ${over ? "bad" : ""}">${over ? "over by " + (spent - b.budget) : (b.budget - spent) + " left"}</span>
      </div>
      <div class="bar"><i class="${over ? "over" : ""}" style="width:${pct}%"></i></div>
      <div class="gauge-line" style="margin-top:9px">
        <span class="chip">${nField} of ${b.members.length} fielded</span>
        <span class="chip">${bandActs(b)} activations a round</span>
        ${b.cash ? `<span class="chip gilt">${b.cash} Cash</span>` : ""}
        ${(b.reputation || 0) !== 0 ? `<span class="chip ${b.reputation > 0 ? "good" : "bad"}">${esc((repLevel(b) || {}).name || "")} ${signed(b.reputation)}</span>` : ""}
      </div>
    </div>`;

  $("#bandName").oninput = e => { b.name = e.target.value; save(); };
  $("#bandBudget").oninput = e => {
    b.budget = Math.max(0, parseInt(e.target.value.replace(/\D/g, ""), 10) || 0);
    renderUnburied(b);
  };
  $("#bandMenu").onclick = openBands;
  $("#bandCarry").onclick = openCarry;
  $("#bandAfter").onclick = openAfter;

  const qb = $("#questBar");
  qb.innerHTML = questOn() ? questBarHTML() : "";
  if(questOn()) questBarBind(qb);

  const list = $("#roster");
  list.innerHTML = "";
  if(!b.members.length){
    list.insertAdjacentHTML("beforeend", `
      <div class="empty" style="grid-column:1/-1">
        <div class="big">No one yet</div>
        <div class="quiet">The Unburied are what you make of them. Raise the first.</div>
      </div>`);
  }
  b.members.slice().sort((x, y) => (fielded(y) - fielded(x))).forEach(m => {
    const n = squadOf(m), cost = unitCost(m);
    const el = document.createElement("button");
    el.className = "marker" + (fielded(m) ? "" : " benched");
    el.innerHTML = `
      <div class="m-cost">${cost}<small>points</small></div>
      <span class="m-name">${esc(m.name) || "<span style='color:var(--ash-mute)'>Unnamed</span>"}</span>
      ${m.epithet ? `<span class="m-epithet">“${esc(m.epithet)}”</span>` : ""}
      ${m.role ? `<span class="m-role">${esc(m.role)}</span>` : ""}
      <div class="m-stats">
        ${DIE_STATS.map(k => `<div class="m-stat"><b>${esc(m[k])}</b><span>${esc(RSX.stat[k].name)}</span></div>`).join("")}
        <div class="m-stat"><b>${m.wounds}</b><span>${esc(RSX.stat.wounds.name)}</span></div>
      </div>
      <div class="m-foot">
        ${n > 1 ? `<span class="chip">squad ×${n}</span>` : ""}
        <span class="chip">${effectiveMove(m)}cm</span>
        <span class="chip">${activationsOf(m)} act</span>
        ${(m.scars || []).filter(x => x.scar).length ? `<span class="chip bad">${(m.scars || []).filter(x => x.scar).length} scar${(m.scars || []).filter(x => x.scar).length > 1 ? "s" : ""}</span>` : ""}
        ${m.xp ? `<span class="chip gilt">${m.xp} XP</span>` : ""}
        ${(m.found || []).length ? `<span class="chip good">${m.found.length} found</span>` : ""}
        ${isHurt(m) ? `<span class="chip bad">${healthOf(m).reduce((s2, h) => s2 + h, 0)}/${m.wounds * n} ${esc(RSX.stat.wounds.name.toLowerCase())}${n > 1 ? " · " + standing(m) + " standing" : ""}</span>` : ""}
        ${(m.flaws || []).length ? `<span class="chip bad">${m.flaws.length} flaw${m.flaws.length > 1 ? "s" : ""}</span>` : ""}
        <span class="rule"></span>
        <span class="chip ${fielded(m) ? "gilt" : ""}" data-field>${fielded(m) ? "fielded" : "benched"}</span>
      </div>`;
    el.onclick = ev => {
      if(ev.target.closest("[data-field]")){ m.fielded = !fielded(m); renderUnburied(b); return; }
      openCard(m.id);
    };
    list.appendChild(el);
  });
  const conj = document.createElement("button");
  conj.className = "marker add conjure";
  conj.hidden = true;
  conj.innerHTML = `<div class="plus">✦</div><span>Call something up</span>`;
  conj.onclick = openConjure;
  /* Only offered where there is something to answer: the artifact's own
     sampling, or an endpoint you have set. Elsewhere it stays hidden
     rather than sitting there dead. */
  /* Asked for lazily: the answer may take a moment to exist, and the tile
     simply appears when it does. */
  getAI().then(ai => { if(ai && conj.isConnected) conj.hidden = false; });
  const add = document.createElement("button");
  add.className = "marker add";
  add.innerHTML = `<div class="plus">†</div><span>Raise one of the Unburied</span>`;
  add.onclick = () => {
    const m = newMember();
    b.members.push(m); save();
    openMember(m.id);
  };
  list.appendChild(add);
  list.appendChild(conj);
}

/* ---------------------------------------------------------------- boot */
function boot(){
  const el = document.getElementById("rulesetJSON");
  const ok = loadRuleset(el ? el.textContent : "{}");
  if(!ok){
    document.body.innerHTML = `<div class="fatal">
      <h2>The ruleset would not load</h2>
      <p class="lead">Epitaph refuses to run on rules it cannot read, rather than guess at a value.</p>
      <ul>${RS_ERRORS.map(e => "<li>" + esc(e) + "</li>").join("")}</ul></div>`;
    return;
  }
  buildCatalogues();
  load();
  $$(".way").forEach(w => w.onclick = () => { store.way = w.dataset.way; render(); });
  $("#scrim").onclick = closeSheet;
  $("#scrim2").onclick = closePicker;
  render();
}

/* ---- member.js ---- */
/* =====================================================================
   RAISING ONE OF THE UNBURIED
   The editor. Every control it draws is described by the ruleset: the die
   ladder, what a step costs, what may be carried, what a flaw gives back.
   Nothing here decides a value.
   ===================================================================== */

let editId = null;
function editing(){ return band().members.find(m => m.id === editId); }

function openMember(id){
  editId = id;
  drawMember();
  $("#sheet").classList.add("show");
  $("#scrim").classList.add("show");
  document.body.classList.add("locked");
}
function redraw(){ drawMember(); renderUnburied(band()); save(); }

/* ---- a row with a stepper, used by every stat ---- */
function stepRow(o){
  return `
  <div class="srow">
    <div class="srow-l">
      <b>${esc(o.title)}</b>
      <span>${esc(o.sub)}</span>
    </div>
    <div class="srow-r">
      <div class="stepper">
        <button data-step="${o.key}|-1" ${o.down ? "" : "disabled"} aria-label="Lower ${esc(o.title)}">−</button>
        <span>${esc(o.value)}</span>
        <button data-step="${o.key}|1" ${o.up ? "" : "disabled"} aria-label="Raise ${esc(o.title)}">+</button>
      </div>
      <span class="srow-hint mono">${esc(o.hint)}</span>
    </div>
  </div>`;
}

function drawMember(){
  const m = editing(); if(!m) return closeSheet();
  const b = band();
  const cost = unitCost(m), bd = costBreakdown(profileOf(m));

  const dieRows = DIE_STATS.map(k => {
    const st = RSX.stat[k], cur = m[k];
    const i = RSX.ladder.indexOf(dieNum(cur));
    const iMin = RSX.ladder.indexOf(dieNum(st.min)), iMax = RSX.ladder.indexOf(dieNum(st.max));
    const iBase = RSX.ladder.indexOf(dieNum(st.default));
    const next = i < iBase ? st.stepDownCost : st.stepUpCosts[i - iBase];
    return stepRow({key: "die:" + k, title: st.name, sub: "from " + st.default + " · " + st.min + "–" + st.max,
      value: cur, down: i > iMin, up: i < iMax,
      hint: i >= iMax ? "max" : (next === undefined ? "—" : "next +" + next)});
  }).join("");

  const mv = RSX.stat.move, ws = RSX.stat.wounds, as = RSX.stat.actions, sz = RSX.stat.size;
  const wStep = ws.upStep || 1, wCost = ws.upCostPerStep !== undefined ? ws.upCostPerStep : ws.upCostEach;
  const hStart = startHealth(m.size), hMax = maxHealth(m.size);
  const armObj = (m.armour || [])[0] ? RSX.armour[m.armour[0]] : null;
  const bodyRows =
    stepRow({key: "move", title: mv.name,
      sub: mv.step + "cm a step · " + mv.costPerStep + " pts" +
           (armObj && armObj.moveMod ? " · armour " + signed(armObj.moveMod) + "cm" : ""),
      value: effectiveMove(m) + "cm", down: m.move > mv.min, up: m.move < mv.max, hint: "±" + mv.costPerStep}) +
    stepRow({key: "wounds", title: ws.name,
      sub: m.size + " starts at " + hStart + ", tops out at " + hMax +
           (wStep > 1 ? " · " + wCost + " a step of " + wStep : ""),
      value: m.wounds, down: m.wounds > ws.min, up: m.wounds < hMax,
      hint: m.wounds >= hMax ? "max" : "+" + wCost}) +
    stepRow({key: "actions", title: as.name, sub: "start " + as.default,
      value: m.actions, down: m.actions > as.min,
      up: m.actions < as.max && as.upCosts[m.actions - as.default] !== undefined,
      hint: as.upCosts[m.actions - as.default] !== undefined ? "+" + as.upCosts[m.actions - as.default] : "max"}) +
    (sz ? stepRow({key: "size", title: sz.name,
      sub: startHealth(m.size) + "–" + maxHealth(m.size) + " " + ws.name.toLowerCase() +
           " · " + ((sz.costs || {})[m.size] ? signed(sz.costs[m.size]) + " points" : "no change"),
      value: m.size.charAt(0).toUpperCase() + m.size.slice(1),
      down: sz.values.indexOf(m.size) > 0, up: sz.values.indexOf(m.size) < sz.values.length - 1,
      hint: (sz.costs || {})[m.size] ? signed(sz.costs[m.size]) : "free"}) : "");

  const n = squadOf(m), sq = RS.squads;
  const deploy = stepRow({key: "count", title: isSquad(m) ? "Squad" : "Alone",
    sub: isSquad(m) ? "one profile, " + n + " models · " + (sq.squadDiscount * 100) + "% together"
                    : "set " + sq.minSize + " or more to field a squad",
    value: n, down: n > 1, up: n < sq.maxSize, hint: n > 1 ? "×" + n : "—"});

  $("#sheetIn").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="mBack" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="eyebrow">One of the Unburied</div>
      <div class="m-cost" style="position:static">${cost}<small>points</small></div>
    </div>

    <div class="slab">
      <div class="field" style="margin-bottom:11px"><label>Name</label>
        <input class="input" id="fName" value="${esc(m.name)}" maxlength="42" placeholder="who were they"></div>
      <div class="field" style="margin-bottom:11px"><label>Epithet</label>
        <input class="input serif" id="fEpi" value="${esc(m.epithet)}" maxlength="42" placeholder="what they are called now"></div>
      <div class="field" style="margin-bottom:11px"><label>Role</label>
        <input class="input" id="fRole" value="${esc(m.role)}" maxlength="40" placeholder="what they do"></div>
      <div class="field"><label>Their story</label>
        <textarea class="input" id="fStory" rows="3" placeholder="how they came to be Unburied">${esc(m.story)}</textarea></div>
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">Attributes</span><span class="rule"></span>
        <span class="quiet mono">${RS.dice.ladder.join(" · ")}</span></div>
      ${dieRows}
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">Body</span><span class="rule"></span></div>
      ${bodyRows}
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">How it deploys</span><span class="rule"></span>
        <span class="chip gilt">${activationsOf(m)} activation${activationsOf(m) === 1 ? "" : "s"}</span></div>
      ${deploy}
      <p class="quiet" style="margin:9px 0 0">${isSquad(m)
        ? memberCost(m) + " each × " + n + ", less " + (sq.squadDiscount * 100) + "% — <b>" + unitCost(m) + " points</b>. Activates " +
          activationsOf(m) + " time" + (activationsOf(m) === 1 ? "" : "s") + " a round, up to three models each time. Coherency " + sq.coherency + "cm."
        : "One activation per " + RS.activation.pointsPerActivation + " points, up to " + RS.activation.maxActivations + "."}</p>
    </div>

    ${gearSlab(m, "Weapons", "weapons")}
    ${gearSlab(m, "Armour", "armour")}
    ${gearSlab(m, "Carried", "items")}
    ${gearSlab(m, "Traits", "traits")}
    ${gearSlab(m, "Abilities", "abilities")}
    ${gearSlab(m, "Powers", "powers")}
    ${gearSlab(m, "Flaws", "flaws")}

    <div class="slab">
      <div class="head"><span class="eyebrow">What it costs</span><span class="rule"></span>
        <span class="chip gilt mono">${bd.total} points</span></div>
      ${bd.rows.map(r => `<div class="cost-row"><span>${esc(r.label)}</span><b class="mono ${r.cost < 0 ? "neg" : ""}">${signed(r.cost)}</b></div>`).join("")}
      ${n > 1 ? `<div class="cost-row"><span>Squad of ${n}, less ${(sq.squadDiscount * 100)}%</span><b class="mono">${unitCost(m)}</b></div>` : ""}
      <p class="quiet" style="margin:10px 0 0">The first ${RS.surcharge.freeUpgrades} upgrades cost list price; after that each
        adds +${RS.surcharge.perPriorUpgrade} for every upgrade already bought. Gear, size, resistances and flaws are exempt.</p>
    </div>

    <div class="sheet-actions">
      <button class="btn danger ghost" id="mDel">Lay to rest</button>
      <button class="btn primary" id="mDone">Done</button>
    </div>`;

  const root = $("#sheetIn");
  root.querySelector("#fName").oninput = e => { m.name = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fEpi").oninput = e => { m.epithet = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fRole").oninput = e => { m.role = e.target.value; renderUnburied(band()); save(); };
  root.querySelector("#fStory").oninput = e => { m.story = e.target.value; save(); };

  root.querySelectorAll("[data-step]").forEach(btn => btn.onclick = () => {
    const [key, dRaw] = btn.dataset.step.split("|"); const d = +dRaw;
    if(key.startsWith("die:")){
      const k = key.slice(4), st = RSX.stat[k];
      const nv = dieStep(m[k], d); if(!nv) return;
      const i = RSX.ladder.indexOf(dieNum(nv));
      if(i < RSX.ladder.indexOf(dieNum(st.min)) || i > RSX.ladder.indexOf(dieNum(st.max))) return;
      m[k] = nv;
    } else if(key === "move"){
      const nv = m.move + d * mv.step; if(nv < mv.min || nv > mv.max) return; m.move = nv;
    } else if(key === "wounds"){
      const nv = m.wounds + d * (d > 0 || m.wounds - wStep >= ws.default ? wStep : 1);
      if(nv < ws.min || nv > ws.max) return; m.wounds = nv;
    } else if(key === "actions"){
      const nv = m.actions + d; if(nv < as.min || nv > as.max) return; m.actions = nv;
    } else if(key === "size"){
      const i = sz.values.indexOf(m.size) + d; if(i < 0 || i >= sz.values.length) return;
      setSize(m, sz.values[i]);
    } else if(key === "count"){
      let nv = n + d;
      if(nv > 1 && nv < sq.minSize) nv = d > 0 ? sq.minSize : 1;
      m.count = Math.max(1, Math.min(sq.maxSize, nv));
    }
    redraw();
  });

  bindGear(root, m);
  root.querySelector("#mBack").onclick = closeSheet;
  root.querySelector("#mDone").onclick = closeSheet;
  root.querySelector("#mDel").onclick = () => {
    const b2 = band();
    b2.members = b2.members.filter(x => x.id !== m.id);
    closeSheet(); renderUnburied(b2); save();
    toast("Laid to rest");
  };
}

/* ---- gear, traits, powers and flaws all render the same way ---- */
const GEAR_KIND = {
  weapons:  {cat:"weapons",  qty:true,  single:false, reskin:true,  add:"Add a weapon"},
  armour:   {cat:"armour",   qty:false, single:true,  reskin:true,  add:"Wear armour"},
  items:    {cat:"items",    qty:true,  single:false, reskin:true,  add:"Carry something"},
  traits:   {cat:"traits",   qty:false, single:false, reskin:false, add:"Add a trait"},
  abilities:{cat:"abilities",qty:false, single:false, reskin:false, add:"Add an ability"},
  powers:   {cat:"powers",   qty:false, single:false, reskin:false, add:"Learn a power"},
  flaws:    {cat:"flaws",    qty:false, single:false, reskin:false, add:"Take a flaw"}
};
function gearSlab(m, label, field){
  const k = GEAR_KIND[field], cat = catOf(k.cat), arr = m[field] || [];
  const rows = arr.map(entry => {
    const id = k.qty ? entry.id : (entry.id || entry);
    const o = cat[id]; if(!o) return "";
    const shown = k.reskin ? skinOf(m, id, o.name) : o.name;
    const mods = k.qty && field === "weapons" ? (entry.mods || []) : [];
    const modCost = mods.reduce((s, x) => s + ((CAT.mods[x] || {}).cost || 0), 0);
    const price = k.qty ? (o.cost + modCost) * (entry.qty || 1) : o.cost;
    return `
    <div class="grow">
      <div class="grow-main">
        <div class="grow-name">${esc(shown)}
          ${k.reskin ? `<button class="tiny" data-skin="${field}|${esc(id)}" title="Call it something else">✎</button>` : ""}</div>
        ${shown !== o.name ? `<div class="grow-sub">${esc(o.name)}</div>` : ""}
        <div class="grow-sub">${esc(o.desc)}</div>
        ${field === "weapons" ? `
          <div class="mods">
            ${mods.map(x => { const mo = CAT.mods[x]; return mo ? `<span class="mod">${esc(mo.name)} <b>${mo.cost}</b><button data-modoff="${esc(id)}|${esc(x)}" aria-label="Remove">×</button></span>` : ""; }).join("")}
            ${Object.values(CAT.mods).filter(x => !mods.includes(x.id)).length ? `
              <select class="mod-add" data-modadd="${esc(id)}" aria-label="Add an effect">
                <option value="">+ effect…</option>
                ${Object.values(CAT.mods).filter(x => !mods.includes(x.id))
                  .map(x => `<option value="${esc(x.id)}">${esc(x.name)} +${x.cost} — ${esc(x.desc)}</option>`).join("")}
              </select>` : ""}
          </div>` : ""}
      </div>
      <div class="grow-r">
        <span class="mono ${o.cost < 0 ? "neg" : ""}">${k.qty ? price + " pts" : signed(price)}</span>
        ${k.qty ? `<div class="stepper sm">
            <button data-qty="${field}|${esc(id)}|-1" aria-label="fewer">−</button>
            <span>${entry.qty || 1}</span>
            <button data-qty="${field}|${esc(id)}|1" aria-label="more">+</button></div>` : ""}
        <button class="tiny" data-drop="${field}|${esc(id)}" aria-label="Remove">×</button>
      </div>
    </div>`;
  }).join("");
  const total = arr.reduce((s, e) => {
    const id = k.qty ? e.id : (e.id || e), o = cat[id]; if(!o) return s;
    const mods = (e.mods || []).reduce((t, x) => t + ((CAT.mods[x] || {}).cost || 0), 0);
    return s + (k.qty ? (o.cost + mods) * (e.qty || 1) : o.cost);
  }, 0);
  return `
  <div class="slab">
    <div class="head"><span class="eyebrow">${esc(label)}</span><span class="rule"></span>
      <span class="quiet mono">${arr.length ? (k.qty ? total + " pts" : signed(total)) : "—"}</span></div>
    ${rows || `<p class="quiet" style="margin:0">Nothing yet.</p>`}
    <button class="btn sm ghost" data-add="${field}" style="margin-top:10px">${esc(k.add)}</button>
  </div>`;
}

function bindGear(root, m){
  root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openPicker(m, b.dataset.add));
  root.querySelectorAll("[data-drop]").forEach(b => b.onclick = () => {
    const [field, id] = b.dataset.drop.split("|");
    const k = GEAR_KIND[field];
    m[field] = k.qty ? m[field].filter(e => e.id !== id) : m[field].filter(e => (e.id || e) !== id);
    if(m.skins) delete m.skins[id];
    redraw();
  });
  root.querySelectorAll("[data-qty]").forEach(b => b.onclick = () => {
    const [field, id, d] = b.dataset.qty.split("|");
    const e = m[field].find(x => x.id === id); if(!e) return;
    e.qty = Math.max(1, (e.qty || 1) + +d);
    redraw();
  });
  root.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => {
    const [field, id] = b.dataset.skin.split("|");
    askName(m, field, id);
  });
  root.querySelectorAll("[data-modoff]").forEach(b => b.onclick = () => {
    const [wid, mod] = b.dataset.modoff.split("|");
    const e = m.weapons.find(x => x.id === wid); if(!e) return;
    e.mods = (e.mods || []).filter(x => x !== mod);
    redraw();
  });
  root.querySelectorAll("[data-modadd]").forEach(sel => sel.onchange = () => {
    if(!sel.value) return;
    const e = m.weapons.find(x => x.id === sel.dataset.modadd); if(!e) return;
    e.mods = (e.mods || []).concat([sel.value]);
    redraw();
  });
}

/* ---- pickers.js ---- */
/* =====================================================================
   CHOOSING THINGS
   The picker lists whatever the ruleset holds for that kind, with its
   price and its own words. It also enforces the few limits the ruleset
   states outright: one suit of armour, so many flaws, uniques, squad-only.
   ===================================================================== */

let pickCtx = null;

function openPicker(m, field){
  const k = GEAR_KIND[field];
  pickCtx = {m, field, k, q: ""};
  drawPicker();
  $("#sheet2").classList.add("show");
  $("#scrim2").classList.add("show");
}
function closePicker(){
  $("#sheet2").classList.remove("show");
  $("#scrim2").classList.remove("show");
  pickCtx = null;
}

/* What the ruleset forbids, said plainly rather than silently ignored. */
function pickBlocked(m, field, o){
  const raw = (RS[field === "flaws" ? "flaws" : field] || {});
  if(field === "flaws"){
    const cap = ((RS.flaws || {}).refundCap || {});
    if(cap.maxFlaws !== undefined && (m.flaws || []).length >= cap.maxFlaws)
      return "Only " + cap.maxFlaws + " flaws on one model.";
    const taken = (m.flaws || []).reduce((s, id) => s + -((catOf("flaws")[id] || {}).cost || 0), 0);
    if(cap.maxRefund !== undefined && taken + -o.cost > cap.maxRefund)
      return "Flaws give back at most " + cap.maxRefund + " points; this would pass it.";
  }
  const src = (RS.traits || []).find(t => t.id === o.id);
  if(src){
    if(src.unique && (m.traits || []).includes(o.id)) return "Only one.";
    if(src.squadOnly && !isSquad(m)) return "Squads only — this one fields alone.";
    if(src.max && (m.traits || []).filter(x => x === o.id).length >= src.max)
      return "At most " + src.max + ".";
  }
  /* A weakness offsets a nature; it cannot simply be banked. */
  const vuln = ((RS.traitTags || {}).vulnerabilities) || [];
  if(vuln.includes(o.id)){
    const spendOn = ((RS.traitTags || {}).resistances || []).concat(["aura", "regenerate"]);
    const spent = (m.traits || []).reduce((s, id) => s + (spendOn.includes(id) ? (catOf("traits")[id] || {}).cost || 0 : 0), 0)
      + (m.weapons || []).reduce((s, w) => s + (w.mods || []).reduce((t, x) => t + ((CAT.mods[x] || {}).cost || 0), 0), 0);
    const already = (m.traits || []).reduce((s, id) => s + (vuln.includes(id) ? -((catOf("traits")[id] || {}).cost || 0) : 0), 0);
    if(already + -o.cost > spent)
      return "A weakness offsets a nature. Buy a resistance, an aura or a weapon effect first, or this gives nothing back.";
  }
  return null;
}

function drawPicker(){
  const {m, field, k, q} = pickCtx;
  const cat = catOf(k.cat);
  const chosen = new Set((m[field] || []).map(e => e.id || e));
  const all = Object.values(cat);
  const hay = o => (o.name + " " + (o.desc || "") + " " + (o.examples || []).join(" ")).toLowerCase();
  const list = q ? all.filter(o => hay(o).includes(q.toLowerCase())) : all;

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="pkX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="eyebrow">${esc(k.add)}</div>
      <span class="chip">${list.length}</span>
    </div>
    <input class="input" id="pkQ" placeholder="Search" value="${esc(q)}" style="margin-bottom:12px">
    <div class="picks">
      ${list.map(o => {
        const on = chosen.has(o.id);
        const why = on ? null : pickBlocked(m, field, o);
        return `
        <button class="pick ${on ? "on" : ""} ${why ? "no" : ""}" data-pick="${esc(o.id)}" ${why ? "disabled" : ""}>
          <div class="pick-main">
            <div class="pick-name">${esc(o.name)}${on ? ` <span class="chip gilt">taken</span>` : ""}</div>
            <div class="pick-desc">${esc(o.desc)}</div>
            ${o.examples ? `<div class="pick-eg">e.g. ${esc(o.examples.slice(0, 4).join(", "))}</div>` : ""}
            ${why ? `<div class="pick-no">${esc(why)}</div>` : ""}
          </div>
          <div class="pick-cost mono ${o.cost < 0 ? "neg" : ""}">${k.qty ? o.cost + " pts" : signed(o.cost)}</div>
        </button>`;
      }).join("") || `<p class="quiet">Nothing matches that.</p>`}
    </div>`;

  $("#pkX").onclick = closePicker;
  const qi = $("#pkQ");
  qi.oninput = e => { pickCtx.q = e.target.value; drawPicker(); $("#pkQ").focus(); };
  $("#sheet2In").querySelectorAll("[data-pick]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.pick, o = cat[id];
    const arr = m[field] = m[field] || [];
    if(k.qty){
      const e = arr.find(x => x.id === id);
      if(e) e.qty = (e.qty || 1) + 1;
      else arr.push({id, qty: 1, mods: []});
      toast(o.name + " taken");
    } else if(chosen.has(id)){
      m[field] = arr.filter(x => (x.id || x) !== id);
      if(m.skins) delete m.skins[id];
      toast(o.name + " dropped");
    } else {
      if(k.single){ arr.length = 0; if(m.skins) m.skins = {}; }
      arr.push(id);
      toast(o.name + " taken");
    }
    redraw(); drawPicker();
  });
}

/* ---- calling a thing by your own name for it ---- */
function askName(m, field, id){
  const cat = catOf(GEAR_KIND[field].cat), o = cat[id]; if(!o) return;
  const cur = (m.skins && m.skins[id]) || "";
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="skX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="eyebrow">Call it something else</div>
    </div>
    <p class="lead">This changes the name on this model only. The stats and the cost stay

    <div class="field" style="margin:14px 0"><label>${esc(o.name)}</label>
      <input class="input" id="skV" value="${esc(cur)}" placeholder="${esc(o.name)}" maxlength="40"></div>
    <div class="sheet-actions">

      <button class="btn primary" id="skGo">Rename</button>

  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");

/* ---- more than one band, because a person may keep several ---- */
function openBands(){
  const rows = store.bands.map(b => `
    <div class="grow">
      <button class="grow-main" data-band="${b.id}" style="text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer">
        <div class="grow-name">${esc(b.name)}${b.id === store.activeId ? ` <span class="chip gilt">open</span>` : ""}</div>
        <div class="grow-sub">${b.members.length} raised · ${bandSpent(b)} of ${b.budget} points fielded</div>
      </button>
      <div class="grow-r">
        <button class="tiny" data-bcopy="${b.id}" title="Copy">⧉</button>
        ${store.bands.length > 1 ? `<button class="tiny" data-bdel="${b.id}" aria-label="Delete">×</button>` : ""}
      </div>
    </div>`).join("");
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="bX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="eyebrow">Your bands</div>
    </div>
    ${rows}
    <button class="btn sm ghost" id="bNew" style="margin-top:12px">Begin another band</button>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#bX").onclick = closePicker;
  $("#sheet2In").querySelectorAll("[data-band]").forEach(b => b.onclick = () => {
    store.activeId = b.dataset.band; closePicker(); render();
  });
  $("#sheet2In").querySelectorAll("[data-bcopy]").forEach(b => b.onclick = () => {
    const src = store.bands.find(x => x.id === b.dataset.bcopy);
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid(); copy.name = src.name + " (again)";
    copy.members.forEach(m => m.id = uid());
    store.bands.push(copy); save(); openBands(); toast("Copied");
