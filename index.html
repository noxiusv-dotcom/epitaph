    const b = newBand("The Unburied");
    store.bands.push(b); store.activeId = b.id;
    closePicker(); render(); toast("A new band");
  };
}

/* ---- quest.js ---- */
/* =====================================================================
   THE QUEST
   A battle in progress. The app does not play the game; it remembers the
   things that are easy to lose track of across a table — Health on each
   model, Strain and its burnout number, Ready tokens, which units have
   activated, how many activate per turn, and how close a side is to
   breaking.

   It also keeps the secrets. Markers are numbered on the table and blank;
   what is under them lives here, and when a model walks into one, the app
   knows which model it was and deals with it.
   ===================================================================== */

const QUEST_KEY = "ep_quest_v1";
let Q = null;

function questLoad(){
  if(Q !== null) return Q;
  try{ Q = JSON.parse(localStorage.getItem(QUEST_KEY) || "null"); }catch(e){ Q = null; }
  return Q;
}
function questSave(){
  try{ localStorage.setItem(QUEST_KEY, JSON.stringify(Q)); }catch(e){}
  /* A shared quest publishes what this device owns and nothing else:
     a player their own models, the host the table as well. */
  if(Q && Q.realm && typeof pushMyUnits === "function"){
    try{ pushMyUnits(); if(Q.host) pushTable(); }catch(e){}
  }
}
function questOn(){ return !!questLoad(); }
function questEnd(){ Q = null; try{ localStorage.removeItem(QUEST_KEY); }catch(e){} }

/* ---- who is in it ---- */
function questUnitFrom(m){
  /* 0.11: every model comes back to full Health between battles. Lasting harm
     comes from Fate alone — carrying damage as well punishes a losing band
     twice and sends it into a spiral. The old behaviour is the Hard campaign
     rule, which a band can switch on. */
  const carry = !!band().hardCampaign;
  return {uid: m.id, side: "us", name: m.name || "Unnamed",
          models: carry ? healthOf(m) : Array.from({length: squadOf(m)}, () => effWounds(m)),
          max: m.wounds, acts: activationsOf(m), used: 0,
          strain: 0, ready: false, cond: [], pushed: false};
}
/* Anything that changes a unit's Health writes straight through to the model.
   The tracker is a view of the Unburied, not a separate set of numbers. */
function writeThrough(u){
  if(!u || u.remote || u.side !== "us") return;
  if(!band().hardCampaign) return;      // damage is a battle's business, not the band's
  const m = band().members.find(x => x.id === u.uid);
  if(m) setHealth(m, u.models);
}
function questFoe(name, count, health, acts, hidden){
  /* A hidden unit exists from the start of the scenario but is not on the
     table: it cannot be picked as a marker target and does not add to
     activation counts until something reveals it. */
  return {uid: "f" + uid(), side: "them", name: name || "Enemy",
          models: Array.from({length: count}, () => health),
          max: health, acts, used: 0, strain: 0, ready: false, cond: [],
          pushed: false, hidden: !!hidden};
}
/* Bring a held-back unit onto the table — a scenario event, a marker, or the
   host doing it by hand. */
function revealFoe(uidStr, why){
  const u = Q.units.find(x => x.uid === uidStr && x.hidden);
  if(!u) return null;
  u.hidden = false;
  qlog(u.name + " arrives" + (why ? " — " + why : ""));
  questSave();
  return u;
}

/* Whoever is running a sealed scenario judges when a trigger has happened
   and opens that envelope by hand — the conditions are plain English, not
   something the app can watch for on its own. */
function openEnvelope(eid){
  const m = Q.scenario && Q.scenario.mystery; if(!m) return null;
  const e = m.envelopes.find(x => x.eid === eid); if(!e || e.opened) return null;
  e.opened = true;
  qlog("Envelope — " + e.title);
  if(e.revealsObjectives && !Q.scenario.objectivesKnown){
    Q.scenario.objectivesKnown = true;
    qlog("The objectives are revealed");
  }
  questSave();
  return e;
}
function questUnit(m){ return Q ? Q.units.find(u => u.uid === m.id) : null; }
function unitDown(u){ return u.models.every(h => h <= 0); }
function unitStanding(u){ return u.models.filter(h => h > 0).length; }

function questBegin(size, opts){
  const b = band();
  const mine = b.members.filter(fielded);
  if(!mine.length){ toast("Field someone first"); return false; }
  Q = {round: 1, step: "tempo", size,
       nerve: {us: 0, them: 0}, vp: {us: 0, them: 0},
       units: mine.map(questUnitFrom),
       markers: rollMarkers(size, opts),
       log: []};
  questSave();
  return true;
}

/* ---- the ruleset's arithmetic ---- */
function sideActs(side){
  return Q.units.filter(u => u.side === side && !u.hidden && !unitDown(u)).reduce((s, u) => s + u.acts, 0);
}
function questGroups(){
  const a = sideActs("us"), b = sideActs("them");
  if(!a || !b) return {us: 1, them: 1, usTotal: a, themTotal: b};
  return a >= b ? {us: Math.ceil(a / b), them: 1, usTotal: a, themTotal: b}
                : {us: 1, them: Math.ceil(b / a), usTotal: a, themTotal: b};
}
function lostFraction(side){
  const us = Q.units.filter(u => u.side === side && !u.hidden);
  const start = us.reduce((s, u) => s + u.models.length, 0);
  const lost = us.reduce((s, u) => s + u.models.filter(h => h <= 0).length, 0);
  return start ? lost / start : 0;
}
function breakState(side){
  const f = lostFraction(side);
  const hit = RS.morale.break.thresholds.slice().sort((a, b) => b - a).find(t => f >= t);
  return {at: hit || 0, frac: f};
}
function qlog(s){ Q.log.unshift({r: Q.round, t: s}); Q.log = Q.log.slice(0, 50); }

/* ---- what happens to a model ---- */
function hurtUnit(u, amount, why){
  let left = amount;
  while(left > 0){
    const i = u.models.findIndex(h => h > 0);
    if(i < 0) break;
    const take = Math.min(u.models[i], left);
    u.models[i] -= take; left -= take;
    if(u.models[i] === 0) qlog(u.name + " — a model goes Down" + (why ? " (" + why + ")" : ""));
  }
  writeThrough(u);
  questSave();
}
function strainUnit(u, d){
  const st = RS.strain;
  u.strain = Math.max(0, u.strain + d);
  if(u.strain >= st.autoBurnoutAt){
    u.strain = 0;
    hurtUnit(u, st.burnoutEffect.damage, "burnout");
    qlog(u.name + " burns out at " + st.autoBurnoutAt + " Strain");
    toast("Burnout — " + st.burnoutEffect.damage + " damage, no save");
  }
  questSave();
}
function questStep(){
  if(Q.step === "tempo"){
    const gain = side => {
      let g = RS.nerve.perRound;
      if(Q.units.some(u => u.side === side && !unitDown(u) && (u.cond || []).includes("leader")))
        g += RS.nerve.leaderStandingBonus;
      return g;
    };
    Q.nerve.us = Math.min(RS.nerve.cap, Q.nerve.us + gain("us"));
    Q.nerve.them = Math.min(RS.nerve.cap, Q.nerve.them + gain("them"));
    Q.units.forEach(u => u.used = 0);
    Q.step = "acts";
    qlog("Round " + Q.round + " — Nerve gained, activations reset");
  } else if(Q.step === "acts"){
    Q.step = "end";
  } else {
    const endingRound = Q.round;      // the round whose End step this is, before it advances
    Q.units.forEach(u => {
      if((u.cond || []).includes("burning")) hurtUnit(u, 1, "burning");
      if((u.cond || []).includes("tainted")) hurtUnit(u, 1, "tainted");
      u.ready = false;
      if(!u.pushed && u.strain > 0) u.strain = Math.max(0, u.strain - RS.strain.restDecay.amount);
      u.pushed = false;
    });
    /* sealedRule, read literally: "revealed in the End step of round 2" —
       this round's own End step, not the one that rolls into round 2. */
    const sc2 = Q.scenario;
    if(sc2 && sc2.sealed && !sc2.objectivesKnown && endingRound >= 2){
      sc2.objectivesKnown = true;
      qlog("The objectives are revealed");
    }
    Q.round++; Q.step = "tempo";
    qlog("End of round — Burning and Tainted bite, Ready cleared, Strain rested");
    /* Anything the scenario keeps back for this round comes out now. Until it
       does, nobody can read it — that is the point of writing it down early. */
    const due = ((Q.scenario || {}).events || []).filter(e => !e.sprung && e.round <= Q.round);
    due.forEach(e => {
      e.sprung = true;
      qlog("Round " + e.round + " — " + e.title);
      if(e.effect && e.effect.type === "spawn"){
        const hid = Q.units.filter(u => u.side === "them" && u.hidden);
        const one = hid.find(u => (e.effect.who || "").toLowerCase().includes(u.name.toLowerCase())) || hid[0];
        if(one) revealFoe(one.uid, e.title);
      }
    });
    if(due.length) Q.pending = due.map(e => e.title);
  }
  questSave();
}

/* ---- markers: numbered on the table, known only here ---- */
function markerKinds(){
  const priced = id => (((RS.scenario.budget || {}).costs) || []).find(c => c.id === id) || {};
  return {
    trapVisible:  {label: "Trap", hurt: 2,
      sprung: priced("trapVisible").desc || "Wits test or 2 damage.",
      seen: "A trap, in plain view now. Go round it, or disarm it with Interact in contact (Wits; Tools step up)."},
    trapHidden:   {label: "Hidden trap", hurt: 2,
      sprung: "It springs. " + (priced("trapVisible").desc || "Wits test or 2 damage."),
      seen: "A hidden trap, now visible. Go round it, or disarm it with Interact in contact."},
    cache:        {label: "Cache", hurt: 0,
      sprung: "A cache. It pays out only when a model in contact spends Interact on it (Wits test).",
      seen: "A cache. Interact in contact to search it."},
    hiddenUnit:   {label: "Hidden enemy", hurt: 0,
      sprung: "Something was waiting here. Place it on the marker.",
      seen: "A hidden enemy. Place it on the marker — it has not acted."},
    ambushTrigger:{label: "Ambush", hurt: 0,
      sprung: "Ambush. The reserve arrives — place it as the scenario says.",
      seen: "An ambush trigger. Stepping within 5 cm brings the reserve in."},
    objective:    {label: "Objective", hurt: 0,
      sprung: "The objective is here.", seen: "The objective is here."},
    nothing:      {label: "Nothing", hurt: 0,
      sprung: "Nothing. Take the marker off the table.", seen: "A decoy. Take it off the table."}
  };
}
/* Marker limits, straight from scenario.secrets.limits rather than guessed:
     objective     exactly the battle type's count (+1 per player beyond the first),
                   only for a battle type that actually hides objectives
     ambushTrigger one per 250 points
     hiddenUnit    one per 250 points, sharing that pool with ambushes
     trap          one per 150 points, both kinds together
     cache         one per 250 points
     decoys        at least one, and at least a quarter of all markers
     total         max 8

   The battle type's own base objective count is not stated as a number
   anywhere in the file, so this reads it as 1 for any type that lists
   objectives at all (mystery lists none, so gets zero) \u2014 flagged here
   rather than silently assumed. */
function rollMarkers(size, opts){
  const type = (opts && opts.type) || null;
  const players = Math.max(1, (opts && opts.players) || 1);
  const n = Math.max(1, Math.min(8, Math.round(size / 100) || 1));

  const capTrap = Math.max(0, Math.floor(size / 150));
  const capAmbushHidden = Math.max(0, Math.floor(size / 250));      // shared pool
  const capCache = Math.max(0, Math.floor(size / 250));
  const usesHiddenObjective = !!(type && type.objectives && type.objectives.length);
  const capObjective = usesHiddenObjective ? (1 + (players - 1)) : 0;
  const minDecoys = Math.max(1, Math.ceil(n / 4));

  const want = ["trapVisible", "trapHidden", "cache", "hiddenUnit", "ambushTrigger", "objective"];
  const pool = [];
  let traps = 0, ambushHidden = 0, caches = 0, objectives = 0, spins = 0;
  const room = () => n - pool.length - minDecoys;
  while(room() > 0 && spins++ < 500){
    const pick = want[Math.floor(Math.random() * want.length)];
    if((pick === "trapVisible" || pick === "trapHidden") && traps >= capTrap) continue;
    if((pick === "hiddenUnit" || pick === "ambushTrigger") && ambushHidden >= capAmbushHidden) continue;
    if(pick === "cache" && caches >= capCache) continue;
    if(pick === "objective" && objectives >= capObjective) continue;
    if(pick === "trapVisible" || pick === "trapHidden") traps++;
    if(pick === "hiddenUnit" || pick === "ambushTrigger") ambushHidden++;
    if(pick === "cache") caches++;
    if(pick === "objective") objectives++;
    pool.push(pick);
  }
  while(pool.length < n) pool.push("nothing");
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.map((kind, i) => ({n: i + 1, kind, state: "hidden"}));
}

/* A model walked into it. The app knows which model, so a trap lands where
   it should rather than on whoever the table remembers last. */
function resolveMarker(num, uid){
  const mk = Q.markers.find(x => x.n === num); if(!mk) return null;
  const k = markerKinds()[mk.kind];
  const u = uid ? Q.units.find(x => x.uid === uid) : null;
  mk.state = mk.kind === "nothing" ? "gone" : "sprung";
  let extra = "";
  if(mk.kind === "ambushTrigger" || mk.kind === "hiddenUnit"){
    const hid = Q.units.find(x => x.side === "them" && x.hidden);
    if(hid){ revealFoe(hid.uid, "marker " + num); extra += " " + hid.name + " was waiting here."; }
  }
  if(k.hurt && u){
    if(u.remote && typeof sendEvent === "function"){
      /* Someone else's model: post what happened and let their app apply it. */
      sendEvent(u.uid, {damage: k.hurt, why: "marker " + num});
    } else {
      hurtUnit(u, k.hurt, "marker " + num);
    }
    extra = " " + u.name + " takes " + k.hurt + ".";
  }
  qlog("Marker " + num + " — " + k.label + (u ? ", triggered by " + u.name : ""));
  questSave();
  return {label: k.label, text: k.sprung + extra, hurt: k.hurt && u ? u.name : null};
}
function revealMarkers(nums){
  const out = [];
  nums.forEach(num => {
    const mk = Q.markers.find(x => x.n === num);
    if(!mk || mk.state === "gone") return;
    const k = markerKinds()[mk.kind];
    if(mk.state === "hidden") mk.state = mk.kind === "nothing" ? "gone" : "seen";
    out.push({n: num, label: k.label, text: k.seen});
  });
  qlog("Revealed " + nums.join(", ") + " without setting them off");
  questSave();
  return out;
}

/* ---- card.js ---- */
/* =====================================================================
   THE CARD
   This is the app. It is what you look at across a table instead of a
   printed sheet, so it has to answer one question fast: what can this
   model do right now?

   Everything it says is quoted from the ruleset in the ruleset's own
   words. Nothing is summarised, because a summary is the thing you end
   up looking up anyway.
   ===================================================================== */

let cardId = null;
function carded(){ return band().members.find(m => m.id === cardId); }

function openCard(id){
  cardId = id;
  drawCard();
  $("#sheet").classList.add("show");
  $("#scrim").classList.add("show");

/* One attack line per weapon: which die you roll, what it does, and
   whatever the model calls it. */
function attackHTML(m, e){
  const w = catOf("weapons")[e.id]; if(!w) return "";
  const ranged = w.kind === "ranged";
  const stat = ranged ? "aim" : "fight";
  const die = effDie(m, stat);            // after any scars
  const shown = skinOf(m, e.id, w.name);
  const mods = (e.mods || []).map(x => catOf("mods")[x]).filter(Boolean);
  return `
  <div class="atk">
    <div class="atk-top">
      <span class="atk-name">${ranged ? "➤" : "⚔"} ${esc(shown)}</span>
      <span class="atk-roll">${esc(RSX.stat[stat].name)} <b>${esc(die)}</b> <small>4+</small></span>
    </div>
    <div class="atk-line">${esc(w.desc)}${shown !== w.name ? ` · <span class="quiet">${esc(w.name)}</span>` : ""}</div>
    ${mods.length ? `<div class="atk-mods">${mods.map(x =>
      `<span class="mod"><b>${esc(x.name)}</b> ${esc(x.desc)}</span>`).join("")}</div>` : ""}
  </div>`;
}

/* A block of things that each have a name and their own words. */
function saysHTML(m, title, field, tone){
  const arr = m[field] || []; if(!arr.length) return "";
  const cat = catOf(GEAR_KIND[field].cat);

    ${arr.map(entry => {

      const o = cat[id]; if(!o) return "";
      const shown = GEAR_KIND[field].reskin ? skinOf(m, id, o.name) : o.name;
      return `<div class="says ${tone || ""}">
        <div class="says-n">${esc(shown)}${qty && (entry.qty || 1) > 1 ? ` ×${entry.qty}` : ""}

        <div class="says-d">${esc(o.desc)}</div>

      <div class="slab"><p class="quiet" style="margin:0">Unarmed. It has no weapon — edit to give it one.</p></div>`}

    ${saysHTML(m, "Traits", "traits")}
    ${saysHTML(m, "Abilities", "abilities")}

    ${m.story ? `<div class="slab"><div class="head"><span class="eyebrow">Their story</span><span class="rule"></span></div>
      <p class="serif" style="margin:0;font-size:14px;line-height:1.6;color:var(--ash-dim)">${esc(m.story)}</p></div>` : ""}

    <div class="sheet-actions">
      <span class="quiet">${n > 1 ? "Every model shares this profile." : ""}</span>

  const root = $("#sheetIn");

    toast("Left behind");
  });
  root.querySelectorAll("[data-hurt]").forEach(btn => btn.onclick = () => {
    const [what, i, d] = btn.dataset.hurt.split("|");
    if(what === "patch"){ patchUp(m); toast("Patched up"); }
    else { const hp = healthOf(m); hp[+i] = hp[+i] + +d; setHealth(m, hp); }

  root.querySelector("#cBack").onclick = closeSheet;

/* ---- ai.js ---- */
/* =====================================================================
   THE AI
   One way in, two possible backends. Today it is the artifact's own
   sampling; set AI_ENDPOINT and every AI feature moves to a server you
   run, without a line changing anywhere else.

   Whatever comes back is a suggestion. Every id is checked against the
   ruleset and the whole build is trimmed until it fits the points, so a
   hallucinated trait or an overspend never reaches the roster.
   ===================================================================== */

const AI_ENDPOINT = "";                 // e.g. "https://epitaph.<you>.workers.dev/ask"
function aiKey(){ try{ return localStorage.getItem("ep_aikey") || ""; }catch(e){ return ""; } }

let _ai, _aiTried = false;
/* The runtime that grants sampling is injected after the page's first scripts
   run, so asking the moment we boot finds nothing. Wait for it to turn up
   before deciding there is none — and never cache "no" just because it has
   not arrived yet, or the whole session is stuck with that answer. */
const AI_WAIT_MS = 10000, AI_POLL_MS = 120;
let _aiPending = null;
function claudeReady(){ return !!(window.claude && typeof window.claude.use === "function"); }

async function getAI(){
  if(_aiTried) return _ai;
  if(_aiPending) return _aiPending;
  _aiPending = (async () => {
    if(AI_ENDPOINT){ _ai = httpAI(AI_ENDPOINT); _aiTried = true; return _ai; }
    const until = Date.now() + AI_WAIT_MS;
    while(!claudeReady() && Date.now() < until){
      await new Promise(r => setTimeout(r, AI_POLL_MS));
    }
    if(!claudeReady()){ _ai = null; _aiTried = true; return null; }
    try{ _ai = await window.claude.use("sample"); }
    catch(e){ _ai = null; }
    _aiTried = true;
    return _ai;
  })();
  const got = await _aiPending;
  _aiPending = null;
  return got;
}
function httpAI(url){
  async function post(prompt, opts){
    let r;
    try{
      r = await fetch(url, {method:"POST",
        headers: Object.assign({"content-type":"application/json"}, aiKey() ? {authorization:"Bearer " + aiKey()} : {}),
        body: JSON.stringify({prompt, tier:(opts && opts.modelTier) || "default"})});
    }catch(e){ throw {code:"offline", message:"Could not reach the service."}; }
    if(!r.ok) throw {code: r.status === 401 || r.status === 403 ? "not_granted"
                         : r.status === 429 ? "rate_limited" : "error",
                     message:"The service answered " + r.status + "."};
    return String(((await r.json().catch(() => ({}))) || {}).text || "");
  }
  const ask = async (p, o) => { const text = await post(p, o); if(o && o.onText) o.onText({text}); return {text}; };
  ask.json = async (p, o) => {
    const text = await post(p, o);
    const m = text.match(/[\[{][\s\S]*[\]}]/);
    try{ return JSON.parse(m ? m[0] : text); }
    catch(e){ throw {code:"bad_json", message:"The reply was not valid JSON."}; }
  };
  return ask;
}
function aiTrouble(code){
  switch(code){
    case "not_granted": case "sampling_disabled": case "capability_disabled":
    case "not_declared": case "capability_removed":
      return "There is no AI behind this copy. It works in the version opened from claude.ai — you may be on the web address instead, where it stays dark until you point it at your own service.";
    case "rate_limited": return "Too many at once. Wait a moment and try again.";
    case "offline":      return "No answer from the service. Check the connection.";
    case "bad_json":     return "What came back was garbled. Try again.";
    case "cancelled":    return "";
    default:             return "That did not work. Try again.";
  }
}

/* ---- what the ruleset offers, written out for the model to choose from ---- */
function aiCatalogue(){
  const line = kind => Object.values(catOf(kind))
    .map(o => `${o.id} "${o.name}" (${o.cost})`).join(", ");
  const weapons = Object.values(catOf("weapons"))
    .map(o => `${o.id} "${o.name}" (${o.cost}; ${o.desc})`).join(", ");
  const mods = Object.values(catOf("mods"))
    .map(o => `${o.id} "${o.name}" (+${o.cost}: ${o.desc})`).join(", ");
  return `TRAITS: ${line("traits")}
ABILITIES: ${line("abilities")}
POWERS: ${line("powers")}
FLAWS (these give points back): ${line("flaws")}
WEAPONS: ${weapons}
WEAPON EFFECTS (any weapon may take some): ${mods}
ARMOUR: ${line("armour")}
CARRIED: ${line("items")}`;
}

/* ---- turn a suggestion into something legal ---- */
function aiLegalise(raw, budget){
  if(!raw || typeof raw !== "object") return null;
  const m = newMember();
  const st = raw.stats || {};
  DIE_STATS.forEach(k => {
    const conf = RSX.stat[k], i = RSX.ladder.indexOf(dieNum(String(st[k] || "").trim()));
    if(i < 0){ m[k] = conf.default; return; }
    const lo = RSX.ladder.indexOf(dieNum(conf.min)), hi = RSX.ladder.indexOf(dieNum(conf.max));
    m[k] = dieName(RSX.ladder[Math.max(lo, Math.min(hi, i))]);
  });
  const clamp = (v, conf, step) => {
    let n = Math.round(+v); if(!isFinite(n)) n = conf.default;
    if(step) n = conf.default + Math.round((n - conf.default) / step) * step;
    return Math.max(conf.min, Math.min(conf.max, n));
  };
  m.move    = clamp(st.move, RSX.stat.move, RSX.stat.move.step);
  m.actions = clamp(st.actions, RSX.stat.actions);
  if(RSX.stat.size && RSX.stat.size.values.includes(raw.size)) m.size = raw.size;
  /* Health is bounded by the size it just chose, not by a global default. */
  m.wounds = clamp(st.wounds, {default: startHealth(m.size), min: 1, max: maxHealth(m.size)},
                   RSX.stat.wounds.upStep || 1);

  const keep = (arr, kind, max) => [...new Set((Array.isArray(arr) ? arr : [])
    .map(x => (typeof x === "string" ? x : x && x.id))
    .filter(id => catOf(kind)[id]))].slice(0, max);
  m.traits    = keep(raw.traits, "traits", 4);
  m.abilities = keep(raw.abilities, "abilities", 3);
  m.powers    = keep(raw.powers, "powers", 3);
  m.flaws     = keep(raw.flaws, "flaws", ((RS.flaws || {}).refundCap || {}).maxFlaws || 2);

  (Array.isArray(raw.weapons) ? raw.weapons : []).slice(0, 3).forEach(x => {
    const id = typeof x === "string" ? x : x && x.id;
    if(!catOf("weapons")[id] || m.weapons.some(e => e.id === id)) return;
    const mods = [...new Set(((x && x.mods) || []).filter(v => catOf("mods")[v]))];
    m.weapons.push({id, qty: 1, mods});
    const as = (x && typeof x.as === "string") ? x.as.trim().slice(0, 40) : "";
    if(as && as.toLowerCase() !== catOf("weapons")[id].name.toLowerCase()) m.skins[id] = as;
  });
  if(catOf("armour")[raw.armour]) m.armour = [raw.armour];
  m.items = keep(raw.items, "items", 2).map(id => ({id, qty: 1}));

  /* Trim until it can be paid for: the trimmings go in the order a player
     would give things up, cheapest flavour first, their own dice last. */
  let guard = 80;
  while(memberCost(m) > budget && guard-- > 0){
    if(m.items.length){ m.items.pop(); continue; }
    const withMods = m.weapons.filter(w => w.mods.length);
    if(withMods.length){ withMods[withMods.length - 1].mods.pop(); continue; }
    if(m.powers.length){ m.powers.pop(); continue; }
    if(m.abilities.length){ m.abilities.pop(); continue; }
    if(m.armour.length){ m.armour = []; continue; }
    if(m.weapons.length > 1){ const g = m.weapons.pop(); delete m.skins[g.id]; continue; }
    const costly = m.traits.filter(id => catOf("traits")[id].cost > 0);
    if(costly.length){ m.traits.splice(m.traits.indexOf(costly[costly.length - 1]), 1); continue; }
    if(m.wounds > startHealth(m.size)){ m.wounds -= (RSX.stat.wounds.upStep || 1); continue; }
    if(m.actions > RSX.stat.actions.default){ m.actions--; continue; }
    const best = DIE_STATS.slice().sort((a, b) => dieNum(m[b]) - dieNum(m[a]))[0];
    if(dieNum(m[best]) > dieNum(RSX.stat[best].default)){ m[best] = dieStep(m[best], -1); continue; }
    if(m.weapons.length){ const g = m.weapons.pop(); delete m.skins[g.id]; continue; }
    break;
  }
  m.name = String(raw.name || "").trim().slice(0, 42);
  m.epithet = String(raw.epithet || "").trim().slice(0, 42);
  m.role = String(raw.role || "").trim().slice(0, 40);
  m.story = String(raw.story || "").trim();
  return m.name ? m : null;
}

    const prompt = `Invent 4 concepts for a single model in ${RS.meta.name}, a grim tabletop skirmish game.
A band is called the Unburied. A model can be anything: a person, a beast, a machine, an elemental, something worse.
Tone: ${tone}.
Brief: ${brief}.

For each, give: a name; an EPITHET (what others call them — short, like "the Quiet" or "Ashmouth"); a role in three words or fewer; and two or three sentences of story.

Also give a "build" that matches the story — a brawler fights, a marksman aims, a mystic has Will and powers, a coward takes a flaw.

STATS: fight, aim, will, wits are dice on the ladder ${RS.dice.ladder.join(", ")}, default ${statDefault("fight")}; stepping up costs points, stepping down gives a few back. Also move in cm (default ${statDefault("move")}, steps of ${RSX.stat.move.step}), ${RSX.stat.wounds.name.toLowerCase()} (default ${statDefault("wounds")}, bought in ${RSX.stat.wounds.upStep}s), actions (default ${statDefault("actions")}), size (${RSX.stat.size.values.join(", ")}).

GEAR IS NAMED BY WHAT IT DOES, NOT WHAT IT LOOKS LIKE. "${catOf("weapons").rifle ? catOf("weapons").rifle.name : "Long-range weapon"}" is a stat line: it can be a rifle, a longbow, or an acid-spitting maw. So for EVERY weapon, also give "as" — a name that fits THIS model. A drowned bell-ringer does not carry a "Melee weapon", it swings a "Rusted clapper". Never leave "as" out.

Flaws give points back and make a model more interesting. Use them.

Use ONLY these ids:
${aiCatalogue()}

Keep each build under ${budget} points. Make the four genuinely different.

Reply with ONLY a JSON array of 4 objects:
[{"name":"...","epithet":"...","role":"...","story":"...","build":{"stats":{"fight":"d8","aim":"d6","will":"d6","wits":"d6","move":12,"wounds":5,"actions":2},"size":"man","traits":["id"],"abilities":["id"],"powers":["id"],"flaws":["id"],"weapons":[{"id":"id","as":"its own name","mods":["id"]}],"armour":"id","items":["id"]}}]
No other text.`;

    try{
      const list = await ai.json(prompt, {modelTier:"default", cache:false, signal:aiAbort.signal});
      const made = (Array.isArray(list) ? list : []).map(x => {
        const m = aiLegalise(Object.assign({}, x.build, {
          name:x.name, epithet:x.epithet, role:x.role, story:x.story}), budget);
        return m;
      }).filter(Boolean);
      if(!made.length){ out.innerHTML = `<p class="quiet">Nothing came up. Try again.</p>`; }
      else out.innerHTML = made.map((m, i) => `
        <div class="pick" style="cursor:default;display:block">
          <div class="pick-name" style="font-family:'Cinzel',serif;font-size:15px">${esc(m.name)}</div>
          ${m.epithet ? `<div class="cardepi" style="font-size:14px;margin:3px 0 5px">“${esc(m.epithet)}”</div>` : ""}
          <div class="quiet">${esc(m.role)} · ${memberCost(m)} points</div>
          <div class="says-d" style="margin-top:6px">${esc(m.story)}</div>
          <div class="quiet" style="margin-top:7px">${esc(aiSummary(m))}</div>
          <button class="btn sm primary" data-take="${i}" style="margin-top:10px">Raise this one</button>
        </div>`).join("");
      out.querySelectorAll("[data-take]").forEach(btn => btn.onclick = () => {
        const m = made[+btn.dataset.take];
        band().members.push(m); save();
        closePicker(); render(); openCard(m.id);
        toast(m.name + " joins the Unburied");
      });
      go.textContent = "Raise four more";
    }catch(e){
      const msg = aiTrouble(e && e.code);
      out.innerHTML = msg ? `<p class="quiet">${esc(msg)}</p>` : "";
      go.textContent = "Raise four";
    }finally{ go.disabled = false; aiAbort = null; }
  };
}

function aiSummary(m){
  const nm = (arr, kind) => arr.map(id => (catOf(kind)[id] || {}).name).filter(Boolean);
  const parts = [DIE_STATS.map(k => RSX.stat[k].name + " " + m[k]).join(" · "),
                 m.wounds + " " + RSX.stat.wounds.name];
  const w = m.weapons.map(e => skinOf(m, e.id, (catOf("weapons")[e.id] || {}).name));
  if(w.length) parts.push(w.join(", "));
  const t = nm(m.traits, "traits").concat(nm(m.abilities, "abilities"), nm(m.powers, "powers"));
  if(t.length) parts.push(t.join(", "));
  const f = nm(m.flaws, "flaws");
  if(f.length) parts.push(f.join(", "));
  return parts.join("  ·  ");
}

/* ---- carry.js ---- */
/* =====================================================================
   CARRYING A BAND OUT
   Your Unburied live on this phone, which means a dead phone loses them.
   So a band can be written down as a code: short enough to paste into a
   message, complete enough to raise the whole band again somewhere else.

   The same code hands your band to whoever is running a game.
   ===================================================================== */

const CARRY_TAG = "EPITAPH1";

/* Only what differs from a fresh model is written down. A band of six comes
   out a few hundred characters rather than several thousand. */
function thin(m){
  const base = newMember(), out = {};
  Object.keys(m).forEach(k => {
    if(k === "id") return;
    const v = m[k], b = base[k];
    if(JSON.stringify(v) === JSON.stringify(b)) return;
    if(v === "" || v === null || v === undefined) return;
    if(Array.isArray(v) && !v.length) return;
    if(k === "skins" && !Object.keys(v || {}).length) return;
    out[k] = v;
  });
  return out;
}
function bandPayload(b){
  return {t: CARRY_TAG, rs: RS.meta.version, name: b.name, budget: b.budget,
          members: b.members.map(thin)};
}

/* gzip where the browser has it, which is most places now; plain where not.
   The prefix says which, so a code made on one device opens on another. */
async function packCode(obj){
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let body, mark = "R";
  if(typeof CompressionStream === "function"){
    try{
      const cs = new CompressionStream("gzip");
      const w = cs.writable.getWriter(); w.write(bytes); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      body = new Uint8Array(buf); mark = "Z";
    }catch(e){ body = bytes; }
  } else body = bytes;
  let s = ""; body.forEach(c => s += String.fromCharCode(c));
  return CARRY_TAG + mark + ":" + btoa(s);
}
async function unpackCode(code){
  const raw = String(code || "").trim().replace(/\s+/g, "");
  const m = raw.match(/^EPITAPH1([ZR]):(.+)$/);
  if(!m) throw new Error("That is not an Epitaph code.");
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  let json;
  if(m[1] === "Z"){
    const ds = new DecompressionStream("gzip");
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    json = await new Response(ds.readable).text();
  } else json = new TextDecoder().decode(bytes);
  const obj = JSON.parse(json);
  if(obj.t !== CARRY_TAG) throw new Error("That code is not from Epitaph.");
  return obj;
}

/* Whatever arrives is put through the same mending every saved band gets,
   so a code written against an older ruleset still opens. */
function adoptBand(obj){
  const b = newBand(obj.name || "The Unburied");
  b.budget = Math.max(0, parseInt(obj.budget, 10) || 500);
  b.members = (obj.members || []).map(m => Object.assign(newMember(), m, {id: uid()}));
  mendBand(b);
  return b;
}

    <p class="lead">Your Unburied live on this phone and nowhere else. This is how
      they leave it \u2014 to keep somewhere safe, to move to another phone, or to hand
      to whoever is running a game.</p>

    <div class="slab" style="margin-top:14px">
      <div class="head"><span class="eyebrow">${esc(b.name)}</span><span class="rule"></span>
        <span class="chip">${b.members.length} raised</span></div>
      <textarea class="input mono" id="cyCode" rows="4" readonly
        style="font-size:11px;line-height:1.4">${esc(code)}</textarea>
      <div class="sheet-actions" style="margin-top:10px">
        <button class="btn sm" id="cySave">Save a file</button>
        <button class="btn sm primary" id="cyCopy" style="margin-left:auto">Copy the code</button>
      </div>
      <p class="quiet" style="margin:9px 0 0">${code.length} characters \u00b7 written against ruleset ${esc(RS.meta.version)}</p>
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">Bring one in</span><span class="rule"></span></div>
      <p class="quiet" style="margin:0 0 9px">Paste a code and the band is raised alongside
        yours. Nothing you already have is touched.</p>
      <textarea class="input mono" id="cyIn" rows="3" placeholder="EPITAPH1Z:\u2026"
        style="font-size:11px;line-height:1.4"></textarea>
      <div class="sheet-actions" style="margin-top:10px">
        <label class="btn sm ghost" style="cursor:pointer">Open a file
          <input type="file" id="cyFile" accept=".json,.txt,application/json" hidden></label>
        <button class="btn sm primary" id="cyGo" style="margin-left:auto">Raise them</button>
      </div>
      <p class="quiet" id="cyMsg" style="margin:9px 0 0"></p>
    </div>`;

  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#cyX").onclick = closePicker;

  $("#cyCopy").onclick = async () => {
    const t = $("#cyCode");
    try{ await navigator.clipboard.writeText(code); toast("Copied"); }
    catch(e){ t.focus(); t.select(); toast("Select it and copy"); }
  };
  /* Two ways to hand over a file, because the two homes this app has differ.
     In an artifact the viewer grants the save; on a plain web page a link does
     it. If neither is possible the button says so rather than pretending. */
  $("#cySave").onclick = async () => {
    const name = (b.name || "unburied").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".json";
    const data = JSON.stringify(bandPayload(b), null, 2);
    let saver = null;
    try{ saver = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){}
    if(saver){
      try{ await saver.save({filename: name, data}); toast("Saved"); }
      catch(e){ toast("The save was declined"); }
      return;
    }
    try{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], {type: "application/json"}));
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Saved");
    }catch(e){ toast("Files cannot be saved here \u2014 copy the code instead"); }
  };

  const bring = async text => {
    const msg = $("#cyMsg");
    try{
      let obj;
      const t = String(text || "").trim();
      if(t.startsWith("{")) obj = JSON.parse(t);        // a saved file, pasted or opened
      else obj = await unpackCode(t);
      if(obj.t !== CARRY_TAG) throw new Error("That is not an Epitaph band.");
      const nb = adoptBand(obj);
      store.bands.push(nb); store.activeId = nb.id;
      save(); closePicker(); render();
      toast(nb.name + " raised \u2014 " + nb.members.length + " of them");
      if(obj.rs && obj.rs !== RS.meta.version)
        setTimeout(() => toast("Written against ruleset " + obj.rs + "; costs may differ"), 2400);
    }catch(e){
      msg.textContent = e.message || "That did not open.";
      msg.style.color = "var(--rust)";
    }
  };
  $("#cyGo").onclick = () => bring($("#cyIn").value);
  $("#cyFile").onchange = e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => bring(String(r.result));
    r.readAsText(f);
  };
}

/* ---- the live strip at the top of a card ---- */
function questStripHTML(m, u){
  const st = RS.strain, spent = u.used >= u.acts, down = unitDown(u);
  const conds = ["shaken", "pinned", "burning", "tainted", "marked", "stabilised"];
  const byId = {}; (RS.conditions || []).forEach(c => byId[c.id] = c);
  const effects = (u.cond || []).map(id => byId[id]).filter(Boolean);
  return `
  <div class="qstrip ${down ? "down" : ""}">
    <div class="qs-top">
      <span class="qs-round">Round ${Q.round}</span>
      <span class="chip ${spent ? "" : "gilt"}">${u.used}/${u.acts} used</span>
      ${u.models.length > 1 ? `<span class="chip">${unitStanding(u)}/${u.models.length} standing</span>` : ""}
      <button class="chip ${u.ready ? "good" : ""}" data-qp="ready">${u.ready ? "◉ Ready" : "○ Ready"}</button>
      ${u.strain ? `<span class="chip ${u.strain >= st.autoBurnoutAt - 1 ? "bad" : "gilt"}">Strain ${u.strain}</span>` : ""}
    </div>

    <div class="qs-hp">
      ${u.models.map((h, i) => `
        <span class="pip ${h <= 0 ? "dead" : h <= u.max * 0.5 ? "hurt" : ""}">
          <button data-qp="hp|${i}|-1" aria-label="Damage">−</button><b>${h}</b>
          <button data-qp="hp|${i}|1" aria-label="Heal">+</button></span>`).join("")}
    </div>

    <div class="qs-row">
      <button class="qp-btn" data-qp="act" ${spent || down ? "disabled" : ""}>Activate</button>
      <button class="qp-btn ghost" data-qp="unact" ${!u.used ? "disabled" : ""}>undo</button>
      <button class="qp-btn" data-qp="push" ${down ? "disabled" : ""}
        title="A push costs 1 Strain; you burn out if the Risk die rolls under it">Push</button>
      <button class="qp-btn ghost" data-qp="recover" ${!u.strain && !(u.cond || []).length ? "disabled" : ""}>Recover</button>
    </div>

    <div class="qs-conds">
      ${conds.map(id => `<button class="qp-cond ${(u.cond || []).includes(id) ? "on" : ""}"
        data-qp="cond|${id}">${id.charAt(0).toUpperCase() + id.slice(1)}</button>`).join("")}
    </div>

    ${effects.length || u.strain ? `<div class="qs-eff">
      ${effects.map(c => `<div><b>${c.id.charAt(0).toUpperCase() + c.id.slice(1)}</b> ${esc(c.desc)}</div>`).join("")}
      ${u.strain ? `<div><b>Strain ${u.strain}</b> ${u.strain >= st.autoBurnoutAt - 1
        ? "One more push and it burns out: " + st.burnoutEffect.damage + " damage, no save."
        : "Push again and the Risk die burns it out if it rolls under " + (u.strain + 1) + "."}</div>` : ""}
    </div>` : ""}
  </div>`;
}
function questBind(root, m){
  const u = questUnit(m); if(!u) return;
  root.querySelectorAll("[data-qp]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [what, a, c] = b.dataset.qp.split("|");
    if(what === "hp"){ u.models[+a] = Math.max(0, Math.min(u.max, u.models[+a] + +c)); writeThrough(u); }
    else if(what === "ready") u.ready = !u.ready;
    else if(what === "act")   u.used = Math.min(u.acts, u.used + 1);
    else if(what === "unact") u.used = Math.max(0, u.used - 1);
    else if(what === "push"){ u.pushed = true; strainUnit(u, 1); }
    else if(what === "recover"){
      /* One Recover: 1 Strain, or Shaken, or Pinned. Not all three. */
      if(u.strain > 0) u.strain--;
      else if((u.cond || []).includes("shaken")) u.cond = u.cond.filter(x => x !== "shaken");
      else if((u.cond || []).includes("pinned")) u.cond = u.cond.filter(x => x !== "pinned");
    }
    else if(what === "cond"){
      u.cond = u.cond || [];
      u.cond = u.cond.includes(a) ? u.cond.filter(x => x !== a) : u.cond.concat([a]);
    }
    questSave(); drawCard(); renderUnburied(band());
  });
}

      <p class="quiet" style="margin:0 0 9px">Pick one marker and whose model ended its move within 5 cm.
        Anything it does lands on that model.</p>
      <select class="input" id="mkWho" style="margin-bottom:10px">
        <option value="">no one in particular</option>
        ${standing.map(u => `<option value="${esc(u.uid)}" ${mkWho === u.uid ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
      </select>
      <div class="sheet-actions">
        <button class="btn primary" id="mkGo" ${one ? "" : "disabled"} style="margin-left:0">
          ${one ? "Walk into marker " + one : "Walk into marker …"}</button>
      </div>
    </div>

    ${Q.markers.some(m => m.kind === "cache" && m.state !== "hidden" && m.state !== "gone") ? `
    <div class="slab">
      <div class="head"><span class="eyebrow">A cache</span><span class="rule"></span></div>
      <p class="quiet" style="margin:0 0 9px">It pays out only when a model in contact spends
        Interact on it and passes a Wits test.</p>
      <div class="sheet-actions">
        ${Q.markers.filter(m => m.kind === "cache" && m.state !== "hidden" && m.state !== "gone")
          .map(m => `<button class="btn" data-search="${m.n}" style="margin-left:0">Search marker ${m.n}</button>`).join("")}
      </div>
    </div>` : ""}

    <div class="slab">
      <div class="head"><span class="eyebrow">Something looked</span><span class="rule"></span></div>
      <p class="quiet" style="margin:0 0 9px">Glimpse, Trapwise, or anything else that reveals.
        Pick every marker in range — they are revealed without going off.</p>
      <div class="sheet-actions">
        <button class="btn" id="mkSee" ${mkPicked.size ? "" : "disabled"} style="margin-left:0">
          ${mkPicked.size ? "Reveal " + [...mkPicked].sort((a, b) => a - b).join(", ") : "Reveal …"}</button>
      </div>
    </div>

    ${result && result.length ? `<div class="mkout">${result.map(r =>
      `<div class="mkres"><b>Marker ${r.n !== undefined ? r.n : one} — ${esc(r.label)}</b>
        <span>${esc(r.text)}</span></div>`).join("")}</div>` : ""}`;

  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#mkX").onclick = () => { mkPicked = new Set(); closePicker(); render(); };
  $("#sheet2In").querySelectorAll("[data-mk]").forEach(b => b.onclick = () => {
    const n = +b.dataset.mk;
    if(mkPicked.has(n)) mkPicked.delete(n); else mkPicked.add(n);
    openMarkers(result);
  });
  const who = $("#mkWho"); if(who) who.onchange = () => { mkWho = who.value || null; };
  const go = $("#mkGo");
  if(go) go.onclick = () => {
    const r = resolveMarker(one, mkWho);
    mkPicked = new Set();
    openMarkers(r ? [Object.assign({n: one}, r)] : null);
    render();
    if(r && r.hurt) toast(r.hurt + " takes it");
  };
  $("#sheet2In").querySelectorAll("[data-search]").forEach(b2 => b2.onclick = () => {
    mkPicked = new Set(); openSearch(+b2.dataset.search);
  });
  const see = $("#mkSee");
  if(see) see.onclick = () => {
    const out = revealMarkers([...mkPicked]);
    mkPicked = new Set();
    openMarkers(out); render();
  };
}

/* ---- searching a cache ----
   The ruleset pays a cache out with a d100 loot roll but does not say what the
   numbers mean, so the app rolls the die and whoever is running it says what
   turned up. What is found goes to the model that searched, and is kept apart
   from bought gear: finding something does not make a model cost more. */
let searchRoll = null, searchWho = null;
function openSearch(markerN){
  const standing = Q.units.filter(u => u.side === "us" && !unitDown(u));
  if(!searchWho && standing.length) searchWho = standing[0].uid;
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="seX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">Searching${markerN ? " marker " + markerN : ""}</div></div>
    <p class="lead">A cache pays out only when a model in contact spends Interact on it
      and passes a Wits test. Then roll ${RS.dice.lootDie} for what is in it.</p>

    <div class="slab" style="margin-top:14px">
      <div class="field" style="margin-bottom:11px"><label>Who searched it</label>
        <select class="input" id="seWho">
          ${standing.map(u => `<option value="${esc(u.uid)}" ${searchWho === u.uid ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
        </select></div>
      <div class="sheet-actions" style="margin-bottom:11px">
        <button class="btn" id="seRoll" style="margin-left:0">Roll ${RS.dice.lootDie}</button>
        ${searchRoll ? `<span class="chip gilt mono" style="font-size:15px">${searchRoll}</span>` : ""}
      </div>
      <div class="field" style="margin-bottom:11px"><label>What they found</label>
        <input class="input" id="seName" maxlength="50" placeholder="a coil of wire, a wet ledger, someone's teeth"></div>
      <div class="field" style="margin-bottom:11px"><label>Or something from the list</label>
        <select class="input" id="seItem">
          <option value="">nothing from the list</option>
          ${Object.values(catOf("items")).map(o => `<option value="${esc(o.id)}">${esc(o.name)} \u2014 ${esc(o.desc)}</option>`).join("")}
        </select></div>
      <div class="field"><label>A note, if it needs one</label>
        <input class="input" id="seNote" maxlength="90" placeholder="what it does, or where it came from"></div>
      <div class="sheet-actions" style="margin-top:12px">
        <button class="btn primary" id="seGive" style="margin-left:0">They take it</button></div>
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#seX").onclick = () => { searchRoll = null; closePicker(); render(); };
  $("#seWho").onchange = e => searchWho = e.target.value;
  $("#seRoll").onclick = () => {
    searchRoll = 1 + Math.floor(Math.random() * (dieNum(RS.dice.lootDie) || 100));
    searchWho = $("#seWho").value;
    openSearch(markerN);
  };
  $("#seGive").onclick = () => {
    const uidSel = $("#seWho").value;
    const u = Q.units.find(x => x.uid === uidSel);
    const itemId = $("#seItem").value;
    const listed = itemId ? catOf("items")[itemId] : null;
    const name = ($("#seName").value.trim()) || (listed ? listed.name : "");
    if(!name && !listed){ toast("Say what they found"); return; }
    const what = {name: name || listed.name, id: itemId || null,
                  note: $("#seNote").value.trim() || (listed ? listed.desc : ""),
                  roll: searchRoll || null, from: markerN ? "marker " + markerN : "the field"};
    if(u && u.remote && typeof sendEvent === "function"){
      sendEvent(u.uid, {found: what, why: "found " + what.name});
    } else {
      const m = band().members.find(x => x.id === uidSel);
      if(m) giveFound(m, what);
    }
    qlog((u ? u.name : "Someone") + " found " + what.name + (searchRoll ? " (" + RS.dice.lootDie + " " + searchRoll + ")" : ""));
    searchRoll = null;
    questSave(); closePicker(); render();
    toast((u ? u.name : "They") + " take " + what.name);
  };
}

/* ---- starting one ---- */
function openQuestStart(){
  const b = band();
  /* Game size is what the PLAYERS bring, summed across everyone at the table.
     The enemy is then sized from it: enemy points = game size x difficulty.
     In a campaign the ruleset bases it on the band's current total points,
     so it grows as they do rather than sitting at a fixed number. */
  const mine = bandSpent(b);
  const st = questStartState || (questStartState = {mine, others: 0, difficulty: "standard"});
  const size = st.mine + st.others;
  const diff = (RS.scenario.difficulty || []).find(d => d.id === st.difficulty) || {enemyPct: 1, reward: 1};
  const enemy = Math.round(size * diff.enemyPct);

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="qsX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">Take them out</div></div>
    <p class="lead">Everyone fielded goes. The app rolls suspicion markers for the table
      and keeps what is under them to itself.</p>

    <div class="slab" style="margin-top:14px">
      <div class="head"><span class="eyebrow">Game size</span><span class="rule"></span>
        <span class="chip gilt mono">${size}</span></div>
      <p class="quiet" style="margin:0 0 11px">What the players bring between them \u2014 yours,
        plus anyone else at the table.</p>
      <div class="grow">
        <div class="grow-main"><div class="grow-name">Your Unburied, fielded</div>
          <div class="grow-sub">${b.members.filter(fielded).length} of ${b.members.length}</div></div>
        <div class="grow-r"><span class="mono">${st.mine}</span></div>
      </div>
      <div class="field" style="margin-top:11px"><label>Other players, between them</label>
        <input class="input mono" id="qsOthers" inputmode="numeric" value="${st.others}"></div>
    </div>

    <div class="slab">
      <div class="head"><span class="eyebrow">Difficulty</span><span class="rule"></span></div>
      <div class="sheet-actions" style="flex-wrap:wrap;gap:7px;margin-bottom:11px">
        ${(RS.scenario.difficulty || []).map(d => `
          <button class="btn sm ${d.id === st.difficulty ? "primary" : "ghost"}" data-diff="${esc(d.id)}"
            style="margin-left:0">${d.id.charAt(0).toUpperCase() + d.id.slice(1)}</button>`).join("")}
      </div>
      <div class="grow">
        <div class="grow-main"><div class="grow-name">What you face</div>
          <div class="grow-sub">${size} \u00d7 ${diff.enemyPct} \u00b7 up to ${Math.round((RS.scenario.budget.maxPct || 0) * 100)}% of it
            may be traps, hazards and set pieces instead of models</div></div>
        <div class="grow-r"><span class="mono" style="font-size:16px;color:var(--gilt)">${enemy}</span></div>
      </div>
      <div class="grow">
        <div class="grow-main"><div class="grow-name">Pays</div>
          <div class="grow-sub">a win is worth ${diff.reward}\u00d7</div></div>
        <div class="grow-r"><span class="mono">\u00d7${diff.reward}</span></div>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn primary" id="qsGo" style="margin-left:0" ${size ? "" : "disabled"}>
        ${size ? "Begin" : "Field someone first"}</button></div>`;

  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#qsX").onclick = () => { questStartState = null; closePicker(); };
  $("#qsOthers").oninput = e => {
    st.others = Math.max(0, parseInt(e.target.value.replace(/\D/g, ""), 10) || 0);
    openQuestStart();
  };
  $("#sheet2In").querySelectorAll("[data-diff]").forEach(bn => bn.onclick = () => {
    st.difficulty = bn.dataset.diff; openQuestStart();
  });
  $("#qsGo").onclick = () => {
    if(!size) return;
    if(questBegin(size)){
      Q.difficulty = st.difficulty;
      Q.enemyPoints = enemy;
      Q.reward = diff.reward;
      questSave();
      questStartState = null;
      closePicker(); render();
      toast("The quest begins \u2014 open a card to run it");
    }
  };
}
let questStartState = null;

/* ---- enemies, entered by whoever is running it ---- */
function openFoes(){
  const foes = Q.units.filter(u => u.side === "them" && !u.hidden);
  const waiting = Q.units.filter(u => u.side === "them" && u.hidden);
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="feX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">The enemy</div></div>
    ${foes.length ? foes.map(u => `
      <div class="slab">
        <div class="head"><span class="eyebrow">${esc(u.name)}</span><span class="rule"></span>
          <span class="chip">${u.used}/${u.acts} used</span>
          <button class="tiny" data-fdel="${esc(u.uid)}" aria-label="Remove">×</button></div>
        <div class="qs-hp">${u.models.map((h, i) => `
          <span class="pip ${h <= 0 ? "dead" : h <= u.max * 0.5 ? "hurt" : ""}">
            <button data-fhp="${esc(u.uid)}|${i}|-1">−</button><b>${h}</b>
            <button data-fhp="${esc(u.uid)}|${i}|1">+</button></span>`).join("")}</div>
        ${u.profile ? `<div class="says-d" style="margin-bottom:7px">${esc(enemyLine(u.profile))}</div>` : ""}
        ${(u.protocol || []).length ? `<div class="says-d quiet" style="margin-bottom:7px">${u.protocol.map(esc).join(" · ")}</div>` : ""}
        <div class="qs-row" style="margin-top:9px">
          <button class="qp-btn" data-fact="${esc(u.uid)}" ${u.used >= u.acts ? "disabled" : ""}>Activate</button>
          <button class="qp-btn ghost" data-funact="${esc(u.uid)}" ${!u.used ? "disabled" : ""}>undo</button>
        </div>
      </div>`).join("") : `<p class="quiet">Nothing against you yet.</p>`}

    ${waiting.length ? `<div class="slab">
      <div class="head"><span class="eyebrow">Held back</span><span class="rule"></span>
        <span class="quiet">not on the table yet</span></div>
      ${waiting.map(u => `<div class="grow"><div class="grow-main">
        <div class="grow-name">Something unseen</div>
        <div class="grow-sub">${esc(u.hint || "what it is stays unknown until it reveals itself")}</div></div>
        <div class="grow-r"><button class="btn sm" data-freveal="${esc(u.uid)}">Bring them on</button></div>
      </div>`).join("")}
    </div>` : ""}

    <div class="slab">
      <div class="head"><span class="eyebrow">Add one</span><span class="rule"></span></div>
      <div class="field" style="margin-bottom:9px"><label>Name</label>
        <input class="input" id="feName" placeholder="Scav pack" maxlength="40"></div>
      <div class="row3">
        <div class="field"><label>Models</label><input class="input mono" id="feN" inputmode="numeric" value="1"></div>
        <div class="field"><label>${esc(RSX.stat.wounds.name)}</label><input class="input mono" id="feH" inputmode="numeric" value="${statDefault("wounds")}"></div>
        <div class="field"><label>Acts</label><input class="input mono" id="feA" inputmode="numeric" value="1"></div>
      </div>
      <div class="sheet-actions"><button class="btn primary" id="feGo" style="margin-left:0">Add</button></div>
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#feX").onclick = () => { closePicker(); render(); };
  const num = id => Math.max(1, parseInt(($("#" + id).value || "").replace(/\D/g, ""), 10) || 1);
  $("#feGo").onclick = () => {
    Q.units.push(questFoe($("#feName").value.trim(), num("feN"), num("feH"), num("feA")));
    qlog("Enemy joined: " + ($("#feName").value.trim() || "Enemy"));
    questSave(); openFoes(); render();
  };
  const bind = (sel, fn) => $("#sheet2In").querySelectorAll(sel).forEach(b => b.onclick = () => { fn(b); questSave(); openFoes(); render(); });
  bind("[data-fdel]", b => Q.units = Q.units.filter(u => u.uid !== b.dataset.fdel));
  bind("[data-freveal]", b => revealFoe(b.dataset.freveal, "brought on"));
  bind("[data-fact]", b => { const u = Q.units.find(x => x.uid === b.dataset.fact); u.used = Math.min(u.acts, u.used + 1); });
  bind("[data-funact]", b => { const u = Q.units.find(x => x.uid === b.dataset.funact); u.used = Math.max(0, u.used - 1); });
  bind("[data-fhp]", b => {
    const [uid, i, d] = b.dataset.fhp.split("|");
    const u = Q.units.find(x => x.uid === uid);
    u.models[+i] = Math.max(0, Math.min(u.max, u.models[+i] + +d));
  });
}

/* How many of the scenario's events have just come out and not been read. */
function questDue(){
  return ((Q.scenario || {}).events || []).filter(e => e.sprung && !e.read).length;
}

      ${s.twist ? `<div class="grow"><div class="grow-main"><div class="grow-name">Later</div>

    openEnvelope(b.dataset.envelope);
    openBrief(); render();
  });
  $("#sheet2In").querySelectorAll("[data-spring]").forEach(b => b.onclick = () => {
    const e = events.find(x => x.round === +b.dataset.spring && !x.sprung);
    if(!e) return;
    e.sprung = true; qlog("Sprung early \u2014 " + e.title);
    questSave(); openBrief(); render();
  });
}

/* ---- campaign.js ---- */
/* =====================================================================
   AFTER THE BATTLE
   What a scenario leaves behind. A model taken Down rolls Fate on a d20:
   most of the time it walks it off, sometimes it keeps something for good.
   A scar is not a number in a ledger — it changes what the model can do,
   and it earns a name.

   Every roll, every effect and every price here is read from the ruleset.
   ===================================================================== */

const INJ = () => RS.injuries || [];
function injuryFor(roll){
  return INJ().find(i => roll >= i.roll[0] && roll <= i.roll[1]) || null;
}
function d20(){ return 1 + Math.floor(Math.random() * 20); }

/* Stabilised rolls two and keeps the higher, Marked two and keeps the lower,
   and one cancels the other. */
function rollFate(mode){
  const a = d20();
  if(mode === "plain") return {roll: a, dice: [a]};
  const b = d20();
  const keep = mode === "advantage" ? Math.max(a, b) : Math.min(a, b);
  return {roll: keep, dice: [a, b]};
}
function fateMode(stabilised, marked){
  if(RS.fateRules.cancel && stabilised && marked) return "plain";
  if(stabilised) return "advantage";
  if(marked) return "disadvantage";
  return "plain";
}

/* ---- what a scar does to a model ----
   Scars change what a model can do but never what it cost. A wound is not a
   discount, and re-pricing a band mid-campaign because someone lost an eye
   would be a nasty surprise. */
function scarMods(m){
  const out = {};
  (m.scars || []).forEach(s => {
    Object.keys(s.mods || {}).forEach(k => {
      if(typeof s.mods[k] === "number") out[k] = (out[k] || 0) + s.mods[k];
      else out[k] = s.mods[k];
    });
  });
  return out;
}
function effDie(m, key){
  const mods = scarMods(m);
  let d = m[key];
  if(mods[key]) d = dieStep(d, mods[key]) || d;
  return d;
}
function effWounds(m){
  const mods = scarMods(m);
  return Math.max(1, m.wounds + (mods.wounds || 0));
}
function scarNotes(m){
  const mods = scarMods(m), out = [];
  if(mods.noSprint) out.push("cannot Sprint");
  if(mods.noTwoHanded) out.push("no two-handed weapons");
  if(mods.noShield) out.push("no shield");
  if(mods.startStrain) out.push("starts every battle with " + mods.startStrain + " Strain");
  return out;
}

/* ---- the roll ---- */
function applyInjury(m, inj, roll){
  const rec = {iid: uid(), id: inj.id, name: inj.name, roll,
               effect: inj.effect || "", mods: inj.mods || null,
               scar: !!inj.scar, hooks: inj.epithetHooks || [],
               mend: inj.mend || null, replace: inj.replace || []};
  if(inj.id === "dead"){ rec.dead = true; }
  /* The bought profile is never touched. A Health change from an injury is a
     scar modifier, applied by effWounds — writing it into m.wounds would both
     double-count it and quietly re-price the model. */
  if(inj.id === "bruisedButWiser" || /\+1 XP/i.test(inj.effect || "")) m.xp = (m.xp || 0) + 1;
  m.scars = (m.scars || []).concat([rec]);
  save();
  return rec;
}

/* ---- what the band takes away ---- */
function awardBattle(b, {won, size, difficultyMult}){
  const aw = RS.campaign.awards;
  const cash = Math.round((size || 0) * aw.cash.winPayoutPctOfGameSize *
                          (won ? 1 : aw.cash.lossFactor) * (difficultyMult || 1));
  b.cash = (b.cash || 0) + cash;
  b.reputation = (b.reputation || 0) + (won ? aw.reputation.win : aw.reputation.withdrawOrBreak);
  save();
  return {cash, rep: won ? aw.reputation.win : aw.reputation.withdrawOrBreak};
}
function repLevel(b){
  const n = b.reputation || 0;
  return (RS.campaign.reputationLevels || []).find(l => n >= l.min && n <= l.max) || null;
}

/* =====================================================================
   The sheet: every model that owes a roll, one at a time.
   ===================================================================== */
let afterState = null;

function openAfter(){
  const b = band();
  /* Who rolls: the ruleset says anyone Down at the end, or Marked at any point. */
  const owed = b.members.filter(m => {
    const u = questOn() ? questUnit(m) : null;
    const down = u ? unitDown(u) : healthOf(m).every(h => h <= 0);
    const marked = u ? (u.cond || []).includes("marked") : false;
    return down || marked;
  }).map(m => ({id: m.id, marked: questOn() && questUnit(m) ? (questUnit(m).cond || []).includes("marked") : false,
                stabilised: questOn() && questUnit(m) ? (questUnit(m).cond || []).includes("stabilised") : false}));

  afterState = {owed, done: [], step: owed.length ? "fate" : "spoils", won: true,
                size: (questOn() && Q.size) || bandSpent(b),
                mult: (questOn() && Q.reward) || 1,
                difficulty: (questOn() && Q.difficulty) || null};

function defaultXP(m, S){

function cashFor(S){

/* ---- an epithet for what it cost them ---- */
async function openEpithet(m, rec){

`Three epithets for a character in ${RS.meta.name}, a grim tabletop skirmish game.

words at most, like "the Quiet", "Ashmouth", "One-Eye", "who came back".

What happened: ${rec.name} — ${rec.effect}

/* =====================================================================
   SPENDING XP
   "XP buys any upgrade at its points cost, including surcharge." So the
   price of a thing is whatever adding it does to the model's cost — which
   means the surcharge is counted honestly, and a fourth upgrade really is
   dearer than a first.
   ===================================================================== */

/* What it would cost this model to take one more of something. */
function xpPrice(m, apply){
  const before = memberCost(m);
  const trial = JSON.parse(JSON.stringify(m));
  apply(trial);
  return memberCost(trial) - before;
}
function xpBuy(m, apply, price){
  if((m.xp || 0) < price) return false;
  apply(m);
  m.xp -= price;
  save();
  return true;
}

function openAdvance(mid){
  const m = band().members.find(x => x.id === mid); if(!m) return;
  const have = m.xp || 0;

  /* Every way this model could advance, priced by what it does to its cost. */
  const offers = [];
  DIE_STATS.forEach(k => {
    const st = RSX.stat[k], next = dieStep(m[k], 1);
    if(!next || dieNum(next) > dieNum(st.max) || next === m[k]) return;
    offers.push({kind: "stat", label: st.name + " " + m[k] + " \u2192 " + next,
      note: "one step up the ladder",
      price: xpPrice(m, t => t[k] = next), apply: t => t[k] = next});
  });
  const ws = RSX.stat.wounds, step = ws.upStep || 1;
  if(m.wounds + step <= ws.max){
    offers.push({kind: "stat", label: ws.name + " " + m.wounds + " \u2192 " + (m.wounds + step),
      note: "bought in " + step + "s",
      price: xpPrice(m, t => t.wounds += step), apply: t => t.wounds += step});
  }
  const as = RSX.stat.actions;
  if(m.actions < as.max && as.upCosts[m.actions - as.default] !== undefined){
    offers.push({kind: "stat", label: as.name + " " + m.actions + " \u2192 " + (m.actions + 1),
      note: "another action each activation",
      price: xpPrice(m, t => t.actions += 1), apply: t => t.actions += 1});
  }
  [["traits", "Traits"], ["abilities", "Abilities"], ["powers", "Powers"]].forEach(([field, label]) => {
    Object.values(catOf(field)).forEach(o => {
      if((m[field] || []).includes(o.id)) return;
      if(o.cost < 0) return;                       // a drawback is not an advance
      const why = typeof pickBlocked === "function" ? pickBlocked(m, field, o) : null;
      offers.push({kind: field, label: o.name, note: o.desc, blocked: why,
        price: xpPrice(m, t => t[field] = (t[field] || []).concat([o.id])),
        apply: t => t[field] = (t[field] || []).concat([o.id])});
    });
  });
  offers.sort((a, b) => a.price - b.price);
  const shown = offers.filter(o => !o.blocked);

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="axX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">What they have learned</div>
      <span class="chip gilt mono">${have} XP</span></div>

    <div class="cardhead" style="padding-bottom:12px;margin-bottom:12px">
      <div class="cardname" style="font-size:21px">${esc(m.name) || "Unnamed"}</div>
      ${m.epithet ? `<div class="cardepi">\u201c${esc(m.epithet)}\u201d</div>` : ""}
    </div>

    <p class="lead">XP buys anything at its points price, surcharge and all \u2014 so the
      fourth thing a model learns costs more than the first.</p>

    <div class="slab" style="margin-top:14px">
      ${shown.length ? shown.map((o, i) => `
        <div class="grow">
          <div class="grow-main">
            <div class="grow-name">${esc(o.label)}</div>
            <div class="grow-sub">${esc(o.note || "")}</div>
          </div>
          <div class="grow-r">
            <span class="mono ${have >= o.price ? "" : "quiet"}">${o.price} XP</span>
            <button class="btn sm ${have >= o.price ? "primary" : ""}" data-buy="${i}"
              ${have >= o.price ? "" : "disabled"}>Learn</button>
          </div>
        </div>`).join("") : `<p class="quiet" style="margin:0">Nothing left to learn.</p>`}
    </div>`;

  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#axX").onclick = () => { closePicker(); render(); if(cardId) drawCard(); };
  $("#sheet2In").querySelectorAll("[data-buy]").forEach(btn => btn.onclick = () => {
    const o = shown[+btn.dataset.buy];
    if(xpBuy(m, o.apply, o.price)){
      toast(m.name + " learns " + o.label + " \u2014 " + o.price + " XP");
      openAdvance(mid); render(); if(cardId) drawCard();
    }
  });
}

/* ---- scnmap.js ---- */
/* =====================================================================
   THE MAP
   A scenario is easier to lay out than to read. This draws the table:
   deployment zones, terrain, the ground under it, and a numbered badge on
   everything the text refers to, so "the bell tower (3)" is somewhere you
   can point at.

   Coordinates are percentages of the table, so it does not matter whether
   you play on a door or a dining table.
   ===================================================================== */

const GROUND = {
  even:       {fill: "none",   label: "even ground"},
  rough:      {fill: "rough",  label: "difficult — costs double"},
  hazardous:  {fill: "hazard", label: "hazardous"},
  impassable: {fill: "solid",  label: "impassable"}
};
const ROLE_MARK = {
  cover:     {sym: "◧", tint: "var(--ash-mute)"},
  blocking:  {sym: "■", tint: "var(--ash-dim)"},
  high:      {sym: "▲", tint: "var(--ash-dim)"},
  objective: {sym: "◆", tint: "var(--gilt)"},
  hazard:    {sym: "✵", tint: "var(--rust)"},
  marker:    {sym: "◈", tint: "var(--gilt)"}
};

function mapSVG(map, opts){
  map = map || {};
  const mini = opts && opts.mini;
  const zones = Array.isArray(map.zones) ? map.zones : [];
  const feats = Array.isArray(map.features) ? map.features : [];
  const clamp = v => Math.max(0, Math.min(100, +v || 0));
  const id = "m" + Math.random().toString(36).slice(2, 7);

  const defs = `<defs>
    <pattern id="${id}grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0V10H0" fill="none" stroke="currentColor" stroke-width=".25" opacity=".18"/></pattern>
    <pattern id="${id}rough" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="currentColor" stroke-width=".55" opacity=".35"/></pattern>
    <pattern id="${id}hazard" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="2.6" stroke="var(--rust)" stroke-width=".7" opacity=".55"/></pattern>
  </defs>`;

  let out = `<rect width="100" height="100" fill="url(#${id}grid)"/>`;

  /* deployment zones first, so everything else sits on top */
  zones.forEach(z => {
    const x = clamp(z.x), y = clamp(z.y);
    const w = Math.min(100 - x, Math.max(4, +z.w || 20));
    const h = Math.min(100 - y, Math.max(4, +z.h || 18));
    const col = z.side === "b" ? "var(--rust)" : z.side === "neutral" ? "var(--ash-mute)" : "var(--gilt)";
    out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${col}" fill-opacity=".07"
      stroke="${col}" stroke-width=".5" stroke-dasharray="2 1.6"/>`;
    if(!mini && z.label)
      out += `<text x="${x + 1.5}" y="${y + 4}" font-size="3" fill="${col}" opacity=".9">${esc(String(z.label).slice(0, 22))}</text>`;
  });

  /* the ground each feature sits on, shaded where it is not plain */
  feats.forEach(f => {
    const g = GROUND[f.ground] || GROUND.even;
    if(g.fill === "none") return;
    const r = Math.max(3, Math.min(30, +f.r || 7));
    const fill = g.fill === "rough" ? `url(#${id}rough)` : g.fill === "hazard" ? `url(#${id}hazard)` : "currentColor";
    out += `<circle cx="${clamp(f.x)}" cy="${clamp(f.y)}" r="${r}" fill="${fill}"
      ${g.fill === "solid" ? 'opacity=".22"' : ""}/>`;
  });

  /* the pieces themselves, numbered in the order the text uses */
  let n = 0;
  feats.forEach(f => {
    n++;
    const x = clamp(f.x), y = clamp(f.y);
    const mark = ROLE_MARK[f.role] || ROLE_MARK.cover;
    out += `<g class="mapnum" data-n="${n}" data-label="${esc(String(f.label || ""))}">
      <circle cx="${x}" cy="${y}" r="3" fill="var(--stone-1)" stroke="${mark.tint}" stroke-width=".7"/>
      <text x="${x}" y="${y}" font-size="3.2" font-weight="700" fill="${mark.tint}"
        text-anchor="middle" dominant-baseline="central">${n}</text></g>`;
  });

  return `<svg viewBox="0 0 100 100" class="scnmap ${mini ? "mini" : ""}"
    role="img" aria-label="the table">${defs}${out}</svg>`;
}

function mapKeyHTML(map){
  const feats = (map && Array.isArray(map.features)) ? map.features : [];
  if(!feats.length) return "";
  return `<div class="mapkey">
    ${feats.map((f, i) => {
      const mark = ROLE_MARK[f.role] || ROLE_MARK.cover;
      const g = GROUND[f.ground];
      return `<div class="mk-row">
        <span class="mk-n">${i + 1}</span>
        <span class="mk-l"><b>${esc(f.label || "unnamed")}</b>
          <span>${esc([f.role, g && g.fill !== "none" ? g.label : null].filter(Boolean).join(" · "))}</span></span>
      </div>`;
    }).join("")}
  </div>`;
}

/* ---- scenario.js ---- */
/* =====================================================================
   THE SCENARIO
   Asked for in the shape the ruleset already describes: a mode, a theme,
   a kind of battle, a difficulty. What comes back is checked against the
   same file — objectives must belong to the battle type, the enemy must
   fit inside its points, and every id must exist.

   The generator writes the fiction. The ruleset decides what is legal.
   ===================================================================== */

let genState = null;

function genDefaults(){
  const b = band();
  return {wish: "", mode: "coop", type: "", theme: "", difficulty: "standard",
          length: "standard", players: 1,
          perBand: Math.max(50, bandSpent(b) || b.budget),
          table: "", more: false, out: null, busy: false};
}

async function openGenerate(){
  const ai = await getAI();
  genState = genState || genDefaults();
  genState.mine = bandSpent(band());
  drawGenerate(ai);
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
}

function drawGenerate(ai){
  const S = genState, sc = RS.scenario;
  const size = S.players * S.perBand;
  const diff = (sc.difficulty || []).find(d => d.id === S.difficulty) || {enemyPct: 1, reward: 1};
  const enemy = Math.round(size * diff.enemyPct);

  const modeCard = m => `
    <button class="opt ${S.mode === m.id ? "on" : ""}" data-mode="${esc(m.id)}">
      <b>${esc(m.id === "coop" ? "Co-op" : m.id === "pvp" ? "Player vs player" : "Solo")}</b>
      <span>${esc(m.desc)}</span></button>`;
  const typeCard = t => `
    <button class="opt ${S.type === t.id ? "on" : ""}" data-type="${esc(t.id)}">
      <b>${esc(t.id.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase()))}</b>
      <span>${esc(t.desc)}</span></button>`;

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="gX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">Something to fight over</div></div>

    ${!ai ? `<p class="lead">${esc(aiTrouble("not_granted"))}</p>` : `

    <div class="slab" style="margin-top:6px;border-color:var(--gilt-deep)">

      <textarea class="input serif" id="gWish" rows="3" maxlength="400"
        placeholder="a bell tower nobody will go near \u00b7 something is taking the dead \u00b7 we owe a debt and it has come to collect \u00b7 a quiet job that goes wrong">${esc(S.wish)}</textarea>
      <p class="quiet" style="margin:9px 0 0">Say as much or as little as you like. Everything

    <div class="slab">
      <div class="head"><span class="eyebrow">How it is played</span><span class="rule"></span></div>
      <div class="opts">${(sc.modes || []).map(modeCard).join("")}</div>

    <div class="slab">
      <div class="head"><span class="eyebrow">What kind of mission</span><span class="rule"></span>
        <button class="chip ${S.type ? "" : "gilt"}" data-type="">let it decide</button></div>

    </div>

    <div class="slab">

            <button data-players="-1">\u2212</button><span>${S.players}</span><button data-players="1">+</button>
          </div></div>
        <div class="field" style="grid-column:span 2"><label>Points per band</label>

      </div>
      <p class="quiet" style="margin:9px 0 0">${S.players} band${S.players === 1 ? "" : "s"} of
        ${S.perBand} \u2014 the enemy gets <b>${enemy}</b> on ${esc(S.difficulty)}.</p>
    </div>

    <button class="btn sm ghost" id="gMore" style="margin-bottom:12px">
      ${S.more ? "\u2212 fewer choices" : "+ more choices"}</button>

    ${S.more ? `
    <div class="slab">
      <div class="head"><span class="eyebrow">If you care</span><span class="rule"></span></div>
      <div class="field" style="margin-bottom:11px"><label>Where</label>
        <select class="input" id="gTheme">
          <option value="">let it decide</option>

        <select class="input" id="gDiff">
          ${(sc.difficulty || []).map(d => `<option value="${esc(d.id)}" ${S.difficulty === d.id ? "selected" : ""}>${esc(d.id)} \u2014 enemy \u00d7${d.enemyPct}, pays \u00d7${d.reward}</option>`).join("")}
        </select></div>
      <div class="field" style="margin-bottom:11px"><label>How long</label>
        <select class="input" id="gLen">
          ${(sc.lengths || []).map(l => `<option value="${esc(l.id)}" ${S.length === l.id ? "selected" : ""}>${esc(l.id)}${l.rounds ? " \u2014 " + l.rounds + " rounds" : ""}</option>`).join("")}

  $("#gX").onclick = () => { closePicker(); };

  const per = $("#gPer"); if(per) per.oninput = e => { S.perBand = Math.max(10, parseInt(e.target.value.replace(/\D/g, ""), 10) || 10); };

  $("#sheet2In").querySelectorAll("[data-type]").forEach(b2 => b2.onclick = () => { keep(); S.type = b2.dataset.type; drawGenerate(ai); });
  $("#sheet2In").querySelectorAll("[data-players]").forEach(b2 => b2.onclick = () => {

  });
  const more = $("#gMore"); if(more) more.onclick = () => { keep(); S.more = !S.more; drawGenerate(ai); };
  const th = $("#gTheme"); if(th) th.onchange = e => { keep(); S.theme = e.target.value; drawGenerate(ai); };
  const df = $("#gDiff"); if(df) df.onchange = e => { keep(); S.difficulty = e.target.value; drawGenerate(ai); };

  $("#gGo").onclick = () => { keep(); runGenerate(ai); };
  if(S.out) bindScenario();
