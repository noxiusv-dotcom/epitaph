`Three epithets for a character in ${RS.meta.name}, a grim tabletop skirmish game.
An epithet is what others call someone after something happened to them: short, two or three
words at most, like "the Quiet", "Ashmouth", "One-Eye", "who came back".

The character: ${m.name}${m.role ? ", " + m.role : ""}.
What happened: ${rec.name} — ${rec.effect}
${hooks ? "Words that fit: " + hooks : ""}
${m.story ? "Their story: " + m.story : ""}

Reply with ONLY a JSON array of exactly 3 strings. No other text.`, {modelTier: "quick", cache: false});
      const three = (Array.isArray(list) ? list : []).map(x => String(x).trim()).filter(Boolean).slice(0, 3);
      out.innerHTML = three.length
        ? three.map(t => `<button class="btn sm ghost" data-epi="${esc(t)}" style="margin:0 6px 6px 0">${esc(t)}</button>`).join("")
        : `<p class="quiet">Nothing came back.</p>`;
      out.querySelectorAll("[data-epi]").forEach(bn => bn.onclick = () => { $("#epV").value = bn.dataset.epi; });
    }catch(e){ out.innerHTML = `<p class="quiet">${esc(aiTrouble(e && e.code))}</p>`; }
    finally{ ask.disabled = false; }
  };
}

/* =====================================================================
   SPENDING XP
   "XP buys any upgrade at its points cost, including surcharge." So the
   price of a thing is whatever adding it does to the model's cost — which
   means the surcharge is counted honestly, and a fourth upgrade really is
   dearer than a first.
   ===================================================================== */

/* What it would cost this model to take one more of something. */
function xpPrice(m, apply){
  const before = memberCost(m);
  const trial = JSON.parse(JSON.stringify(m));
  apply(trial);
  return memberCost(trial) - before;
}
function xpBuy(m, apply, price){
  if((m.xp || 0) < price) return false;
  apply(m);
  m.xp -= price;
  save();
  return true;
}

/* Spending XP opens on four categories, not on everything at once. Coming back
   after buying something keeps you in the category you were in. */
let advCat = null;
const ADV_CATS = [
  {id: "stat",      label: "Stats",     blurb: "Dice, Health and Actions"},
  {id: "traits",    label: "Traits",    blurb: "What they are"},
  {id: "abilities", label: "Abilities", blurb: "What they can do"},
  {id: "powers",    label: "Powers",    blurb: "Murmurs and Reckonings"}
];
function openAdvance(mid, keepCat){
  if(!keepCat) advCat = null;
  const m = band().members.find(x => x.id === mid); if(!m) return;
  const have = m.xp || 0;

  /* Every way this model could advance, priced by what it does to its cost. */
  const offers = [];
  DIE_STATS.forEach(k => {
    const st = RSX.stat[k], next = dieStep(m[k], 1);
    if(!next || dieNum(next) > dieNum(st.max) || next === m[k]) return;
    offers.push({kind: "stat", label: st.name + " " + m[k] + " \u2192 " + next,
      note: "one step up the ladder",
      price: xpPrice(m, t => t[k] = next), apply: t => t[k] = next});
  });
  const ws = RSX.stat.wounds, step = ws.upStep || 1;
  if(m.wounds + step <= ws.max){
    offers.push({kind: "stat", label: ws.name + " " + m.wounds + " \u2192 " + (m.wounds + step),
      note: "bought in " + step + "s",
      price: xpPrice(m, t => t.wounds += step), apply: t => t.wounds += step});
  }
  const as = RSX.stat.actions;
  if(m.actions < as.max && as.upCosts[m.actions - as.default] !== undefined){
    offers.push({kind: "stat", label: as.name + " " + m.actions + " \u2192 " + (m.actions + 1),
      note: "another action each activation",
      price: xpPrice(m, t => t.actions += 1), apply: t => t.actions += 1});
  }
  [["traits", "Traits"], ["abilities", "Abilities"], ["powers", "Powers"]].forEach(([field, label]) => {
    Object.values(catOf(field)).forEach(o => {
      const have_ = (m[field] || []).filter(x => x === o.id).length;
      if(have_ >= (field === "traits" ? traitMax(o.id) : 1)) return;
      if(o.cost < 0) return;                       // a drawback is not an advance
      const why = typeof pickBlocked === "function" ? pickBlocked(m, field, o) : null;
      offers.push({kind: field, label: o.name + (have_ ? " (second pair)" : ""), note: o.desc, blocked: why,
        price: xpPrice(m, t => t[field] = (t[field] || []).concat([o.id])),
        apply: t => t[field] = (t[field] || []).concat([o.id])});
    });
  });
  offers.sort((a, b) => a.price - b.price);
  const shown = offers.filter(o => !o.blocked);

  const cat = ADV_CATS.find(c => c.id === advCat) || null;
  const inCat = c => shown.filter(o => o.kind === c);
  const head = `
    <div class="sheet-head">
      <button class="iconbtn" id="axX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">What they have learned</div>
      <span class="chip gilt mono">${have} XP</span></div>

    <div class="cardhead" style="padding-bottom:12px;margin-bottom:12px">
      <div class="cardname" style="font-size:21px">${esc(fullName(m)) || "Unnamed"}</div>
      ${combatStyle(m) ? `<div style="margin:2px 0 4px">${styleBadge(m)}</div>` : ""}
      ${m.epitaph ? `<div class="cardepi">\u201c${esc(m.epitaph)}\u201d</div>` : ""}
    </div>`;

  if(!cat){
    $("#sheet2In").innerHTML = head + `
    <p class="lead">XP buys anything at its points price, surcharge and all \u2014 so the
      fourth thing a model learns costs more than the first. Pick what to look at.</p>
    <div class="opts" style="margin-top:14px">
      ${ADV_CATS.map(c => {
        const list = inCat(c.id), can = list.filter(o => o.price <= have), cheapest = list.length ? Math.min(...list.map(o => o.price)) : null;
        return `<button class="opt" data-cat="${c.id}" ${list.length ? "" : "disabled"} style="${list.length ? "" : "opacity:.5;cursor:default"}">
          <b>${esc(c.label)}</b>
          <span>${esc(c.blurb)}</span>
          <span style="margin-top:7px;color:${can.length ? "var(--gilt)" : "var(--ash-mute)"}">${
            list.length ? (can.length ? can.length + " you can afford" : "none affordable yet") + " \u00b7 from " + cheapest + " XP" : "nothing left"}</span>
        </button>`; }).join("")}
    </div>`;
    $("#sheet2In").querySelectorAll("[data-cat]").forEach(btn => btn.onclick = () => { advCat = btn.dataset.cat; openAdvance(mid, true); });
  } else {
    const list = inCat(cat.id);
    $("#sheet2In").innerHTML = head + `
    <div class="sheet-actions" style="margin:0 0 12px;align-items:center">
      <button class="btn sm ghost" id="axAll" style="margin-left:0">\u2039 All categories</button>
      <span class="eyebrow" style="margin-left:auto">${esc(cat.label)}</span>
    </div>
    <div class="slab">
      ${list.length ? list.map(o => `
        <div class="grow">
          <div class="grow-main">
            <div class="grow-name">${esc(o.label)}</div>
            <div class="grow-sub">${esc(o.note || "")}</div>
          </div>
          <div class="grow-r">
            <span class="mono ${have >= o.price ? "" : "quiet"}">${o.price} XP</span>
            <button class="btn sm ${have >= o.price ? "primary" : ""}" data-buy="${shown.indexOf(o)}"
              ${have >= o.price ? "" : "disabled"}>Learn</button>
          </div>
        </div>`).join("") : `<p class="quiet" style="margin:0">Nothing left to learn here.</p>`}
    </div>`;
    $("#axAll").onclick = () => { advCat = null; openAdvance(mid, true); };
  }

  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#axX").onclick = () => { advCat = null; closePicker(); render(); if(cardId) drawCard(); };
  $("#sheet2In").querySelectorAll("[data-buy]").forEach(btn => btn.onclick = () => {
    const o = shown[+btn.dataset.buy];
    if(xpBuy(m, o.apply, o.price)){
      toast(m.name + " learns " + o.label + " \u2014 " + o.price + " XP");
      openAdvance(mid, true); render(); if(cardId) drawCard();
    }
  });
}

/* ---- tether.js ---- */
/* =====================================================================
   TETHERS
   The Unburied are called back from the grave. By default only the
   Leader is bound: one tether, one observance performed in every battle,
   until its debt of oaths is paid. Nothing here changes a point cost —
   the ruleset says so outright: "tethers are story, not points."

   The app cannot see who actually took an enemy down or who stood on an
   objective at the End step, so it does not pretend to: at the end of a
   battle it asks whether the observance was kept, same as it already
   asks about wound flavour and morale calls it cannot detect either.
   ===================================================================== */

function leaderOf(b){
  return (b.members || []).find(m => (m.traits || []).includes("leader")) || null;
}
function tetherKind(id){
  return (RS.tethers && RS.tethers.kinds || []).find(k => k.id === id) || null;
}
/* The tether belongs to the Oathbearer as a person: it is what they did in
   life, and it is settled where they are raised (the Reliquary) and travels with
   them. Camp only reads it. It is stored on the member as `tetherKind`. */
function tetherKinds(){ return (RS.tethers && RS.tethers.kinds) || []; }
/* Reckoning needs someone in the band who can call one (a Reckoning is a major
   power), so it is only rolled for a band that has such a caster. */
function bandHasCaster(members){
  return (members || []).some(m => (m.powers || []).some(id => (RSX.power[id] || {}).tier === "signature"));
}
function needsCaster(k){ return !!k && /caster/i.test(k.requires || ""); }
function tetherAllowed(k, members){ return !needsCaster(k) || bandHasCaster(members); }
function rollTetherKind(notId, members){
  members = members || (typeof band === "function" ? band().members : []);
  const kinds = tetherKinds().filter(k => k.id !== notId && tetherAllowed(k, members));
  return kinds.length ? kinds[Math.floor(Math.random() * kinds.length)].id : null;
}
/* Quarry is sworn against a kind of enemy chosen when it is set. */
function tetherObservance(kindId, sworn){
  const k = tetherKind(kindId); if(!k) return "";
  return kindId === "quarry" && sworn ? "hunt " + sworn : k.observance;
}
/* A battle where the observance could not be kept is not checked: Reckoning with
   no caster in the field. (Quarry with none of the sworn kind is the player's call.) */
function tetherUnchecked(b){
  const k = tetherKind(b.tether && b.tether.kindId);
  if(!needsCaster(k)) return false;
  const going = (typeof Q !== "undefined" && Q)
    ? Q.units.filter(u => u.side === "us").map(u => b.members.find(m => m.id === u.uid)).filter(Boolean)
    : b.members.filter(fielded);
  return !bandHasCaster(going);
}
/* One line for the scenario writer: the Oathbearer's quarry belongs in the fight. */
function tetherPromptLine(){
  const b = band(), leader = leaderOf(b);
  if(!leader || leader.tetherKind !== "quarry" || !leader.tetherSworn) return "";
  return "THE OATHBEARER HUNTS " + leader.tetherSworn.toUpperCase() + ". Their tether is sworn against that kind of enemy. Include at least one such enemy if it fits the place; if it truly does not, leave it out.\n";
}
function tetherDebtFor(kindId){
  const k = tetherKind(kindId) || {};
  return ((RS.tethers.debt || {}).byKind || {})[kindId] || k.debt || 10;
}
/* Puts the band's tether on the Oathbearer's own kind. */
function bindTether(b){
  const leader = leaderOf(b);
  if(!leader || !tetherKinds().length) return null;
  if(!tetherKind(leader.tetherKind)){ leader.tetherKind = rollTetherKind(); }   // one raised before tethers were chosen
  const kind = tetherKind(leader.tetherKind);
  b.tether = {leaderId: leader.id, kindId: kind.id, debt: tetherDebtFor(kind.id),
              kept: 0, frayed: false, obols: 0, sworn: leader.tetherSworn || null, severed: null};
  qlogBand(b, leader.name + " is bound: the " + kind.name + " tether");
  return b.tether;
}

/* Camp: the band's tether follows its Oathbearer's. Nothing is rolled here. */
function syncTether(b){
  if(!ruleOn("narrative", b)) return false;
  const leader = leaderOf(b);
  if(!leader){ if(!b.sealed && b.tether && !b.tether.severed) b.tether = null; return false; }
  if(b.tether && b.tether.leaderId === leader.id) return false;
  if(b.tether && b.sealed && !b.tether.severed) return false;
  const t = bindTether(b);
  save();
  return !!t;
}

/* ---- the Reliquary: settling the Oathbearer's tether when they are raised ---- */
function rollOathbearerTether(m){
  if(m.tetherKind){
    if(m.tetherRerolled) return false;
    m.tetherKind = rollTetherKind(m.tetherKind); m.tetherRerolled = true;
  } else m.tetherKind = rollTetherKind();
  if(m.tetherKind !== "quarry") m.tetherSworn = undefined;
  save();
  return true;
}
function tetherEditorHTML(m){
  const k = tetherKind(m.tetherKind);
  return `<div class="slab" style="border-color:var(--gilt-deep)">
    <div class="head"><span class="eyebrow">Tether</span><span class="rule"></span>
      ${k ? `<span class="chip gilt">${esc(k.name)} · ${tetherDebtFor(k.id)} oaths</span>` : ""}</div>
    ${k ? `<p class="quiet" style="margin:0"><b style="color:var(--ash)">${esc(k.name)}.</b> They must <span data-tobs>${esc(tetherObservance(k.id, m.tetherSworn))}</span>.</p>
      <p class="serif" style="margin:8px 0 0;color:var(--ash-dim);font-size:13.5px;line-height:1.55">${esc(k.why)}</p>`
      : `<p class="quiet" style="margin:0">Whoever calls the Unburied back is tied to the grave by something they did in life.
        Settle what, and that is where their story starts.</p>`}
    ${k && k.id === "quarry" ? `<div class="field" style="margin-top:10px"><label>What do they hunt?</label>
      <input class="input" data-tsworn maxlength="30" value="${esc(m.tetherSworn || "")}" placeholder="wolves, cultists, machines, the drowned">
      <p class="quiet" style="margin:6px 0 0">The kind of enemy the tether is sworn against. The scenario writer works one into the fight.</p></div>` : ""}
    ${k && needsCaster(k) && !bandHasCaster(band().members) ? `<p class="quiet" style="margin:10px 0 0;color:var(--rust)">No one in the band can call a Reckoning yet. Give someone a Reckoning, or the tether is not checked in any battle.</p>` : ""}
    <div class="sheet-actions" style="flex-wrap:wrap;gap:8px;margin-top:10px">
      <button class="btn sm ${k ? "" : "primary"}" data-tether="roll" style="margin-left:0" ${k && m.tetherRerolled ? "disabled" : ""}>${k ? (m.tetherRerolled ? "Rolled again already" : "Roll again — once") : "Roll the tether"}</button>
      <button class="btn sm ghost" data-tether="choose">Choose one</button>
    </div>
  </div>`;
}
function bindTetherEditor(root, m, after){
  root.querySelectorAll("[data-tether]").forEach(btn => btn.onclick = () => {
    if(btn.dataset.tether === "roll"){ if(rollOathbearerTether(m)) after(); }
    else openTetherChoose(kind => { m.tetherKind = kind; if(kind !== "quarry") m.tetherSworn = undefined; save(); after(); });
  });
  /* the sentence above the field follows what is typed */
  root.querySelectorAll("[data-tsworn]").forEach(inp => inp.oninput = () => {
    m.tetherSworn = inp.value.trim().slice(0, 30); save();
    const line = root.querySelector("[data-tobs]");
    if(line) line.textContent = tetherObservance(m.tetherKind, m.tetherSworn);
  });
}
/* A free choice of the ten, each with its reason. */
function openTetherChoose(pick){
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="tcX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">Choose the tether</div></div>
    <div class="picks" style="margin-top:6px">
      ${tetherKinds().map(k => { const no = !tetherAllowed(k, band().members); return `<button class="pick ${no ? "no" : ""}" data-tk="${esc(k.id)}" ${no ? "disabled" : ""}><div class="pick-main">
        <div class="pick-name">${esc(k.name)} <span class="chip">${tetherDebtFor(k.id)} oaths</span></div>
        <div class="pick-desc">They must ${esc(k.observance)}.</div>
        <div class="pick-eg">${esc(k.why)}</div>
        ${no ? `<div class="pick-no">Needs someone in the band who can call a Reckoning.</div>` : ""}</div></button>`; }).join("")}
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#tcX").onclick = closePicker;
  $("#sheet2In").querySelectorAll("[data-tk]").forEach(btn => btn.onclick = () => { closePicker(); pick(btn.dataset.tk); });
}

/* Quests don't all keep a Q.log the way a battle does — this just keeps a
   short breadcrumb on the band itself so binding/severing is visible even
   outside a battle. */
function qlogBand(b, s){
  b.log = b.log || [];
  b.log.unshift({at: Date.now(), t: s});
  b.log = b.log.slice(0, 30);
}

function obolCost(t){ return 15 * (t.obols + 1); }
/* The final oath of a debt can never be bought — it must be honoured. */
function obolAllowed(t){ return t.kept < t.debt - 1; }

/* One battle's honour/forsake call, applied to the band's tether. */
function tetherHonour(b){
  const t = b.tether; if(!t || t.severed) return;
  t.kept++;
  if(t.kept >= t.debt) severTether(b);
  else qlogBand(b, "The " + tetherKind(t.kindId).name + " tether is honoured — " + t.kept + " of " + t.debt);
  save();
}
function tetherForsake(b){
  const t = b.tether; if(!t || t.severed) return;
  if(t.frayed) snapTether(b);
  else { t.frayed = true; qlogBand(b, "The " + tetherKind(t.kindId).name + " tether frays"); }
  save();
}
function tetherPayObol(b){
  const t = b.tether; if(!t || t.severed || !obolAllowed(t)) return false;
  const cost = obolCost(t);
  if((b.cash || 0) < cost) return false;
  b.cash -= cost; t.obols++; t.kept++;
  qlogBand(b, "Paid the obol (" + cost + " Cash) — the oath counts as kept");
  if(t.kept >= t.debt) severTether(b);
  save();
  return true;
}
function severTether(b){
  const t = b.tether; if(!t) return;
  t.severed = "paid";
  qlogBand(b, "Every oath is kept — the " + tetherKind(t.kindId).name + " tether is severed");
}
/* Leader returns to the grave for good; the band picks a new one by
   giving someone else the Leader trait, and binds a fresh tether next
   time it is sent out. */
function snapTether(b){
  const t = b.tether;
  const leader = (b.members || []).find(m => m.id === t.leaderId);
  if(leader) layToGrave(b, leader, "Their tether snapped", false);
  b.reputation = (b.reputation || 0) - 2;
  qlogBand(b, (leader ? leader.name : "The " + leaderTerm()) + "'s tether snaps — they return to the grave");
  b.tether = null;
}
/* The debt is paid; the Leader chooses what that means for them. */
function tetherStayUnbound(b){
  const t = b.tether; if(!t) return;
  const leader = (b.members || []).find(m => m.id === t.leaderId);
  /* every oath kept is worth a new name, but the player chooses it */
  if(leader && ruleOn("narrative", b))
    addMoment(b, leader.id, "Every oath is kept", ["the Unbound", "the Freed", "Kept-Promise"],
              "The tether is severed; they stay, free.");
  b.tether = null;
  save();
}
function tetherLayToRest(b){
  const t = b.tether; if(!t) return;
  const leader = (b.members || []).find(m => m.id === t.leaderId);
  if(leader) layToGrave(b, leader, "Laid to rest, with honour", true);
  b.reputation = (b.reputation || 0) + 2;
  qlogBand(b, (leader ? leader.name : "The " + leaderTerm()) + " is laid to rest, with honour");
  b.tether = null;
  save();
}

/* ---- mending a frayed tether: any time, not gated behind a camp phase
   the app does not otherwise have ---- */
function mendTether(b, how){
  const t = b.tether; if(!t || !t.frayed) return false;
  const leader = (b.members || []).find(m => m.id === t.leaderId);
  if(how === "rite"){
    if((b.cash || 0) < 10) return false;
    b.cash -= 10;
  } else if(how === "sacrifice"){
    if(!leader || (leader.xp || 0) < 3) return false;
    leader.xp -= 3;
  } else if(how === "scar"){
    if(!leader) return false;
    /* "Fate rows 3-8" are the six specific-injury rows of the Fate table
       (rows 1-2 are Dead/Mortal wound, 9+ are Laid up or better) — one is
       picked for the Leader, same shape as a battle's own injury roll. */
    const rows = INJ().slice(2, 8);
    if(rows.length){
      const inj = rows[Math.floor(Math.random() * rows.length)];
      applyInjury(leader, inj, inj.roll[0]);
    }
  } else return false;
  t.frayed = false;
  qlogBand(b, "The tether is mended (" + how + ") — not counted as an oath kept");
  save();
  return true;
}

/* ---- the band head's tether summary ---- */
function tetherHTML(b){
  const t = b.tether;
  if(!t) return "";
  const kind = tetherKind(t.kindId); if(!kind) return "";
  const leader = (b.members || []).find(m => m.id === t.leaderId);
  return `<div class="slab" style="border-color:${t.frayed ? "var(--rust)" : "var(--gilt-deep)"}">
    <div class="head"><span class="eyebrow">Tether — ${esc(kind.name)}</span><span class="rule"></span>
      <span class="chip ${t.frayed ? "bad" : "gilt"}">${t.kept} of ${t.debt} oaths</span></div>
    <p class="quiet" style="margin:0">${esc(leader ? leader.name : "The " + leaderTerm())} must ${esc(tetherObservance(kind.id, t.sworn))}.
      ${t.frayed ? "Forsaken once already — it will snap if that happens again." : ""}</p>
    ${kind.why ? `<p class="serif" style="margin:8px 0 0;color:var(--ash-dim);font-size:13.5px;line-height:1.55">${esc(kind.why)}</p>` : ""}

    ${t.frayed ? `<div class="sheet-actions" style="flex-wrap:wrap;gap:7px">
      <button class="btn sm" data-tmend="rite">Mend — 10 Cash</button>
      <button class="btn sm" data-tmend="sacrifice">Mend — 3 XP</button>
      <button class="btn sm ghost" data-tmend="scar">Mend — take a scar</button>
    </div>` : ""}
  </div>`;
}
function bindTetherHTML(el){
  el.querySelectorAll("[data-tmend]").forEach(btn => btn.onclick = () => {
    const ok = mendTether(band(), btn.dataset.tmend);
    toast(ok ? "Mended" : "Can't afford that");
    if(ok) renderUnburied(band());
  });
}

/* ---- camp.js ---- */
/* =====================================================================
   CAMP, THE WALL, AND WHICH RULES ARE ON
   What happens between battles. Each of the Unburied takes one camp
   action per camp is NOT limited: it comes after the scenario, so the
   Unburied heal, train with XP, buy gear and have scars operated on with
   Cash, as much as they can afford. Everyone who is gone gets a stone in
   the Cenotaph (the ruleset calls it the Epitaph wall).

   Prices, limits and wording come from the ruleset. The few places the
   ruleset describes an effect only in words (what a mend leaves behind)
   are marked where the app has to read them.
   ===================================================================== */

/* ---- which rule categories this band plays with ----
   meta.ruleCategories names them: core is always on, campaign and
   narrative can be switched off for a table that only wants battles. */
function ruleCats(){ return (RS.meta && RS.meta.ruleCategories) || {}; }
function ruleOn(cat, b){
  if(cat === "core") return true;
  b = b || band();
  return !b.rules || b.rules[cat] !== false;
}
function openRules(){
  const b = band();
  const cats = ruleCats();
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="ruX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">Which rules this band plays</div></div>
    <p class="lead">Switch off what your table does not want. Nothing here changes a
      point cost, and anything already recorded is kept if you switch it back on.</p>
    <div class="slab" style="margin-top:14px">
      ${Object.keys(cats).map(id => `
        <div class="grow">
          <div class="grow-main">
            <div class="grow-name">${esc(id.charAt(0).toUpperCase() + id.slice(1))}</div>
            <div class="grow-sub">${esc(cats[id])}</div>
          </div>
          <div class="grow-r">
            ${id === "core" ? `<span class="chip">always on</span>`
              : `<button class="chip ${ruleOn(id, b) ? "gilt" : ""}" data-rule="${esc(id)}">${ruleOn(id, b) ? "on" : "off"}</button>`}
          </div>
        </div>`).join("")}
    </div>
    ${ruleOn("narrative", b) ? "" : `<p class="quiet">Narrative off: no tether is bound or asked about, and the Cenotaph is hidden.</p>`}
    ${ruleOn("campaign", b) ? "" : `<p class="quiet">Campaign off: no After the battle sheet or Camp; the band is only a roster.</p>`}`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#ruX").onclick = () => { closePicker(); render(); };
  $("#sheet2In").querySelectorAll("[data-rule]").forEach(btn => btn.onclick = () => {
    b.rules = b.rules || {};
    b.rules[btn.dataset.rule] = !ruleOn(btn.dataset.rule, b);
    save(); openRules();
  });
}

/* ---- the Cenotaph ---- */
function addStone(b, m, how, gilded, epitaph, options){
  b.wall = b.wall || [];
  b.wall.unshift({sid: uid(), at: Date.now(), name: m.name || "Unnamed",
    epithet: m.epithet || "", epithets: (m.epithetHistory || []).concat(m.epithet ? [m.epithet] : []),
    titles: (m.titles || []).slice(),
    role: m.role || "", battles: m.battles || 0,
    how: how || "", gilded: !!gilded, epitaph: epitaph !== undefined ? epitaph : (m.epitaph || ""),
    options: (options || []).slice(0, 3)});
  b.wall = b.wall.slice(0, 200);
  qlogBand(b, (m.name || "Someone") + " — " + (how || "gone"));
}
/* The band's stash: what the fallen carried. Anyone can take it up again, free. */
function stashOf(b){
  b.stash = b.stash || {};
  ["weapons", "armour", "items"].forEach(k => { b.stash[k] = b.stash[k] || []; });
  return b.stash;
}
function stashGear(b, m){
  const st = stashOf(b);
  ["weapons", "items"].forEach(k => (m[k] || []).forEach(e => {
    const id = e.id || e, n = e.qty || 1, have = st[k].find(x => x.id === id);
    if(have) have.qty = (have.qty || 1) + n; else st[k].push({id, qty: n, mods: (e.mods || []).slice()});
  }));
  (m.armour || []).forEach(a => st.armour.push(a.id || a));
}
function stashCount(b){
  const st = b.stash || {};
  return (st.weapons || []).reduce((n, e) => n + (e.qty || 1), 0) + (st.items || []).reduce((n, e) => n + (e.qty || 1), 0) + (st.armour || []).length;
}
/* A member leaves the band for good. Their gear goes to the stash. */
function layToGrave(b, m, how, gilded, epitaph, options){
  addStone(b, m, how, gilded, epitaph, options);
  stashGear(b, m);
  b.members = b.members.filter(x => x.id !== m.id);
  save();
}

function openWall(){
  const b = band(), list = b.wall || [];
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="wlX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">The Cenotaph</div>
      <span class="chip">${list.length}</span></div>
    <p class="lead">${"A resting place for every one of the Unburied who is gone."}
      ${(RS.epitaphWall || {}).gilded ? " Gilded stones: laid to rest with honour." : ""}</p>
    ${list.length ? list.map(s => `
      <div class="slab" style="margin-top:12px;border-color:${s.gilded ? "var(--gilt)" : "var(--line)"}">
        <div class="head"><span class="eyebrow" style="${s.gilded ? "color:var(--gilt)" : ""}">${s.gilded ? "✦ " : ""}${esc(s.name)}</span><span class="rule"></span>
          <button class="tiny" data-wdel="${esc(s.sid)}" aria-label="Remove the stone">×</button></div>
        ${(s.epithets && s.epithets.length ? s.epithets : s.epithet ? [s.epithet] : []).length ? `<div class="cardepi" style="margin:0 0 4px">${esc((s.epithets && s.epithets.length ? s.epithets : [s.epithet]).join(" \u2192 "))}</div>` : ""}
        <div class="quiet" style="margin-bottom:8px">
          ${esc([s.role, s.how, s.battles ? s.battles + " battle" + (s.battles === 1 ? "" : "s") : "", (s.titles || []).join(", ")].filter(Boolean).join(" · "))}
          · ${esc(new Date(s.at).toLocaleDateString())}</div>
        <input class="input serif" data-wep="${esc(s.sid)}" maxlength="140" value="${esc(s.epitaph)}"
          placeholder="what the stone says">
        ${(s.options || []).length ? `<div style="display:flex;flex-direction:column;gap:5px;margin-top:8px">${(s.options || []).map((o, i) =>
          `<button class="pick" type="button" data-wo="${esc(s.sid)}|${i}" style="padding:8px 10px"><div class="pick-main"><div class="pick-name" style="font-family:Spectral,Georgia,serif;font-style:italic;font-size:13.5px;font-weight:500">${esc(o)}</div></div></button>`).join("")}</div>` : ""}
        <div class="sheet-actions" style="margin-top:8px">
          <button class="btn sm ghost" data-wai="${esc(s.sid)}" style="margin-left:0" hidden>Write one from their deeds</button>
        </div>
      </div>`).join("") : `<div class="empty"><div class="big">The Cenotaph is empty</div>
        <div class="quiet">Nobody has been lost yet.</div></div>`}`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#wlX").onclick = closePicker;
  $("#sheet2In").querySelectorAll("[data-wep]").forEach(inp => inp.oninput = () => {
    const s = list.find(x => x.sid === inp.dataset.wep); if(s){ s.epitaph = inp.value; save(); }
  });
  $("#sheet2In").querySelectorAll("[data-wo]").forEach(btn => btn.onclick = () => {
    const [sid, i] = btn.dataset.wo.split("|");
    const s = list.find(x => x.sid === sid); if(!s) return;
    s.epitaph = (s.options || [])[+i] || s.epitaph; save(); openWall();
  });
  $("#sheet2In").querySelectorAll("[data-wdel]").forEach(btn => btn.onclick = () => {
    b.wall = list.filter(x => x.sid !== btn.dataset.wdel); save(); openWall();
  });
  /* The line is written from what the stone records, and stays editable. */
  getAI().then(ai => {
    if(!ai) return;
    $("#sheet2In").querySelectorAll("[data-wai]").forEach(btn => {
      btn.hidden = false;
      btn.onclick = async () => {
        const s = list.find(x => x.sid === btn.dataset.wai); if(!s) return;
        btn.disabled = true; btn.textContent = "Cutting…";
        try{
          const r = await ai.json(
`One line for a gravestone in ${RS.meta.name}, a grim tabletop skirmish game. Past tense, plain, the
way a stone would say it. Not a summary of a character sheet: a line an old friend would nod at.
Under 20 words.

Name: ${s.name}${s.epithet ? " " + s.epithet : ""}. ${s.role ? "Role: " + s.role + "." : ""}
How they left: ${s.how}. Battles fought: ${s.battles}.
${s.epitaph ? "An earlier line, to be bettered or kept in spirit: " + s.epitaph : ""}

Reply with ONLY a JSON string.`, {modelTier: "quick", cache: false});
          const line = String(Array.isArray(r) ? r[0] : r).trim().slice(0, 140);
          if(line){ s.epitaph = line; save(); }
        }catch(e){ toast(aiTrouble(e && e.code) || "That did not work"); }
        openWall();
      };
    });
  });
}

/* ---- camp ---- */
function campState(b){
  if(!b.camp) b.camp = {n: 1};
  return b.camp;
}
function cashChip(b){ return `<span class="chip gilt">${b.cash || 0} Cash</span>`; }
function lvlChip(b){ const l = repLevel(b); return `<span class="chip ${(b.reputation || 0) < 0 ? "bad" : ""}">${esc(l ? l.name : "Unknown")} ${signed(b.reputation || 0)}</span>`; }

function laidUpRec(m){ return (m.scars || []).find(s => s.id === "laidUp"); }
function mortalRec(m){ return (m.scars || []).find(s => s.id === "mortalWound" && !s.surgery); }
function surgeryCost(m){
  const inj = INJ().find(i => i.id === "mortalWound");
  const rule = ((inj || {}).surgery || {}).costRule || "";
  const floor = +(/min (\d+)/.exec(rule) || [])[1] || 10;
  return Math.max(floor, Math.ceil(unitCost(m) / 2));
}
function treatable(m){
  return (m.scars || []).some(s => s.scar && ((s.mend && !s.mended) || ((s.replace || []).length && !s.fitted)));
}

/* Camp is not a turn order. It comes after the scenario, so everyone may do
   everything they can afford, in any order, for as long as the table likes:
   heal, train with XP, buy gear with Cash, have a scar mended or replaced. */
function openCamp(){
  const b = band(), C = campState(b);
  const rows = b.members.map(m => {
    const laid = laidUpRec(m), mortal = mortalRec(m);
    const nScars = (m.scars || []).filter(s => s.scar).length;
    return `
    <div class="grow" style="flex-wrap:wrap">
      <div class="grow-main" style="min-width:150px">
        <div class="grow-name">${isLeaderM(m) ? crownHTML(12) : ""}${esc(fullName(m)) || "Unnamed"}
          ${laid ? `<span class="chip bad">Laid up</span>` : ""}
          ${m.xp ? `<span class="chip gilt">${m.xp} XP</span>` : ""}</div>
        <div class="grow-sub">${nScars} scar${nScars === 1 ? "" : "s"}</div>
        ${mortal ? `<div class="grow-sub" style="color:var(--rust)">Mortal wound — dies unless surgery is paid before camp breaks.</div>` : ""}
      </div>
      <div class="grow-r" style="flex-wrap:wrap;justify-content:flex-end;gap:6px">
        ${mortal ? `<button class="btn sm primary" data-surg="${esc(m.id)}" ${(b.cash || 0) < surgeryCost(m) ? "disabled" : ""}>Life-saving surgery — ${surgeryCost(m)}</button>
          <button class="btn sm danger ghost" data-letgo="${esc(m.id)}">Let go</button>` : ""}
        ${laid ? `<button class="btn sm" data-rest="${esc(m.id)}">Rest — end Laid up</button>` : ""}
        <button class="btn sm" data-train="${esc(m.id)}" ${m.xp ? "" : "disabled"}>Train</button>
        <button class="btn sm" data-gear="${esc(m.id)}">Gear</button>
        <button class="btn sm ${treatable(m) ? "" : "ghost"}" data-treat="${esc(m.id)}" ${treatable(m) ? "" : "disabled"}>Surgery</button>
      </div>
    </div>`;
  }).join("");

  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="cpX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button><div class="eyebrow">At the Barrow · Camp ${C.n}</div>${cashChip(b)}${lvlChip(b)}</div>
    <p class="lead">The fighting is done, so take your time. Health comes back on its own, but scars do not: lost limbs, eyes, ribs and
      shaken nerves stay until surgery. Spend XP to train, Cash on gear, and Cash on surgery for scars — as much as you can afford,
      in any order.</p>
    ${momentsHTML(b)}
    ${campRisks(b).length ? `<div class="slab" style="border-color:var(--rust)">
      <div class="head"><span class="eyebrow" style="color:var(--rust)">When the band sets out</span><span class="rule"></span></div>
      ${campRisks(b).map(r => `<p class="quiet" style="margin:0 0 5px">${esc(r.text)}</p>`).join("")}
    </div>` : ""}
    <div class="slab" style="margin-top:12px">
      <div class="head"><span class="eyebrow">The Unburied</span><span class="rule"></span></div>
      ${rows || `<p class="quiet" style="margin:0">Nobody to camp.</p>`}
    </div>
    <div class="sheet-actions">
      <span class="quiet" style="margin:0">Camp ends by itself when the band sets out again.</span>
      ${b.tether && b.tether.frayed ? `<span class="quiet">The tether is frayed — mend it from the band header.</span>` : ""}
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#cpX").onclick = () => { closePicker(); render(); };
  bindMoments($("#sheet2In"), openCamp);
  const each = (sel, fn) => $("#sheet2In").querySelectorAll(sel).forEach(btn => btn.onclick = () => fn(btn));
  each("[data-train]", btn => openAdvance(btn.dataset.train));
  each("[data-gear]", btn => openBuy(btn.dataset.gear));
  each("[data-treat]", btn => openTreat(btn.dataset.treat));
  each("[data-rest]", btn => {
    const m = b.members.find(x => x.id === btn.dataset.rest); if(!m) return;
    const rec = laidUpRec(m); if(rec) m.scars = m.scars.filter(s => s !== rec);
    m.fielded = true; save(); toast(m.name + " is back on their feet"); openCamp(); render();
  });
  each("[data-surg]", btn => {
    const m = b.members.find(x => x.id === btn.dataset.surg); if(!m) return;
    const rec = mortalRec(m), cost = surgeryCost(m);
    if(!rec || (b.cash || 0) < cost) return;
    b.cash -= cost; rec.surgery = true;
    rec.name = "Mortal wound, treated"; rec.effect = "Surgery was paid. They live.";
    save(); render();
    if(ruleOn("narrative", b)){
      const mom = addMoment(b, m.id, "Came back from the edge of death", ["twice-born", "cheat-death", "the Stitched"], "Surgery was paid; they live.",
        (b.lastNamings && b.lastNamings.survived) || []);
      toast(m.name + " lives");
      openEpithet(m, mom, {back: () => { openCamp(); render(); }, moment: mom.id,
        lead: m.name + " was dying, and lived. People will call them something for it; it replaces the name they had."});
    } else { toast(m.name + " lives"); openCamp(); }
  });
  each("[data-letgo]", btn => {
    const m = b.members.find(x => x.id === btn.dataset.letgo); if(!m) return;
    const rec = mortalRec(m) || {};
    const how = rec.flavourCause ? "Mortal wound from " + rec.flavourCause + ", no surgery" : "Mortal wound, no surgery";
    openEpitaph(m, {reason: rec.flavourCause ? "a mortal wound from " + rec.flavourCause : "a mortal wound they could not pay to mend",
      options: rec.epitaphOptions, back: openCamp,
      done: ep => { layToGrave(b, m, how, false, ep, rec.epitaphOptions); toast(m.name + " is gone"); openCamp(); render(); }});
  });
}

/* ---- buying and selling gear with Cash: 1 Cash buys 1 point, sell for half ---- */
let buyKind = "weapons";
function openBuy(mid){
  const b = band(), m = b.members.find(x => x.id === mid); if(!m) return;
  const kinds = [["weapons", "Weapons"], ["armour", "Armour"], ["items", "Carried"]];
  const cat = catOf(buyKind), k = GEAR_KIND[buyKind];
  const owned = (m[buyKind] || []).map(e => k.qty ? e : {id: e.id || e});
  const mine = owned.map(e => {
    const o = cat[e.id]; if(!o) return "";
    return `<div class="grow"><div class="grow-main"><div class="grow-name">${esc(skinOf(m, e.id, o.name))}${k.qty && (e.qty || 1) > 1 ? " ×" + e.qty : ""}</div></div>
      <div class="grow-r"><button class="btn sm ghost" data-sell="${esc(e.id)}">Sell — ${Math.floor(o.cost / 2)}</button></div></div>`;
  }).join("");
  const st = stashOf(b);
  const stashRows = (buyKind === "armour" ? st.armour.map(id => ({id, qty: 1})) : st[buyKind]).map(e => {
    const o = cat[e.id]; if(!o) return "";
    const why = handsBlock(m, buyKind, o.id);
    return `<div class="grow"><div class="grow-main"><div class="grow-name">${esc(o.name)}${(e.qty || 1) > 1 ? " \u00d7" + e.qty : ""}</div>
      ${why ? `<div class="pick-no">${esc(why)}</div>` : ""}</div>
      <div class="grow-r"><button class="btn sm" data-take="${esc(e.id)}" ${why ? "disabled" : ""}>Take</button></div></div>`;
  }).join("");
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="byX" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M15 6l-6 6 6 6"/></svg>
      </button><div class="eyebrow">Gear</div>${cashChip(b)}</div>
    <div class="cardhead" style="padding-bottom:10px;margin-bottom:10px">
      <div class="cardname" style="font-size:21px">${esc(fullName(m)) || "Unnamed"}</div></div>
    <div class="sheet-actions" style="margin:0 0 12px;flex-wrap:wrap;gap:7px">
      ${kinds.map(([id, label]) => `<button class="chip ${buyKind === id ? "gilt" : ""}" data-bk="${id}" style="cursor:pointer;font-size:13px;padding:6px 12px">${label}</button>`).join("")}
    </div>
    ${stashRows ? `<div class="slab" style="border-color:var(--gilt-deep)"><div class="head"><span class="eyebrow">From the stash</span><span class="rule"></span><span class="quiet">left by the fallen, free</span></div>${stashRows}</div>` : ""}
    ${mine ? `<div class="slab"><div class="head"><span class="eyebrow">Carried now</span><span class="rule"></span></div>${mine}</div>` : ""}
    <div class="picks">
      ${Object.values(cat).map(o => `
        <button class="pick ${handsBlock(m, buyKind, o.id) ? "no" : ""}" data-buy="${esc(o.id)}" ${(b.cash || 0) < o.cost || handsBlock(m, buyKind, o.id) ? "disabled" : ""}>
          <div class="pick-main"><div class="pick-name">${esc(o.name)}</div>
            <div class="pick-desc">${esc(o.desc)}</div>
            ${handsBlock(m, buyKind, o.id) ? `<div class="pick-no">${esc(handsBlock(m, buyKind, o.id))}</div>` : ""}</div>
          <div class="pick-cost mono">${o.cost} Cash</div></button>`).join("")}
    </div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#byX").onclick = () => { openCamp(); render(); };
  $("#sheet2In").querySelectorAll("[data-bk]").forEach(btn => btn.onclick = () => { buyKind = btn.dataset.bk; openBuy(mid); });
  $("#sheet2In").querySelectorAll("[data-buy]").forEach(btn => btn.onclick = () => {
    const o = cat[btn.dataset.buy]; if(!o || (b.cash || 0) < o.cost) return;
    const arr = m[buyKind] = m[buyKind] || [];
    if(buyKind === "armour"){
      /* a suit replaces a suit and a shield a shield; the old one is sold on for half */
      const uses = armourUsesHand(o.id);
      const oldId = arr.map(a => a.id || a).find(x => armourUsesHand(x) === uses);
      if(oldId) b.cash += Math.floor((cat[oldId] || {cost: 0}).cost / 2);
      m.armour = arr.filter(x => armourUsesHand(x.id || x) !== uses);
      m.armour.push(o.id);
    } else {
      const e = arr.find(x => x.id === o.id);
      if(e) e.qty = (e.qty || 1) + 1; else arr.push({id: o.id, qty: 1, mods: []});
    }
    b.cash -= o.cost; save(); toast(o.name + " bought"); openBuy(mid); render();
  });
  $("#sheet2In").querySelectorAll("[data-take]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.take, o = cat[id]; if(!o) return;
    const arr = m[buyKind] = m[buyKind] || [];
    if(buyKind === "armour"){
      const uses = armourUsesHand(id);
      const oldId = arr.map(a => a.id || a).find(x => armourUsesHand(x) === uses);
      m.armour = arr.filter(x => armourUsesHand(x.id || x) !== uses);
      m.armour.push(id);
      const i = st.armour.indexOf(id); if(i >= 0) st.armour.splice(i, 1);
      if(oldId) st.armour.push(oldId);   /* what they set down goes back to the stash */
    } else {
      const s = st[buyKind].find(x => x.id === id); if(!s) return;
      const e = arr.find(x => x.id === id);
      if(e) e.qty = (e.qty || 1) + 1; else arr.push({id, qty: 1, mods: (s.mods || []).slice()});
      if((s.qty || 1) > 1) s.qty--; else st[buyKind] = st[buyKind].filter(x => x !== s);
    }
    save(); toast(o.name + " taken up"); openBuy(mid); render();
  });
  $("#sheet2In").querySelectorAll("[data-sell]").forEach(btn => btn.onclick = () => {
    const id = btn.dataset.sell, o = cat[id]; if(!o) return;
    if(k.qty){
      const e = m[buyKind].find(x => x.id === id);
      if(e && (e.qty || 1) > 1) e.qty--; else m[buyKind] = m[buyKind].filter(x => x.id !== id);
    } else m[buyKind] = m[buyKind].filter(x => (x.id || x) !== id);
    if(!(m[buyKind] || []).some(x => (x.id || x) === id) && m.skins) delete m.skins[id];
    b.cash = (b.cash || 0) + Math.floor(o.cost / 2); save(); toast(o.name + " sold"); openBuy(mid); render();
  });
}

/* What a mend leaves behind. The ruleset gives each in words; this reads
   them: the penalty it names is what stays, the rest is lifted. */
const MEND_KEEP = {
  lostLeg:     {move: -2},
  lostArm:     {fight: -1, noTwoHanded: true},
  lostEye:     "keep",        // an eyepatch: no effect within 20 cm, the penalty stays beyond it
  shaken:      {},
  crushedRibs: {},
  badKnee:     {}
};
function openTreat(mid){
  const b = band(), m = b.members.find(x => x.id === mid); if(!m) return;
  const lvl = b.reputation || 0;
  const rows = (m.scars || []).filter(s => s.scar).map(s => {
    const opts = [];
    if(s.mend && !s.mended)
      opts.push({k: "mend", label: "Mend — " + s.mend.cost + " Cash", cost: s.mend.cost, note: s.mend.effect, ok: (b.cash || 0) >= s.mend.cost});
    if(!s.fitted) (s.replace || []).forEach(rid => {
      const r = (RS.replacements || []).find(x => x.id === rid); if(!r) return;
      const need = r.reputation || 0;
      opts.push({k: "rep:" + rid, label: "Fit " + r.id.replace(/([A-Z])/g, " $1").toLowerCase() + " — " + r.cost + " Cash",
        cost: r.cost, note: r.effect + " Catch: " + r.catch, ok: (b.cash || 0) >= r.cost && lvl >= need,
        why: lvl < need ? "needs Reputation " + need : (b.cash || 0) < r.cost ? "not enough Cash" : ""});
    });
    return `<div class="says ${s.scar ? "bad" : ""}">
      <div class="says-n">${esc(s.name)} ${s.mended ? `<span class="chip good">mended</span>` : ""}${s.fitted ? `<span class="chip good">fitted</span>` : ""}</div>
      <div class="says-d">${esc(s.effect)}</div>
      ${opts.map(o => `<div style="margin-top:7px">
        <button class="btn sm" data-tr="${esc(s.iid)}|${esc(o.k)}" ${o.ok ? "" : "disabled"} style="margin-left:0">${esc(o.label)}</button>
        <span class="quiet">${esc(o.note)}${o.why ? " — " + esc(o.why) : ""}</span></div>`).join("")}
    </div>`;
  }).join("");
  $("#sheet2In").innerHTML = `
    <div class="sheet-head">
      <button class="iconbtn" id="trX" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="17" height="17"><path d="M15 6l-6 6 6 6"/></svg>
      </button><div class="eyebrow">Surgery</div>${cashChip(b)}${lvlChip(b)}</div>
    <div class="cardhead" style="padding-bottom:10px;margin-bottom:10px">
      <div class="cardname" style="font-size:21px">${esc(fullName(m)) || "Unnamed"}</div></div>
    <p class="lead">Mend a scar for less, or replace the lost limb or eye outright with something mechanical or arcane. As many as you can pay for.</p>
    <div class="slab" style="margin-top:12px">${rows || `<p class="quiet" style="margin:0">No scars to treat.</p>`}</div>`;
  $("#sheet2").classList.add("show"); $("#scrim2").classList.add("show");
  $("#trX").onclick = () => { openCamp(); render(); };
  $("#sheet2In").querySelectorAll("[data-tr]").forEach(btn => btn.onclick = () => {
    const [iid, k] = btn.dataset.tr.split("|");
    const s = m.scars.find(x => x.iid === iid); if(!s) return;
    if(k === "mend"){
      if((b.cash || 0) < s.mend.cost) return;
      b.cash -= s.mend.cost; s.mended = true;
      const keep = MEND_KEEP[s.id];
      if(keep !== "keep" && keep !== undefined) s.mods = Object.keys(keep).length ? keep : null;
      s.effect = "Mended. " + s.mend.effect;
    } else {
      const rid = k.slice(4), r = (RS.replacements || []).find(x => x.id === rid);
      if(!r || (b.cash || 0) < r.cost || (b.reputation || 0) < (r.reputation || 0)) return;
      b.cash -= r.cost; s.fitted = rid; s.mods = null;
      s.effect = "Replaced. " + r.effect + " Catch: " + r.catch;
    }
    save(); toast("Done"); openTreat(mid); render();
  });
}

/* Camp ends by itself when the band sets out again. What that costs is settled then,
   not by a button someone might forget: an unpaid Mortal wound is a death, and anyone
   with four or more scars rolls to walk away. Until then it is only a warning. */
function campRisks(b){
  const out = [];
  b.members.forEach(m => {
    const rec = mortalRec(m);
    if(rec) out.push({m, kind: "death", text: fullName(m) + " dies of their wound unless surgery is paid first."});
  });
  const lb = (RS.campaign || {}).liability || {};
  if(lb.rawScars) b.members.forEach(m => {
    if(!mortalRec(m) && (m.scars || []).filter(s => s.scar).length >= lb.rawScars)
      out.push({m, kind: "quit", text: fullName(m) + " may walk away: " + (m.scars || []).filter(s => s.scar).length + " scars, a d6 roll of " + (lb.quitsOn || 1) + " and they go."});
  });
  return out;
}
/* The night passes. Returns what happened, one line each. */
function campBreaks(b){
  const C = campState(b), lines = [];
  b.members.filter(m => mortalRec(m)).forEach(m => {
    const rec = mortalRec(m);
    layToGrave(b, m, rec.flavourCause ? "Mortal wound from " + rec.flavourCause + ", no surgery" : "Mortal wound, no surgery", false,
               (rec.epitaphOptions || [])[0], rec.epitaphOptions);
    lines.push(m.name + " died of their wound.");
  });
  const lb = (RS.campaign || {}).liability || {};
  if(lb.rawScars){
    b.members.slice().forEach(m => {
      if((m.scars || []).filter(s => s.scar).length >= lb.rawScars){
        const r = 1 + Math.floor(Math.random() * 6);
        if(r <= (lb.quitsOn || 1)){
          layToGrave(b, m, "Worn out \u2014 walked away", false);
          lines.push(m.name + " (d6 " + r + ") has had enough and leaves.");
        }
      }
    });
  }
  C.n++;
  save();
  return lines;
}
/* shown before a quest begins, only when the night cost someone */
function showCampBroken(lines, next){
  $("#sheet2In").innerHTML = `
    <div class="sheet-head"><div class="eyebrow">Camp is broken</div></div>
    <p class="lead">The band sets out. Before it goes:</p>
    <div class="slab">

}

/* The camp's own menu. Camp, the after-battle sheet, the Cenotaph and the rules

/* ---- scnmap.js ---- */
/* =====================================================================
   THE MAP
   A scenario is easier to lay out than to read. This draws the table from
   above: start zones, the ground, and every piece of terrain as what it is,
   in the look of the place (ruin, wilds, under, machine, sacred, frontier).
   Each piece carries a small number, so "the bell tower (3)" can be pointed at.

   Coordinates are percentages of the table, so it does not matter whether
   you play on a door or a dining table. A piece has a shape:
     block    a building or a tower (w by h, turned by angle)
     wall     a long thin barrier (w long, h thick, turned by angle)
     blob     a hill, a pool, a pit, a patch of ground (r wide)
     cluster  trees, rubble, stones, crates, pipes (r wide)
   A piece with no shape is given one from its role, so older scenarios draw too.
   ===================================================================== */

const GROUND = {
  even:       {fill: "none",   label: "even ground"},
  rough:      {fill: "rough",  label: "difficult — costs double"},
  hazardous:  {fill: "hazard", label: "hazardous"},
  impassable: {fill: "solid",  label: "impassable"}
};
const ROLE_MARK = {
  cover:     {sym: "◧", tint: "var(--ash-mute)"},
  blocking:  {sym: "■", tint: "var(--ash-dim)"},
  high:      {sym: "▲", tint: "var(--ash-dim)"},
  objective: {sym: "◆", tint: "var(--gilt)"},
  hazard:    {sym: "✵", tint: "var(--rust)"},
  marker:    {sym: "◈", tint: "var(--gilt)"}
};
const MAP_SHAPES = ["block", "wall", "blob", "cluster"];

/* the look of each kind of place */
const MAP_THEME = {
  ruin:     {ground: "#26272c", grain: "#32343a", solid: "#6b6963", dark: "#3b3a37", edge: "#111214", accent: "#8d8a82", prop: "rubble"},
  wilds:    {ground: "#1c2a1f", grain: "#26372a", solid: "#5b6a55", dark: "#3d4d3a", edge: "#0b140d", accent: "#6f9a5f", prop: "tree"},
  under:    {ground: "#181630", grain: "#221f42", solid: "#4f4a86", dark: "#312d5c", edge: "#090816", accent: "#8f86d8", prop: "stalag"},
  machine:  {ground: "#212529", grain: "#2b3137", solid: "#66717c", dark: "#414a53", edge: "#0d0f11", accent: "#d19a2e", prop: "pipe"},
  sacred:   {ground: "#2a2620", grain: "#342f27", solid: "#9a8d72", dark: "#6b6049", edge: "#14110c", accent: "#c9a227", prop: "stone"},
  frontier: {ground: "#2c251c", grain: "#372f24", solid: "#8a7256", dark: "#5c4a37", edge: "#15110b", accent: "#c08c4a", prop: "crate"}
};
function mapPal(theme){ return MAP_THEME[theme] || MAP_THEME.ruin; }

/* the same map always draws the same way */
function mapRng(seed){
  let h = 2166136261;
  String(seed).split("").forEach(c => { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); });
  h = h || 1;
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
}
const mapClamp = v => Math.max(0, Math.min(100, +v || 0));
const mapN = v => Math.round(v * 100) / 100;

function mapShapeOf(f){
  if(MAP_SHAPES.includes(f.shape)) return f.shape;
  if(f.role === "blocking") return "wall";
  if(f.role === "high") return "block";
  if(f.role === "cover") return "cluster";
  if(f.role === "objective" || f.role === "marker") return "marker";
  return "blob";
}
/* a name often says what the ground is */
function mapKind(f){
  const t = String(f.label || "").toLowerCase();
  if(/pool|lake|river|sea|pond|flood|well|tide|water|moat|canal|marsh|swamp|bog/.test(t)) return "water";
  if(/lava|forge|fire|magma|ember|furnace|burn|pyre|brazier/.test(t)) return "fire";
  if(/tree|wood|forest|grove|thicket|copse|orchard/.test(t)) return "wood";
  return "";
}

function blobD(cx, cy, r, rnd, sx){
  const n = 10, pts = [];
  for(let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2, rr = r * (0.78 + rnd() * 0.42);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * (sx || 0.9)]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const start = mid(pts[n - 1], pts[0]);
  let d = `M${mapN(start[0])} ${mapN(start[1])}`;
  for(let i = 0; i < n; i++){
    const m = mid(pts[i], pts[(i + 1) % n]);
    d += ` Q${mapN(pts[i][0])} ${mapN(pts[i][1])} ${mapN(m[0])} ${mapN(m[1])}`;
  }
  return d + "Z";
}

/* one prop of a cluster */
function mapProp(kind, x, y, s, rnd, pal){
  x = mapN(x); y = mapN(y);
  if(kind === "tree"){
    const r = 1.1 + s * 0.9;
    return `<circle cx="${x + .5}" cy="${y + .6}" r="${mapN(r)}" fill="#000" opacity=".35"/>
      <circle cx="${x}" cy="${y}" r="${mapN(r)}" fill="${pal.dark}" stroke="${pal.edge}" stroke-width=".2"/>
      <circle cx="${mapN(x - r * .25)}" cy="${mapN(y - r * .25)}" r="${mapN(r * .55)}" fill="${pal.accent}" opacity=".55"/>`;
  }
  if(kind === "stalag"){
    const h = 1.8 + s * 1.6;
    return `<path d="M${mapN(x - h * .38)} ${mapN(y + h * .5)} L${x} ${mapN(y - h * .6)} L${mapN(x + h * .38)} ${mapN(y + h * .5)}Z" fill="${pal.dark}" stroke="${pal.accent}" stroke-width=".2" stroke-linejoin="round"/>
      <path d="M${x} ${mapN(y - h * .6)} L${mapN(x + h * .38)} ${mapN(y + h * .5)} L${x} ${mapN(y + h * .3)}Z" fill="#000" opacity=".3"/>`;
  }
  if(kind === "pipe"){
    const r = 0.9 + s * 0.7;
    return `<circle cx="${x + .4}" cy="${y + .5}" r="${mapN(r)}" fill="#000" opacity=".35"/>
      <circle cx="${x}" cy="${y}" r="${mapN(r)}" fill="${pal.solid}" stroke="${pal.edge}" stroke-width=".22"/>
      <circle cx="${x}" cy="${y}" r="${mapN(r * .45)}" fill="none" stroke="${pal.accent}" stroke-width=".25"/>`;
  }
  if(kind === "stone"){
    const h = 2 + s * 1.6, w = 0.9 + s * 0.4;
    return `<rect x="${mapN(x - w / 2 + .35)}" y="${mapN(y - h / 2 + .4)}" width="${mapN(w)}" height="${mapN(h)}" rx=".3" fill="#000" opacity=".35"/>
      <rect x="${mapN(x - w / 2)}" y="${mapN(y - h / 2)}" width="${mapN(w)}" height="${mapN(h)}" rx=".3" fill="${pal.solid}" stroke="${pal.edge}" stroke-width=".2"/>`;
  }
  if(kind === "crate"){
    const w = 1.6 + s * 1.2, a = (rnd() - .5) * 40;
    return `<g transform="translate(${x} ${y}) rotate(${mapN(a)})"><rect x="${mapN(-w / 2 + .35)}" y="${mapN(-w / 2 + .4)}" width="${mapN(w)}" height="${mapN(w)}" fill="#000" opacity=".35"/>
      <rect x="${mapN(-w / 2)}" y="${mapN(-w / 2)}" width="${mapN(w)}" height="${mapN(w)}" fill="${pal.solid}" stroke="${pal.edge}" stroke-width=".22"/>
      <path d="M${mapN(-w / 2)} ${mapN(-w / 2)} L${mapN(w / 2)} ${mapN(w / 2)} M${mapN(w / 2)} ${mapN(-w / 2)} L${mapN(-w / 2)} ${mapN(w / 2)}" stroke="${pal.edge}" stroke-width=".18" opacity=".7"/></g>`;
  }
  // rubble: a few angular chunks
  const w = 1.2 + s * 1.3;
  const pts = [0, 1, 2, 3, 4].map(i => { const a = i / 5 * Math.PI * 2 + rnd(), rr = w * (0.6 + rnd() * .5); return [mapN(x + Math.cos(a) * rr), mapN(y + Math.sin(a) * rr)]; });
  return `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${pal.solid}" stroke="${pal.edge}" stroke-width=".2" stroke-linejoin="round"/>`;
}

/* One piece of terrain. Returns what to draw and how far it reaches, so its number badge can sit at the edge. */
function mapPiece(f, i, pal, id){
  const rnd = mapRng((f.label || "") + i);
  const x = mapClamp(f.x), y = mapClamp(f.y), shape = mapShapeOf(f), kind = mapKind(f);
  const r = Math.max(3, Math.min(30, +f.r || 7));
  let svg = "", ext = 3.5;

  if(shape === "wall"){
    const w = Math.max(6, Math.min(60, +f.w || r * 2.4)), h = Math.max(1.6, Math.min(5, +f.h || 2.2)), a = +f.angle || 0;
    ext = Math.min(30, w / 2);
    svg = `<g transform="translate(${x} ${y}) rotate(${mapN(a)})">
      <rect x="${mapN(-w / 2 + .5)}" y="${mapN(-h / 2 + .6)}" width="${mapN(w)}" height="${mapN(h)}" rx=".5" fill="#000" opacity=".4"/>
      <rect x="${mapN(-w / 2)}" y="${mapN(-h / 2)}" width="${mapN(w)}" height="${mapN(h)}" rx=".5" fill="${pal.solid}" stroke="${pal.edge}" stroke-width=".3"/>
      <path d="M${mapN(-w / 2 + 1)} 0 H${mapN(w / 2 - 1)}" stroke="${pal.edge}" stroke-width=".25" stroke-dasharray="1.4 1" opacity=".55"/>
      <rect x="${mapN(-w / 2)}" y="${mapN(-h / 2)}" width="${mapN(w)}" height="${mapN(h * .35)}" rx=".4" fill="#fff" opacity=".08"/>
    </g>`;
    // a broken end or two
    if(pal.prop === "rubble" || rnd() > .5)
      svg += mapProp("rubble", x + Math.cos((+f.angle || 0) * Math.PI / 180) * (w / 2 + 1), y + Math.sin((+f.angle || 0) * Math.PI / 180) * (w / 2 + 1), .5, rnd, pal);
  } else if(shape === "block"){
    const w = Math.max(5, Math.min(40, +f.w || r * 1.6)), h = Math.max(4, Math.min(40, +f.h || r * 1.2)), a = +f.angle || 0;
    ext = Math.min(26, Math.max(w, h) / 2);
    const tower = f.role === "high";
    svg = `<g transform="translate(${x} ${y}) rotate(${mapN(a)})">
      <rect x="${mapN(-w / 2 + .7)}" y="${mapN(-h / 2 + .8)}" width="${mapN(w)}" height="${mapN(h)}" rx=".6" fill="#000" opacity=".4"/>
      <rect x="${mapN(-w / 2)}" y="${mapN(-h / 2)}" width="${mapN(w)}" height="${mapN(h)}" rx=".6" fill="${pal.dark}" stroke="${pal.edge}" stroke-width=".35"/>
      <rect x="${mapN(-w / 2 + 1)}" y="${mapN(-h / 2 + 1)}" width="${mapN(w - 2)}" height="${mapN(h - 2)}" rx=".4" fill="${pal.solid}" stroke="${pal.edge}" stroke-width=".2" opacity=".95"/>
      <path d="${Array.from({length: Math.max(2, Math.floor(w / 2.4))}, (_, k) => `M${mapN(-w / 2 + 1 + (k + 1) * (w - 2) / (Math.floor(w / 2.4) + 1))} ${mapN(-h / 2 + 1)} V${mapN(h / 2 - 1)}`).join(" ")}" stroke="${pal.edge}" stroke-width=".18" opacity=".45"/>
      ${tower ? `<circle r="${mapN(Math.min(w, h) * .22)}" fill="none" stroke="${pal.accent}" stroke-width=".35"/><circle r=".7" fill="${pal.accent}"/>` : ""}
      <rect x="${mapN(-1)}" y="${mapN(h / 2 - .6)}" width="2" height="1.2" fill="${pal.edge}"/>
    </g>`;
  } else if(shape === "cluster"){
    const n = Math.max(4, Math.min(14, Math.round(r * 1.1)));
    const prop = kind === "wood" ? "tree" : pal.prop;
    ext = r * .8;
    for(let k = 0; k < n; k++){
      const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r * .8;
      svg += mapProp(prop, x + Math.cos(a) * d, y + Math.sin(a) * d * .85, rnd(), rnd, pal);
    }
  } else if(shape === "marker"){
    ext = 3;
    svg = "";               // drawn on top by the badge step
  } else {                    // blob
    ext = r * .9;
    const water = kind === "water", fire = kind === "fire" || f.role === "hazard" && kind === "fire";
    const fill = water ? "#1c3a45" : fire ? "#4a1c10" : f.role === "hazard" ? "#3a1c18" : f.role === "high" ? pal.dark : pal.solid;
    const line = water ? "#4a8598" : fire ? "#ff8a3a" : f.role === "hazard" ? "#b5503c" : pal.edge;
    svg = `<path d="${blobD(x + .6, y + .8, r, rnd)}" fill="#000" opacity=".35"/>
      <path d="${blobD(x, y, r, rnd)}" fill="${fill}" stroke="${line}" stroke-width=".4"/>`;
    if(water){
      svg += [0, 1, 2].map(k => `<path d="M${mapN(x - r * .4 + k * r * .25)} ${mapN(y - r * .2 + k * r * .3)} q${mapN(r * .18)} ${mapN(-r * .12)} ${mapN(r * .36)} 0" fill="none" stroke="#7ab0c2" stroke-width=".25" opacity=".7"/>`).join("");
    } else if(fire){
      svg += `<path d="${blobD(x, y, r * .55, rnd)}" fill="#ff7a2a" opacity=".55"/><path d="${blobD(x, y, r * .28, rnd)}" fill="#ffd28a" opacity=".8"/>`;
    } else if(f.role === "high"){
      svg += `<path d="${blobD(x, y, r * .66, rnd)}" fill="none" stroke="${pal.edge}" stroke-width=".25" opacity=".7"/><path d="${blobD(x, y, r * .36, rnd)}" fill="none" stroke="${pal.edge}" stroke-width=".25" opacity=".7"/>`;
    } else if(f.role === "hazard"){
      svg += `<path d="M${mapN(x - r * .5)} ${mapN(y + r * .4)} L${x} ${mapN(y - r * .5)} L${mapN(x + r * .5)} ${mapN(y + r * .4)}Z" fill="none" stroke="#b5503c" stroke-width=".4" stroke-linejoin="round"/><path d="M${x} ${mapN(y - r * .15)} V${mapN(y + r * .12)}" stroke="#b5503c" stroke-width=".45"/>`;
    } else {
      // stony ground: a scatter of chunks
      for(let k = 0; k < Math.round(r * .8); k++){
        const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r * .6;
        svg += mapProp("rubble", x + Math.cos(a) * d, y + Math.sin(a) * d * .8, rnd() * .6, rnd, pal);
      }
    }
  }
  return {svg, ext, x, y, shape};
}

function mapSVG(map, opts){
  map = map || {};
  const mini = opts && opts.mini;
  const pal = mapPal(opts && opts.theme);
  const zones = Array.isArray(map.zones) ? map.zones : [];
  const feats = Array.isArray(map.features) ? map.features : [];
  const id = "m" + Math.random().toString(36).slice(2, 7);
  const rnd = mapRng("board" + feats.length + zones.length + (opts && opts.theme));

  const defs = `<defs>
    <pattern id="${id}rough" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="${pal.accent}" stroke-width=".5" opacity=".4"/></pattern>
    <pattern id="${id}hazard" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="2.6" stroke="#b5503c" stroke-width=".7" opacity=".6"/></pattern>
    <radialGradient id="${id}vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
  </defs>`;

  // the board itself: ground, grain, and the mark of the place
  let out = `<rect width="100" height="100" fill="${pal.ground}"/>`;
  let grain = "";
  for(let i = 0; i < 170; i++){
    const gx = mapN(rnd() * 100), gy = mapN(rnd() * 100), gr = mapN(0.15 + rnd() * .5);
    grain += `<circle cx="${gx}" cy="${gy}" r="${gr}" fill="${pal.grain}" opacity="${mapN(.5 + rnd() * .5)}"/>`;
  }
  out += grain;
  if(pal.prop === "rubble" || pal.prop === "stone" || pal.prop === "crate")
    for(let i = 1; i < 6; i++) out += `<path d="M0 ${i * 16.6} H100 M${i * 16.6} 0 V100" stroke="${pal.grain}" stroke-width=".35" opacity=".8"/>`;
  else if(pal.prop === "pipe")
    for(let i = 1; i < 10; i++) out += `<path d="M0 ${i * 10} H100 M${i * 10} 0 V100" stroke="${pal.grain}" stroke-width=".3" opacity=".9"/>` +
      `<circle cx="${i * 10}" cy="${((i * 7) % 9 + 1) * 10}" r=".5" fill="${pal.dark}"/>`;
  else out += `<path d="M0 50 H100 M50 0 V100" stroke="${pal.grain}" stroke-width=".3" opacity=".6"/>`;

  // start zones under everything
  zones.forEach(z => {
    const x = mapClamp(z.x), y = mapClamp(z.y);
    const w = Math.min(100 - x, Math.max(4, +z.w || 20));
    const h = Math.min(100 - y, Math.max(4, +z.h || 18));
    const col = z.side === "b" ? "#c25a44" : z.side === "neutral" ? "#9aa3b0" : "#c9a227";
    out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="${col}" fill-opacity=".10"
      stroke="${col}" stroke-width=".5" stroke-dasharray="2 1.6"/>`;
    if(!mini && z.label)
      out += `<text x="${x + 1.5}" y="${y + 4}" font-size="2.6" letter-spacing=".2" fill="${col}" opacity=".95" font-family="Cinzel,serif">${esc(String(z.label).slice(0, 22).toUpperCase())}</text>`;
  });

  // the ground that is not plain, under the pieces
  feats.forEach(f => {
    const g = GROUND[f.ground] || GROUND.even;
    if(g.fill === "none") return;
    const gr = Math.max(3, Math.min(30, +f.r || 7));
    const fill = g.fill === "rough" ? `url(#${id}rough)` : g.fill === "hazard" ? `url(#${id}hazard)` : pal.edge;
    out += `<circle cx="${mapClamp(f.x)}" cy="${mapClamp(f.y)}" r="${gr}" fill="${fill}" ${g.fill === "solid" ? 'opacity=".55"' : ""}/>`;
  });

  // the pieces themselves, then their numbers on top
  const pieces = feats.map((f, i) => mapPiece(f, i, pal, id));
  out += pieces.map(p => p.svg).join("");
  let n = 0;
  feats.forEach((f, i) => {
    n++;
    const p = pieces[i], mark = ROLE_MARK[f.role] || ROLE_MARK.cover;
    const bx = mapN(Math.min(96, p.x + p.ext * .55)), by = mapN(Math.max(4, p.y - p.ext * .55));
    if(f.role === "objective")
      out += `<g><circle cx="${p.x}" cy="${p.y}" r="4.2" fill="${pal.accent}" opacity=".18"/>
        <path d="M${p.x} ${mapN(p.y - 2.6)} L${mapN(p.x + 2.2)} ${p.y} L${p.x} ${mapN(p.y + 2.6)} L${mapN(p.x - 2.2)} ${p.y}Z" fill="#c9a227" stroke="#3a2f1c" stroke-width=".3"/></g>`;
    else if(f.role === "marker")
      out += `<circle cx="${p.x}" cy="${p.y}" r="2.6" fill="none" stroke="#c9a227" stroke-width=".35" stroke-dasharray="1 .8"/><circle cx="${p.x}" cy="${p.y}" r=".7" fill="#c9a227"/>`;
    out += `<g class="mapnum" data-n="${n}" data-label="${esc(String(f.label || ""))}">
      <circle cx="${bx}" cy="${by}" r="2.3" fill="#0d1016" fill-opacity=".85" stroke="${mark.tint}" stroke-width=".5"/>
      <text x="${bx}" y="${by}" font-size="2.8" font-weight="700" fill="${mark.tint}" text-anchor="middle" dominant-baseline="central"
        font-family="Space Mono,monospace">${n}</text></g>`;
    /* a piece a model can work (door, switch, lever): two small gears touching its number, so it is plainly its own */
    if(f.use && !mini){
      const gx = bx > 91 ? mapN(bx - 4.8) : mapN(bx + 4.8), dash = f.worked ? ' stroke-dasharray=".7 .5"' : "";
      out += `<g class="mapuse" data-tuse="${i}" style="cursor:pointer"><title>${esc(String(f.label || ""))} (${esc(String(f.use))})</title>
        <circle cx="${gx}" cy="${by}" r="2.7" fill="#0d1016" fill-opacity=".92" stroke="#5e9e8a" stroke-width=".5"${dash}/>
        <g fill="none" stroke="#5e9e8a" stroke-width=".5">
          <circle cx="${mapN(gx - .8)}" cy="${mapN(by - .6)}" r="1.15" stroke-width=".85" stroke-dasharray=".55 .42"/><circle cx="${mapN(gx - .8)}" cy="${mapN(by - .6)}" r=".35"/>
          <circle cx="${mapN(gx + 1)}" cy="${mapN(by + .9)}" r=".85" stroke-width=".75" stroke-dasharray=".5 .4"/><circle cx="${mapN(gx + 1)}" cy="${mapN(by + .9)}" r=".28"/></g></g>`;
    }
  });

  // the scale: the table is 90 cm across, so 10 cm is a little over a ninth of it
  if(!mini)
    out += `<g stroke="${pal.accent}" fill="none" opacity=".85"><path d="M4 95.5h11.11M4 94v3M15.11 94v3" stroke-width=".45"/>
      <text x="9.6" y="93" text-anchor="middle" font-size="2.6" fill="${pal.accent}" stroke="none" font-family="Space Mono,monospace">10 cm</text></g>`;

  // a little furniture: compass, and a soft dark edge
  if(!mini)
    out += `<g transform="translate(93 8)" stroke="${pal.accent}" fill="none" opacity=".7"><circle r="3.6" stroke-width=".3"/>
      <path d="M0 -5.4 L1 0 L0 5.4 L-1 0Z" fill="${pal.accent}" fill-opacity=".3" stroke-width=".25"/>
      <text y="-6.4" text-anchor="middle" font-size="2.4" fill="${pal.accent}" stroke="none" font-family="Cinzel,serif">N</text></g>`;
  out += `<rect width="100" height="100" fill="url(#${id}vig)"/>
    <rect x=".3" y=".3" width="99.4" height="99.4" fill="none" stroke="${pal.accent}" stroke-width=".5" opacity=".55"/>`;

  return `<svg viewBox="0 0 100 100" class="scnmap ${mini ? "mini" : ""}"
    role="img" aria-label="the table">${defs}${out}</svg>`;
}

function mapKeyHTML(map){
  const feats = (map && Array.isArray(map.features)) ? map.features : [];
  if(!feats.length) return "";
  return `<div class="mapkey">
    ${feats.map((f, i) => {
      const mark = ROLE_MARK[f.role] || ROLE_MARK.cover;
      const g = GROUND[f.ground];
      return `<div class="mk-row">
        <span class="mk-n">${i + 1}</span>
        <span class="mk-l"><b>${esc(f.label || "unnamed")}</b>
          <span>${esc(f.cm ? f.cm.l + " \u00d7 " + f.cm.w + " \u00d7 " + f.cm.h + " cm \u00b7 " + ({low: "low cover", high: "high cover", tall: "tall", flat: "flat"}[f.cls] || "cover")
            : [f.role, g && g.fill !== "none" ? g.label : null].filter(Boolean).join(" \u00b7 "))}</span></span>
      </div>`;
    }).join("")}
  </div>`;
}

/* ---- terrain.js ---- */
/* =====================================================================
   SET PIECES
   The table is 90 x 90 cm. The terrain on it is a short list of real pieces, the
   ones you have printed, each with a footprint, a height and a number owned. The
   scenario writer chooses from that list and no more than you own, so every map is one
   you can actually build. Add a piece when you print another.

   How high a piece is decides what it does, from the rules' own distances:
     up to 5 cm    low cover      a model hops over it (free jump 5)
     5 to 10 cm    high cover     harder to cross, up to the longest jump (10)
     over 10 cm    tall           blocks sight, and climbing it needs a test
   ===================================================================== */

const TABLE_CM = 90, CM_UNIT = TABLE_CM / 100;       // one map unit is 0.9 cm
const TERRAIN_KEY = "ep_terrain_v1";
const PIECE_SHAPES = {wall: "A long, thin barrier", block: "A solid footprint (a crate, a building)", cluster: "A round thing (a tree, a pillar, rubble)"};

const STARTER_PIECES = [
  {id: "lowwall",  name: "Low wall",    shape: "wall",    l: 15, w: 2,  h: 4,  qty: 4, note: "Knee-high rubble, a garden wall, a hedge"},
  {id: "ruinwall", name: "Ruined wall", shape: "wall",    l: 15, w: 2,  h: 8,  qty: 4, note: "A broken wall with gaps to shoot through"},
  {id: "crates",   name: "Crate stack", shape: "block",   l: 6,  w: 6,  h: 6,  qty: 4, note: "Crates, barrels, a wreck, a boulder"},
  {id: "pillar",   name: "Pillar",      shape: "cluster", l: 3,  w: 3,  h: 12, qty: 4, note: "A standing stone, a column, a chimney"},
  {id: "deadtree", name: "Dead tree",   shape: "cluster", l: 6,  w: 6,  h: 14, qty: 3, note: "A tree, a lamp post, a mast"},
  {id: "hall",     name: "Ruined hall", shape: "block",   l: 18, w: 12, h: 14, qty: 1, note: "A building to fight around, or through"}
];

function loadPieces(){
  try{
    const raw = JSON.parse(localStorage.getItem(TERRAIN_KEY) || "null");
    if(Array.isArray(raw) && raw.length) return raw.filter(p => p && p.id && p.name);
  }catch(e){}
  return STARTER_PIECES.map(p => Object.assign({}, p));
}
function savePieces(list){ try{ localStorage.setItem(TERRAIN_KEY, JSON.stringify(list)); }catch(e){} }
function pieceById(id, list){ return (list || loadPieces()).find(p => p.id === id) || null; }

function coverClass(h){
  h = +h || 0;
  return h <= 0 ? "flat" : h <= 5 ? "low" : h <= 10 ? "high" : "tall";
}
const COVER_LABEL = {flat: "Flat ground", low: "Low cover", high: "High cover", tall: "Tall: blocks sight, climb to cross"};
const COVER_SHORT = {flat: "flat", low: "low cover", high: "high cover", tall: "tall"};
function pieceDims(p){ return p.l + " × " + p.w + " × " + p.h + " cm"; }

/* what the piece looks like on the 0-100 plan, from its real size */
function pieceOnMap(p){
  const L = p.l / CM_UNIT, W = p.w / CM_UNIT;
  if(p.shape === "wall")    return {shape: "wall", w: Math.max(3, Math.min(60, L)), h: 0};
  if(p.shape === "block")   return {shape: "block", w: Math.max(3, Math.min(60, L)), h: Math.max(3, Math.min(40, W))};
  return {shape: "cluster", r: Math.max(3, Math.min(30, Math.max(L, W) / 2 + 1))};
}
function pieceSizeId(p){
  const m = Math.max(p.l, p.w);
  return m <= 6 ? "small" : m <= 15 ? "medium" : "large";
}

/* the piece list as the writer is told about it */
function piecesPrompt(list){
  return list.map(p => `  ${p.id}: ${p.name}, ${pieceDims(p)} (${COVER_SHORT[coverClass(p.h)]}), you own ${p.qty}. ${p.note || ""}`.trim()).join("\n");
}

/* ---- scenario.js ---- */
/* =====================================================================
   THE SCENARIO
   Asked for in the shape the ruleset already describes: a mode, a theme,
   a kind of battle, a difficulty. What comes back is checked against the
   same file — objectives must belong to the battle type, the enemy must
   fit inside its points, and every id must exist.

   The generator writes the fiction. The ruleset decides what is legal.
   ===================================================================== */

let genState = null;

/* A fixed vocabulary so the AI (and a hand-added piece) always names a size
   the table can actually build to, instead of a free-text guess. */
const TERRAIN_ROLES = ["cover", "blocking", "high", "objective", "hazard", "marker"];
const TERRAIN_GROUNDS = ["even", "rough", "hazardous", "impassable"];
const TERRAIN_SIZES = [
  {id: "small", name: "Small", desc: "about the footprint of a crate or a boulder, 5–10cm across"},
  {id: "medium", name: "Medium", desc: "about the footprint of a wall section or a wreck, 10–20cm across"},
  {id: "large", name: "Large", desc: "about the footprint of a tower or a building, 20cm or more across"}
];
function terrainSizeName(id){
  return (TERRAIN_SIZES.find(sz => sz.id === id) || TERRAIN_SIZES[1]).name;
}

function genDefaults(){
  const b = band();
  return {wish: "", mode: "coop", type: "", theme: "", difficulty: "standard",
          length: "standard", players: 1,
          perBand: Math.max(50, bandSpent(b) || b.budget),
          table: "", more: false, out: null, busy: false, savedId: null,
          addingTerrain: false, terrainDraft: null};
}

  const more = $("#gMore"); if(more) more.onclick = () => { keep(); S.more = !S.more; drawGenerate(ai); };

  const df = $("#gDiff"); if(df) df.onchange = e => { keep(); S.difficulty = e.target.value; drawGenerate(ai); };
  const ln = $("#gLen"); if(ln) ln.onchange = e => { keep(); S.length = e.target.value; drawGenerate(ai); };
  $("#gGo").onclick = () => { keep(); runGenerate(ai); };
  if(S.out){
    bindScenario(); bindAddTerrain(S, ai);

    });
  }

/* ---- asking ---- */
async function runGenerate(ai){
  const S = genState, sc = RS.scenario;
  S.busy = true; drawGenerate(ai);

  const size = S.players * S.perBand;
  const diff = (sc.difficulty || []).find(d => d.id === S.difficulty);
  const enemy = Math.round(size * diff.enemyPct);
  const len = (sc.lengths || []).find(l => l.id === S.length);
  const mode = (sc.modes || []).find(m => m.id === S.mode);

  /* Anything left on "let it decide" is chosen here, so the scenario still
     comes back legal, and the choice is shown afterwards rather than hidden. */
  const type = S.type
    ? (sc.battleTypes || []).find(t => t.id === S.type)
    : (sc.battleTypes || [])[Math.floor(Math.random() * sc.battleTypes.length)];
  const theme = S.theme
    ? (sc.themes || []).find(t => t.id === S.theme)
    : (sc.themes || [])[Math.floor(Math.random() * sc.themes.length)];

  /* A sealed (mystery) battle type has no fixed objectives of its own \u2014 the
     generator picks any it likes and the app hides them until round 2 or an
     envelope says otherwise. Everything else works exactly as before. */
  const sealed = !!type.sealed;
  const objList = sealed ? (sc.victory.objectiveTypes || []).map(o => o.id)
    : (type.objectives && type.objectives.length)
    ? type.objectives : (sc.victory.objectiveTypes || []).map(o => o.id);
  const objCount = sealed ? (type.baseObjectives || 2) : null;
  const markers = Math.max(1, Math.min(8, Math.round(size / 100) || 1));

  const pieceList = loadPieces();
  const roles = TERRAIN_ROLES.join(", ");
  const grounds = TERRAIN_GROUNDS.join(", ");
  const sizes = TERRAIN_SIZES.map(sz => sz.id + " (" + sz.desc + ")").join("; ");
  const prompt = `You are running tonight's game of ${RS.meta.name} for a table that has shown
up to play, not to read a rulebook. A player's band is called the Unburied.

Write so the table wants to go in and see what is happening, and wants to stay once they are
there. That means specifics, not adjectives: not "an eerie ruin" but what is actually standing,
what it smells like, what sound stops when they arrive. Write like someone who has actually
been to this place \u2014 concrete, unhurried, never explaining the mood, just describing the
thing so the mood happens on its own. No sentence should tell the reader how to feel.

For tone only, never to be copied or echoed \u2014 the kind of image this game wants:
  "The last name on the wall is still wet."
  "Someone built a door into the reactor housing. Someone else used it."
  "The tide left fish in the rafters. They are still breathing."
  "Every clock in the station stopped at the same second, years apart."
